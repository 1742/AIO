l_simp_chinese:
 #region 套娃脑建筑

 # 节点共振器
 building_AIO_lathe_resonator: "$building_lathe_resonator$"
 building_AIO_lathe_resonator_desc: "$building_lathe_resonator_desc$"
 building_AIO_resonator_tt: "每§Y100§!个$job_AIO_recursive_node$产出§G+1%§!\n（当前值：§G+[AIO_AIO_resonator_factor]%§!）"
 # 数据稳定器
 building_AIO_lathe_stabilisator: "$building_lathe_stabilisator$"
 building_AIO_lathe_stabilisator_desc: "$building_lathe_stabilisator_desc$"
 # 计算超频器
 building_AIO_lathe_overclocker: "$building_lathe_overclocker$"
 building_AIO_lathe_overclocker_desc: "超频器直接提高递归节点的科研与超然逻辑产出。循环造成的节点损耗由$AIO_recursive_cycle_situation$当前采用的计算方案决定。"
 # 核心保存器
 building_AIO_lathe_preserver: "$building_lathe_preserver$"
 building_AIO_lathe_preserver_desc: "保存器降低演算收束时的结构崩解，使$AIO_recursive_cycle_situation$完成时消耗的递归节点§G-25%§!。"
 # 扩展反应堆
 building_AIO_lathe_reactor: "$building_lathe_reactor$"
 building_AIO_lathe_reactor_desc: "$building_lathe_reactor_desc$"
 # 节点保持器
 building_AIO_lathe_life_support: "$building_lathe_life_support$"
 building_AIO_lathe_life_support_desc: "$building_lathe_life_support_desc$"
 # 战争推演器
 building_AIO_lathe_cogitator: "$building_lathe_cogitator$"
 building_AIO_lathe_cogitator_desc: "$building_lathe_cogitator_desc$"
 building_AIO_lathe_cogitator_tt: "§Y$MOD_COUNTRY_NAVAL_CAP_MULT$§!：每100§Y$job_AIO_recursive_node$§!§G+1%§!\n（当前值：§G+[AIO_num_AIO_recursive_node_per_100]%§!）\n§Y$MOD_SHIP_EXPERIENCE_GAIN_MULT$§!：每100§Y$job_AIO_recursive_node$§!§G+2%§!\n（当前值：§G+[AIO_num_AIO_recursive_node_per_200]%§!）"
 # 验证器
 building_AIO_lathe_validator: "$building_lathe_validator$"
 building_AIO_lathe_validator_desc: "$building_lathe_validator_desc$"
 building_AIO_lathe_validator_tt: "每100§Y$job_AIO_recursive_node$§!使§Y$mod_category_computing_research_speed_mult$§!§G+1%§!\n（当前值：§G+[AIO_num_AIO_recursive_node_per_100]%§!）"

 #endregion
