l_simp_chinese:
 pc_AIO_mist:0 "无名之雾的居所"
 pc_AIO_mist_desc:0 "撕裂三维时空投影截面后所建立的独立维度泡。它超脱于外界宇宙的物理因果与宏观热力学法则之外，伴随内部巨构的扩建，其内部空间可被无限度拓扑延展。"
 AIO_mist_anchor:0 "$pc_AIO_mist$"
 AIO_mist_anchor_plural:0 "$pc_AIO_mist$"
 NAME_AIO_Mist_Anchor:0 "$pc_AIO_mist$"
 NAME_AIO_Mist_Colony:0 "$pc_AIO_mist$"

 decision_AIO_mist_build_civilian_arkship:0 "建造民用方舟"
 decision_AIO_mist_build_science_arkship:0 "建造科研方舟"
 decision_AIO_mist_build_military_arkship:0 "建造军事方舟"
 decision_AIO_mist_build_civilian_arkship_desc:0 "在无名之雾的维度边缘组装一艘民用方舟，为重返星海的族群开辟新的家园。"
 decision_AIO_mist_build_science_arkship_desc:0 "在无名之雾的维度边缘组装一艘科研方舟，将探索与求知带向外部宇宙。"
 decision_AIO_mist_build_military_arkship_desc:0 "在无名之雾的维度边缘组装一艘军事方舟，为漫游星海的族群提供武力保障。"
 decision_AIO_mist_build_civilian_arkship_effects:0 "在居所所在星系生成一艘§Y民用方舟§!。无名之雾的居所保持固定。"
 decision_AIO_mist_build_science_arkship_effects:0 "在居所所在星系生成一艘§Y科研方舟§!。无名之雾的居所保持固定。"
 decision_AIO_mist_build_military_arkship_effects:0 "在居所所在星系生成一艘§Y军事方舟§!。无名之雾的居所保持固定。"

 decision_AIO_expand_mist:0 "拓扑延展：无名之雾"
 decision_AIO_expand_mist_desc:0 "向无名之雾的边缘注入巨量能源与致密构型合金，撕裂并撑开更深层的维度褶皱。在这片不存在实体边界的居所内，空间容量只取决于我们敢于编织多大的时空。"
 decision_AIO_expand_mist_effects:0 "区划容量增加§G8§!。"
 starbase_level_AIO_mist_anchor:0 "无名之雾锚居"
 d_AIO_mist_exemption:0 "截面之外"
 d_AIO_mist_exemption_desc:0 "这片空间立足于三维截面之外。外部宇宙中因规则篡改而引发的物理反弹、能流紊乱与常数溃散，皆无法穿透这里的拓扑绝缘壁障。"
