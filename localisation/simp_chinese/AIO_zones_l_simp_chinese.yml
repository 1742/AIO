l_simp_chinese:
 # 套娃脑特化
 zone_AIO_lathe: "套娃脑特化"
 zone_AIO_lathe_desc: "$district_AIO_lathe_desc$"
 # 暗物质生产特化
 zone_AIO_dm_production: "暗物质合成复合体"
 zone_AIO_dm_production_desc: "发电设施开始向引力的阴面输送功率。能量在此沉降，凝成无法被寻常光线照亮的物质；生产报表因此少了一些电力，多了一项曾被列为宇宙之谜的库存。"
 # 塔械组装及活体金属生产
 zone_AIO_lm_production_machine_empire: "活金合成"
 zone_AIO_lm_production_machine_empire_desc: "装配线的余热中，银色流体沿着新生机体的接缝汇聚。我们教会金属自行寻找形状，如今每一批子个体下线时，都能一并收取它们尚未使用的可能。"
 # 蜂巢组装及活体金属生产
 zone_AIO_lm_production_hive_empire: "活金孵育"
 zone_AIO_lm_production_hive_empire_desc: "孵育腔中的银色脉络随幼体一同搏动。营养液喂养血肉，也喂养那些学会了生长的金属；当新生子个体离开腔室，活金仍会沿着内壁继续增殖。"
 # 矿工岗纳米机器人生产特化
 zone_AIO_nanites_production_minerals: "纳米开采"
 zone_AIO_nanites_production_minerals_desc: "矿脉被切削成微观机器的原料，开采设备则负责唤醒第一批群落。此后，矿石会自行寻找裂隙、分解自身，并以能够继续采掘的形态离开岩层。"
 # 食物岗纳米机器人生产特化
 zone_AIO_nanites_production_farmers: "纳米培育"
 zone_AIO_nanites_production_farmers_desc: "田垄与培养槽中生长着可以自行收获的作物。养分被引入微观装配循环，成熟的纳米群落沿着灌溉管道汇入仓储。农业部门只须适应一件事：收成有时会主动寻找下一块田。"
 # 合金岗纳米机器人生产特化
 zone_AIO_nanites_production_metallurgists: "纳米组装"
 zone_AIO_nanites_production_metallurgists_desc: "熔炉不再将金属固定成最终的形状。无数微观构造体在冷却前完成装配，沿着生产线涌动，等待下一道命令。如今，一块材料可以同时是一套工具，也是一座尚未展开的工厂。"
