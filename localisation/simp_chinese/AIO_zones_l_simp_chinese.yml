l_simp_chinese:
 zone_AIO_mist_motes:0 "亚稳微粒激发特化"
 zone_AIO_mist_motes_desc:0 "通过多维共振腔将挥发性粒子维持在临界激发态，配合专属设施与区划，维持高密度的亚稳态微粒产出。"
 zone_AIO_mist_gases:0 "流形气体凝析特化"
 zone_AIO_mist_gases_desc:0 "在截面之外抽取并分离具有异常物理特性的高维气体，由专用冷凝矩阵提供高活性环境支持。"
 zone_AIO_mist_crystals:0 "超维晶格编织特化"
 zone_AIO_mist_crystals_desc:0 "部署原子级透镜与几何重塑阵列，将空间本身的拓扑张力固化为完美排列的稀有水晶晶格。"
 zone_AIO_mist_farm:0 "生化质能合成特化"
 zone_AIO_mist_farm_desc:0 "绕过落后的光合作用与有机循环，直接利用质能重构技术批量生成营养流质，保障庞大人口的基本存续。"
 zone_AIO_mist_alloys:0 "致密晶格重构特化"
 zone_AIO_mist_alloys_desc:0 "将多维几何拓扑压入金属晶格，消除材料在宏观应力下的一切疲劳极限，实现超强合金的规模化生产。"
 zone_AIO_mist_goods:0 "熵减制造特化"
 zone_AIO_mist_goods_desc:0 "在微观尺度逆转局域熵增，将基础原料以最高精度组装为精密科研器件与高级日用品。"
 zone_AIO_mist_energy:0 "能流截取特化"
 zone_AIO_mist_energy_desc:0 "将现实缝隙中逸散的高维能量潜流集中导入主电网，在不发生热力学扩散的前提下实现近乎无穷的能量产出。"
 zone_AIO_mist_minerals:0 "实在物质沉淀特化"
 zone_AIO_mist_minerals_desc:0 "利用引力剪切透镜，将虚粒子对中带有质量的一侧强行捕获并沉淀为致密的重工业矿物晶核。"
 zone_AIO_mist_dark_matter:0 "暗相凝聚特化"
 zone_AIO_mist_dark_matter_desc:0 "建立微观重力透镜矩阵，集中引导弱相互作用潜流，由暗相编织者将其固化为可加工的暗物质块。"
 zone_AIO_mist_living_metal:0 "流形塑态特化"
 zone_AIO_mist_living_metal_desc:0 "维持自组织金属的亚稳活性，为流形铸形师提供高能磁流体引导通道，赋予其自我重构与延展特性。"
 zone_AIO_mist_nanites:0 "微相连续体特化"
 zone_AIO_mist_nanites_desc:0 "建立微尺度集群的逻辑中枢，部署防死锁阻尼场，确保数以万亿计的纳米机群高效协同运行。"
 zone_AIO_mist_government:0 "拓扑行政中枢"
 zone_AIO_mist_government_desc:0 "位于截面之外的调度中枢。在此发出的指令直接在全域空间同步坍缩生效，无视宏观光速与通讯延迟。"
 zone_AIO_lathe:0 "递归运算特化"
 zone_AIO_lathe_desc:0 "为套娃脑递归网络配置专用高通量总线与容错装置，以海量意识的极限过载为代价，强行推演宇宙常数的底层逻辑。"
