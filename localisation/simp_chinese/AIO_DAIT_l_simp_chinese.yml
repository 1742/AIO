 AIO_DAIT_menu_button_erase:0 "[From.GetAIO_DAIT_menu_button_erase]"
 AIO_DAIT_menu_selected_erase:0 "§Y$AIO_DAIT_button_erase$§!"
 AIO_DAIT_menu_status_erase:0 "[This.GetAIO_DAIT_erase_state]"

 #endregion

 #region DAIT menu - void anchor

 AIO_DAIT_void_anchor:0 "虚空"
 AIO_DAIT_void_anchor_desc:0 "被擦除星系留下的坐标锚点。选中此对象后，可在应用无限菜单中使用“生成”重建该星系。"

 #endregion

 #region DAIT menu - ascension rules

 AIO_DAIT_ascended_no_cooldown:0 "飞升后无冷却。"

 #endregion

 #region DAIT situation

 AIO_DAIT_spawn_situation:0 "应用无限：生成"
 AIO_DAIT_spawn_situation_desc:0 "范围：$AIO_DAIT_range_0$。\n\n现实的结构正在重排。完成时重建虚空或被收割的星系，或调整普通星系的恒星与可改造天体。中心目标失效或失去操作权限时取消，退还一半实付费用，不进入冷却。其他国家仅在效果触发时收到通知。"
 AIO_DAIT_seed_situation:0 "应用无限：播种"
 AIO_DAIT_seed_situation_desc:0 "范围：$AIO_DAIT_range_0$。\n\n一个新物种及其文明正在获得存在的条件。完成时在符合条件的无人口宜居天体上创造太空文明。中心目标失效、失去操作权限或已无适用天体时取消，退还一半实付费用，不进入冷却。其他国家仅在效果触发时收到通知。"
 AIO_DAIT_ethic_situation:0 "应用无限：思潮反转"
 AIO_DAIT_ethic_situation_desc:0 "施放开始时锁定国家。局势完成时反转该国思潮并重组政府，不受原选中对象的位置、存续或所有权变化影响。目标灭亡、成为格式塔或不再满足国家类型条件，或施放者失去权限时，取消施放、退还一半实付费用且不进入冷却。"
 AIO_DAIT_storm_situation:0 "应用无限：风暴"
 AIO_DAIT_storm_situation_desc:0 "范围：$AIO_DAIT_range_0$。\n\n稳定的空间正在积蓄一场不应存在的风暴。完成时在星系中唤起随机宇宙风暴。中心目标失效或失去操作权限时取消，退还一半实付费用，不进入冷却。其他国家仅在效果触发时收到通知。"
 AIO_DAIT_harvest_situation:0 "应用无限：收割"
 AIO_DAIT_harvest_situation_desc:0 "范围：[Owner.GetAIO_DAIT_harvest_range_name]。\n\n恒星与岩层正在被换算为可以提取的物质。完成时重新核验范围内目标，拆解可收割的天体并获取资源。中心目标失效、失去操作权限或无有效作用对象时取消，退还一半实付费用，不进入冷却。其他国家仅在效果触发时收到通知。"
 AIO_DAIT_strike_situation:0 "应用无限：打击"
 AIO_DAIT_strike_situation_desc:0 "范围：[Owner.GetAIO_DAIT_strike_range_name]。\n\n降临的轮廓正在现实之外成形。完成时核验目标并召唤化身；全境档按施放开始时记录的目击帝国，向其生效时拥有的有效星系传播；游牧帝国另按其舰队当时所在的有效星系传播，同一星系只打击一次。化身不分敌我。中心目标失效、失去权限或无有效作用对象时取消，退还一半实付费用，不进入冷却。其他国家仅在效果触发时收到通知。"
 AIO_DAIT_erase_situation:0 "应用无限：擦除"
 AIO_DAIT_erase_situation_desc:0 "范围：[Owner.GetAIO_DAIT_erase_range_name]。\n\n时空正沿着指定的边界收拢。完成时核验范围内目标，擦除可被干涉的天体、巨构与舰队。中心目标失效、失去操作权限或无有效作用对象时取消，退还一半实付费用，不进入冷却。其他国家仅在效果触发时收到通知。"
 AIO_DAIT_windup_stage:0 "因果编织"
 AIO_DAIT_wait_approach:0 "等待干涉降临"
 AIO_DAIT_wait_approach_desc:0 "每月推进30天，按施放时确定的生效时长结算；切换菜单目标或范围不影响此局势。"
 AIO_DAIT_situation_complete:0 "因果收束完成：核验目标并执行本次应用无限；成功后按操作规则进入独立冷却。"

 #endregion
