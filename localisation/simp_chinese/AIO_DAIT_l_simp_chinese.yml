 AIO_DAIT_need_target:0 "请选中一个可干涉的星系或天体。"
 AIO_DAIT_unavailable:0 "需要解锁对应操作、拥有足够超然逻辑并选择适用档位，且该操作未处于生效或冷却中。"
 AIO_DAIT_invalid_target:0 "目标不满足本操作条件，或已有干涉正在生效中。"
 AIO_DAIT_cancelled:0 "应用无限已取消：目标失效、权限不足或无有效作用对象。退还实际支付费用的一半，不进入冷却。"
 AIO_DAIT_ready_text:0 "已就绪"
 AIO_DAIT_need_unlock:0 "尚未解锁此操作。"
 AIO_DAIT_need_range:0 "此操作需要选择0～5跳；全境档仅限飞升后的打击。"
 AIO_DAIT_wait_pending:0 "此操作仍在生效中。"
