 #region DAIT menu - harvest

 AIO_DAIT_button_harvest:0 "收割"
 AIO_DAIT_button_harvest_tooltip:0 "拆解范围内可被收割的天体与殖民地，按天体类型和大小获取资源。\n生效时间：§Y90天§!；每增加1跳，增加90天。\n冷却：§Y360天§!（超越因果：§Y270天§!）。\n$AIO_DAIT_ascended_no_cooldown$"
