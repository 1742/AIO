 AIO_DAIT_need_logic:0 "超然逻辑不足：丰饶、收割、打击、擦除的0～5跳费用为基础费×（1＋跳数），丰饶另乘执行次数；其余操作按0跳计费。"
 AIO_DAIT_target_system_name:0 "星系：[This.GetName]"
 AIO_DAIT_target_planet_system_name:0 "星系：[This.System.GetName]"
 AIO_DAIT_target_ambient_system_name:0 "星系：[This.GetStarName]"
