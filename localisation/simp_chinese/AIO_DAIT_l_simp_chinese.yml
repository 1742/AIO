 AIO_DAIT_harvest_completed:0 "[event_target:AIO_DAIT_maker.GetName]以[event_target:AIO_DAIT_target_system.GetName]为中心施放的“收割”已生效。"
 AIO_DAIT_menu_button_harvest:0 "[From.GetAIO_DAIT_menu_button_harvest]"
