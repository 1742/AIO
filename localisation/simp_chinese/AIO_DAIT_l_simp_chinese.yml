 #region DAIT menu - spawn

 AIO_DAIT_button_spawn:0 "生成"
 AIO_DAIT_button_spawn_tooltip:0 "重塑目标星系：将虚空或被收割的星系重建为特殊星系；在普通星系中调整恒星，并将符合条件的未殖民天体改造为宜居世界。\n生效时间：§Y90天§!。\n无冷却时间。"
