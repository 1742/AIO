 AIO_DAIT_menu_status_harvest:0 "[This.GetAIO_DAIT_harvest_state]"

 #endregion

 #region DAIT menu - strike

 AIO_DAIT_button_strike:0 "打击"
 AIO_DAIT_button_strike_tooltip:0 "召唤§R$AIO_Aforgomon$§!。化身强度随游戏难度与天灾倍率缩放。\n生效时间：弱化体基础§Y180天§!，完全体基础§Y90天§!；每增加1跳，增加90天；全境档为§Y360天§!。\n冷却：§Y360天§!（超越因果：§Y270天§!）。\n全境档仅限飞升后使用：施放开始时，以中心星系内的舰队记录目击帝国（不含化身所属国）；生效时向其当时拥有的全部有效星系传播，游牧帝国另按其舰队当时所在的有效星系传播，同一星系只打击一次。\n$AIO_DAIT_ascended_no_cooldown$"
 AIO_DAIT_strike_pending_text:0 "正在生效中（预计§Y[This.AIO_DAIT_strike_due]§!完成）"
 AIO_DAIT_strike_cooldown_text:0 "冷却结束：§Y[This.AIO_DAIT_strike_ready_date]§!"
 AIO_DAIT_strike_completed:0 "[event_target:AIO_DAIT_maker.GetName]以[event_target:AIO_DAIT_target_system.GetName]为中心施放的“打击”已生效。"
 AIO_DAIT_menu_button_strike:0 "[From.GetAIO_DAIT_menu_button_strike]"
 AIO_DAIT_menu_selected_strike:0 "§Y$AIO_DAIT_button_strike$§!"
 AIO_DAIT_menu_status_strike:0 "[This.GetAIO_DAIT_strike_state]"

 #endregion

 #region DAIT menu - erase

 AIO_DAIT_button_erase:0 "擦除"
 AIO_DAIT_button_erase_tooltip:0 "擦除范围内星系中可被干涉的天体、巨构与舰队，留下可供“生成”重建的虚空坐标。\n生效时间：§Y180天§!；每增加1跳，增加90天。\n冷却：§Y360天§!（超越因果：§Y270天§!）。\n$AIO_DAIT_ascended_no_cooldown$"
 AIO_DAIT_erase_pending_text:0 "正在生效中（预计§Y[This.AIO_DAIT_erase_due]§!完成）"
 AIO_DAIT_erase_cooldown_text:0 "冷却结束：§Y[This.AIO_DAIT_erase_ready_date]§!"
