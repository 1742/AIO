 #region DAIT menu - ethic

 AIO_DAIT_button_ethic:0 "思潮"
 AIO_DAIT_button_ethic_tooltip:0 "反转单个非格式塔国家的思潮并重组政府。可在外交界面选择国家，或选中其舰队、舰船、殖民地或有主星系。施放时锁定国家，原选中对象此后的移动、易主或消失不改变目标。\n生效时间：§Y90天§!。\n无冷却时间。"
