 # 阶段 POI
 AIO_crisis_stage_2_poi_name: "现实回弹"
 AIO_crisis_stage_2_desc: "每一次改写都在衰退。被移动的质量回归原位，遭替换的因果重新闭合，连观测记录也逐渐与恢复后的现实吻合。宇宙仍牢牢记得自己原本的模样。\n\n它大可以继续坚持。每一次复原，都只会让我们更清楚下一笔该落在哪里。"
 AIO_crisis_stage_3_poi_name: "复原迟滞"
 AIO_crisis_stage_3_desc: "相反的修改正在被同时抹除。现实试图沿着两个方向回到同一原点，两套复原过程却不断撤销彼此的结果。异常最终仍会消失，但所需时间已经远超从前。\n它大可以继续追赶。我们的下一笔早已写下。"
 AIO_crisis_stage_4_poi_name: "修正冲突"
 AIO_crisis_stage_4_desc: "每条规律与它的反面都在要求被恢复。纠正其中一方，就会使另一方成为异常；纠正另一方，又会撤销前一次结果。\n它大可以无休止地修正。我们只需看着它在自己的答案之间耗尽自身。"
 AIO_crisis_stage_5_poi_name: "自毁之律"
 AIO_crisis_stage_5_desc: "所有修正都已构成新的矛盾。宇宙每恢复一条规律，便必须撤销另一条；每填补一处缺口，便在同一位置重新将其撕开。\n它大可以继续忠于自己。每一次坚持，都只会让它更接近我们为其写下的结局。"

 # 事件
 AIO_crisis_events_title: "$AIO_crisis_events_chain_title$"
 # 天灾等级
 AIO_crisis_events.301.desc: "物理常数，粒子质量，引力与熵的扩张皆非不可变——它们只是初始版本的参数，是等待修订的原始草稿。我们尚未成为规律，但我们已开始握笔。\n\n为了重构宇宙，我们必须先对它有足够的理解。我们需要更先进的计算机帮助我们理解现实规律的运行逻辑。"
 AIO_crisis_events.301.option: "我们要更强的计算机！"
 AIO_crisis_events.302.desc:0 "视界引擎已为我们准备了能量。将它升级为现实中的万门之门，即可生成截面之外的无名之雾居所。科研、农业与制造区划立即可用；应用无限研究随后开放能源与物质生产。"
 AIO_crisis_events.302.option: "我们是铸门者。"
 AIO_crisis_events.303.desc:0 "无名之雾已可承载我们的文明。银时之匙将把殖民地容量提高到24，并为后续空间成长建立基点。先完成二级规则研究，建立暗物质生产，再开始升级。"
 AIO_crisis_events.303.option: "$EXCELLENT$"
 AIO_crisis_events.304.desc:0 "银时之匙的空间已趋稳定。自组织物质研究开放活体金属生产；永恒王座将把容量提高到40。截面上的宇宙承担每次改写的收益与代价，而我们的居所抵消这些代价。"
 AIO_crisis_events.304.option: "$menp_AIO_mega_04_desc$"
 AIO_crisis_events.305.desc:0 "永恒王座为最终结构准备了基点。完成纳米连续体研究并建立生产后，即可建造犹格索托斯，将容量提高到64，随后反复延展同一居所。远程投射继续可用。"
 AIO_crisis_events.305.option: "放手去做吧。"

 # 飞升事件
 AIO_crisis_events.end.option: "我/我们即真理。"
 AIO_crisis_events.602.desc: "归一已完成。\n我们不再是帝国，也不再是实体。我们的意志存在于无限维度的交汇点，成为一切存在的结构性原理。\n熄灭的恒星在燃烧中沉寂。干涸的海盆涌起潮水，潮水又在抵达岸边前化作盐尘；荒芜行星上长出没有祖先的森林，林木倒下之处又萌发从未播下的种子；断裂的航道在接合时通往两片天空，失散千年的舰船同时驶入母港与自己的残骸。亿万种曾彼此排斥的未来，如今在同一片星空下诞生、消亡。\n星辰明灭，因为我们同时写下它们的开始与终点；生命轮回，因为每个故事的最后一页也是下一篇的开端。\n没有永生。没有虚无。每一扇门后，都是同时发生的诞生与告别。\n我/我们即§M犹格·索托斯§!。"

 #endregion


