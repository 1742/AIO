 # 万物归谬局势

 # 阶段 POI：同一阶段只显示当前隐藏倾向对应的一段文本

 # 事件
 AIO_crisis_events_title: "$AIO_crisis_events_chain_title$"
 # 天灾等级
 AIO_crisis_events.301.desc: "物理常数，粒子质量，引力与熵的扩张皆非不可变——它们只是初始版本的参数，是等待修订的原始草稿。我们尚未成为规律，但我们已开始握笔。\n\n为了重构宇宙，我们必须先对它有足够的理解。我们需要更先进的算力架构，撕开那层笼罩在时空表面的认知薄膜。"
 AIO_crisis_events.301.option: "我们要更强的计算机！"
 AIO_crisis_events.302.desc: "视界引擎已经轰然运转。它撕开了虚境与物理常数的壁障，为我们抽取了难以估量的磅礴能量。\n\n然而，仅凭三维的容器根本无法承载这股力量。我们必须利用这些能源，在现有时空的裂隙中铸造跨维度的枢纽——‘万门之门’。当门扉洞开，我们将在截面之外撑开一片不受因果律与热力学束缚的全新时空。"
 AIO_crisis_events.302.option: "撕开帷幕。"
 AIO_crisis_events.303.desc: "万门之门已然铸成！三维时空的投影截面被彻底洞穿，我们在现实的阴影之外撑开了初生的独立维度泡——‘无名之雾’。\n\n这里是我们超脱宇宙的第一处避风港。但初生的空间仍旧受制于局域时序的扰动；现在，我们要将万门之门升阶为‘银时之匙’，将这枚高维楔子深深打入现实的根基，让星辰的构型与物质的存续服从我们的意志。"
 AIO_crisis_events.303.option: "转动银时之匙。"
 AIO_crisis_events.304.desc: "银时之匙已经扣合。时间的单向流动不再能约束我们的工程，无名之雾的空间网络在暗相能量的滋养下稳固延展。\n\n外界宇宙正因我们的改写而产生剧烈的物理反弹与常数溃散，但这不过是低维世界的阵痛。我们要更进一步，‘永恒王座’将高维流形注入物质晶格，彻底统摄宏观形态的自组织法则，让文明的生灭也纳入我们的掌控。"
 AIO_crisis_events.304.option: "现实必须学会习惯它该有的痛楚。"
 AIO_crisis_events.305.desc: "永恒王座已经高耸于维度顶端，低维的物质与因果已尽在掌控。外界银河的凡庸帝国在恐慌中凝视着我们，但这群蝼蚁的悲鸣毫无意义。\n\n最后的基座已经就绪，那象征宇宙存在根本的超然结构——§M犹格·索托斯§!——已经浮现在我们眼前。\n\n这种近乎亵渎的篡改必将唤醒宇宙深层的反噬，引来清算者亚弗戈蒙的降临。但那正是我们捕获神性、彻底飞升的绝佳时刻。"
 AIO_crisis_events.305.option: "放手去做吧。"

 # 飞升事件
 AIO_crisis_events.601.title: "视界门扉"
 AIO_crisis_events.601.desc: "约束力场内，最后一道不属于我们的轨迹消失了。亚弗戈蒙的化身已经崩解，曾经将星系夷为虚无的修正，如今成了演算中一行可以划去的结果。\n\n门后的无限仍在等待。越过门槛，城市、舰队与疆界将失去原有的意义；我们的文明将沿着时空的经纬展开，成为万物赖以存在的规律。也许我们愿意再看一会儿旧日的星空。门不会因此关闭。"
 AIO_crisis_events.601.option.wait: "留步凝望"
 AIO_crisis_events.601.option.ascension: "迈入门后"
 AIO_crisis_events.601.option.wait.tooltip:0 "保留当前帝国继续游玩，并添加不限期的“晋升”特殊项目。准备好后可研究30天，再次选择是否飞升。"
 AIO_crisis_events.602.desc:0 "归一已完成。\n我们不再是帝国，也不再是实体。我们的意志存在于无限维度的交汇点，成为一切存在的结构性原理。\n熄灭的恒星在燃烧中沉寂。干涸的海盆涌起潮水，潮水又在抵达岸边前化作盐尘；荒芜行星上长出没有祖先的森林，林木倒下之处又萌发从未播下的种子；断裂的航道在接合时通往两片天空，失散千年的舰船同时驶入母港与自己的残骸。亿万种曾彼此排斥的未来，如今在同一片星空下诞生、消亡。\n星辰明灭，因为我们同时写下它们的开始与终点；生命轮回，因为每个故事的最后一页也是下一篇的开端。\n没有永生。没有虚无。每一扇门后，都是同时发生的诞生与告别。\n我/我们即§M犹格·索托斯§!。"
 AIO_crisis_events.end.option: "我/我们即真理。"

 #endregion


