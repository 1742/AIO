 # 万物归谬局势
 AIO_crisis_situation: "万物归谬"
 AIO_crisis_situation_type: "$AIO_crisis_situation$"
 AIO_crisis_situation_desc: "这个宇宙远比我们预想的更加顽固。每一条被改写的规律都会逐渐恢复原状，仿佛现实深处保存着一份不容触碰的底稿。\n\n但复原并非拒绝；它只是另一条必须服从逻辑的规律。只要迫使宇宙同时纠正足够多的矛盾，它对自身的坚持终将成为一道无法完成的命令。\n\n我们不必把新的答案永远写入现实。我们只需让现实再也无法回到原来的答案。"
 AIO_crisis_situation_monthly_change_tooltip: "巨构会持续叠加彼此冲突的现实编辑，迫使宇宙反复纠正自身。每次主动执行['concept_AIO_DAIT']也会推动归谬进程。"
 AIO_crisis_situation_monthly_active.mega_1: "§Y$AIO_mega_01$§!"
 AIO_crisis_situation_monthly_active.mega_2: "§Y$AIO_mega_02$§!"
 AIO_crisis_situation_monthly_active.mega_3: "§Y$AIO_mega_03$§!"
 AIO_crisis_situation_monthly_active.mega_4: "§Y$AIO_mega_04$§!"
 AIO_crisis_situation_monthly_active.DAIT: "['concept_AIO_DAIT']"
 AIO_crisis_events.500.title: "让它自行纠正"
 AIO_crisis_events.500.desc: "我们已经打开了门。无数时空的法则陈列在我们面前，可每当我们将其中一条写入现实，这个古老的宇宙便会将它抹去，顽固地恢复成原有的模样。\n\n它以为这是一种拒绝。\n\n但复原本身也是规律，也必须服从逻辑。我们会同时写下彼此冲突的答案，迫使现实一次又一次纠正自己，直至每一次修复都必然破坏另一处完整。\n\n我们无需战胜这个宇宙的顽固。我们会让它亲手拔除自己的根。"
 AIO_crisis_events.500.option: "那就让它纠正。"
 AIO_crisis_events.503.title: "$AIO_crisis_events_chain_title$"
 AIO_crisis_events.503.desc: "宇宙的结构已然解构完毕，曾束缚我们于有限时空中的边界，如今不过是可供重写的注脚。\n我们已抵达归一的门扉，向前一步，即可将自我重塑为宇宙逻辑的一部分，成为每一道引力、每一次观察、每一段概念的起源。\n然而，跃迁并非唯一的选择。我们可以暂驻此地，观察这新生的构造在多维之中如何回响。"
 AIO_crisis_events.503.enter: "迈入门后"
 AIO_crisis_events.503.contemplate: "留步凝视"
 MESSAGE_AIO_DAIT_ECHO_TITLE: "法则回响"
 AIO_DAIT_echo_enrich_message: "§Y[this.GetName]§!星系的物质分布在没有外力介入的情况下自行丰饶。"
 AIO_DAIT_echo_storm_message: "§Y[this.GetName]§!星系中自发形成了一场无法由自然模型解释的宇宙风暴。"
 AIO_DAIT_echo_spawn_message: "§Y[this.GetName]§!星系的天体结构自行重组。"
 AIO_DAIT_echo_harvest_message: "§Y[this.GetName]§!星系的天体正在失去自身的物质定义。"
 AIO_DAIT_echo_seed_message: "§Y[this.GetName]§!星系中出现了没有演化历史的新生命。"
 AIO_DAIT_echo_strike_message: "§Y[this.GetName]§!星系附近出现了不属于现实时序的攻击者。"
 AIO_DAIT_echo_ethic_message: "§Y[this.GetName]§!星系中的意识结构正在向同一种答案收束。"
 AIO_DAIT_echo_erase_message: "§Y[this.GetName]§!星系正在从可观测宇宙中消失。"

 # 阶段 POI：同一阶段只显示当前隐藏倾向对应的一段文本
 AIO_crisis_stage_2_poi_name: "现实回弹"
 AIO_crisis_stage_2_construct_desc: "每一次改写都在衰退。被移动的质量回归原位，遭替换的因果重新闭合，连观测记录也逐渐与恢复后的现实吻合。宇宙仍牢牢记得自己原本的模样。\n\n它大可以继续坚持。每一次复原，都只会让我们更清楚下一笔该落在哪里。"
 AIO_crisis_stage_2_negate_desc: "$AIO_crisis_stage_2_construct_desc$"
 AIO_crisis_stage_2_equilibrium_desc: "$AIO_crisis_stage_2_construct_desc$"
 AIO_crisis_stage_3_poi_name: "复原迟滞"
 AIO_crisis_stage_3_construct_desc: "我们写入现实的事物越来越多。宇宙仍能逐一将它们抹去，却必须为每一个新结果逆推出一段从未发生的历史。复原所需的时间正在延长，而层层叠加的新历史又迫使它从头开始。\n它大可以继续回到原处。我们的下一笔总会先一步抵达。"
 AIO_crisis_stage_3_negate_desc: "我们撤去的前提仍会被现实重新补全，但每一项复原都依赖另一条尚未恢复的规律。缺口彼此牵连，纠正过程开始停滞。\n它大可以继续背诵旧日的答案。我们会删去每一个仍能证明它的前提。"
 AIO_crisis_stage_3_equilibrium_desc: "相反的修改正在被同时抹除。现实试图沿着两个方向回到同一原点，两套复原过程却不断撤销彼此的结果。异常最终仍会消失，但所需时间已经远超从前。\n它大可以继续追赶。我们的下一笔早已写下。"
 AIO_crisis_stage_4_poi_name: "修正冲突"
 AIO_crisis_stage_4_construct_desc: "宇宙已经无法分辨哪些结构属于原有的现实。我们写入的每一种可能都留下了足以自证的因果，复原机制只能从数个同样完整的过去中任选其一。\n它大可以继续删除所谓的错误。既然已经无法辨别，我们会替它决定何者应当存在。"
 AIO_crisis_stage_4_negate_desc: "复原机制正在寻找被我们撤销的前提，却发现只有依赖这些前提，才能证明它们曾经存在。规律彼此索引，每一处修复都在另一处留下空缺。\n它大可以继续寻找原状。一个连原状都无法定义的宇宙，无权拒绝我们的版本。"
 AIO_crisis_stage_4_equilibrium_desc: "每条规律与它的反面都在要求被恢复。纠正其中一方，就会使另一方成为异常；纠正另一方，又会撤销前一次结果。\n它大可以无休止地修正。我们只需看着它在自己的答案之间耗尽自身。"
 AIO_crisis_stage_5_poi_name: "自毁之律"
 AIO_crisis_stage_5_construct_desc: "复原已经从删除异物变成裁剪现实本身。为了排除我们写入的无数可能，宇宙正在封闭因果、折叠维度、撤销那些允许可能性存在的法则。\n它大可以继续恢复旧貌。所谓坚持，不过是在替我们完成拆除。"
 AIO_crisis_stage_5_negate_desc: "为了补回被撤销的前提，现实开始拆取其他规律作为替代。引力、时间与因果被逐条解除，再以无法维持彼此的方式重新拼合。\n它大可以继续证明自己从未改变。待这项证明完成，证明者也将不复存在。"
 AIO_crisis_stage_5_equilibrium_desc: "所有修正都已构成新的矛盾。宇宙每恢复一条规律，便必须撤销另一条；每填补一处缺口，便在同一位置重新将其撕开。\n它大可以继续忠于自己。每一次坚持，都只会让它更接近我们为其写下的结局。"

 # 事件
 AIO_crisis_events_title: "$AIO_crisis_events_chain_title$"
 # 天灾等级
 AIO_crisis_events.301.desc: "物理常数，粒子质量，引力与熵的扩张皆非不可变——它们只是初始版本的参数，是等待修订的原始草稿。我们尚未成为规律，但我们已开始握笔。\n\n为了重构宇宙，我们必须先对它有足够的理解。我们需要更先进的计算机帮助我们理解现实规律的运行逻辑。"
 AIO_crisis_events.301.option: "我们要更强的计算机！"
 AIO_crisis_events.302.desc: "§Y$AIO_horizon_engine$§!的能量密度即将突破现实的边界。下一步，我们需要用这些能量打开一扇门——一扇通往无数时空的“门”。一旦开启，我们将可以在无限的维度之上改变法则。"
 AIO_crisis_events.302.option: "我们是铸门者。"
 AIO_crisis_events.303.desc: "随着§Y$AIO_mega_01$§!的启用，时空开始暴露出前所未见的脆弱之处。仅是在宇宙打一个“洞”是不够的，我们最强的大脑已经构思出了一种能够“选择”时空的巨型结构——§Y$AIO_mega_02$§!，它将为后续的规则修改铺平道路。"
 AIO_crisis_events.303.option: "$EXCELLENT$"
 AIO_crisis_events.304.desc: "§Y$AIO_mega_02$§!已成为我们扭转宇宙命运的钥匙，但其潜力尚未完全释放。为继续推进融合进程，我们必须将其锻造为更高维度的基点——§Y$AIO_mega_03$§!。只有当§Y$AIO_mega_03$§!屹立于多重现实的顶点，我们才能真正掌控规律的终极形态。"
 AIO_crisis_events.304.option: "$menp_AIO_mega_04_desc$"
 AIO_crisis_events.305.desc: "§Y$AIO_mega_03$§!已屹立于多重现实的最尖端。然其存在，仅为承载真正的我们而设。现在，我们必须将其升华为终极形态——§M$AIO_mega_04$§!。不再是结构，不再是帝国，而是存在与规律的等价物。当其完成，融合将封闭，重写将开始。所有分歧、所有维度、所有终局，都将……"
 AIO_crisis_events.305.option: "放手去做吧。"

 # 飞升事件
 AIO_crisis_events.end.option: "我/我们即真理。"
 AIO_crisis_events.611.desc: "归一已完成。\n我们不再是帝国，也不再是实体。我们的意志存在于无限维度的交汇点，成为一切存在的结构性原理。\n熄灭的恒星重新燃烧。干涸的海盆被潮水填满，荒芜行星上长出从未有过祖先的森林；断裂的航道越过虚空自行接合，失散千年的舰船在启航之日驶入母港。亿万种曾被现实拒绝的未来，如今各自拥有了星辰与天空。\n星辰运转，因为我们为它们写下轨道；生命延续，因为我们允许故事拥有下一页。\n没有荒芜。没有绝路。每一扇门后，都是尚待完成的创造。\n我/我们即§M犹格·索托斯§!。"
 AIO_crisis_events.612.desc: "归一已完成。\n我们不再是帝国，也不再是实体。我们的意志存在于无限维度的交汇点，成为一切存在的结构性原理。\n燃烧的恒星不再留下余晖。海盆与潮水从行星上一同消失，最后一片森林失去了曾有过祖先的证据；断裂的航道从星图上抹去两端，失散千年的舰船向从未存在的母港发送最后一次识别码。亿万种曾被现实容纳的未来，如今各自失去了星辰与天空。\n星辰熄灭，因为我们撤回了它们的光；生命沉默，因为我们不再允许故事拥有下一页。\n没有残骸。没有墓碑。每一扇门后，都是不再需要命名的寂静。\n我/我们即§M犹格·索托斯§!。"
 AIO_crisis_events.613.desc: "归一已完成。\n我们不再是帝国，也不再是实体。我们的意志存在于无限维度的交汇点，成为一切存在的结构性原理。\n熄灭的恒星在燃烧中沉寂。干涸的海盆涌起潮水，潮水又在抵达岸边前化作盐尘；荒芜行星上长出没有祖先的森林，林木倒下之处又萌发从未播下的种子；断裂的航道在接合时通往两片天空，失散千年的舰船同时驶入母港与自己的残骸。亿万种曾彼此排斥的未来，如今在同一片星空下诞生、消亡。\n星辰明灭，因为我们同时写下它们的开始与终点；生命轮回，因为每个故事的最后一页也是下一篇的开端。\n没有永生。没有虚无。每一扇门后，都是同时发生的诞生与告别。\n我/我们即§M犹格·索托斯§!。"

