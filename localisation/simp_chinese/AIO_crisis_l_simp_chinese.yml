 #region 灾飞奖励

 # 一阶
 menp_AIO_al_research: "超然逻辑"
 menp_AIO_al_research_desc: "宇宙不再只是三维的舞台，我们的文明已窥见了更高的规则流。"
 unlocks_AIO_allinone_research: "可以开始通过完成§H天灾目标§!以积累£AIO_advanced_logic£§Y$AIO_advanced_logic$§!。"
 menp_AIO_buildings_1: "$menp_cosmo_buildings_1$"
 menp_AIO_buildings_1_desc: "$menp_cosmo_buildings_1_desc$"
 menp_AIO_component_1:0 "能量边界"
 menp_AIO_component_1_desc:0 "暗物质不只是能源。掌控它，将为我们理解并改写宇宙法则铺平道路。"
 unlocks_AIO_component_1:0 "解锁科技研究选项：§Y$tech_dark_matter_power_core$§!。"
 menp_AIO_dimensionality:0 "升维假设"
 menp_AIO_dimensionality_desc:0 "三维世界只是囚禁意识的浅滩。通过视界引擎吞噬现实的能流，我们将在时空的幕布上剪开第一道通往无穷的裂隙。"
 # 二阶
 menp_AIO_mega_02: "铸门之人"
 menp_AIO_mega_02_desc: "低维生物称之为神迹或裂痕，而在我们的工程图纸上，它不过是一扇可以被精确装配的门扉。"
 unlocks_AIO_allinone_mega_01: "解锁巨构：§Y$AIO_mega_01$§!\n"
 menp_AIO_buildings_2: "$menp_cosmo_buildings_2$"
 menp_AIO_buildings_2_desc: "$menp_cosmo_buildings_2_desc$"
 menp_AIO_component_2:0 "能量解构"
 menp_AIO_component_2_desc:0 "能量守恒定律并非不可动摇的神谕，它只是三维宇宙缺乏想象力的平庸设定。"
 unlocks_AIO_component_2:0 "解锁科技研究选项：§Y$tech_enigmatic_decoder$§!, §Y$tech_dark_matter_propulsion$§!。\n解锁应用无限研究选项：§Y$tech_AIO_rule_energy$§!。完成对应研究后开放无名之雾的§Y$district_AIO_mist_energy$§!。"
 menp_AIO_ship_escort: "$menp_cosmo_ship_2$"
 menp_AIO_ship_escort_desc: "$menp_cosmo_ship_2_desc$"
 # 三阶
 menp_AIO_mega_03: "时空工程"
 menp_AIO_mega_03_desc: "时间不再是单向奔流的长河，而是任由我们截断、折叠与重塑的几何标尺。银时之匙将把事件的先后次序重铸为我们的阶梯。"
 unlocks_AIO_allinone_mega_02: "解锁巨构：§Y$AIO_mega_02$§!\n"
 menp_AIO_buildings_3: "$menp_cosmo_buildings_3$"
 menp_AIO_buildings_3_desc: "$menp_cosmo_buildings_3_desc$"
 menp_AIO_component_3:0 "物质实在化"
 menp_AIO_component_3_desc:0 "物质与暗物质的分野，不过是观察者视角的局限。当我们掌握了实在化的权柄，有无便只在我们的一念之间。"
 unlocks_AIO_component_3:0 "解锁科技研究选项：§Y$tech_enigmatic_encoder$§!, §Y$tech_dark_matter_deflector$§!。\n解锁应用无限研究选项：§Y$tech_AIO_rule_matter$§!, §Y$tech_AIO_rule_dark_matter$§!。完成对应研究后开放无名之雾的§Y$district_AIO_mist_minerals$§!, §Y$district_AIO_mist_dark_matter$§!。"
 menp_AIO_ship_3: "$menp_cosmo_ship_3$"
 menp_AIO_ship_3_desc: "$menp_cosmo_ship_3_desc$"
 # 四阶
 menp_AIO_mega_04: "恒视之主"
 menp_AIO_mega_04_desc: "物质必须学会服从更高维度的意志。永恒王座将高高耸立在截面之巅，俯瞰着整片因我们随意玩弄而战栗的星海。"
 unlocks_AIO_allinone_mega_03: "解锁巨构：§Y$AIO_mega_03$§!\n"
 menp_AIO_buildings_4: "$menp_cosmo_buildings_4$"
 menp_AIO_buildings_4_desc: "$menp_cosmo_buildings_4_desc$"
 menp_AIO_component_4:0 "结构重塑"
 menp_AIO_component_4_desc:0 "自然演化给物质设定的分子构型过于脆弱。我们将高维流形强行注入其中，让重子与晶格懂得如何自我生长与自愈。"
 unlocks_AIO_component_4:0 "解锁科技研究选项：§Y$tech_arc_emitter_1$§!, §Y$tech_dragon_armor$§!。\n解锁应用无限研究选项：§Y$tech_AIO_rule_structure$§!, §Y$tech_AIO_rule_living_metal$§!。完成对应研究后开放无名之雾的§Y$district_AIO_mist_motes$§!, §Y$district_AIO_mist_gases$§!, §Y$district_AIO_mist_crystals$§!, §Y$district_AIO_mist_living_metal$§!。"
 menp_AIO_ship_titan: "$menp_cosmo_ship_4$"
 menp_AIO_ship_titan_desc: "$menp_cosmo_ship_4_desc$"
 # 五阶
 menp_AIO_mega_05: "维度嵌入"
 menp_AIO_mega_05_desc: "全知即全能。当犹格·索托斯在此界彻底成型，我们不再生活在宇宙之中——我们即是万物赖以存在的结构性原理。"
 unlocks_AIO_allinone_mega_04: "解锁巨构：§Y$AIO_mega_04$§!\n"
 menp_AIO_buildings_5: "$menp_cosmo_buildings_5$"
 menp_AIO_buildings_5_desc: "$menp_cosmo_buildings_5_desc$"
 menp_AIO_component_5:0 "纳米连续体"
 menp_AIO_component_5_desc:0 "将现实分解为无穷尽的可编程微粒。宏观的秩序在此刻彻底瓦解，一切物理结构都将退化为我们随时可以重写的泥浆。"
 unlocks_AIO_component_5:0 "解锁科技研究选项：§Y$tech_nanite_transmutation$§!, §Y$tech_nanite_repair_system$§!, §Y$tech_nanite_autocannon$§!, §Y$tech_nanite_flak_batteries$§!。\n解锁应用无限研究选项：§Y$tech_AIO_rule_nanites$§!。完成对应研究后开放无名之雾的§Y$district_AIO_mist_nanites$§!。"
 menp_AIO_break_rules: "$menp_cosmo_features_4$"
 menp_AIO_break_rules_desc: "$menp_cosmo_features_4_desc$"
 unlocks_AIO_mist_expansion:0 "最终巨构完成后，可在无名之雾反复延展空间容量。"

 #endregion


 #region 天灾事件链

 # 事件链
 AIO_crisis_events_chain_title: "万物归一"
 AIO_crisis_events_chain_desc: "$AIO_advanced_logic_crisis_howto$"
 AIO_crisis_events_chain: "$AIO_crisis_events_chain_title$"

 # 阶段 POI
 AIO_crisis_stage_2_poi_name: "现实回弹"
 AIO_crisis_stage_2_desc: "每一次改写都在衰退。被移动的质量回归原位，遭替换的因果重新闭合，连观测记录也逐渐与恢复后的现实吻合。宇宙仍牢牢记得自己原本的模样。"
 AIO_crisis_stage_3_poi_name: "复原迟滞"
 AIO_crisis_stage_3_desc: "相反的修改正在被同时抹除。现实试图沿着两个方向回到同一原点，两套复原过程却不断撤销彼此的结果。异常最终仍会消失，但所需时间已经远超从前。"
 AIO_crisis_stage_4_poi_name: "修正冲突"
 AIO_crisis_stage_4_desc: "每条规律与它的反面都在要求被恢复。纠正其中一方，就会使另一方成为异常；纠正另一方，又会撤销前一次结果。"
 AIO_crisis_stage_5_poi_name: "自毁之律"
 AIO_crisis_stage_5_desc: "所有修正都已构成新的矛盾。宇宙每恢复一条规律，便必须撤销另一条；每填补一处缺口，便在同一位置重新将其撕开。"

 # 事件
 AIO_crisis_events_title: "$AIO_crisis_events_chain_title$"
 # 天灾等级
 AIO_crisis_events.301.desc: "物理常数，粒子质量，引力与熵的扩张皆非不可变——它们只是初始版本的参数，是等待修订的原始草稿。我们尚未成为规律，但我们已开始握笔。\n\n为了重构宇宙，我们必须先对它有足够的理解。我们需要更先进的算力架构，撕开那层笼罩在时空表面的认知薄膜。"
 AIO_crisis_events.301.option: "撕开帷幕。"
 AIO_crisis_events.302.desc:0 "视界引擎已经轰然运转。它撕开了虚境与物理常数的壁障，为我们抽取了难以估量的磅礴能量。\n\n然而，仅凭三维的容器根本无法承载这股力量。我们必须利用这些能源，在现有时空的裂隙中铸造跨维度的枢纽——‘万门之门’。当门扉洞开，我们将在截面之外撑开一片不受因果律与热力学束缚的全新居所。"
 AIO_crisis_events.302.option: "开始铸造万门之门。"
 AIO_crisis_events.303.desc:0 "万门之门已然铸成！三维时空的投影截面被彻底洞穿，我们在现实的阴影之外撑开了初生的独立维度泡——‘无名之雾’。\n\n这里是我们超脱宇宙的第一处避风港。但初生的空间仍旧受制于局域时序的扰动；现在，我们要将万门之门升阶为‘银时之匙’，将这枚高维楔子深深打入现实的根基，大幅拓展无名之雾的容量，捕获暗物质的潜流。"
 AIO_crisis_events.303.option: "转动银时之匙。"
 AIO_crisis_events.304.desc:0 "银时之匙已经扣合。时间的单向流动不再能约束我们的工程，无名之雾的空间网络在暗相能量的滋养下稳固延展。\n\n外界宇宙正因我们的改写而产生剧烈的物理反弹与常数溃散，但这不过是低维世界的阵痛。我们要更进一步，‘永恒王座’将高维流形注入物质晶格，彻底统摄宏观形态的自组织法则，让我们的居所容量实现质的飞跃。"
 AIO_crisis_events.304.option: "现实必须学会习惯它该有的痛楚。"
 AIO_crisis_events.305.desc:0 "永恒王座已经高耸于维度顶端，低维的物质与因果已尽在掌控。外界银河的凡庸帝国在恐慌中对我们发起围攻，但这群蝼蚁的悲鸣毫无意义。\n\n最后的基座已经就绪，那象征宇宙存在根本的超然结构——§M犹格·索托斯§!——已经浮现在我们眼前。\n\n这种近乎亵渎的篡改必将唤醒宇宙深层的反噬，引来清算者亚弗戈蒙的降临。但那正是我们捕获神性、彻底飞升的绝佳时刻。"
 AIO_crisis_events.305.option: "放手去做吧。"

 # 飞升事件
 AIO_crisis_events.601.title: "视界门扉"
 AIO_crisis_events.601.desc: "最后的纠错机制已经沉寂。宇宙的免疫风暴在我们的约束力场中耗尽了最后一丝怒火，亚弗戈蒙的残骸化作了基底结构中最顺从的印记。\n\n门后的无限已经彻底洞开。观察者与被观察之物的分界在此刻彻底溶解——只要向前迈出一步，我们的文明将不再是一个历史名词，而是化作一切时空与存在的底层规律。"
 AIO_crisis_events.601.option.wait: "留步凝望"
 AIO_crisis_events.601.option.ascension: "迈入门后"
 AIO_crisis_events.end.option: "我/我们即真理。"
 AIO_crisis_events.602.desc: "归一已完成。\n我们不再是帝国，也不再是实体。我们的意志存在于无限维度的交汇点，成为一切存在的结构性原理。\n熄灭的恒星在燃烧中沉寂。干涸的海盆涌起潮水，潮水又在抵达岸边前化作盐尘；荒芜行星上长出没有祖先的森林，林木倒下之处又萌发从未播下的种子；断裂的航道在接合时通往两片天空，失散千年的舰船同时驶入母港与自己的残骸。亿万种曾彼此排斥的未来，如今在同一片星空下诞生、消亡。\n星辰明灭，因为我们同时写下它们的开始与终点；生命轮回，因为每个故事的最后一页也是下一篇的开端。\n没有永生。没有虚无。每一扇门后，都是同时发生的诞生与告别。\n我/我们即§M犹格·索托斯§!。"

 #endregion


