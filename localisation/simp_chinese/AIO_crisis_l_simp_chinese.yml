 # 犹格索托斯完成
 AIO_crisis_events.403.desc: "位于[from.GetName]的§Y$AIO_mega_01$§!完成"
 AIO_crisis_events.404.desc: "位于[from.GetName]的§Y$AIO_mega_02$§!完成"
 AIO_crisis_events.405.desc: "位于[from.GetName]的§Y$AIO_mega_03$§!完成"
 AIO_crisis_events.406.desc: "位于[from.GetName]的§Y$AIO_mega_04$§!完成"

 # 提示建造视界引擎
 AIO_crisis_events.401.desc: "我们已完成对多维相互作用模型的闭环构建。模拟显示，在特定的引力剪切与虚境波动节点上，现实可被稳定渗透。我们将以此为基础建造§Y$AIO_horizon_engine$§!——一座能穿透物理与可能性边界、抽取存在能量的结构体。\n我们并非第一个拥有这种技术的帝国，不同的是，我们会用这些能量创造一个比现有宇宙高无数倍的时空。"
 AIO_crisis_events.401.option: "建立新进程。"

