 # 犹格索托斯完成
 AIO_crisis_events.403.desc: "位于[from.GetName]的§Y$AIO_mega_01$§!已建成。"
 AIO_crisis_events.404.desc: "位于[from.GetName]的§Y$AIO_mega_02$§!已落成。"
 AIO_crisis_events.405.desc: "位于[from.GetName]的§Y$AIO_mega_03$§!已落成。"
 AIO_crisis_events.406.desc: "位于[from.GetName]的§Y$AIO_mega_04$§!已落成。"

 # 提示建造视界引擎
 AIO_crisis_events.401.desc: "在现实与虚境交界之处，引力的褶皱露出了更深的纹理。那里涌动的能量足以撬开维度之间的壁垒，只是至今仍无人为它筑起足够深的井。\n\n§Y$AIO_horizon_engine$§!将沿着这道裂隙向下延伸。古老文明留下了抽取能量的方法，而我们已经替这些能量找到了新的去处：一个比现有宇宙高出无数层的时空。"
 AIO_crisis_events.401.option: "向现实深处凿井。"

