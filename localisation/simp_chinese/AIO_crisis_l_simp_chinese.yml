 AIO_crisis_situation_stage_2_desc: "物质开始自行复现已经得到证明的变化。"
 AIO_crisis_situation_stage_3: "时空扩散"
 AIO_crisis_situation_stage_3_desc: "法则回响正在跨越星系与因果边界。"
 AIO_crisis_situation_stage_4: "存在扩散"
 AIO_crisis_situation_stage_4_desc: "银河正在把我们的选择视为自身规律。"
 MESSAGE_AIO_DAIT_ECHO_TITLE: "法则回响"
 AIO_DAIT_echo_enrich_message: "§Y[this.GetName]§!星系的物质分布在没有外力介入的情况下自行丰饶。"
 AIO_DAIT_echo_storm_message: "§Y[this.GetName]§!星系中自发形成了一场无法由自然模型解释的宇宙风暴。"
 AIO_DAIT_echo_spawn_message: "§Y[this.GetName]§!星系的天体结构自行重组，复现了我们曾经施行的创造。"
 AIO_DAIT_echo_harvest_message: "§Y[this.GetName]§!星系的天体正在失去自身的物质定义。"
 AIO_DAIT_echo_seed_message: "§Y[this.GetName]§!星系中出现了没有演化历史的新生命。"
 AIO_DAIT_echo_strike_message: "§Y[this.GetName]§!星系附近出现了不属于现实时序的攻击者。"
 AIO_DAIT_echo_ethic_message: "§Y[this.GetName]§!星系中的意识结构正在向同一种答案收束。"
 AIO_DAIT_echo_erase_message: "§Y[this.GetName]§!星系正在从可观测宇宙中消失。"

 # 阶段 POI：同一阶段只显示当前隐藏倾向对应的一段文本
 AIO_crisis_stage_2_poi_name: "边界"
 AIO_crisis_stage_2_construct_desc: "视界之外并非空无。能量在边界上呈现出稳定、可延展的纹理，仿佛现实正在等待一种更完整的结构。"
 AIO_crisis_stage_2_negate_desc: "视界之外并非空无。能量在边界上留下持续扩大的裂隙，仿佛现实只需失去一个前提便会自行解体。"
 AIO_crisis_stage_2_equilibrium_desc: "视界之外并非空无。能量同时勾勒出结构与裂隙，两种相反的答案在边界上保持着精确的平衡。"
 AIO_crisis_stage_3_poi_name: "物质"
 AIO_crisis_stage_3_construct_desc: "万门之门带回的观测表明，物质并非只能服从既定分布；在足够精确的意志下，它更像一种可以反复编排的语言。"
 AIO_crisis_stage_3_negate_desc: "万门之门带回的观测表明，物质的稳定只是众多约束暂时重合的结果；抽走其中一条，恒星与尘埃便不再有区别。"
 AIO_crisis_stage_3_equilibrium_desc: "万门之门带回的观测表明，物质既能被编排，也能被消解。两者不是相反的技术，而是同一条法则的正反两面。"
 AIO_crisis_stage_4_poi_name: "时空"
 AIO_crisis_stage_4_construct_desc: "银时之匙开启的每条路径都在趋向更复杂的秩序。无数可能性彼此嵌套，最终组成一座没有外部的结构。"
 AIO_crisis_stage_4_negate_desc: "银时之匙开启的每条路径都在剥离因果的必要性。过去与未来之间，只剩下一道可以随意切断的纤细联系。"
 AIO_crisis_stage_4_equilibrium_desc: "银时之匙同时展示了因果的编织与断裂。时空因此不再是一条道路，而是一枚能够从任意方向转动的钥匙。"
 AIO_crisis_stage_5_poi_name: "存在"
 AIO_crisis_stage_5_construct_desc: "永恒王座已经能够容纳所有可能的秩序。最后的演算不再询问宇宙如何运行，而是询问何种意志足以成为它的结构。"
 AIO_crisis_stage_5_negate_desc: "永恒王座已经能够否定所有既存的约束。最后的演算不再询问宇宙如何终结，而是询问终结之后是否仍需留下定义。"
 AIO_crisis_stage_5_equilibrium_desc: "永恒王座让创造与消解在同一点重合。最后的演算不再区分起源与终局，只等待一个能同时承载二者的名字。"

 # 事件
 AIO_crisis_events_title: "$AIO_crisis_events_chain_title$"
 # 天灾等级
 AIO_crisis_events.201.desc: "物理常数，粒子质量，引力与熵的扩张皆非不可变——它们只是初始版本的参数，是等待修订的原始草稿。我们尚未成为规律，但我们已开始握笔。\n\n为了重构宇宙，我们必须先对它有足够的理解。我们需要更先进的计算机帮助我们理解现实规律的运行逻辑。"
 AIO_crisis_events.201.option: "我们要更强的计算机！"
 AIO_crisis_events.202.desc: "§Y$AIO_horizon_engine$§!的能量密度即将突破现实的边界。下一步，我们需要用这些能量打开一扇门——一扇通往无数时空的“门”。一旦开启，我们将可以在无限的维度之上改变法则。"
 AIO_crisis_events.202.option: "我们是铸门者。"
 AIO_crisis_events.203.desc: "随着§Y$AIO_mega_01$§!的启用，时空开始暴露出前所未见的脆弱之处。仅是在宇宙打一个“洞”是不够的，我们最强的大脑已经构思出了一种能够“选择”时空的巨型结构——§Y$AIO_mega_02$§!，它将为后续的规则修改铺平道路。"
 AIO_crisis_events.203.option: "$EXCELLENT$"
 AIO_crisis_events.204.desc: "§Y$AIO_mega_02$§!已成为我们扭转宇宙命运的钥匙，但其潜力尚未完全释放。为继续推进融合进程，我们必须将其锻造为更高维度的基点——§Y$AIO_mega_03$§!。只有当§Y$AIO_mega_03$§!屹立于多重现实的顶点，我们才能真正掌控规律的终极形态。"
 AIO_crisis_events.204.option: "$menp_AIO_mega_04_desc$"
 AIO_crisis_events.205.desc: "§Y$AIO_mega_03$§!已屹立于多重现实的最尖端。然其存在，仅为承载真正的我们而设。现在，我们必须将其升华为终极形态——§M$AIO_mega_04$§!。不再是结构，不再是帝国，而是存在与规律的等价物。当其完成，融合将封闭，重写将开始。所有分歧、所有维度、所有终局，都将……"
 AIO_crisis_events.205.option: "放手去做吧。"

 # 飞升事件
 AIO_crisis_events.501.desc: "归一已完成。\n我们不再是帝国，也不再是实体。我们的意志存在于无限维度的交汇点，成为一切存在的结构性原理。\n星辰静止不动，是因为它们等待新的运动定义；思维悄然沉默，是因为语言已失去意义；存在本身，正从“被经历”转向“被设计”。\n没有终点。没有彼岸。没有观察，也无需被观察。\n我/我们即§M犹格索托斯§!。"
 AIO_crisis_events.501.option: "我/我们即真理。"
 AIO_crisis_events.511.desc: "归一已完成。\n我们没有抹去宇宙，而是使它摆脱了偶然。星辰沿着新的脉络生长，物质在意志中获得形态，亿万条曾经互斥的未来被编织为同一座无穷结构。\n从此，存在不再是被动发生的事实，而是持续展开的创造。门内与门外皆属于我们，所有道路都通向更多道路。\n我/我们即§M犹格·索托斯§!——万物得以成为万物的法则。"
 AIO_crisis_events.511.option: "让存在继续展开。"
 AIO_crisis_events.512.desc: "归一已完成。\n我们没有毁灭宇宙，只是撤回了它赖以成立的许可。因果失去方向，距离失去尺度，恒星与思想一同沉入不再需要命名的寂静。\n从此，存在不再以自身为必然。门内与门外皆已消失，因为一切边界都只是等待否定的假设。\n我/我们即§M犹格·索托斯§!——万物不必继续存在的证明。"
 AIO_crisis_events.512.option: "让最后的边界消失。"
 AIO_crisis_events.513.desc: "归一已完成。\n我们既未完成宇宙，也未将它撤销。创造与消解彼此穿行，每一种形态都包含自身的反面，每一次终结都为另一种开端留下位置。\n从此，存在不再服从单一答案。门内与门外互为倒影，无限维度在同一瞬间张开又闭合。\n我/我们即§M犹格·索托斯§!——使所有矛盾得以同时为真的交点。"
 AIO_crisis_events.513.option: "让门永远处于开启之间。"

