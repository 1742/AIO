l_simp_chinese:
 AIO_recursive_cycle_situation: "递归演算"
 AIO_recursive_cycle_situation_type: "$AIO_recursive_cycle_situation$"
 AIO_recursive_cycle_situation_desc: "套娃脑正在把递归节点编排为可重复执行的理论凝聚循环。节点仍通过岗位经济正常生产科研与超然逻辑；循环完成时则将本轮计算压缩为储备科研，并以不可逆的方式消耗参与演算的节点。\n\n三种方案产生的进度会分别记账，科研奖励和人口损失按各方案实际贡献的进度加权。"
 AIO_recursive_cycle_situation_monthly_change_tooltip: "月进度取决于帝国所有已任职递归节点的总劳动力及当前计算方案。能量币或超然逻辑赤字时暂停。"
 AIO_recursive_cycle_stage_1: "演算编排"
 AIO_recursive_cycle_stage_1_desc: "网络仍可自由改变计算结构。串行演算必须在这一阶段结束前确定。"
 AIO_recursive_cycle_stage_2: "理论收束"
 AIO_recursive_cycle_stage_2_desc: "计算结构已经收束。当前串行演算可以继续，但离开后不能重新切回；并行与超频仍可互换。"

 AIO_recursive_cycle_parallel: "并行演算"
 AIO_recursive_cycle_parallel_desc: "将问题拆分到尽可能多的节点：$job_AIO_recursive_node$岗位效率§G+100%§!，局势速度§R-50%§!；每100节点每月消耗§R0.5§!$AIO_advanced_logic$。该方案贡献的进度对应§Y5%§!人口损失和三项各§Y120个月§!月度科研。"
 AIO_recursive_cycle_serial: "串行演算"
 AIO_recursive_cycle_serial_desc: "沿单一依赖链执行不可并行化的推演：局势速度§G+100%§!；每100节点每月消耗§R1§!$AIO_advanced_logic$。该方案贡献的进度对应§Y10%§!人口损失和三项各§Y240个月§!月度科研。进入第二阶段后不能重新选择。"
 AIO_recursive_cycle_serial_locked: "£trigger_no£理论已进入收束阶段，不能再将计算结构切换为串行演算。"
 AIO_recursive_cycle_overclock: "过载超频"
 AIO_recursive_cycle_overclock_desc: "同时扩张并行宽度并压缩串行时序：$job_AIO_recursive_node$岗位效率§G+100%§!，局势速度§G+100%§!；每100节点每月消耗§R2§!$AIO_advanced_logic$。该方案贡献的进度对应§R25%§!人口损失和三项各§Y120个月§!月度科研。"
 AIO_recursive_cycle_parallel_progress_desc: "$AIO_recursive_cycle_parallel$"
 AIO_recursive_cycle_serial_progress_desc: "$AIO_recursive_cycle_serial$"
 AIO_recursive_cycle_overclock_progress_desc: "$AIO_recursive_cycle_overclock$"

 AIO_recursive_cycle_parallel_modifier: "$AIO_recursive_cycle_parallel$"
 AIO_recursive_cycle_overclock_modifier: "$AIO_recursive_cycle_overclock$"

 AIO_recursive_events.204.title: "递归演算完成"
 AIO_recursive_events.204.desc: "本轮演算已经收束。\n\n三项储备科研分别增加相当于§Y[This.AIO_recursive_cycle_research_months]个月§!当前月度产出的数值。\n参与演算的递归节点损失§R[This.AIO_recursive_cycle_pop_loss_display]%§!。"
 AIO_recursive_events.204.option: "启动下一轮演算。"
 AIO_recursive_events.204.exhausted: "\n\n§Y所有可凝聚的永久理论均已达到上限，本轮不再产生永久修正。§!"
 AIO_recursive_events.204.material_1: "\n\n§H永久理论抽取：原子晶格效率§!\n等级：[This.AIO_DAIT_material_option_1_rank]/10\n每级：矿物、食物、合金、消费品与战略资源岗位产出§G+100%§!。"
 AIO_recursive_events.204.material_2: "\n\n§H永久理论抽取：重子装配阈值§!\n等级：[This.AIO_DAIT_material_option_2_rank]/8\n每级：建筑、舰船和巨型结构建造花费§G-10%§!。"
 AIO_recursive_events.204.material_3: "\n\n§H永久理论抽取：生物/机械自举§!\n等级：[This.AIO_DAIT_material_option_3_rank]/10\n每级：人口增长与组装速度§G+10%§!。"
 AIO_recursive_events.204.material_4: "\n\n§H永久理论抽取：结构抗熵极限§!\n等级：[This.AIO_DAIT_material_option_4_rank]/8\n每级：建筑与区划维护费§G-10%§!。"
 AIO_recursive_events.204.material_5: "\n\n§H永久理论抽取：泡利不相容屏蔽§!\n等级：[This.AIO_DAIT_material_option_5_rank]/8\n每级：最大区划§G+12.5%§!，住房使用§G-10%§!。"
 AIO_recursive_events.204.material_7: "\n\n§H永久理论抽取：行星相态重写§!\n等级：[This.AIO_DAIT_material_option_7_rank]/10\n每级：最低宜居度§G+7%§!，环境改造速度§G+100%§!。"
 AIO_recursive_events.204.energy_1: "\n\n§H永久理论抽取：真空零点能级§!\n等级：[This.AIO_DAIT_energy_option_1_rank]/10\n每级：能量币岗位产出与舰船护盾§G+100%§!。"
 AIO_recursive_events.204.energy_2: "\n\n§H永久理论抽取：麦克斯韦妖协议§!\n等级：[This.AIO_DAIT_energy_option_2_rank]/8\n每级：岗位及舰船能量币维护费§G-10%§!。"
 AIO_recursive_events.204.energy_3: "\n\n§H永久理论抽取：强相互作用耦合§!\n等级：[This.AIO_DAIT_energy_option_3_rank]/10\n每级：舰船船体与装甲§G+100%§!。"
 AIO_recursive_events.204.energy_4: "\n\n§H永久理论抽取：精细结构常数§!\n等级：[This.AIO_DAIT_energy_option_4_rank]/10\n每级：舰船武器伤害§G+100%§!。"
 AIO_recursive_events.204.energy_5: "\n\n§H永久理论抽取：作用量极小化§!\n等级：[This.AIO_DAIT_energy_option_5_rank]/10\n每级：行星设施、巨构、舰船及恒星基地建造速度§G+100%§!。"
 AIO_recursive_events.204.metric_1: "\n\n§H永久理论抽取：拓扑流形刚度§!\n等级：[This.AIO_DAIT_metric_option_1_rank]/8\n每级：帝国规模§G-10%§!。"
 AIO_recursive_events.204.metric_2: "\n\n§H永久理论抽取：闵可夫斯基度规§!\n等级：[This.AIO_DAIT_metric_option_2_rank]/8\n每级：亚光速航速§G+12.5%§!，超空间充能与冷却§G-10%§!。"
 AIO_recursive_events.204.metric_3: "\n\n§H永久理论抽取：光锥闭合曲线§!\n等级：[This.AIO_DAIT_metric_option_3_rank]/10\n每级：闪避、船体/装甲/护盾每日再生§G+100%§!。"
 AIO_recursive_events.204.metric_4: "\n\n§H永久理论抽取：非定域性关联§!\n等级：[This.AIO_DAIT_metric_option_4_rank]/10\n每级：探测范围§G+0.3§!，武器射程§G+6%§!，追踪§G+100%§!。"
 AIO_recursive_events.204.metric_5: "\n\n§H永久理论抽取：事件视界投影§!\n等级：[This.AIO_DAIT_metric_option_5_rank]/10\n每级：命中§G+10%§!，量子弹弓准确度§G+25%§!，跃迁范围§G+50%§!。"
 AIO_recursive_events.204.metric_6: "\n\n§H永久理论抽取：因果律攻防§!\n等级：[This.AIO_DAIT_metric_option_6_rank]/8\n每级：装甲与护盾穿透§G+12.5%§!，伤害减免§G+10%§!。"

