 AIO_interference_industry_backlash: "精炼制造反噬：[Target.GetName]"
 AIO_interference_industry_backlash_type: "精炼制造反噬"
 AIO_interference_industry_backlash_desc: "我国干涉场覆盖的多个星系正出现材料相变加速与异常热流。受影响殖民地的矿场与精炼厂增产，但维护和建设成本也在上升。"
 AIO_interference_industry_backlash_monthly_change_tooltip: "精炼制造政策生效时，$AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_industry_maintain: "$AIO_interference_accidence_maintain$"
 AIO_industry_maintain_desc: "维持现有干涉参数，继续记录矿物分离速率与异常热流。"
 AIO_industry_blockade: "$AIO_interference_accidence_blockade$"
 AIO_industry_blockade_desc: "压低材料相变速率，隔离过热区域，让异常热流逐步回落。"
 AIO_industry_reverse: "$AIO_interference_accidence_reverse$"
 AIO_industry_reverse_desc: "确定矿物分离与温度控制的稳定范围，保留增产潜力并减少损耗。"

 AIO_industry_backlash_1: "冶炼过载 I"
 AIO_industry_backlash_1_desc: "矿物与合金生产潜力上升；若有殖民地，炉衬、备件和新设施的需求也会增加。"
 AIO_industry_backlash_2: "冶炼过载 II"
 AIO_industry_backlash_2_desc: "材料相变继续加速；若有殖民地，矿石供应、维护需求和扩建成本随之上升。"
 AIO_industry_backlash_3: "冶炼过载 III"
 AIO_industry_backlash_3_desc: "矿物与合金增益达到峰值；若有殖民地，高产将依赖更多原料与频繁的设备更换。"
 AIO_industry_backlash_collapse_colony: "工业停摆"
 AIO_industry_backlash_collapse_colony_desc: "异常热流与矿渣层将长期阻碍开发；若有殖民地，矿场与精炼厂也会长期减产。"

 d_AIO_industry_slag_residue: "£blocker£ 矿渣残层"
 d_AIO_industry_slag_residue_desc: "矿渣与凝固的铁水填塞运输通道，烧毁的设备骨架仍需拆除。"

 AIO_interference_events.440.name: "冶炼临界"
 AIO_interference_events.440.desc.maker: "我国干涉场覆盖的星系中，矿物分离和材料相变同时加速。受影响殖民地的矿场与精炼厂增产，异常热流和维护消耗也在上升。"
 AIO_interference_events.440.desc.other: "[from.GetName]的精炼制造干涉场出现异常热流。我国受影响殖民地的矿场与精炼厂增产，维护压力也在上升。"
 AIO_interference_events.440.option.maker: "启动事故应对程序。"

 AIO_interference_events.441.name: "第一次过热"
 AIO_interference_events.441.desc.maker: "第一轮过热冲击干涉场覆盖区。冷却泵停转，熔融物溢出导流槽；受影响殖民地的矿石运输和冶炼线被迫减速。"
 AIO_interference_events.441.desc.other: "[from.GetName]的精炼制造干涉场出现第一轮过热。我国受影响殖民地的矿场和运输线遭到冲击。"
 AIO_interference_events.441.option.maker: "记录损耗。"

 AIO_interference_events.442.name: "产线梗阻"
 AIO_interference_events.442.desc.maker: "异常热流继续扰乱矿脉与输送流程。受影响殖民地再次受损，疏通和重建产线所需的材料持续增加。"
 AIO_interference_events.442.desc.other: "[from.GetName]的精炼制造干涉场再次过热。我国受影响殖民地的产线遭到进一步损坏。"
 AIO_interference_events.442.option.maker: "继续压住产线。"

 AIO_interference_events.443.name: "驾驭反噬"
 AIO_interference_events.443.desc.maker: "研究人员确定了矿石供料与炉温控制的稳定范围。矿物和合金仍保持高产，设备损耗却不再失控。$AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.443.desc.other: "[from.GetName]稳定了精炼制造干涉场。我国受影响星系的异常高温回落，开采与冶炼仍可受益。"

 AIO_interference_events.444.name: "工业停摆"
 AIO_interference_events.444.desc.maker: "冷却回路相继失效，熔融物凝固成大片矿渣。干涉场覆盖的殖民地遭受严重破坏，矿场与精炼厂需要数年恢复。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.444.desc.other: "[from.GetName]的精炼制造干涉场发生崩溃。我国受影响殖民地遭受严重破坏，矿渣将长期阻碍开发。"
 AIO_interference_events.444.option.maker: "$AIO_interference_accidence_option.collapse$"

 AIO_interference_events.445.name: "实验已中止"
 AIO_interference_events.445.desc.maker: "干涉场的影响正在减弱，异常热流逐步回落。受损输送线仍需修复，但大范围过热已经停止。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.445.desc.other: "[from.GetName]的精炼制造干涉场正在减弱。我国受影响星系的异常热流回落，残余矿渣仍需清理。"

