l_simp_chinese:
 #region 灵能光环

 AIO_reality_interference_aura: "现实干涉场"
 AIO_reality_interference_aura_level_1_tt: "§H轻度现实扭曲§!"
 AIO_reality_interference_aura_level_2_tt: "§H显著现实扭曲§!"
 AIO_reality_interference_aura_level_3_tt: "§R临界现实扭曲§!"
 AIO_interference_source_intensity_desc: "现实干涉仪"
 AIO_interference_proof_intensity_desc: "现实证明者"
 AIO_interference_disconnected_desc: "与现实干涉源断开"

 #endregion


 #region 建筑

 building_AIO_reality_proof_facility: "现实证明设施"
 building_AIO_reality_proof_facility_desc: "以观测和演算不断验证局部现实的可塑性。"
 building_AIO_reality_proof_facility_tt: "每100名 £job_physicist£ §Y现实证明者§!使当地现实干涉场每月额外增长§G0.5§!强度，每星系最多计入1000名。"

 #endregion


 #region 岗位

 job_AIO_proof_researcher: "现实证明者"
 job_AIO_proof_researcher_plural: "现实证明者"
 job_AIO_proof_researcher_desc: "证明既有物理定律只是现实的一种可选解。"
 mod_job_AIO_proof_researcher_add: "£job_physicist£ $job_AIO_proof_researcher$岗位"
 job_AIO_proof_drone: "现实证明子例程"
 job_AIO_proof_drone_plural: "现实证明子例程"
 job_AIO_proof_drone_desc: "持续验证并修订局部现实的基础规律。"
 mod_job_AIO_proof_drone_add: "£job_physicist£ $job_AIO_proof_drone$岗位"

 #endregion


 #region 巨构

 AIO_reality_interferometer: "现实干涉仪"
 AIO_reality_interferometer_plural: "$AIO_reality_interferometer$"
 AIO_reality_interferometer_DESC: "以超然逻辑强迫局部现实服从预设结论的巨型装置。装置会生成并强化现实干涉场；若当地已有灵能光环，启动时将直接覆盖原有光环。"
 AIO_reality_interferometer_MEGASTRUCTURE_DETAILS: "建成后按国家干涉政策启用统一来源。覆盖同一星系的效果按本国来源数叠加，最多计入三座；我方效果还受光环等级影响。每个星系只能建造一座，每个帝国初始最多维持五座。"
 AIO_requires_no_existing_reality_interferometer: "$TRIGGER_FAIL$该星系已经存在一座$AIO_reality_interferometer$。"
 AIO_requires_reality_interferometer_capacity: "$TRIGGER_FAIL$我们最多只能维持§Y5§!座$AIO_reality_interferometer$。"

 #endregion


 #region 修正

 mod_AIO_interferometer_range: "现实干涉仪影响范围"

 #endregion


 #region 提示

 AIO_interferometer_completed: "位于§Y[from.GetName]§!星系中的$AIO_reality_interferometer$已建造完成。"

 #endregion


 #region 政策

 policy_policy_AIO_interference_doctrine: "现实干涉范式"
 policy_policy_AIO_interference_doctrine_desc: "决定本国现实干涉场采用的组合效应。改变范式只改变收益构成，不改变光环覆盖与强度。"
 policy_AIO_interference_balanced: "均衡干涉"
 policy_AIO_interference_energy: "零点能量"
 policy_AIO_interference_ecology: "生态演化"
 policy_AIO_interference_industry: "精炼制造"
 policy_AIO_interference_metric: "度规工程"

 #endregion


 #region 反噬局势通用文本

 AIO_interference_accidence_maintain: "维持实验"
 AIO_interference_accidence_blockade: "紧急封锁"
 AIO_interference_accidence_reverse: "逆转反噬"
 AIO_interference_accidence_progress_active: "现实干涉场"
 AIO_interference_accidence_progress_blockade: "$AIO_interference_accidence_blockade$"
 AIO_interference_accidence_progress_policy_mismatch: "干涉方向已改变"
 AIO_interference_accidence_progress_disconnect: "与干涉源失联"
 AIO_interference_accidence_backlash_monthly_change_tooltip: "采取积极的应对方案会使局势受§Y现实干涉场来源数量§!和§I证明者§!影响。"
 AIO_interference_accidence_conclusion.no_reverse: "在这轮爆发后干涉场对现实的影响减弱了，宇宙似乎会在矛盾达到极点时严重失稳，爆发后恢复原样，它总是向着“稳态”演化。"
 AIO_interference_accidence_conclusion.reverse: "这和以往的实验不同，事故地点与外界保持着不同的宇宙常数，我们的更改似乎会持续一段时间。"
 AIO_interference_accidence_option.abort: "可惜。"
 AIO_interference_accidence_option.collapse: "必要的牺牲。"
 AIO_interference_accidence_option.reverse: "我们对宇宙的理解更进一步。"

 #endregion


 #region 反噬好感与通知

 opinion_AIO_interference_accident: "扰乱现实"
 AIO_interference_events.390.name: "越界的实验"
 AIO_interference_events.390.desc: "过去几个月，我们星系里的读数反复失稳，工程队只当是设备故障。现在真相送到了桌上：[event_target:AIO_accident_owner.GetName]把这里当成了试验场，留给我们的只有受损的设施和一句“实验数据已归档”。"
 AIO_interference_events.390.option: "记下这笔账。"

 #endregion


 #region 均衡干涉反噬

 AIO_interference_balanced_backlash: "均衡干涉反噬：[Target.GetName]"
 AIO_interference_balanced_backlash_type: "均衡干涉反噬"
 AIO_interference_balanced_backlash_desc: "[Target.GetName]的现实正在变得均匀。干涉场把一切差异都抹平：产出、消耗、生长，全部向同一条水平线靠拢。起初这是恩惠——每座殖民地都以同样的效率运转，没有短板。但均匀意味着没有冗余，一旦某处开始偏离，整片区域都会跟着偏移。"
 AIO_interference_balanced_backlash_monthly_change_tooltip: "均衡干涉政策生效时，$AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_balanced_stage_one: "数值趋同"
 AIO_balanced_stage_one_desc: "各处产出的差异最先消失。报表变得整齐划一，调度员发现自己无从下手——每个数值都是同一个数。"
 AIO_balanced_stage_two: "比例拉平"
 AIO_balanced_stage_two_desc: "均衡向更深处蔓延。舒适与秩序被一起拉向同一条线，人们说不清哪里不对，只觉得一切都刚刚好，好得令人不安。"
 AIO_balanced_stage_three: "均质临界"
 AIO_balanced_stage_three_desc: "整片区域已经被拖到同一条线上。产出高得离谱，基建却跟不上——因为在这里，已经没有任何东西比别的东西更突出。"

 AIO_balanced_maintain: "$AIO_interference_accidence_maintain$"
 AIO_balanced_maintain_desc: "多么漂亮的平衡啊，我们应该抓住这个机会，看看均匀能被推到多远。"
 AIO_balanced_blockade: "$AIO_interference_accidence_blockade$"
 AIO_balanced_blockade_desc: "把殖民地与干涉场隔开，让局部的差异自己长回来，事故到此为止。"
 AIO_balanced_reverse: "$AIO_interference_accidence_reverse$"
 AIO_balanced_reverse_desc: "我们已经看清这个平均值是怎么形成的，接下来把它拆开。"

 AIO_balanced_accidence_1: "均质化 I"
 AIO_balanced_accidence_1_desc: "每个数字都在向中间靠拢，好处和坏处一起来。"
 AIO_balanced_accidence_2: "均质化 II"
 AIO_balanced_accidence_2_desc: "产出继续上涨，代价也一起上涨：这里没有一样东西是为效率调过的。"
 AIO_balanced_accidence_3: "均质化 III"
 AIO_balanced_accidence_3_desc: "整片区域被拉成同一条线，产量惊人，代价同样惊人。"
 AIO_balanced_misalignment: "失衡冲击"
 AIO_balanced_misalignment_desc: "平均值突然歪了一下，各处的读数同时偏转，殖民地被反复拉扯。"
 AIO_balanced_drift: "比例漂移"
 AIO_balanced_drift_desc: "平均值在缓慢漂移，整片区域被迫跟着偏移，每个岗位都变得更贵。"
 AIO_balanced_collapse: "均质坍塌"
 AIO_balanced_collapse_desc: "一整片区域被拉成同一个数值，然后同时塌了下去。这个星系要数年才能恢复差异。"

 d_AIO_balanced_uniform_residue: "£blocker£ 均质残层"
 d_AIO_balanced_uniform_residue_desc: "沟壑与残骸被压成一层毫无特征的灰土，什么也建不起来。"

 AIO_interference_events.310.name: "均衡临界"
 AIO_interference_events.310.desc: "[Target.GetName]的干涉场已经临界。这里的现实正在被抹平，产出与消耗同时向同一条水平线靠拢，而这条线还在缓慢下移。我们可以现在就动手，也可以再看看它会走到哪一步。"
 AIO_interference_events.310.option: "启动事故应对程序。"
 AIO_interference_events.311.name: "第一次失衡"
 AIO_interference_events.311.desc: "平均值突然晃了一下。各处的读数在同一瞬间一起偏转，[Target.GetName]的殖民地被反复拉扯，供能中断，而产出还在上涨。"
 AIO_interference_events.311.option: "记录偏差。"
 AIO_interference_events.312.name: "比例漂移"
 AIO_interference_events.312.desc: "平均值不再稳定，整片区域被迫跟着它一起漂移。产出依旧惊人，但整齐正在以效率为代价——没有任何一处还能被单独优化。"
 AIO_interference_events.312.option: "继续压制偏差。"
 AIO_interference_events.313.name: "驾驭反噬"
 AIO_interference_events.313.desc: "在我们最强的科学家们的干预下，[Target.GetName]的数值不再被强行拉平，而是开始在我们选定的区间里自由波动。$AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.313.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.314.name: "均质坍塌"
 AIO_interference_events.314.desc: "一整片区域被拉成了同一个数值，然后同时塌了下去：殖民地大面积焦毁，地表被压成均质的一层，全国产出要数年才能恢复差异。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.314.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.315.name: "实验已中止"
 AIO_interference_events.315.desc: "事故结束了，平均值正在慢慢散回原来的样子，这次没有留下真正的损伤。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.315.option: "$AIO_interference_accidence_option.abort$"

 #endregion


 #region 零点能量反噬

 AIO_interference_energy_backlash: "零点能量反噬：[Target.GetName]"
 AIO_interference_energy_backlash_type: "零点能量反噬"
 AIO_interference_energy_backlash_desc: "[Target.GetName]的电网正在与干涉场失去同步。电网把积存的电荷抛进现实的缝隙，产出越推越高，越来越不受我们控制。我们可以调整功能设备抑制它，也可以抓住这个机会研究物理规则的改变。"
 AIO_interference_energy_backlash_monthly_change_tooltip: "零点能量政策生效时，$AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_energy_stage_one: "电网失谐"
 AIO_energy_stage_one_desc: "发电机组越转越顺，用电器却开始对不上——吊臂无故停摆，殖民地广播里混进了不该存在的静电。"
 AIO_energy_stage_two: "反馈浪涌"
 AIO_energy_stage_two_desc: "电网开始把多出来的电荷推回殖民地。灯亮得刺眼，护盾在港内无故闪烁，而电网自己在一瞬间烧成了一片黑障。"
 AIO_energy_stage_three: "级联阈值"
 AIO_energy_stage_three_desc: "浪涌已经不需要电缆来传播。整个星系的供能都吊在干涉场边缘，产出高得离谱，而同一股电流正慢慢啃掉基建，一切都变得不稳定。"

 AIO_energy_maintain: "$AIO_interference_accidence_maintain$"
 AIO_energy_maintain_desc: "多么美妙的现象啊，我们应该抓住这个难得的机会研究！"
 AIO_energy_blockade: "$AIO_interference_accidence_blockade$"
 AIO_energy_blockade_desc: "把殖民地与电网隔开，让浪涌在隔离层里自己耗干，事故到此为止。"
 AIO_energy_reverse: "$AIO_interference_accidence_reverse$"
 AIO_energy_reverse_desc: "凭借我们对宇宙规律和高维空间的认知，我们将重新引导能量的流动。"

 AIO_energy_accidence_1: "电网过载 I"
 AIO_energy_accidence_1_desc: "发电机组喜欢这样，电机却不喜欢。"
 AIO_energy_accidence_2: "电网过载 II"
 AIO_energy_accidence_2_desc: "浪涌越来越强，发电量一路上涨，代价也从地基蔓延到港口与舰队。"
 AIO_energy_accidence_3: "电网过载 III"
 AIO_energy_accidence_3_desc: "整个星系都在跟着电网震颤，浪涌已经脱离了常理。"
 AIO_energy_blackout: "电网黑障"
 AIO_energy_blackout_desc: "浪涌烧穿了局部供能系统，殖民地暂时停摆。"
 AIO_energy_grid_drain: "电网降压"
 AIO_energy_grid_drain_desc: "浪涌在星系里反复冲刷，电网被迫降压运行。"
 AIO_energy_grid_collapse: "电网崩溃"
 AIO_energy_grid_collapse_desc: "零点电网烧穿，这个星系的供电要数年才能缓过来。"

 d_AIO_energy_cascade_residue: "£blocker£ 级联残渣"
 d_AIO_energy_cascade_residue_desc: "电网烧穿后留下的电离渣块，仍在低鸣放电。"

 AIO_interference_events.320.name: "电网频率分岔"
 AIO_interference_events.320.desc: "[Target.GetName]的干涉场已经临界。零点电网在两种互不相容的能量状态之间来回震荡，每一次都在现实里留下抹不掉的痕迹。我们可以现在就动手，也可以再看看它会走到哪一步。"
 AIO_interference_events.320.option: "启动事故应对程序。"
 AIO_interference_events.321.name: "第一次浪涌"
 AIO_interference_events.321.desc: "电网把积存的电荷一次抛了出去，[Target.GetName]的殖民地发生了好几次火灾，供能系统陷入黑障，而能源产出还在增长。"
 AIO_interference_events.321.option: "记录损伤。"
 AIO_interference_events.322.name: "电网级联"
 AIO_interference_events.322.desc: "第二次浪涌不再沿着电缆走，而是沿着干涉场回传。全国电网被迫降压一年，殖民地再次受损，产量曲线却依旧高的吓人。"
 AIO_interference_events.322.option: "继续隔离电网。"
 AIO_interference_events.323.name: "驾驭反噬"
 AIO_interference_events.323.desc: "在我们最强的科学家们的干预下，[Target.GetName]的能量涌动逐渐得到控制，能量从混乱的湍流变成平稳的大河。$AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.323.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.324.name: "电网崩溃"
 AIO_interference_events.324.desc: "巨大的能量浪涌烧穿了[Target.GetName]的电网，殖民地大片焦毁，电离残渣堆在废墟上，全国供电要花数年才能缓过来。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.324.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.325.name: "实验已中止"
 AIO_interference_events.325.desc: "事故结束了，幸运的是电网没有彻底报废。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.325.option: "$AIO_interference_accidence_option.abort$"

 #endregion

 #region 生态演化反噬

 AIO_interference_ecology_backlash: "生态演化反噬：[Target.GetName]"
 AIO_interference_ecology_backlash_type: "生态演化反噬"
 AIO_interference_ecology_backlash_desc: "[Target.GetName]的生物圈正在脱出控制。干涉场让每一株、每一只、每一群都比该有的样子长得更快：产出曲线一路上扬，而同一股生命力正在啃食承托它自己的设施。我们可以投入设备把它压下去，也可以趁这个机会研究生命为何能这样生长。"
 AIO_interference_ecology_backlash_monthly_change_tooltip: "生态演化政策生效时，$AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_ecology_stage_one: "过度生长"
 AIO_ecology_stage_one_desc: "最先变化的是田地和养殖场的报表：什么都长得比过去更快，收割与捕捞都跟不上。"
 AIO_ecology_stage_two: "失控群落"
 AIO_ecology_stage_two_desc: "长出来的东西不再听话。根系钻进电缆槽，孢子堵住通风口，维护班次改成全天候，只为了把生长挡在生活区外面。"
 AIO_ecology_stage_three: "生物圈过载"
 AIO_ecology_stage_three_desc: "整个星系的生物圈已经连成一个生命体。产出惊人，而同一股生长正在吃地基、吃管线、吃船坞。"

 AIO_ecology_maintain: "$AIO_interference_accidence_maintain$"
 AIO_ecology_maintain_desc: "多么漂亮的生命啊，我们应该抓住这个机会，看看它到底能长到哪一步。"
 AIO_ecology_blockade: "$AIO_interference_accidence_blockade$"
 AIO_ecology_blockade_desc: "把殖民地与群落隔开，让两边各自停在自己的界限内，事故到此为止。"
 AIO_ecology_reverse: "$AIO_interference_accidence_reverse$"
 AIO_ecology_reverse_desc: "我们已经看清这股生长的规律，接下来给它重新画一条边界。"

 AIO_ecology_accidence_1: "生态膨胀 I"
 AIO_ecology_accidence_1_desc: "每一块田、每一间养殖舱都超出配额，还没有人停下来问为什么。"
 AIO_ecology_accidence_2: "生态膨胀 II"
 AIO_ecology_accidence_2_desc: "电缆槽里是根，通风口里是孢子，维护班组全天候处理损伤报告。"
 AIO_ecology_accidence_3: "生态膨胀 III"
 AIO_ecology_accidence_3_desc: "一个生命体，一份胃口，而基础设施正写在菜单上。"
 AIO_ecology_bloom: "生态爆发"
 AIO_ecology_bloom_desc: "生长一次性越过了全部界限：孢子与根系同时铺开，殖民地为此付出代价。"
 AIO_ecology_choke: "生态窒息"
 AIO_ecology_choke_desc: "群落正在勒住周围的一切：地形改造停摆，每个岗位都要多付一笔。"
 AIO_ecology_collapse: "生物圈崩溃"
 AIO_ecology_collapse_desc: "整个生物圈在同一瞬间越过极限，然后一起垮了下来；这个星系的产出要数年才能恢复。"

 d_AIO_ecology_overgrowth: "£blocker£ 丛生残层"
 d_AIO_ecology_overgrowth_desc: "生长退去后留下的厚厚一层根须与腐质，什么也种不踏实。"

 AIO_interference_events.330.name: "生态临界"
 AIO_interference_events.330.desc: "[Target.GetName]的干涉场已经临界。这里的生物圈正在加速：产出与生长一起向上冲，而承托它们的结构正在变薄。我们可以现在就动手，也可以再看看它会走到哪一步。"
 AIO_interference_events.330.option: "启动事故应对程序。"
 AIO_interference_events.331.name: "第一次爆发"
