 AIO_metric_backlash_1: "几何畸变 I"
 AIO_metric_backlash_1_desc: "可用空间与航行速度提高，导航校准更难；若有殖民地，可开发区划和施工速度也会上升。"
 AIO_metric_backlash_2: "几何畸变 II"
 AIO_metric_backlash_2_desc: "折叠持续扩展，火控误差增加；若有殖民地，道路、管线与区划维护也会受扰。"
 AIO_metric_backlash_3: "几何畸变 III"
 AIO_metric_backlash_3_desc: "可用空间与航行效应达到峰值，坐标漂移干扰火控；若有殖民地，施工和居民出行也会受阻。"
 AIO_metric_backlash_collapse_colony: "几何崩塌"
 AIO_metric_backlash_collapse_colony_desc: "部分可用空间回缩，航行长期受阻；若有殖民地，施工和区划维护也将承压。"

 d_AIO_metric_fold_residue: "£blocker£ 折叠残区"
