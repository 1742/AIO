l_simp_chinese:
 #region 灵能光环

 AIO_reality_interference_aura: "现实干涉场"
 AIO_reality_interference_aura_level_1_tt: "§H轻度现实扭曲§!"
 AIO_reality_interference_aura_level_2_tt: "§H显著现实扭曲§!"
 AIO_reality_interference_aura_level_3_tt: "§R临界现实扭曲§!"
 AIO_interference_source_intensity_desc: "现实干涉仪"
 AIO_interference_proof_intensity_desc: "现实证明者"
 AIO_interference_disconnected_desc: "与现实干涉源断开"

 #endregion


 #region 建筑

 building_AIO_reality_proof_facility: "现实证明设施"
 building_AIO_reality_proof_facility_desc: "以观测和演算不断验证局部现实的可塑性。"
 building_AIO_reality_proof_facility_tt: "每100名 £job_physicist£ §Y现实证明者§!使当地现实干涉场每月额外增长§G0.5§!强度，每星系最多计入1000名。"

 #endregion


 #region 岗位

 job_AIO_proof_researcher: "现实证明者"
 job_AIO_proof_researcher_plural: "现实证明者"
 job_AIO_proof_researcher_desc: "证明既有物理定律只是现实的一种可选解。"
 mod_job_AIO_proof_researcher_add: "£job_physicist£ $job_AIO_proof_researcher$岗位"
 job_AIO_proof_drone: "现实证明子例程"
 job_AIO_proof_drone_plural: "现实证明子例程"
 job_AIO_proof_drone_desc: "持续验证并修订局部现实的基础规律。"
 mod_job_AIO_proof_drone_add: "£job_physicist£ $job_AIO_proof_drone$岗位"

 #endregion


 #region 巨构

 AIO_reality_interferometer: "现实干涉仪"
 AIO_reality_interferometer_plural: "$AIO_reality_interferometer$"
 AIO_reality_interferometer_DESC: "以超然逻辑强迫局部现实服从预设结论的巨型装置。装置会生成并强化现实干涉场；若当地已有灵能光环，启动时将直接覆盖原有光环。"
 AIO_reality_interferometer_MEGASTRUCTURE_DETAILS: "建成后按国家干涉政策启用统一来源。覆盖同一星系的效果按本国来源数叠加，最多计入三座；我方效果还受光环等级影响。每个星系只能建造一座，每个帝国初始最多维持五座。"
 AIO_requires_no_existing_reality_interferometer: "$TRIGGER_FAIL$该星系已经存在一座$AIO_reality_interferometer$。"
 AIO_requires_reality_interferometer_capacity: "$TRIGGER_FAIL$我们最多只能维持§Y5§!座$AIO_reality_interferometer$。"

 #endregion


 #region 修正

 mod_AIO_interferometer_range: "现实干涉仪影响范围"

 #endregion


 #region 提示

 AIO_interferometer_completed: "位于§Y[from.GetName]§!星系中的$AIO_reality_interferometer$已建造完成。"

 #endregion


 #region 政策

 policy_policy_AIO_interference_doctrine: "现实干涉范式"
 policy_policy_AIO_interference_doctrine_desc: "决定本国现实干涉场采用的组合效应。改变范式只改变收益构成，不改变光环覆盖与强度。"
 policy_AIO_interference_balanced: "均衡干涉"
 policy_AIO_interference_energy: "零点能量"
 policy_AIO_interference_ecology: "生态演化"
 policy_AIO_interference_industry: "精炼制造"
 policy_AIO_interference_metric: "度规工程"

 #endregion


 #region 反噬局势通用文本

 AIO_interference_accidence_maintain: "维持实验"
 AIO_interference_accidence_blockade: "紧急封锁"
 AIO_interference_accidence_reverse: "逆转反噬"
 AIO_interference_accidence_progress_active: "现实干涉场"
 AIO_interference_accidence_progress_blockade: "$AIO_interference_accidence_blockade$"
 AIO_interference_accidence_progress_policy_mismatch: "干涉方向已改变"
 AIO_interference_accidence_progress_disconnect: "与干涉源失联"
 AIO_interference_accidence_backlash_monthly_change_tooltip: "采取积极的应对方案会使局势受§Y现实干涉场来源数量§!和§I证明者§!影响。"
 AIO_interference_accidence_conclusion.no_reverse: "在这轮爆发后干涉场对现实的影响减弱了，宇宙似乎会在矛盾达到极点时严重失稳，爆发后恢复原样，它总是向着“稳态”演化。"
 AIO_interference_accidence_conclusion.reverse: "这和以往的实验不同，事故地点与外界保持着不同的宇宙常数，我们的更改似乎会持续一段时间。"
 AIO_interference_accidence_option.abort: "可惜。"
 AIO_interference_accidence_option.collapse: "必要的牺牲。"
 AIO_interference_accidence_option.reverse: "我们对宇宙的理解更进一步。"

 #endregion


 #region 反噬好感与通知

 opinion_AIO_interference_accident: "扰乱现实"
 AIO_interference_events.390.name: "越界的实验"
 AIO_interference_events.390.desc: "过去几个月，我们星系里的读数反复失稳，工程队只当是设备故障。现在真相送到了桌上：[event_target:AIO_accident_owner.GetName]把这里当成了试验场，留给我们的只有受损的设施和一句“实验数据已归档”。"
 AIO_interference_events.390.option: "记下这笔账。"

 #endregion


 #region 均衡干涉反噬

 AIO_interference_balanced_backlash: "均衡干涉反噬：[Target.GetName]"
 AIO_interference_balanced_backlash_type: "均衡干涉反噬"
 AIO_interference_balanced_backlash_desc: "[Target.GetName]的矿场、农场、工厂和实验室正同时提高产出。干涉场让不同部门以相近的节奏扩张，原料配送、设备检修和人员轮换也因此挤进同一时段。只要一处供应中断，其他产线就可能接连停下。"
 AIO_interference_balanced_backlash_monthly_change_tooltip: "均衡干涉政策生效时，$AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_balanced_stage_one: "同步增产"
 AIO_balanced_stage_one_desc: "各类设施同时刷新产量纪录。但只要一次断供，几条产线就会一起减速。"
 AIO_balanced_stage_two: "调度拥塞"
 AIO_balanced_stage_two_desc: "原料、备件和生活物资争夺同一批运力。值得注意的是，检修申请总是一起交来；扩张的产线占用公共资源，基础设施建设被迫延期，居民的不满也在增加。"
 AIO_balanced_stage_three: "全线临界"
 AIO_balanced_stage_three_desc: "各部门都在满负荷运行，错峰检修已无法安排。供应链只需断开一环，就可能拖停整片产区。"

 AIO_balanced_maintain: "$AIO_interference_accidence_maintain$"
 AIO_balanced_maintain_desc: "保留当前干涉参数，继续观测各部门同步增产的极限。"
 AIO_balanced_blockade: "$AIO_interference_accidence_blockade$"
 AIO_balanced_blockade_desc: "隔离受影响的生产设施，让各部门逐步恢复原有负荷。"
 AIO_balanced_reverse: "$AIO_interference_accidence_reverse$"
 AIO_balanced_reverse_desc: "调整干涉场对各生产环节的作用，使增产得以延续，同时恢复错峰运行。"

 AIO_balanced_accidence_1: "同步增产 I"
 AIO_balanced_accidence_1_desc: "各类设施同时增产，配送与施工资源却开始紧张。"
 AIO_balanced_accidence_2: "同步增产 II"
 AIO_balanced_accidence_2_desc: "产量继续提高，贸易受阻，建筑工程也被迫放缓。"
 AIO_balanced_accidence_3: "同步增产 III"
 AIO_balanced_accidence_3_desc: "全线满负荷运行，产出可观，贸易与建筑工程却持续受阻。"
 AIO_balanced_misalignment: "节拍错位"
 AIO_balanced_misalignment_desc: "发电、加工和运输相继停机，产出与贸易额骤降。"
 AIO_balanced_drift: "调度失衡"
 AIO_balanced_drift_desc: "各部门争夺原料与检修窗口，产出和贸易额下降，建筑工程延期。"
 AIO_balanced_collapse: "连锁停摆"
 AIO_balanced_collapse_desc: "供应链大范围中断，受损设施与积压原料需要多年清理。"

 d_AIO_balanced_uniform_residue: "£blocker£ 混合废料层"
 d_AIO_balanced_uniform_residue_desc: "停机后遗留的矿粉、炉渣与废弃原料板结在设施之间，清理工作尚未完成。"

 AIO_interference_events.310.name: "均衡临界"
 AIO_interference_events.310.desc: "[Target.GetName]的干涉场已达到临界强度。矿石、粮食、合金和科研产出一同攀升，供应与检修系统却开始跟不上。各部门表面上仍在正常运转，故障记录已经指向同一个时段。"
 AIO_interference_events.310.option: "启动事故应对程序。"
 AIO_interference_events.311.name: "同步停机"
 AIO_interference_events.311.desc: "第一轮失衡发生时，多处设施同时进入故障停机。发电、加工与运输短暂脱节，[Target.GetName]的殖民地受到冲击。干涉场仍在推动产能增长，实际交付量却突然下跌。"
 AIO_interference_events.311.option: "核查停机记录。"
 AIO_interference_events.312.name: "调度失衡"
 AIO_interference_events.312.desc: "各部门的生产节奏再次挤到一起。原料到货时无人能够接收，检修开始时又没有备用设备；殖民地接连受损。高产占用了过多公共资源，贸易与建筑工程都在放缓。"
 AIO_interference_events.312.option: "记录各部门损失。"
 AIO_interference_events.313.name: "驾驭反噬"
 AIO_interference_events.313.desc: "研究人员重新调整了[Target.GetName]的干涉场，使采掘、运输和加工不再同时冲向峰值。生产仍能受益于干涉，供应链也终于有了周转余地。$AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.313.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.314.name: "连锁停摆"
 AIO_interference_events.314.desc: "[Target.GetName]的供料、供电和检修系统接连失效。停机的设施与来不及处理的原料留下大片残层，殖民地遭受严重破坏；恢复产能还需要数年。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.314.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.315.name: "实验已中止"
 AIO_interference_events.315.desc: "干涉场的影响正在减弱。[Target.GetName]的各部门逐步恢复独立运行，供应链重新接上；此前停机造成的损失仍需处理。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.315.option: "$AIO_interference_accidence_option.abort$"

 #endregion


 #region 零点能量反噬

 AIO_interference_energy_backlash: "零点能量反噬：[Target.GetName]"
 AIO_interference_energy_backlash_type: "零点能量反噬"
 AIO_interference_energy_backlash_desc: "[Target.GetName]的零点电网正出现频率失谐。发电机组持续增产，配电设备却反复跳闸，建筑工地和港口开始受影响。干涉场还在推高输出；我们必须决定，是让机组降载，还是调整电网以利用这股能量。"
 AIO_interference_energy_backlash_monthly_change_tooltip: "零点能量政策生效时，$AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_energy_stage_one: "电网失谐"
 AIO_energy_stage_one_desc: "发电机组的输出持续上升，输电线路却开始失谐。吊装设备间歇停摆，工程进度放缓；异常波形也为物理学家提供了新的数据。"
 AIO_energy_stage_two: "反馈浪涌"
 AIO_energy_stage_two_desc: "回灌脉冲沿配电网传开，殖民地的断路器频繁跳闸。舰载武器充能更快，护盾却难以保持稳定；建筑工程只能在两次浪涌之间施工。"
 AIO_energy_stage_three: "级联阈值"
 AIO_energy_stage_three_desc: "干涉场使浪涌越过线路，在星系内多点同时出现。发电和舰载武器输出达到峰值，护盾失稳、工程延误，殖民地的正常供能也越来越难维持。"

 AIO_energy_maintain: "$AIO_interference_accidence_maintain$"
 AIO_energy_maintain_desc: "维持现有干涉参数，继续记录发电量与电网失谐的关系。"
 AIO_energy_blockade: "$AIO_interference_accidence_blockade$"
 AIO_energy_blockade_desc: "隔离受影响的线路，让机组逐步降载，阻断浪涌回灌。"
 AIO_energy_reverse: "$AIO_interference_accidence_reverse$"
 AIO_energy_reverse_desc: "重新标定发电端与负载端，将多余能量引入受控输电回路。"

 AIO_energy_accidence_1: "电网过载 I"
 AIO_energy_accidence_1_desc: "发电量与异常物理读数上升，输电故障拖慢施工。"
 AIO_energy_accidence_2: "电网过载 II"
 AIO_energy_accidence_2_desc: "浪涌提高发电与舰载武器功率，施工延误和护盾失稳也在加剧。"
 AIO_energy_accidence_3: "电网过载 III"
 AIO_energy_accidence_3_desc: "发电与舰载武器输出达到峰值，护盾和殖民地设施承受持续冲击。"
 AIO_energy_blackout: "局部断电"
 AIO_energy_blackout_desc: "变电站保护装置接连跳闸，部分机组脱网，建筑工程暂时停下。"
 AIO_energy_grid_drain: "电网降压"
 AIO_energy_grid_drain_desc: "电网降压以压制浪涌，发电量暂时下降。"
 AIO_energy_grid_collapse: "电网崩溃"
 AIO_energy_grid_collapse_desc: "主干线路烧毁，星系供电在未来数年持续受限。"

 d_AIO_energy_cascade_residue: "£blocker£ 烧结残骸"
 d_AIO_energy_cascade_residue_desc: "烧毁的导体与绝缘材料熔结在一起，部分区域仍有残余放电。"

 AIO_interference_events.320.name: "电网频率分岔"
 AIO_interference_events.320.desc: "[Target.GetName]的零点电网频率开始在两个状态间跃迁。发电端不断增产，配电设备和港口供能却无法同时保持同步。故障报告正在加速增加。"
 AIO_interference_events.320.option: "启动事故应对程序。"
 AIO_interference_events.321.name: "第一次浪涌"
 AIO_interference_events.321.desc: "一次回灌脉冲使[Target.GetName]多座殖民地的变电站跳闸。部分机组脱网，工地停工，配电室起火；干涉场推动的发电能力却还在提高。"
 AIO_interference_events.321.option: "记录损伤。"
 AIO_interference_events.322.name: "电网级联"
 AIO_interference_events.322.desc: "第二次浪涌绕过电缆，经干涉场同时抵达多个供能节点。[Target.GetName]的电网被迫降压，殖民地再次受损；舰载武器充能更快，护盾却频繁失稳。"
 AIO_interference_events.322.option: "继续隔离电网。"
 AIO_interference_events.323.name: "驾驭反噬"
 AIO_interference_events.323.desc: "研究人员重新标定了[Target.GetName]的发电端与负载端。多余能量进入受控输电回路，零点机组仍能保持较高产出，浪涌不再冲击殖民地。$AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.323.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.324.name: "电网崩溃"
 AIO_interference_events.324.desc: "级联浪涌烧毁了[Target.GetName]的主干线路。殖民地大面积受损，烧结残骸堵塞设施；这个星系的供电能力要数年才能恢复。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.324.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.325.name: "实验已中止"
 AIO_interference_events.325.desc: "干涉场的影响正在减弱，机组输出逐步回落，配电网络重新稳定。此前受损的线路仍需修复，但级联故障已经停止。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.325.option: "$AIO_interference_accidence_option.abort$"

 #endregion

 #region 生态演化反噬

 AIO_interference_ecology_backlash: "生态演化反噬：[Target.GetName]"
 AIO_interference_ecology_backlash_type: "生态演化反噬"
 AIO_interference_ecology_backlash_desc: "[Target.GetName]的作物和培育生物正以异常速度增殖。粮食与生物质产出提高，地形改造也明显加快；但根系侵入管线，孢子进入空气循环，维持居民生活需要更多物资。我们可以限制扩散，也可以研究如何稳定这场增长。"
 AIO_interference_ecology_backlash_monthly_change_tooltip: "生态演化政策生效时，$AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_ecology_stage_one: "过度生长"
 AIO_ecology_stage_one_desc: "农田和培育舱接连提前收获，改造队也能更快培植新地表。与此同时，空气过滤器里的孢子开始增多。"
 AIO_ecology_stage_two: "失控群落"
 AIO_ecology_stage_two_desc: "根系穿过灌溉管和电缆槽，新增植被占去原定的建设用地。过滤与清理班组不断扩编，居民的日常补给也开始吃紧。"
 AIO_ecology_stage_three: "生物圈过载"
 AIO_ecology_stage_three_desc: "粮食、生物质和研究样本大量涌入仓储。可建设区域却持续被植被占据，孢子与腐殖物污染空气和供水，殖民地越来越难以维持正常居住条件。"

 AIO_ecology_maintain: "$AIO_interference_accidence_maintain$"
 AIO_ecology_maintain_desc: "维持当前干涉参数，继续观测生长速度和环境适应性的变化。"
 AIO_ecology_blockade: "$AIO_interference_accidence_blockade$"
 AIO_ecology_blockade_desc: "隔离农田、培育舱和生活区，阻止群落继续侵入设施。"
 AIO_ecology_reverse: "$AIO_interference_accidence_reverse$"
 AIO_ecology_reverse_desc: "调整干涉场对生长周期的影响，保留增产效果，同时限制根系与孢子的扩散。"

 AIO_ecology_accidence_1: "生态膨胀 I"
 AIO_ecology_accidence_1_desc: "粮食与生物质产量上升，地形改造提速；空气过滤和生活补给开始承压。"
 AIO_ecology_accidence_2: "生态膨胀 II"
 AIO_ecology_accidence_2_desc: "植被侵占建设用地，孢子增加过滤负担，居民需要更多生活物资。"
 AIO_ecology_accidence_3: "生态膨胀 III"
 AIO_ecology_accidence_3_desc: "产出与改造速度达到峰值，扩张的群落却持续压缩可居住、可建设的空间。"
 AIO_ecology_bloom: "生态爆发"
 AIO_ecology_bloom_desc: "根系挤裂灌溉管，孢子污染培育舱，粮食与生物质产出暂时下降。"
 AIO_ecology_choke: "生态窒息"
 AIO_ecology_choke_desc: "过密群落遮蔽农田、阻碍改造工程；环境条件恶化，粮食与生物质产出下降。"
 AIO_ecology_collapse: "生物圈崩溃"
 AIO_ecology_collapse_desc: "大面积植被枯死，种植地和培育舱需要多年恢复，居民补给也持续紧张。"

 d_AIO_ecology_overgrowth: "£blocker£ 根系残层"
 d_AIO_ecology_overgrowth_desc: "枯死的根系与腐殖物覆盖管线和可建设地块，清理后才能重新开发。"

 AIO_interference_events.330.name: "生态临界"
 AIO_interference_events.330.desc: "[Target.GetName]的干涉场已达到临界强度。农作物与培育生物的生长速度持续上升，地形改造明显加快；孢子浓度和根系密度却接连越过安全值。"
 AIO_interference_events.330.option: "启动事故应对程序。"
 AIO_interference_events.331.name: "第一次蔓延"
 AIO_interference_events.331.desc: "第一轮扩张潮席卷[Target.GetName]。根系挤裂灌溉管和仓储地基，孢子侵入培育舱。受损殖民地的短期收成下降，生活物资需求却继续上升。"
 AIO_interference_events.331.option: "记录损失。"
 AIO_interference_events.332.name: "失控扩散"
 AIO_interference_events.332.desc: "群落沿供水、通风和运输系统向新区扩散。[Target.GetName]受侵的耕地与培育舱减产，地形改造项目被迫放缓，殖民地再次受损；新的植被却还在不断形成。"
 AIO_interference_events.332.option: "继续隔离群落。"
 AIO_interference_events.333.name: "驾驭反噬"
 AIO_interference_events.333.desc: "研究人员调整了[Target.GetName]的干涉场，使作物和培育生物保持高产，根系与孢子却不再越过生产区。受侵设施可以逐步清理。$AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.333.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.334.name: "生物圈崩溃"
 AIO_interference_events.334.desc: "过密的群落在同一生长周期内耗尽养分，随后大面积枯死。[Target.GetName]的殖民地被根须和腐殖物覆盖，种植地与培育舱需要多年恢复。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.334.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.335.name: "实验已中止"
 AIO_interference_events.335.desc: "干涉场的影响正在减弱，过度生长逐步停止。受侵设施仍需清理，但扩散已经得到控制。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.335.option: "$AIO_interference_accidence_option.abort$"

 #endregion

 #region 精炼制造反噬

 AIO_interference_industry_backlash: "精炼制造反噬：[Target.GetName]"
 AIO_interference_industry_backlash_type: "精炼制造反噬"
 AIO_interference_industry_backlash_desc: "[Target.GetName]的矿场与精炼厂正同时超出设计产能。干涉场使矿石更易分离、熔炉反应更充分，矿物与合金产出持续增加；但炉衬损耗、设备维护和新产线的建设成本也在上升。我们可以让产线降载，或找出维持高产的稳定参数。"
 AIO_interference_industry_backlash_monthly_change_tooltip: "精炼制造政策生效时，$AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_industry_stage_one: "超额运转"
 AIO_industry_stage_one_desc: "矿场出矿率和合金浇铸量同时提高。炉温略高于设计值，矿石、备件和扩建设备的需求开始增加。"
 AIO_industry_stage_two: "损耗失控"
 AIO_industry_stage_two_desc: "矿物与合金仍在增产，但炉衬更换越来越频繁，生产与维修争夺同一批矿石。新炉组的建造报价也持续上涨。"
 AIO_industry_stage_three: "满负荷临界"
 AIO_industry_stage_three_desc: "矿场、运输带和熔炉都在满负荷运转。热负荷逼近冷却系统上限，继续生产需要更多原料与备件；一处停机就可能堵住整条产线。"

 AIO_industry_maintain: "$AIO_interference_accidence_maintain$"
 AIO_industry_maintain_desc: "维持现有干涉参数，记录矿石开采、合金冶炼与设备损耗之间的关系。"
 AIO_industry_blockade: "$AIO_interference_accidence_blockade$"
 AIO_industry_blockade_desc: "让高负荷炉组分批停机，隔离受影响的矿场与产线。"
 AIO_industry_reverse: "$AIO_interference_accidence_reverse$"
 AIO_industry_reverse_desc: "重新标定采矿与熔炼流程，使高产不再超过设备散热和供料能力。"

 AIO_industry_accidence_1: "冶炼过载 I"
 AIO_industry_accidence_1_desc: "矿物和合金增产，炉衬、备件和新设施的耗材也开始增加。"
 AIO_industry_accidence_2: "冶炼过载 II"
 AIO_industry_accidence_2_desc: "产线持续增产，矿石供料和设备维护需求上升，扩建价格走高。"
 AIO_industry_accidence_3: "冶炼过载 III"
 AIO_industry_accidence_3_desc: "高产依赖超额供料与频繁换件，重建任何设备都要投入更多材料。"
 AIO_industry_overheat: "熔炉过热"
 AIO_industry_overheat_desc: "炉温越过安全限值，冷却回路失效，矿石运输与冶炼线暂时减产。"
 AIO_industry_jam: "产线梗阻"
 AIO_industry_jam_desc: "矿石输送线堵塞，部分冶炼炉缺料；疏通与更换设备都需要额外材料。"
 AIO_industry_collapse: "工业停摆"
 AIO_industry_collapse_desc: "矿场与精炼厂长期减产，损坏设备的维护和重建成本居高不下。"

 d_AIO_industry_slag_residue: "£blocker£ 矿渣残层"
 d_AIO_industry_slag_residue_desc: "矿渣与凝固的铁水填塞运输通道，烧毁的设备骨架仍需拆除。"

 AIO_interference_events.340.name: "冶炼临界"
 AIO_interference_events.340.desc: "[Target.GetName]的干涉场已达到临界强度。矿石出仓量与合金浇铸量同时上升，炉温和维护材料消耗也超出设计值。冷却与输送系统正在接近满负荷。"
 AIO_interference_events.340.option: "启动事故应对程序。"
 AIO_interference_events.341.name: "第一次过热"
 AIO_interference_events.341.desc: "[Target.GetName]的首批炉组越过安全温度。冷却泵停转，铁水溢出导流槽，矿石运输与冶炼线被迫减速；受损殖民地的产量暂时下降。"
 AIO_interference_events.341.option: "记录损耗。"
 AIO_interference_events.342.name: "产线梗阻"
 AIO_interference_events.342.desc: "输送带上的矿石因设备故障不断堆积，前段矿场被迫减速，后段炉组却仍在满负荷抢料。[Target.GetName]的殖民地再次受损，疏通和重建产线所需的材料持续增加。"
 AIO_interference_events.342.option: "继续压住产线。"
 AIO_interference_events.343.name: "驾驭反噬"
 AIO_interference_events.343.desc: "研究人员重新确定了[Target.GetName]的矿石供料与炉温控制范围。铁水沿导流槽稳定进入铸造线，矿物与合金仍能保持较高产出，设备损耗却不再失控。$AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.343.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.344.name: "工业停摆"
 AIO_interference_events.344.desc: "[Target.GetName]的冷却回路相继失效，铁水溢出导流槽，凝固后封死运输通道。矿渣覆盖受损殖民地的生产设施，矿场与精炼厂的恢复需要数年。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.344.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.345.name: "实验已中止"
 AIO_interference_events.345.desc: "干涉场的影响正在减弱，炉温逐步回落。受损输送线仍需修复，矿场与精炼厂开始恢复按设计负荷运行。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.345.option: "$AIO_interference_accidence_option.abort$"

 #endregion

 #region 度规工程反噬

 AIO_interference_metric_backlash: "度规工程反噬：[Target.GetName]"
 AIO_interference_metric_backlash_type: "度规工程反噬"
 AIO_interference_metric_backlash_desc: "[Target.GetName]的街道与建筑开始呈现重复的透视关系：相隔数个街区的路口在测量图上紧邻，新的建设用地随之出现，建筑施工也明显加快。但道路、管线和舰船航线需要不断重新校准；折叠一旦回弹，既有设施就会错位。"
 AIO_interference_metric_backlash_monthly_change_tooltip: "度规工程政策生效时，$AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_metric_stage_one: "空间折叠"
 AIO_metric_stage_one_desc: "原本相隔数公里的街口如今近在咫尺。规划图新增了可开发区划，建筑材料的运输距离缩短；测绘人员却发现坐标每天都在变化。"
 AIO_metric_stage_two: "度量失稳"
 AIO_metric_stage_two_desc: "街面与楼体像镜面一样折叠，旧管线与新地基发生错位。区划维护开支上升，舰船航程缩短；火控系统却必须反复校正目标距离。"
 AIO_metric_stage_three: "几何临界"
 AIO_metric_stage_three_desc: "多层街区在不同角度重叠，建设用地继续增加，施工和舰船通行也更快。但坐标变化已快过测绘与火控更新，居民连熟悉的道路都难以辨认。"

 AIO_metric_maintain: "$AIO_interference_accidence_maintain$"
 AIO_metric_maintain_desc: "维持现有干涉参数，继续测量折叠区域的容量与稳定性。"
 AIO_metric_blockade: "$AIO_interference_accidence_blockade$"
 AIO_metric_blockade_desc: "封闭不稳定街区与施工通道，让局部空间逐步恢复原有几何。"
 AIO_metric_reverse: "$AIO_interference_accidence_reverse$"
 AIO_metric_reverse_desc: "为道路、建筑和航线建立统一的空间基准，保留可用面积并限制回弹。"

 AIO_metric_accidence_1: "几何畸变 I"
 AIO_metric_accidence_1_desc: "可开发区划增加，建筑施工和舰船通行加快；区划维护与导航校准也开始承压。"
 AIO_metric_accidence_2: "几何畸变 II"
 AIO_metric_accidence_2_desc: "折叠持续扩展，街道与管线频繁错位，维护费用和火控误差一同增加。"
 AIO_metric_accidence_3: "几何畸变 III"
 AIO_metric_accidence_3_desc: "新增空间、施工和航行达到峰值，坐标漂移却让火控与居民出行难以维持。"
 AIO_metric_shear: "度量剪切"
 AIO_metric_shear_desc: "折叠街区突然错开，在建建筑延误，舰船经过星系时被迫降速。"
 AIO_metric_inversion: "度量倒转"
 AIO_metric_inversion_desc: "街道与航线的测绘距离骤变，建筑施工和舰船机动明显放缓，区划维护负担加重。"
 AIO_metric_collapse: "几何崩塌"
 AIO_metric_collapse_desc: "部分可用空间回缩，施工与航行受阻，区划维护成本在未来数年居高不下。"

 d_AIO_metric_fold_residue: "£blocker£ 折叠残区"
 d_AIO_metric_fold_residue_desc: "路面与建筑基础在局部交叠，维护人员必须反复测绘相邻区划，暂时无法安全施工。"

 AIO_interference_events.350.name: "度规临界"
 AIO_interference_events.350.desc: "[Target.GetName]的干涉场已达到临界强度。街道交叉口在地图上彼此靠近，远处楼宇在同一视线中重复出现。可开发区划和建筑施工速度一同增加，坐标记录却越来越难以统一。"
 AIO_interference_events.350.option: "启动事故应对程序。"
 AIO_interference_events.351.name: "第一次回弹"
 AIO_interference_events.351.desc: "第一次回弹把[Target.GetName]的部分街道横向错开，管线脱节，在建建筑的地基受损。殖民地接连报警，经过该星系的舰船被迫降速。"
 AIO_interference_events.351.option: "记录形变。"
 AIO_interference_events.352.name: "几何反冲"
 AIO_interference_events.352.desc: "原本相邻的街口突然隔开数公里，旧地基与新道路无法对齐。新增区划仍在出现，[Target.GetName]的殖民地却再次受损；建筑工程放缓，舰船降速复核航线，区划维护开支继续上升。"
 AIO_interference_events.352.option: "继续钉住度量。"
 AIO_interference_events.353.name: "驾驭反噬"
 AIO_interference_events.353.desc: "研究人员为[Target.GetName]建立了统一的空间坐标基准。折叠街区固定下来，新增区划仍可使用；道路、建筑和航线不再随时回弹。$AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.353.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.354.name: "几何崩塌"
 AIO_interference_events.354.desc: "[Target.GetName]的折叠街区同时回缩，部分可用地块消失，建筑基础与管线被扯断。殖民地严重受损；残留的错位地块让施工、航行和区划维护在未来数年持续受阻。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.354.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.355.name: "实验已中止"
 AIO_interference_events.355.desc: "干涉场的影响正在减弱，重复的街景逐渐合拢，导航坐标恢复一致。受损街段仍需修复，但大范围回弹已经停止。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.355.option: "$AIO_interference_accidence_option.abort$"

 #endregion
