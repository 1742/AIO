 AIO_interference_events.450.name: "度规临界"
 AIO_interference_events.450.desc.maker: "我国干涉场覆盖的星系开始出现空间折叠。航道距离缩短，可开发区划增加，但测绘坐标、道路和管线越来越难以对齐。"
 AIO_interference_events.450.desc.other: "[from.GetName]的度规干涉场使我国受影响星系出现空间折叠。航道距离缩短，测绘与设施维护的难度正在增加。"
 AIO_interference_events.450.option.maker: "启动事故应对程序。"

 AIO_interference_events.451.name: "第一次回弹"
 AIO_interference_events.451.desc.maker: "第一次空间回弹使干涉场覆盖区的航道与地表短暂错位。受影响殖民地的道路、管线和建筑地基遭到冲击。"
 AIO_interference_events.451.desc.other: "[from.GetName]的度规干涉场出现第一次空间回弹。我国受影响殖民地的建筑和管线遭到冲击。"
 AIO_interference_events.451.option.maker: "记录形变。"

 AIO_interference_events.452.name: "几何反冲"
 AIO_interference_events.452.desc.maker: "折叠空间再次回弹，航道坐标持续漂移。受影响殖民地再次受损，建筑工程放缓，舰船必须降速复核航线。"
 AIO_interference_events.452.desc.other: "[from.GetName]的度规干涉场再次回弹。我国受影响殖民地进一步受损，舰船被迫复核航线。"
 AIO_interference_events.452.option.maker: "继续钉住度量。"

 AIO_interference_events.453.name: "驾驭反噬"
 AIO_interference_events.453.desc.maker: "研究人员建立了统一的空间坐标基准。折叠区域固定下来，新增区划仍可使用；道路、建筑和航线不再随时回弹。$AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.453.desc.other: "[from.GetName]稳定了度规干涉场。我国受影响星系的折叠区域趋于稳定，可用空间得以保留。"

 AIO_interference_events.454.name: "几何崩塌"
 AIO_interference_events.454.desc.maker: "折叠区域同时回缩，航道坐标剧烈漂移。干涉场覆盖的殖民地遭受严重破坏，残留错位将长期阻碍施工和航行。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.454.desc.other: "[from.GetName]的度规干涉场发生崩塌。我国受影响殖民地遭受严重破坏，航道与地表将长期错位。"
 AIO_interference_events.454.option.maker: "$AIO_interference_accidence_option.collapse$"

 AIO_interference_events.455.name: "实验已中止"
 AIO_interference_events.455.desc.maker: "干涉场的影响正在减弱，重叠空间逐渐合拢。导航坐标恢复一致，但受损街段仍需修复。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.455.desc.other: "[from.GetName]的度规干涉场正在减弱。我国受影响星系的导航坐标恢复一致，残余错位仍需测绘。"

