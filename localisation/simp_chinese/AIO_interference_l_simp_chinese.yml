l_simp_chinese:
 #region 灵能光环

 AIO_reality_interference_aura: "现实干涉场"
 AIO_reality_interference_aura_level_1_tt: "§H轻度现实扭曲§!"
 AIO_reality_interference_aura_level_2_tt: "§H显著现实扭曲§!"
 AIO_reality_interference_aura_level_3_tt: "§R临界现实扭曲§!"
 AIO_interference_source_intensity_desc: "现实干涉仪"
 AIO_interference_proof_intensity_desc: "现实证明者"
 AIO_interference_disconnected_desc: "与现实干涉源断开"

 #endregion


 #region 建筑

 building_AIO_reality_proof_facility: "现实证明设施"
 building_AIO_reality_proof_facility_desc: "以观测和演算不断验证局部现实的可塑性。"
 building_AIO_reality_proof_facility_tt: "每100名 £job_physicist£ §Y现实证明者§!使当地现实干涉场每月额外增长§G0.5§!强度，每星系最多计入1000名。"

 #endregion


 #region 岗位

 job_AIO_proof_researcher: "现实证明者"
 job_AIO_proof_researcher_plural: "现实证明者"
 job_AIO_proof_researcher_desc: "证明既有物理定律只是现实的一种可选解。"
 mod_job_AIO_proof_researcher_add: "£job_physicist£ $job_AIO_proof_researcher$岗位"
 job_AIO_proof_drone: "现实证明子例程"
 job_AIO_proof_drone_plural: "现实证明子例程"
 job_AIO_proof_drone_desc: "持续验证并修订局部现实的基础规律。"
 mod_job_AIO_proof_drone_add: "£job_physicist£ $job_AIO_proof_drone$岗位"

 #endregion


 #region 巨构

 AIO_reality_interferometer: "现实干涉仪"
 AIO_reality_interferometer_plural: "$AIO_reality_interferometer$"
 AIO_reality_interferometer_DESC: "以超然逻辑强迫局部现实服从预设结论的巨型装置。装置会生成并强化现实干涉场；若当地已有灵能光环，启动时将直接覆盖原有光环。"
 AIO_reality_interferometer_MEGASTRUCTURE_DETAILS: "建成后按国家干涉政策启用统一来源。覆盖同一星系的效果按本国来源数叠加，最多计入三座；我方效果还受光环等级影响。每个星系只能建造一座，每个帝国初始最多维持五座。"
 AIO_requires_no_existing_reality_interferometer: "$TRIGGER_FAIL$该星系已经存在一座$AIO_reality_interferometer$。"
 AIO_requires_reality_interferometer_capacity: "$TRIGGER_FAIL$我们最多只能维持§Y5§!座$AIO_reality_interferometer$。"

 #endregion


 #region 修正

 mod_AIO_interferometer_range: "现实干涉仪影响范围"

 #endregion


 #region 提示

 AIO_interferometer_completed: "位于§Y[from.GetName]§!星系中的$AIO_reality_interferometer$已建造完成。"

 #endregion


 #region 政策

 policy_policy_AIO_interference_doctrine: "现实干涉范式"
 policy_policy_AIO_interference_doctrine_desc: "决定本国现实干涉场采用的组合效应。改变范式只改变收益构成，不改变光环覆盖与强度。"
 policy_AIO_interference_balanced: "均衡干涉"
 policy_AIO_interference_energy: "零点能量"
 policy_AIO_interference_ecology: "生态演化"
 policy_AIO_interference_industry: "精炼制造"
 policy_AIO_interference_metric: "度规工程"

 #endregion


 #region 反噬局势通用文本

 AIO_interference_accidence_maintain: "维持实验"
 AIO_interference_accidence_blockade: "紧急封锁"
 AIO_interference_accidence_reverse: "逆转反噬"
 AIO_interference_accidence_progress_active: "现实干涉场"
 AIO_interference_accidence_progress_blockade: "$AIO_interference_accidence_blockade$"
 AIO_interference_accidence_progress_policy_mismatch: "干涉方向已改变"
 AIO_interference_accidence_progress_disconnect: "与干涉源失联"
 AIO_interference_accidence_backlash_monthly_change_tooltip: "采取积极的应对方案会使局势受§Y现实干涉场来源数量§!和§I证明者§!影响。"
 AIO_interference_accidence_conclusion.no_reverse: "在这轮爆发后干涉场对现实的影响减弱了，宇宙似乎会在矛盾达到极点时严重失稳，爆发后恢复原样，它总是向着“稳态”演化。"
 AIO_interference_accidence_conclusion.reverse: "这和以往的实验不同，事故地点与外界保持着不同的宇宙常数，我们的更改似乎会持续一段时间。"
 AIO_interference_accidence_option.abort: "可惜。"
 AIO_interference_accidence_option.collapse: "必要的牺牲。"
 AIO_interference_accidence_option.reverse: "我们对宇宙的理解更进一步。"

 #endregion


 #region 反噬好感与通知

 opinion_AIO_interference_accident: "扰乱现实"
 AIO_interference_events.390.name: "越界的实验"
 AIO_interference_events.390.desc: "过去几个月，我们星系里的读数反复失稳，工程队只当是设备故障。现在真相送到了桌上：[event_target:AIO_accident_owner.GetName]把这里当成了试验场，留给我们的只有受损的设施和一句“实验数据已归档”。"
 AIO_interference_events.390.option: "记下这笔账。"

 #endregion


 #region 均衡干涉反噬

 AIO_interference_balanced_backlash: "均衡干涉反噬：[Target.GetName]"
 AIO_interference_balanced_backlash_type: "均衡干涉反噬"
 AIO_interference_balanced_backlash_desc: "[Target.GetName]的干涉场使多类资源与生产过程同时加速，供应和检修节奏随之趋同。若星系内有殖民地，各部门会一起增产，也可能因一次断供接连停机；无人星体上的异常读数同样在持续增强。"
 AIO_interference_balanced_backlash_monthly_change_tooltip: "均衡干涉政策生效时，$AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_balanced_stage_one: "同步增产"
 AIO_balanced_stage_one_desc: "多类资源读数同步上升。若有殖民地，各类设施会一同增产，供应中断也可能同时拖慢多条产线。"
 AIO_balanced_stage_two: "调度拥塞"
 AIO_balanced_stage_two_desc: "干涉场使物资与维护需求集中到同一时段。若有殖民地，公共运力和建设资源将承压；无人星体的自动观测也开始失步。"
 AIO_balanced_stage_three: "全线临界"
 AIO_balanced_stage_three_desc: "多种干涉效应同时逼近峰值。若有殖民地，错峰检修已难以安排；即使没有殖民地，星系内的资源与航运读数也变得不稳定。"

 AIO_balanced_maintain: "$AIO_interference_accidence_maintain$"
 AIO_balanced_maintain_desc: "保留当前干涉参数，继续观测多类资源与生产效应同时增强的极限。"
 AIO_balanced_blockade: "$AIO_interference_accidence_blockade$"
 AIO_balanced_blockade_desc: "隔离不稳定的干涉波段，降低各类资源与生产过程的同步程度。"
 AIO_balanced_reverse: "$AIO_interference_accidence_reverse$"
 AIO_balanced_reverse_desc: "调整干涉场对不同过程的作用节奏，保留增益并减少连锁失衡。"

 AIO_balanced_accidence_1: "同步增产 I"
 AIO_balanced_accidence_1_desc: "多类资源与生产效应同步增强；若有殖民地，配送和施工资源开始紧张。"
 AIO_balanced_accidence_2: "同步增产 II"
 AIO_balanced_accidence_2_desc: "干涉增益继续提高；若有殖民地，贸易与建筑工程会因同步失衡而放缓。"
 AIO_balanced_accidence_3: "同步增产 III"
 AIO_balanced_accidence_3_desc: "干涉效应达到峰值；若有殖民地，产出可观，但贸易和建设持续受阻。"
 AIO_balanced_misalignment: "节拍错位"
 AIO_balanced_misalignment_desc: "发电、加工和运输相继停机，产出与贸易额骤降。"
 AIO_balanced_drift: "调度失衡"
 AIO_balanced_drift_desc: "各部门争夺原料与检修窗口，产出和贸易额下降，建筑工程延期。"
 AIO_balanced_collapse: "连锁停摆"
 AIO_balanced_collapse_desc: "干涉节奏大范围失衡；若有殖民地，受损设施与积压原料需要多年清理。"

 d_AIO_balanced_uniform_residue: "£blocker£ 混合废料层"
 d_AIO_balanced_uniform_residue_desc: "停机后遗留的矿粉、炉渣与废弃原料板结在设施之间，清理工作尚未完成。"

 AIO_interference_events.310.name: "均衡临界"
 AIO_interference_events.310.desc.colony: "[Target.GetName]的干涉场已达到临界强度。矿石、粮食、合金和科研产出一同攀升，供应与检修系统却开始跟不上。各部门表面上仍在正常运转，故障记录已经指向同一个时段。"
 AIO_interference_events.310.desc.no_colony: "[Target.GetName]的干涉场已达到临界强度。无人定居的星体上，矿脉、土壤和能量读数同时偏离基线；模型显示，这些增益也会让未来的供应与检修周期重叠。"
 AIO_interference_events.310.option: "启动事故应对程序。"
 AIO_interference_events.311.name: "同步停机"
 AIO_interference_events.311.desc.colony: "第一轮失衡发生时，多处设施同时进入故障停机。发电、加工与运输短暂脱节，[Target.GetName]的殖民地受到冲击。干涉场仍在推动产能增长，实际交付量却突然下跌。"
 AIO_interference_events.311.desc.no_colony: "第一轮失衡扫过[Target.GetName]。各处遥测站的供能、传输与数据处理短暂失步，探测记录出现成片空白；干涉场却仍在增强。"
 AIO_interference_events.311.option: "核查停机记录。"
 AIO_interference_events.312.name: "调度失衡"
 AIO_interference_events.312.desc.colony: "各部门的生产节奏再次挤到一起。原料到货时无人能够接收，检修开始时又没有备用设备；殖民地接连受损。高产占用了过多公共资源，贸易与建筑工程都在放缓。"
 AIO_interference_events.312.desc.no_colony: "第二轮失衡使[Target.GetName]的自动探测与补给设备反复失步。没有殖民设施承受损伤，但星系内的资源读数与航运调度都变得不可靠。"
 AIO_interference_events.312.option: "记录各部门损失。"
 AIO_interference_events.313.name: "驾驭反噬"
 AIO_interference_events.313.desc.colony: "研究人员重新调整了[Target.GetName]的干涉场，使采掘、运输和加工不再同时冲向峰值。生产仍能受益于干涉，供应链也终于有了周转余地。$AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.313.desc.no_colony: "研究人员重新调整了[Target.GetName]的干涉场，使各类资源波动不再同时冲向峰值。异常产出仍可利用，遥测与航运节奏也已稳定。$AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.313.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.314.name: "连锁停摆"
 AIO_interference_events.314.desc.colony: "[Target.GetName]的供料、供电和检修系统接连失效。停机的设施与来不及处理的原料留下大片残层，殖民地遭受严重破坏；恢复产能还需要数年。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.314.desc.no_colony: "[Target.GetName]的多种资源波动同时崩落，自动站相继失联。这里没有殖民地遭到破坏，但星系异常将在数年内继续干扰未来的开采与通行。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.314.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.315.name: "实验已中止"
 AIO_interference_events.315.desc.colony: "干涉场的影响正在减弱。[Target.GetName]的各部门逐步恢复独立运行，供应链重新接上；此前停机造成的损失仍需处理。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.315.desc.no_colony: "干涉场的影响正在减弱。[Target.GetName]的资源读数逐步恢复独立变化，自动站重新同步；先前丢失的观测数据无法补回。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.315.option: "$AIO_interference_accidence_option.abort$"

 #endregion


 #region 零点能量反噬

 AIO_interference_energy_backlash: "零点能量反噬：[Target.GetName]"
 AIO_interference_energy_backlash_type: "零点能量反噬"
 AIO_interference_energy_backlash_desc: "[Target.GetName]的零点能量频率正反复失谐，浪涌已开始影响星系内的舰船和轨道。若有殖民地，发电会提高，配电与施工也会受冲击；我们必须决定是压低输出，还是重新标定能量波形。"
 AIO_interference_energy_backlash_monthly_change_tooltip: "零点能量政策生效时，$AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_energy_stage_one: "电网失谐"
 AIO_energy_stage_one_desc: "零点能量输出持续上升，异常波形为研究提供了新数据。若有殖民地，输电与施工设备开始失谐。"
 AIO_energy_stage_two: "反馈浪涌"
 AIO_energy_stage_two_desc: "回灌脉冲沿干涉场传播，舰载武器充能更快，护盾却难以稳定。若有殖民地，断路器也会反复跳闸。"
 AIO_energy_stage_three: "级联阈值"
 AIO_energy_stage_three_desc: "浪涌在星系内多点同时出现，舰载武器输出达到峰值，护盾持续失稳。若有殖民地，供电与建设也越来越难以维持。"

 AIO_energy_maintain: "$AIO_interference_accidence_maintain$"
 AIO_energy_maintain_desc: "维持现有干涉参数，继续记录零点能量输出与频率失谐的关系。"
 AIO_energy_blockade: "$AIO_interference_accidence_blockade$"
 AIO_energy_blockade_desc: "隔离不稳定的能量波段，降低输出并阻断浪涌回灌。"
 AIO_energy_reverse: "$AIO_interference_accidence_reverse$"
 AIO_energy_reverse_desc: "重新标定零点能量波形，将多余能量引入受控路径。"

 AIO_energy_accidence_1: "电网过载 I"
 AIO_energy_accidence_1_desc: "零点能量与异常物理读数上升；若有殖民地，输电故障会拖慢施工。"
 AIO_energy_accidence_2: "电网过载 II"
 AIO_energy_accidence_2_desc: "浪涌提高舰载武器功率，也使护盾失稳；若有殖民地，发电增加但施工受阻。"
 AIO_energy_accidence_3: "电网过载 III"
 AIO_energy_accidence_3_desc: "零点能量与舰载武器输出达到峰值，护盾持续失稳；若有殖民地，设施也会承受冲击。"
 AIO_energy_blackout: "局部断电"
 AIO_energy_blackout_desc: "变电站保护装置接连跳闸，部分机组脱网，建筑工程暂时停下。"
 AIO_energy_grid_drain: "电网降压"
 AIO_energy_grid_drain_desc: "干涉场被迫降载以压制浪涌；若有殖民地，发电量也会暂时下降。"
 AIO_energy_grid_collapse: "电网崩溃"
 AIO_energy_grid_collapse_desc: "零点能量长期失稳；若有殖民地，供电将在未来数年持续受限。"

 d_AIO_energy_cascade_residue: "£blocker£ 烧结残骸"
 d_AIO_energy_cascade_residue_desc: "烧毁的导体与绝缘材料熔结在一起，部分区域仍有残余放电。"

 AIO_interference_events.320.name: "电网频率分岔"
 AIO_interference_events.320.desc.colony: "[Target.GetName]的零点电网频率开始在两个状态间跃迁。发电端不断增产，配电设备和港口供能却无法同时保持同步。故障报告正在加速增加。"
 AIO_interference_events.320.desc.no_colony: "[Target.GetName]的零点能量频率开始在两个状态间跃迁。无人定居的星体与轨道上出现异常放电，舰船供能也难以保持同步。"
 AIO_interference_events.320.option: "启动事故应对程序。"
 AIO_interference_events.321.name: "第一次浪涌"
 AIO_interference_events.321.desc.colony: "一次回灌脉冲使[Target.GetName]多座殖民地的变电站跳闸。部分机组脱网，工地停工，配电室起火；干涉场推动的发电能力却还在提高。"
 AIO_interference_events.321.desc.no_colony: "一次回灌脉冲穿过[Target.GetName]，使轨道探测器和过境舰船的供能短暂中断。这里没有殖民地变电站受损，但干涉场推动的能量输出仍在提高。"
 AIO_interference_events.321.option: "记录损伤。"
 AIO_interference_events.322.name: "电网级联"
 AIO_interference_events.322.desc.colony: "第二次浪涌绕过电缆，经干涉场同时抵达多个供能节点。[Target.GetName]的电网被迫降压，殖民地再次受损；舰载武器充能更快，护盾却频繁失稳。"
 AIO_interference_events.322.desc.no_colony: "第二次浪涌绕过物理线路，经干涉场同时抵达[Target.GetName]多个区域。舰载武器充能更快，护盾却频繁失稳；无人星体表面留下了放电痕迹。"
 AIO_interference_events.322.option: "继续隔离电网。"
 AIO_interference_events.323.name: "驾驭反噬"
 AIO_interference_events.323.desc.colony: "研究人员重新标定了[Target.GetName]的发电端与负载端。多余能量进入受控输电回路，零点机组仍能保持较高产出，浪涌不再冲击殖民地。$AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.323.desc.no_colony: "研究人员重新标定了[Target.GetName]的零点能量波形。多余能量沿受控路径释放，过境舰船不再遭受浪涌冲击。$AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.323.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.324.name: "电网崩溃"
 AIO_interference_events.324.desc.colony: "级联浪涌烧毁了[Target.GetName]的主干线路。殖民地大面积受损，烧结残骸堵塞设施；这个星系的供电能力要数年才能恢复。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.324.desc.no_colony: "级联浪涌席卷[Target.GetName]，在轨道上留下持续放电的残余场。这里没有殖民电网崩溃，但舰船供能和今后的设施建设仍将受到多年干扰。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.324.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.325.name: "实验已中止"
 AIO_interference_events.325.desc.colony: "干涉场的影响正在减弱，机组输出逐步回落，配电网络重新稳定。此前受损的线路仍需修复，但级联故障已经停止。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.325.desc.no_colony: "干涉场的影响正在减弱，[Target.GetName]的零点能量波形逐步回落。轨道放电仍需监测，但级联浪涌已经停止。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.325.option: "$AIO_interference_accidence_option.abort$"

 #endregion

 #region 生态演化反噬

 AIO_interference_ecology_backlash: "生态演化反噬：[Target.GetName]"
 AIO_interference_ecology_backlash_type: "生态演化反噬"
 AIO_interference_ecology_backlash_desc: "[Target.GetName]的生长周期正被干涉场加速，无人星体上也出现异常群落。若有殖民地，粮食与生物质产出会提高，但根系、孢子和生活补给将造成压力；我们可以限制扩散或研究稳定方法。"
 AIO_interference_ecology_backlash_monthly_change_tooltip: "生态演化政策生效时，$AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_ecology_stage_one: "过度生长"
 AIO_ecology_stage_one_desc: "星系内的生物活动与地形改造速度提高，孢子浓度也在上升。若有殖民地，农田和培育舱会提前收获。"
 AIO_ecology_stage_two: "失控群落"
 AIO_ecology_stage_two_desc: "根系和孢子向更多区域扩散，占据潜在建设用地。若有殖民地，管线、过滤系统和居民补给都会承压。"
 AIO_ecology_stage_three: "生物圈过载"
 AIO_ecology_stage_three_desc: "群落增殖达到峰值，可建设区域持续被覆盖。若有殖民地，粮食与生物质高产的同时，空气、供水和居住条件会恶化。"

 AIO_ecology_maintain: "$AIO_interference_accidence_maintain$"
 AIO_ecology_maintain_desc: "维持当前干涉参数，继续观测群落生长与环境适应性的变化。"
 AIO_ecology_blockade: "$AIO_interference_accidence_blockade$"
 AIO_ecology_blockade_desc: "隔离扩张的群落，阻止根系与孢子侵入更多区域。"
 AIO_ecology_reverse: "$AIO_interference_accidence_reverse$"
 AIO_ecology_reverse_desc: "调整干涉场对生长周期的影响，保留增产潜力并限制扩散。"

 AIO_ecology_accidence_1: "生态膨胀 I"
 AIO_ecology_accidence_1_desc: "生物活动与地形改造提速；若有殖民地，粮食和生物质产量上升，生活补给开始承压。"
 AIO_ecology_accidence_2: "生态膨胀 II"
 AIO_ecology_accidence_2_desc: "植被侵占可建设区域；若有殖民地，过滤与居民补给负担也会增加。"
 AIO_ecology_accidence_3: "生态膨胀 III"
 AIO_ecology_accidence_3_desc: "群落扩张达到峰值，持续压缩可开发空间；若有殖民地，居住条件也会恶化。"
 AIO_ecology_bloom: "生态爆发"
 AIO_ecology_bloom_desc: "根系挤裂灌溉管，孢子污染培育舱，粮食与生物质产出暂时下降。"
 AIO_ecology_choke: "生态窒息"
 AIO_ecology_choke_desc: "过密群落阻碍地形改造；若有殖民地，农田和培育设施也会减产。"
 AIO_ecology_collapse: "生物圈崩溃"
 AIO_ecology_collapse_desc: "大片植被枯死，开发环境需要多年恢复；若有殖民地，种植设施和居民补给也会受损。"

 d_AIO_ecology_overgrowth: "£blocker£ 根系残层"
 d_AIO_ecology_overgrowth_desc: "枯死的根系与腐殖物覆盖管线和可建设地块，清理后才能重新开发。"

 AIO_interference_events.330.name: "生态临界"
 AIO_interference_events.330.desc.colony: "[Target.GetName]的干涉场已达到临界强度。农作物与培育生物的生长速度持续上升，地形改造明显加快；孢子浓度和根系密度却接连越过安全值。"
 AIO_interference_events.330.desc.no_colony: "[Target.GetName]的干涉场已达到临界强度。无人定居的星体上，原生群落和微生物迅速扩张，孢子与根系读数接连越过安全值。"
 AIO_interference_events.330.option: "启动事故应对程序。"
 AIO_interference_events.331.name: "第一次蔓延"
 AIO_interference_events.331.desc.colony: "第一轮扩张潮席卷[Target.GetName]。根系挤裂灌溉管和仓储地基，孢子侵入培育舱。受损殖民地的短期收成下降，生活物资需求却继续上升。"
 AIO_interference_events.331.desc.no_colony: "第一轮扩张潮席卷[Target.GetName]的无人星体。根系穿过表层土壤，孢子云升入高空；没有农田受损，但预定的地形改造区域已被覆盖。"
 AIO_interference_events.331.option: "记录损失。"
 AIO_interference_events.332.name: "失控扩散"
 AIO_interference_events.332.desc.colony: "群落沿供水、通风和运输系统向新区扩散。[Target.GetName]受侵的耕地与培育舱减产，地形改造项目被迫放缓，殖民地再次受损；新的植被却还在不断形成。"
 AIO_interference_events.332.desc.no_colony: "群落继续在[Target.GetName]扩散，植被覆盖了更多可开发地表。没有殖民设施受损，但改造探测器接连失联，未来的开发难度正在上升。"
 AIO_interference_events.332.option: "继续隔离群落。"
 AIO_interference_events.333.name: "驾驭反噬"
 AIO_interference_events.333.desc.colony: "研究人员调整了[Target.GetName]的干涉场，使作物和培育生物保持高产，根系与孢子却不再越过生产区。受侵设施可以逐步清理。$AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.333.desc.no_colony: "研究人员调整了[Target.GetName]的干涉场。群落仍保持旺盛生长，根系与孢子却不再越过划定区域；生态样本终于可以安全回收。$AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.333.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.334.name: "生物圈崩溃"
 AIO_interference_events.334.desc.colony: "过密的群落在同一生长周期内耗尽养分，随后大面积枯死。[Target.GetName]的殖民地被根须和腐殖物覆盖，种植地与培育舱需要多年恢复。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.334.desc.no_colony: "[Target.GetName]的过密群落在一个生长周期内耗尽养分，随后大面积枯死。无人地表被根系与腐殖物覆盖，未来的地形改造和定居仍需多年清理。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.334.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.335.name: "实验已中止"
 AIO_interference_events.335.desc.colony: "干涉场的影响正在减弱，过度生长逐步停止。受侵设施仍需清理，但扩散已经得到控制。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.335.desc.no_colony: "干涉场的影响正在减弱，[Target.GetName]的异常生长逐步停止。无人地表仍留有过密植被，但扩散已经得到控制。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.335.option: "$AIO_interference_accidence_option.abort$"

 #endregion

 #region 精炼制造反噬

 AIO_interference_industry_backlash: "精炼制造反噬：[Target.GetName]"
 AIO_interference_industry_backlash_type: "精炼制造反噬"
 AIO_interference_industry_backlash_desc: "[Target.GetName]的矿物分离和材料相变正在加速，异常热流也随之增强。若有殖民地，矿场与精炼厂将提高产出，却要付出更多维护和建设成本；我们可以降载或寻找稳定参数。"
 AIO_interference_industry_backlash_monthly_change_tooltip: "精炼制造政策生效时，$AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_industry_stage_one: "超额运转"
 AIO_industry_stage_one_desc: "矿物分离与合金反应的潜力同时上升，异常热量接近安全上限。若有殖民地，炉组和备件需求也会增加。"
 AIO_industry_stage_two: "损耗失控"
 AIO_industry_stage_two_desc: "矿物与合金增益继续提高，热流越来越不稳定。若有殖民地，炉衬损耗、维护需求和新产线成本都会上升。"
 AIO_industry_stage_three: "满负荷临界"
 AIO_industry_stage_three_desc: "异常热流逼近极限，矿物相变随时可能失控。若有殖民地，满负荷的矿场和炉组只需一次停机便可能全线梗阻。"

 AIO_industry_maintain: "$AIO_interference_accidence_maintain$"
 AIO_industry_maintain_desc: "维持现有干涉参数，继续记录矿物分离速率与异常热流。"
 AIO_industry_blockade: "$AIO_interference_accidence_blockade$"
 AIO_industry_blockade_desc: "压低材料相变速率，隔离过热区域，让异常热流逐步回落。"
 AIO_industry_reverse: "$AIO_interference_accidence_reverse$"
 AIO_industry_reverse_desc: "确定矿物分离与温度控制的稳定范围，保留增产潜力并减少损耗。"

 AIO_industry_accidence_1: "冶炼过载 I"
 AIO_industry_accidence_1_desc: "矿物与合金生产潜力上升；若有殖民地，炉衬、备件和新设施的需求也会增加。"
 AIO_industry_accidence_2: "冶炼过载 II"
 AIO_industry_accidence_2_desc: "材料相变继续加速；若有殖民地，矿石供应、维护需求和扩建成本随之上升。"
 AIO_industry_accidence_3: "冶炼过载 III"
 AIO_industry_accidence_3_desc: "矿物与合金增益达到峰值；若有殖民地，高产将依赖更多原料与频繁的设备更换。"
 AIO_industry_overheat: "熔炉过热"
 AIO_industry_overheat_desc: "炉温越过安全限值，冷却回路失效，矿石运输与冶炼线暂时减产。"
 AIO_industry_jam: "产线梗阻"
 AIO_industry_jam_desc: "矿物相变失控，碎矿和熔融物堆积；若有殖民地，输送与冶炼也会受阻。"
 AIO_industry_collapse: "工业停摆"
 AIO_industry_collapse_desc: "异常热流与矿渣层将长期阻碍开发；若有殖民地，矿场与精炼厂也会长期减产。"

 d_AIO_industry_slag_residue: "£blocker£ 矿渣残层"
 d_AIO_industry_slag_residue_desc: "矿渣与凝固的铁水填塞运输通道，烧毁的设备骨架仍需拆除。"

 AIO_interference_events.340.name: "冶炼临界"
 AIO_interference_events.340.desc.colony: "[Target.GetName]的干涉场已达到临界强度。矿石出仓量与合金浇铸量同时上升，炉温和维护材料消耗也超出设计值。冷却与输送系统正在接近满负荷。"
 AIO_interference_events.340.desc.no_colony: "[Target.GetName]的干涉场已达到临界强度。无人星体上的矿脉分离读数和材料相变速率同时上升；模拟冶炼流程显示，热量将很快超出安全范围。"
 AIO_interference_events.340.option: "启动事故应对程序。"
 AIO_interference_events.341.name: "第一次过热"
 AIO_interference_events.341.desc.colony: "[Target.GetName]的首批炉组越过安全温度。冷却泵停转，铁水溢出导流槽，矿石运输与冶炼线被迫减速；受损殖民地的产量暂时下降。"
 AIO_interference_events.341.desc.no_colony: "[Target.GetName]的矿物相变突然加速，遥测设备记录到异常高温与熔融物喷流。这里没有矿场或炉组受损，但自动采样器已被迫撤离。"
 AIO_interference_events.341.option: "记录损耗。"
 AIO_interference_events.342.name: "产线梗阻"
 AIO_interference_events.342.desc.colony: "输送带上的矿石因设备故障不断堆积，前段矿场被迫减速，后段炉组却仍在满负荷抢料。[Target.GetName]的殖民地再次受损，疏通和重建产线所需的材料持续增加。"
 AIO_interference_events.342.desc.no_colony: "熔融物与碎矿在[Target.GetName]的无人星体表面不断堆积。没有殖民产线停摆，但矿脉结构正被扰乱，未来的采掘作业将需要更多清理材料。"
 AIO_interference_events.342.option: "继续压住产线。"
 AIO_interference_events.343.name: "驾驭反噬"
 AIO_interference_events.343.desc.colony: "研究人员重新确定了[Target.GetName]的矿石供料与炉温控制范围。铁水沿导流槽稳定进入铸造线，矿物与合金仍能保持较高产出，设备损耗却不再失控。$AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.343.desc.no_colony: "研究人员找到了[Target.GetName]矿物相变的稳定范围。矿脉仍易于分离，异常高温却已回落；无人星体上的资源可以安全规划开采。$AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.343.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.344.name: "工业停摆"
 AIO_interference_events.344.desc.colony: "[Target.GetName]的冷却回路相继失效，铁水溢出导流槽，凝固后封死运输通道。矿渣覆盖受损殖民地的生产设施，矿场与精炼厂的恢复需要数年。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.344.desc.no_colony: "[Target.GetName]的异常热流突然失控，熔融物冷却后形成大片矿渣层。这里没有殖民工业设施损毁，但未来的采掘与建设将在数年内受到阻碍。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.344.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.345.name: "实验已中止"
 AIO_interference_events.345.desc.colony: "干涉场的影响正在减弱，炉温逐步回落。受损输送线仍需修复，矿场与精炼厂开始恢复按设计负荷运行。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.345.desc.no_colony: "干涉场的影响正在减弱，[Target.GetName]的异常热流逐步回落。无人星体上仍有凝固矿渣需要测绘，但过热反应已经停止。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.345.option: "$AIO_interference_accidence_option.abort$"

 #endregion

 #region 度规工程反噬

 AIO_interference_metric_backlash: "度规工程反噬：[Target.GetName]"
 AIO_interference_metric_backlash_type: "度规工程反噬"
 AIO_interference_metric_backlash_desc: "[Target.GetName]的空间坐标开始折叠，远处星体与航道在测绘图上突然相邻。若有殖民地，可用区划和施工速度也会增加，但道路与管线可能错位；舰船航线已需要反复校准。"
 AIO_interference_metric_backlash_monthly_change_tooltip: "度规工程政策生效时，$AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_metric_stage_one: "空间折叠"
 AIO_metric_stage_one_desc: "远隔数公里的坐标突然靠近，航行距离缩短。若有殖民地，规划图也会出现新的可开发区划。"
 AIO_metric_stage_two: "度量失稳"
 AIO_metric_stage_two_desc: "空间折叠不断改变测绘距离，舰船航程缩短，火控却必须反复校准。若有殖民地，道路、管线和地基也会错位。"
 AIO_metric_stage_three: "几何临界"
 AIO_metric_stage_three_desc: "多层空间以不同角度重叠，航行与施工潜力提高，坐标变化却快过测绘和火控更新。若有殖民地，居民出行也会受扰。"

 AIO_metric_maintain: "$AIO_interference_accidence_maintain$"
 AIO_metric_maintain_desc: "维持现有干涉参数，继续测量折叠区域的容量与稳定性。"
 AIO_metric_blockade: "$AIO_interference_accidence_blockade$"
 AIO_metric_blockade_desc: "封闭不稳定的折叠区域与航道，让局部空间逐步恢复原有几何。"
 AIO_metric_reverse: "$AIO_interference_accidence_reverse$"
 AIO_metric_reverse_desc: "为星体、航道和潜在建设区域建立统一的空间基准，保留可用面积并限制回弹。"

 AIO_metric_accidence_1: "几何畸变 I"
 AIO_metric_accidence_1_desc: "可用空间与航行速度提高，导航校准更难；若有殖民地，可开发区划和施工速度也会上升。"
 AIO_metric_accidence_2: "几何畸变 II"
 AIO_metric_accidence_2_desc: "折叠持续扩展，火控误差增加；若有殖民地，道路、管线与区划维护也会受扰。"
 AIO_metric_accidence_3: "几何畸变 III"
 AIO_metric_accidence_3_desc: "可用空间与航行效应达到峰值，坐标漂移干扰火控；若有殖民地，施工和居民出行也会受阻。"
 AIO_metric_shear: "度量剪切"
 AIO_metric_shear_desc: "折叠空间突然错开，舰船经过星系时被迫降速；若有殖民地，建筑工程也会延期。"
 AIO_metric_inversion: "度量倒转"
 AIO_metric_inversion_desc: "星系内的测绘距离骤变，舰船机动放缓；若有殖民地，施工与区划维护也会受阻。"
 AIO_metric_collapse: "几何崩塌"
 AIO_metric_collapse_desc: "部分可用空间回缩，航行长期受阻；若有殖民地，施工和区划维护也将承压。"

 d_AIO_metric_fold_residue: "£blocker£ 折叠残区"
 d_AIO_metric_fold_residue_desc: "路面与建筑基础在局部交叠，维护人员必须反复测绘相邻区划，暂时无法安全施工。"

 AIO_interference_events.350.name: "度规临界"
 AIO_interference_events.350.desc.colony: "[Target.GetName]的干涉场已达到临界强度。街道交叉口在地图上彼此靠近，远处楼宇在同一视线中重复出现。可开发区划和建筑施工速度一同增加，坐标记录却越来越难以统一。"
 AIO_interference_events.350.desc.no_colony: "[Target.GetName]的干涉场已达到临界强度。无人星体与航道的测绘坐标开始重叠，原本遥远的区域在探测图上彼此靠近；舰船导航数据越来越难以统一。"
 AIO_interference_events.350.option: "启动事故应对程序。"
 AIO_interference_events.351.name: "第一次回弹"
 AIO_interference_events.351.desc.colony: "第一次回弹把[Target.GetName]的部分街道横向错开，管线脱节，在建建筑的地基受损。殖民地接连报警，经过该星系的舰船被迫降速。"
 AIO_interference_events.351.desc.no_colony: "第一次回弹使[Target.GetName]的航道与无人星体表面发生短暂错位。测绘探针失联，经过该星系的舰船被迫降速；这里没有街道或建筑遭到破坏。"
 AIO_interference_events.351.option: "记录形变。"
 AIO_interference_events.352.name: "几何反冲"
 AIO_interference_events.352.desc.colony: "原本相邻的街口突然隔开数公里，旧地基与新道路无法对齐。新增区划仍在出现，[Target.GetName]的殖民地却再次受损；建筑工程放缓，舰船降速复核航线，区划维护开支继续上升。"
 AIO_interference_events.352.desc.no_colony: "[Target.GetName]的空间折叠再次回弹，刚刚相邻的航道突然隔开数公里。无人星体的坐标持续漂移，舰船必须降速复核航线。"
 AIO_interference_events.352.option: "继续钉住度量。"
 AIO_interference_events.353.name: "驾驭反噬"
 AIO_interference_events.353.desc.colony: "研究人员为[Target.GetName]建立了统一的空间坐标基准。折叠街区固定下来，新增区划仍可使用；道路、建筑和航线不再随时回弹。$AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.353.desc.no_colony: "研究人员为[Target.GetName]建立了统一的空间坐标基准。折叠区域固定下来，新增的可用空间仍在；舰船航线也不再随时回弹。$AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.353.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.354.name: "几何崩塌"
 AIO_interference_events.354.desc.colony: "[Target.GetName]的折叠街区同时回缩，部分可用地块消失，建筑基础与管线被扯断。殖民地严重受损；残留的错位地块让施工、航行和区划维护在未来数年持续受阻。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.354.desc.no_colony: "[Target.GetName]的折叠区域同时回缩，无人星体的局部地表被剪切，航道坐标剧烈漂移。这里没有殖民地受损，但未来的建设与航行将在数年内持续受阻。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.354.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.355.name: "实验已中止"
 AIO_interference_events.355.desc.colony: "干涉场的影响正在减弱，重复的街景逐渐合拢，导航坐标恢复一致。受损街段仍需修复，但大范围回弹已经停止。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.355.desc.no_colony: "干涉场的影响正在减弱，[Target.GetName]的重叠空间逐渐合拢，导航坐标恢复一致。测绘探针仍需重新布设，但大范围回弹已经停止。$AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.355.option: "$AIO_interference_accidence_option.abort$"

 #endregion
