 #region 巨构

 AIO_reality_interferometer: "现实干涉仪"
 AIO_reality_interferometer_plural: "$AIO_reality_interferometer$"
 AIO_reality_interferometer_DESC: "以超然逻辑强迫局部现实服从预设结论的巨型装置。装置会生成并强化现实干涉场；若当地已有灵能光环，启动时将直接覆盖原有光环。"
 AIO_reality_interferometer_MEGASTRUCTURE_DETAILS: "建成后按国家干涉政策启用统一来源。覆盖同一星系的效果按本国来源数叠加，最多计入三座；我方效果还受光环等级影响。每个星系只能建造一座，每个帝国初始最多维持五座。"
 AIO_requires_no_existing_reality_interferometer: "$TRIGGER_FAIL$该星系已经存在一座$AIO_reality_interferometer$。"
 AIO_requires_reality_interferometer_capacity: "$TRIGGER_FAIL$我们最多只能维持§Y5§!座$AIO_reality_interferometer$。"

 #endregion


 #region 修正

 mod_AIO_interferometer_range: "现实干涉仪影响范围"

 #endregion


 #region 提示

 AIO_interferometer_completed: "位于§Y[from.GetName]§!星系中的$AIO_reality_interferometer$已建造完成。"

 #endregion


 #region 政策

 policy_policy_AIO_interference_doctrine: "现实干涉范式"
 policy_policy_AIO_interference_doctrine_desc: "决定本国现实干涉场采用的组合效应。改变范式只改变收益构成，不改变光环覆盖与强度。"
 policy_AIO_interference_balanced: "均衡干涉"
 policy_AIO_interference_energy: "零点能量"
 policy_AIO_interference_ecology: "生态演化"
 policy_AIO_interference_industry: "精炼制造"
 policy_AIO_interference_metric: "度规工程"

 AIO_interference_energy_backlash: "零点电网反噬：[Target.GetName]"
 AIO_interference_energy_backlash_type: "零点电网反噬"
 AIO_interference_energy_backlash_desc: "[Target.GetName]的能源网络与现实干涉场失去同步。光环继续独立成长；此局势记录一次事故。进度退到左端即取消实验，到右端才算完成。两种结局都会将光环重置为刚进入第2级。"
 AIO_interference_energy_backlash_monthly_change_tooltip: "零点能量政策生效时，维持和逆转按光环理论月增长推进：基础1，加相连来源与当地在岗证明者；政策切换加速期间翻倍。封锁每月退12，其他政策每月退8。旧效果残留不算政策匹配。"
 AIO_energy_stage_one: "电网失谐"
 AIO_energy_stage_one_desc: "初始震荡。跨过35时发生一次性能量损失。"
 AIO_energy_stage_two: "反馈浪涌"
 AIO_energy_stage_two_desc: "达到35时损失500能量币，封锁方案下为250。进度回退不会返还损失。"
 AIO_energy_stage_three: "级联阈值"
 AIO_energy_stage_three_desc: "达到70时损失1500能量币，封锁方案下为750。该星系己方殖民地承受能源与物理科研惩罚，直到事故结束，最长五年。"
 AIO_energy_maintain: "维持实验"
 AIO_energy_maintain_desc: "每月消耗50能量币和20物理学研究。按光环理论增速推进。全国每100在岗证明者每月提供1研究点，均分给正在维持或逆转的局势；每个局势上限20点。"
 AIO_energy_blockade: "紧急封锁"
 AIO_energy_blockade_desc: "每月消耗150能量币和25合金，进度每月退12，阶段性能量损失减半。退至左端只会取消实验，不积累研究或逆转成果。"
 AIO_energy_reverse: "逆转反噬"
 AIO_energy_reverse_desc: "须解锁银时之匙对应的天灾第三级。每月消耗100超然逻辑和100能量币。按光环理论增速推进；全国在岗证明者均分产生逆转点，每局势每月最多20点。完成时累计50/150/300点分别解锁永久岗位能源产出+5/+10/+20%，高等级替换低等级。"
 AIO_energy_progress_active: "干涉场理论增长"
 AIO_energy_progress_blockade: "紧急封锁：-12"
 AIO_energy_progress_policy_mismatch: "零点能量政策未启用或干涉场失联：-8"
 AIO_energy_accidence_planet: "电网失稳"
 AIO_energy_accidence_planet_desc: "级联浪涌造成的局部供能系统损坏尚未修复。"
 AIO_energy_reversal_1: "驾驭反噬 I"
 AIO_energy_reversal_1_desc: "逆转后的能量反馈强化了发电岗位。"
 AIO_energy_reversal_2: "驾驭反噬 II"
 AIO_energy_reversal_2_desc: "逆转后的能量反馈强化了发电岗位。"
 AIO_energy_reversal_3: "驾驭反噬 III"
 AIO_energy_reversal_3_desc: "逆转后的能量反馈强化了发电岗位。"
 AIO_interference_events.310.name: "电网频率分岔"
 AIO_interference_events.310.desc: "[Target.GetName]的干涉场已达到危险强度。零点电网开始在相互冲突的能量状态间震荡。我们可以终止、研究或逆转这次事故。"
 AIO_interference_events.310.option: "启动事故应对程序。"
 AIO_interference_events.311.name: "第一次浪涌"
 AIO_interference_events.311.desc: "电网释放了储存的能量。紧急封锁将即时损失减半，但浪涌已经发生。"
 AIO_interference_events.311.option: "记录损伤。"
 AIO_interference_events.312.name: "电网级联"
 AIO_interference_events.312.desc: "第二次浪涌损坏了[Target.GetName]内的殖民地能源系统。故障持续至事故结束，最长五年；回退进度不会返还已经损失的能量币。"
 AIO_interference_events.312.option: "继续隔离电网。"
 AIO_interference_events.313.name: "实验结束"
 AIO_interference_events.313.desc: "级联过程已经结束。逐月累计的研究点在50/150/300时，累计奖励分别为500/2000/5000物理学研究及100/400/1000超然逻辑。逆转点达到相同门槛时，累计返还1000/4000/10000能量币，并取得最高已达成的永久能源岗位增益。光环回到第2级起点。"
 AIO_interference_events.313.option: "归档研究成果。"
 AIO_interference_events.314.name: "实验已取消"
 AIO_interference_events.314.desc: "电网在级联完成前恢复稳定。尚未结算的研究成果消失，已损失的能量币不返还。紧急电网惩罚已清除，光环回到第2级起点。"
 AIO_interference_events.314.option: "关闭实验。"

 #endregion
