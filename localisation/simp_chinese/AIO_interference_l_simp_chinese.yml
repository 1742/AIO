l_simp_chinese:
 #region 灵能光环

 AIO_reality_interference_aura: "现实干涉场"
 AIO_interference_source_intensity_desc: "现实干涉仪"
 AIO_interference_proof_intensity_desc: "现实证明者"
 AIO_interference_disconnected_desc: "与现实干涉源断开"

 #endregion


 #region 建筑

 building_AIO_reality_proof_facility: "现实证明设施"
 building_AIO_reality_proof_facility_desc: "以观测和演算不断验证局部现实的可塑性。"
 building_AIO_reality_proof_facility_tt: "每100名 £job_physicist£ §Y现实证明者§!使当地现实干涉场每月额外增长§G0.5§!强度，每星系最多计入1000名。"

 #endregion


 #region 岗位

 job_AIO_proof_researcher: "现实证明者"
 job_AIO_proof_researcher_plural: "现实证明者"
 job_AIO_proof_researcher_desc: "证明既有物理定律只是现实的一种可选解。"
 mod_job_AIO_proof_researcher_add: "£job_physicist£ $job_AIO_proof_researcher$岗位"
 job_AIO_proof_drone: "现实证明子例程"
 job_AIO_proof_drone_plural: "现实证明子例程"
 job_AIO_proof_drone_desc: "持续验证并修订局部现实的基础规律。"
 mod_job_AIO_proof_drone_add: "£job_physicist£ $job_AIO_proof_drone$岗位"

 #endregion


 #region 巨构

 AIO_reality_interferometer: "现实干涉仪"
 AIO_reality_interferometer_plural: "$AIO_reality_interferometer$"
 AIO_reality_interferometer_DESC: "以超然逻辑强迫局部现实服从预设结论的巨型装置。装置会生成并强化现实干涉场；若当地已有灵能光环，启动时将直接覆盖原有光环。"
 AIO_reality_interferometer_MEGASTRUCTURE_DETAILS: "建成后按国家干涉政策启用统一来源。覆盖同一星系的效果按本国来源数叠加，最多计入三座；我方效果还受光环等级影响。每个星系只能建造一座，每个帝国初始最多维持五座。"
 AIO_requires_no_existing_reality_interferometer: "$TRIGGER_FAIL$该星系已经存在一座$AIO_reality_interferometer$。"
 AIO_requires_reality_interferometer_capacity: "$TRIGGER_FAIL$我们最多只能维持§Y5§!座$AIO_reality_interferometer$。"

 #endregion


 #region 修正

 mod_AIO_interferometer_range: "现实干涉仪影响范围"

 #endregion


 #region 提示

 AIO_interferometer_completed: "位于§Y[from.GetName]§!星系中的$AIO_reality_interferometer$已建造完成。"

 #endregion


 #region 政策

 policy_policy_AIO_interference_doctrine: "现实干涉范式"
 policy_policy_AIO_interference_doctrine_desc: "决定本国现实干涉场采用的组合效应。改变范式只改变收益构成，不改变光环覆盖与强度。"
 policy_AIO_interference_balanced: "均衡干涉"
 policy_AIO_interference_energy: "零点能量"
 policy_AIO_interference_ecology: "生态演化"
 policy_AIO_interference_industry: "精炼制造"
 policy_AIO_interference_metric: "度规工程"

 #endregion


 #region 反噬局势通用文本

 AIO_interference_backlash_maintain: "维持实验"
 AIO_interference_backlash_blockade: "紧急封锁"
 AIO_interference_backlash_reverse: "逆转反噬"
 AIO_interference_backlash_progress.interferometer: "现实干涉场"
 AIO_interference_backlash_progress.blockade: "$AIO_interference_backlash_blockade$"
 AIO_interference_backlash_progress.policy_mismatch: "干涉方向已改变"
 AIO_interference_backlash_progress.disconnect: "与干涉源失联"
 AIO_interference_backlash_monthly_change_tooltip: "采取积极的应对方案会使局势受§Y现实干涉场来源数量§!和§I现实证明者§!影响。"
 AIO_interference_backlash_conclusion.no_reverse: "在这轮爆发后干涉场对现实的影响减弱了，宇宙似乎会在矛盾达到极点时严重失稳，爆发后恢复原样，它总是向着“稳态”演化。"
 AIO_interference_backlash_conclusion.reverse: "这和以往的实验不同，事故地点与外界保持着不同的宇宙常数，我们的更改似乎会持续一段时间。"
 AIO_interference_backlash_option.abort: "可惜。"
 AIO_interference_backlash_option.collapse: "必要的牺牲。"
 AIO_interference_backlash_option.reverse: "我们对宇宙的理解更进一步。"

 #endregion


 #region 反噬好感与通知


 opinion_AIO_interference_backlash: "扰乱现实"
 AIO_interference_notice.option: "严密监视。"
 AIO_interference_notice.collapse_option: "可恶！"

 #endregion


 #region 均衡干涉反噬

 AIO_interference_balanced_backlash: "均衡干涉反噬"
 AIO_interference_balanced_backlash_type: "$AIO_interference_balanced_backlash$"
 AIO_interference_balanced_backlash_desc: "我国干涉场覆盖的多个星系正同时出现生产节奏失衡。受影响殖民地的产出提高，但供应、运输和检修也可能连锁停摆。"
 AIO_interference_balanced_backlash_monthly_change_tooltip: "均衡干涉政策生效时，$AIO_interference_backlash_monthly_change_tooltip$"

 AIO_balanced_maintain: "$AIO_interference_backlash_maintain$"
 AIO_balanced_maintain_desc: "保留当前干涉参数，继续观测多类资源与生产效应同时增强的极限。"
 AIO_balanced_blockade: "$AIO_interference_backlash_blockade$"
 AIO_balanced_blockade_desc: "隔离不稳定的干涉波段。"
 AIO_balanced_reverse: "$AIO_interference_backlash_reverse$"
 AIO_balanced_reverse_desc: "调整干涉场对不同过程的作用节奏，保留增益并减少连锁失衡。"

 AIO_balanced_backlash_1: "同步增产 I"
 AIO_balanced_backlash_1_desc: "多类资源与生产效应同步增强，配送和施工资源开始紧张。"
 AIO_balanced_backlash_2: "同步增产 II"
 AIO_balanced_backlash_2_desc: "干涉增益继续提高，贸易与建筑工程会因同步失衡而放缓。"
 AIO_balanced_backlash_3: "同步增产 III"
 AIO_balanced_backlash_3_desc: "干涉效应达到峰值，产出相当可观，但贸易和建设持续受阻。"
 AIO_balanced_backlash_collapse_colony: "连锁停摆"
 AIO_balanced_backlash_collapse_colony_desc: "干涉节奏大范围失衡，受损设施与积压原料需要多年清理。"

 d_AIO_balanced_uniform_residue: "£blocker£ 混合废料层"
 d_AIO_balanced_uniform_residue_desc: "停机后遗留的矿粉、炉渣与废弃原料板结在设施之间，清理工作尚未完成。"

 AIO_interference_events.410.name: "丰收的烦恼"
 AIO_interference_events.410.desc.maker: "最初，我们以为殖民地送来的生产报表出了差错。仓库里的物资超过了入库记录，矿场运出的矿石比实际开采的还多。反复核查后，我们终于可以确认：干涉场正在凭空创造资源。\n\n这当然是个好消息。不过，仓库管理人员已经连续发来数次扩建申请，他们似乎没有我们这么高兴。"
 AIO_interference_events.410.desc.other: "受[from.GetName]干涉场影响的殖民地报告了一件怪事：仓库里出现了没有入库记录的物资，矿场也运出了从未开采过的矿石。起初，当地官员忙着追查账目，直到空置的货舱里也出现了同样的东西。\n\n目前还没有人能解释这些资源从何而来。港口倒是已经开始为它们腾地方了。"
 AIO_interference_events.410.option.maker: "我们需要更多仓库。"

 AIO_interference_events.411.name: "满载而归"
 AIO_interference_events.411.desc.maker: "新一轮资源涌现来得比预计更早。几处尚未清空的货场被彻底填满，输送带在重压下断裂，紧急停机又打乱了加工与供电。殖民地不得不抽调施工设备，先把堆在运输通道上的原料搬走。\n\n研究人员对这次增长十分满意，因为当地的损失报告不是送到他们手上。"
 AIO_interference_events.411.desc.other: "[from.GetName]的实验又给我们的殖民地送来了一批物资。没有预兆，也没有卸货的过程：原本已经满载的输送设备突然承受了更多重量，货场内接连发生事故。\n\n当地正在停机清理。原定用于建设的运输和工程设备，现在都在处理这些多出来的财富。"
 AIO_interference_events.411.option.maker: "把损失报告也送过去。"

 AIO_interference_events.412.name: "无处堆放"
 AIO_interference_events.412.desc.maker: "清理工作赶不上资源出现的速度了。刚腾出的场地转眼又堆满原料，等候卸货的货船占住了泊位，维修设备也堵在途中。殖民地明明拥有比以往更多的物资，却越来越难把任何东西送到需要它的地方。\n\n我们已经证明了资源可以凭空产生。至于该把它们放在哪里，先前的实验没有涉及这个问题。"
 AIO_interference_events.412.desc.other: "我们的港口开始拒绝新的货运申请。受干涉场影响的殖民地已无处堆放不断出现的物资，积压的货物妨碍检修，新的事故又让清理更加缓慢。贸易和建设都受到了拖累。\n\n[from.GetName]还在继续他们的实验。我们只能继续为他们的成果腾地方。"
 AIO_interference_events.412.option.maker: "这也得纳入计算。"

 AIO_interference_events.413.name: "各取所需"
 AIO_interference_events.413.desc.maker: "经过反复调整，我们终于让资源涌现的节奏跟上了殖民地的处理能力。货场不再一夜之间被填满，运输船可以卸货，工厂也能按时收到原料。那些扩建的仓库总算派上了应有的用场。\n\n更值得庆祝的是，当地的物理常数没有立即恢复原状。这次，我们或许能让宇宙把这份慷慨多保留一阵。"
 AIO_interference_events.413.desc.other: "受[from.GetName]干涉场影响的殖民地终于能够清点自己的收获了。物资仍在异常增加，但已经不再压垮当地的运输和加工设施。\n\n对方似乎找到了控制实验的办法。至少，我们的港口终于可以重新接收正常的货物了。"

 AIO_interference_events.414.name: "连锁停摆"
 AIO_interference_events.414.desc.maker: "最后一次资源涌现压垮了仍在运转的设施。供料和供电接连中断，矿粉、炉渣与来不及运走的原料堆积在厂区里，许多地方已无法通行。殖民地需要数年才能清理并修复这些损失。\n\n随后，异常增产停止了。测量结果显示，物理常数正在恢复原值。宇宙纠正了我们的实验，却把清理工作留给了我们。"
 AIO_interference_events.414.desc.other: "[from.GetName]的实验以一场灾难告终。最后涌现的物资冲垮了我们受影响殖民地的生产设施，停机后的厂区被矿粉、炉渣和废弃原料填塞。恢复生产将是项持续数年的工程。\n\n那些凭空出现的资源终于不再增加了。现在，我们得花钱把它们清走。"
 AIO_interference_events.414.option.maker: "至少，我们知道极限在哪里了。"

 AIO_interference_events.415.name: "恢复供需"
 AIO_interference_events.415.desc.maker: "随着干涉场的影响减弱，仓库里的物资终于与账目对上了。殖民地正在疏通积压的货运，陆续恢复停机的设施；此前造成的损失仍需要处理。\n\n物理常数也在回到熟悉的数值。我们曾短暂拥有取之不尽的资源，可惜没能同时拥有用之不竭的仓库。"
 AIO_interference_events.415.desc.other: "[from.GetName]的干涉场正在减弱。我们的殖民地不再报告新的物资涌现，港口开始处理积压的货运，受损设施也陆续进入维修。\n\n当地终于可以按实际生产的数量安排运输了。"

 #endregion


 #region 零点能量反噬

 AIO_interference_energy_backlash: "零点能量反噬"
 AIO_interference_energy_backlash_type: "$AIO_interference_energy_backlash$"
 AIO_interference_energy_backlash_desc: "我国干涉场覆盖的多个星系正出现零点能量失谐。浪涌影响了发电厂和轨道上的舰船，受影响的殖民地发电正不断提高。"
 AIO_interference_energy_backlash_monthly_change_tooltip: "零点能量政策生效时，$AIO_interference_backlash_monthly_change_tooltip$"

 AIO_energy_maintain: "$AIO_interference_backlash_maintain$"
 AIO_energy_maintain_desc: "维持现有干涉参数，继续记录零点能量输出与频率失谐的关系。"
 AIO_energy_blockade: "$AIO_interference_backlash_blockade$"
 AIO_energy_blockade_desc: "隔离不稳定的能量波段，降低输出并阻断浪涌回灌。"
 AIO_energy_reverse: "$AIO_interference_backlash_reverse$"
 AIO_energy_reverse_desc: "重新标定零点能量波形，将多余能量引入受控路径。"

 AIO_energy_backlash_1: "电网过载 I"
 AIO_energy_backlash_1_desc: "零点能量与异常物理读数上升，输电故障会拖慢施工。"
 AIO_energy_backlash_2: "电网过载 II"
 AIO_energy_backlash_2_desc: "浪涌提高舰载武器功率，也使护盾失稳，殖民地发电继续增加。"
 AIO_energy_backlash_3: "电网过载 III"
 AIO_energy_backlash_3_desc: "零点能量与舰载武器输出达到峰值，护盾持续失稳，基础设施出现过载冲击。"
 AIO_energy_backlash_collapse_colony: "电网崩溃"
 AIO_energy_backlash_collapse_colony_desc: "零点能量长期失稳，供电将在未来数年持续受限。"

 d_AIO_energy_cascade_residue: "£blocker£ 烧结残骸"
 d_AIO_energy_cascade_residue_desc: "烧毁的导体与绝缘材料熔结在一起，部分区域仍有残余放电。"

 AIO_interference_events.420.name: "额外供能"
 AIO_interference_events.420.desc.maker: "干涉场内的零点机组正在输出超出设计值的能量，而我们并未为此投入更多。起初，技术人员以为是仪表故障，直到备用仪表给出了相同的读数。\n\n唯一令人不安的是，电网频率开始在两个数值之间来回跳动。保护装置对此频频报警，但发电记录确实一天比一天漂亮。"
 AIO_interference_events.420.desc.other: "受[from.GetName]干涉场影响，我们的发电设施在没有任何改装的情况下提高了输出。与此同时，电网频率开始反复跳变，轨道上的舰船也报告了类似的供能异常。\n\n额外的能源暂时还能利用，但技术人员要求我们不要忽略那些频繁响起的警报。"
 AIO_interference_events.420.option.maker: "先查清警报的原因。"

 AIO_interference_events.421.name: "浪涌"
 AIO_interference_events.421.desc.maker: "一次突如其来的能量脉冲冲进了殖民地电网。变电站接连跳闸，部分配电室起火，施工现场在断电后陷入停顿。技术人员忙着切断故障线路时，仍在运转的机组又刷新了输出纪录。\n\n我们提取能量的办法显然很有效。现有的电网却不是为这样的成果准备的。"
 AIO_interference_events.421.desc.other: "来自[from.GetName]干涉场的一次能量浪涌冲击了我们的输电设施。地面的保护装置接连跳闸，轨道上的舰船也经历了短暂的供能中断。\n\n抢修人员正在隔离受损线路。发电设施的输出仍在上升，这让恢复供电变得更加棘手。"
 AIO_interference_events.421.option.maker: "保护装置撑住了多少？"

 AIO_interference_events.422.name: "无须导线"
 AIO_interference_events.422.desc.maker: "切断线路没能挡住第二次浪涌。已经脱离电网的设备仍然发生了放电，多处供能节点几乎同时起火。能量正通过干涉场直接抵达它们，绕过了我们布置的隔离措施。\n\n舰队也传来了报告：武器的输出显著提高，护盾却频繁失稳。我们似乎解决了远距离输送能量的问题，只是还不能决定它应该送到哪里。"
 AIO_interference_events.422.desc.other: "第二次浪涌击中了已经切断线路的设备。我们的隔离措施没能阻止[from.GetName]的干涉场传递能量，多处供能设施再次起火，殖民地被迫降低电网电压。\n\n舰队报告武器功率有所增加，但护盾越来越不可靠。对于必须驾驶这些舰船的人来说，这很难算是补偿。"
 AIO_interference_events.422.option.maker: "得从干涉场本身入手。"

 AIO_interference_events.423.name: "受控放电"
 AIO_interference_events.423.desc.maker: "在重新标定干涉场后，我们成功将多余的能量导入了指定回路。监测设备记录到了预期中的放电，而殖民地没有再传来新的火灾报告。零点机组仍保持着可观的输出。\n\n当地的物理常数暂时稳定在了修改后的数值。我们终于可以利用这份额外的能量，而不必等着下一处配电室爆炸。"
 AIO_interference_events.423.desc.other: "[from.GetName]似乎终于控制住了干涉场。我们的供能设施不再遭受突如其来的浪涌，异常增加的输出却保留了下来。\n\n技术人员正在谨慎地恢复供电。他们暂时还不愿撤走配电室外的消防设备。"

 AIO_interference_events.424.name: "电网崩溃"
 AIO_interference_events.424.desc.maker: "最后一轮浪涌超过了电网能够承受的极限。主干线路烧毁，导体与绝缘层熔结在一起，干涉场覆盖的殖民地接连失去供电。部分废墟仍在放电，抢修人员甚至无法靠近。重建工作预计需要数年。\n\n随后，能量读数开始回落，物理常数也逐渐恢复原值。实验结束了，我们曾引以为傲的输出纪录成了事故前的最后一组数据。"
 AIO_interference_events.424.desc.other: "[from.GetName]的零点能量实验最终烧毁了我们受影响殖民地的电网。多处主干线路熔断，供能设施只剩下仍在放电的残骸，大片地区失去了电力供应。\n\n干涉场中的能量正在回落，但这不会让烧毁的设备恢复原状。我们将为这场实验付出数年的重建代价。"
 AIO_interference_events.424.option.maker: "把最后的读数保存下来。"

 AIO_interference_events.425.name: "警报解除"
 AIO_interference_events.425.desc.maker: "干涉场的影响正在消退。零点机组的输出逐渐回落，电网频率也终于稳定下来。抢修人员可以着手更换受损线路，不必担心下一次浪涌随时抵达。\n\n物理常数正在恢复原值。这次实验留下了不少值得研究的数据，以及一份相当可观的维修清单。"
 AIO_interference_events.425.desc.other: "随着[from.GetName]干涉场的影响减弱，我们的电网频率逐渐恢复正常，轨道上的舰船也不再报告新的供能异常。\n\n受损线路仍需更换，但抢修工作终于不再被新的浪涌打断了。"

 #endregion


 #region 生态演化反噬

 AIO_interference_ecology_backlash: "生态演化反噬"
 AIO_interference_ecology_backlash_type: "$AIO_interference_ecology_backlash$"
 AIO_interference_ecology_backlash_desc: "我国干涉场覆盖的多个星系正出现异常生长。受影响殖民地的粮食作物与生物质产出提高，不过殖民地里物种数量都在上升，对当地生态系统的影响仍需观察。"
 AIO_interference_ecology_backlash_monthly_change_tooltip: "生态演化政策生效时，$AIO_interference_backlash_monthly_change_tooltip$"

 AIO_ecology_maintain: "$AIO_interference_backlash_maintain$"
 AIO_ecology_maintain_desc: "维持当前干涉参数，继续观测群落生长与环境适应性的变化。"
 AIO_ecology_blockade: "$AIO_interference_backlash_blockade$"
 AIO_ecology_blockade_desc: "隔离扩张的群落，阻止根系与孢子侵入更多区域。"
 AIO_ecology_reverse: "$AIO_interference_backlash_reverse$"
 AIO_ecology_reverse_desc: "调整干涉场对生长周期的影响，保留增产潜力并限制扩散。"

 AIO_ecology_backlash_1: "生态膨胀 I"
 AIO_ecology_backlash_1_desc: "活跃的生物活动使得地形和大气向着更适合生命生存的方向变化。"
 AIO_ecology_backlash_2: "生态膨胀 II"
 AIO_ecology_backlash_2_desc: "过于活跃的植被和孢子侵占可建设区域，基础设施维护变得更加困难。"
 AIO_ecology_backlash_3: "生态膨胀 III"
 AIO_ecology_backlash_3_desc: "群落扩张达到峰值，持续压缩可开发空间，连城市的正常运行也变得举步维艰。"
 AIO_ecology_backlash_collapse_colony: "生物圈崩溃"
 AIO_ecology_backlash_collapse_colony_desc: "大片植被枯死，开发环境需要多年恢复，种植设施和居民补给也会受损。"

 d_AIO_ecology_overgrowth: "£blocker£ 根系残层"
 d_AIO_ecology_overgrowth_desc: "枯死的根系与腐殖物覆盖管线和可建设地块，清理后才能重新开发。"

 AIO_interference_events.430.name: "欣欣向荣"
 AIO_interference_events.430.desc.maker: "干涉场内的作物提前成熟了。随后送来的报告表明，牧场、培育池乃至道路两旁的植被都出现了类似的变化。我们为生命提供了更适宜的条件，而生命立刻作出了回应。\n\n农业部门预计本季将迎来空前的丰收。负责除草的人员要求重新核算本季的预算。"
 AIO_interference_events.430.desc.other: "[from.GetName]的干涉场让我们的殖民地迎来了一个异常繁盛的生长季。粮食作物提前成熟，野外的植被迅速扩张，一些小型动物的数量也明显增加。\n\n目前，农场还在庆祝丰收。不过，田里的害虫似乎也过得相当不错。"
 AIO_interference_events.430.option.maker: "看来它们很喜欢新环境。"

 AIO_interference_events.431.name: "破土而出"
 AIO_interference_events.431.desc.maker: "旺盛的根系已经找到了城市的地下管网。它们挤裂供水管，钻进电缆沟，几条刚刚修好的道路又被从下面顶开。与此同时，空气过滤设备开始频繁堵塞，拆出的滤芯上覆满了孢子。\n\n研究人员提醒我们，这说明改造后的环境确实更适合生命生存。维修人员希望他们能来现场看看。"
 AIO_interference_events.431.desc.other: "受[from.GetName]干涉场影响，我们殖民地的植被开始侵入基础设施。地下根系挤裂管线，孢子进入通风系统，农业培育设施也发现了未经种植的群落。\n\n当地正在清除这些入侵者，但清理人员往往还没离开，新的嫩芽就已经冒了出来。"
 AIO_interference_events.431.option.maker: "把管网图交给研究人员。"

 AIO_interference_events.432.name: "新的栖息地"
 AIO_interference_events.432.desc.maker: "供水与通风系统成了理想的扩散通道。我们封住了几处入口，却在管线另一端发现了新的群落。施工场地也在迅速变绿，工程队清理地基的时间已经超过了浇筑地基的时间。\n\n生态调查显示，当地可供生物栖息的区域正在增加。城市规划部门对此有不同的看法。"
 AIO_interference_events.432.desc.other: "我们的清理队伍已经无法阻止植被扩张。根系沿供水管蔓延，孢子借通风设施进入封闭建筑，几处待开发地块被迫放弃施工。此前修复的设施再次受损。\n\n[from.GetName]创造的繁荣正在覆盖我们的殖民地。再这样下去，我们恐怕只能住在它的缝隙里。"
 AIO_interference_events.432.option.maker: "给我们的城市也留些地方。"

 AIO_interference_events.433.name: "适度繁荣"
 AIO_interference_events.433.desc.maker: "我们终于找到了限制异常生长的办法。调整后的干涉场仍能缩短作物的成熟周期，却不再驱使根系和孢子不断向外扩张。清理队伍昨天移除的植被，今天没有重新长回来。\n\n当地的物理常数暂时维持在了新的数值。农业部门保住了丰收，城市规划部门也保住了城市。双方都愿意承认这是一次成功。"
 AIO_interference_events.433.desc.other: "[from.GetName]调整了生态干涉场，我们殖民地的异常扩张终于停止了。田里的作物仍然长势良好，管道里的根系却不再一夜之间长回原样。\n\n清理人员终于可以从一段管线推进到下一段。被植被占据的场地也有望重新投入使用。"

 AIO_interference_events.434.name: "生长的尽头"
 AIO_interference_events.434.desc.maker: "最密集的群落首先开始枯萎。急速生长耗尽了土壤中的养分，随后大片植被接连死亡，培育设施也未能幸免。干涉场下的殖民地留下了成片腐败的生物质，以及仍牢牢嵌在管网中的根系。\n\n物理常数正在恢复原值，但当地的生态需要多年才能恢复。我们成功缩短了生长的过程，也一并缩短了耗尽一片土地所需的时间。"
 AIO_interference_events.434.desc.other: "[from.GetName]干涉场内的繁盛景象正在迅速消退。过密的群落耗尽养分后成片枯死，种植设施遭到严重破坏，残留的根系和腐殖物覆盖了大片土地。\n\n那些曾经被植被堵住的管线仍然堵着。生命停止了扩张，却没有把占据的地方还给我们。恢复当地环境将需要数年。"
 AIO_interference_events.434.option.maker: "下一次要把养分也算进去。"

 AIO_interference_events.435.name: "生长季结束"
 AIO_interference_events.435.desc.maker: "随着干涉场的影响减弱，殖民地的生长周期正在恢复正常。除草工作终于有了进展，空气过滤设备也不再刚换上就被孢子堵满。受损管线和被侵占的场地仍需逐一清理。\n\n物理常数逐渐回到了原值。研究人员已经开始整理这次实验的生态样本，其中相当一部分是维修部门送来的。"
 AIO_interference_events.435.desc.other: "[from.GetName]的干涉场正在减弱。我们殖民地上的植被恢复了正常的生长速度，清理人员终于能够跟上它们。\n\n根系仍需挖除，管线仍需更换，但至少刚清理过的道路可以保持畅通了。"

 #endregion

 #region 精炼制造反噬

 AIO_interference_industry_backlash: "精炼制造反噬"
 AIO_interference_industry_backlash_type: "$AIO_interference_industry_backlash$"
 AIO_interference_industry_backlash_desc: "我国干涉场覆盖的多个星系正出现材料相变加速与异常热流。受影响殖民地的矿场与精炼厂增产，但维护和建设成本也在上升。"
 AIO_interference_industry_backlash_monthly_change_tooltip: "精炼制造政策生效时，$AIO_interference_backlash_monthly_change_tooltip$"

 AIO_industry_maintain: "$AIO_interference_backlash_maintain$"
 AIO_industry_maintain_desc: "维持现有干涉参数，继续记录矿物分离速率与异常热流。"
 AIO_industry_blockade: "$AIO_interference_backlash_blockade$"
 AIO_industry_blockade_desc: "压低材料相变速率，隔离过热区域，让异常热流逐步回落。"
 AIO_industry_reverse: "$AIO_interference_backlash_reverse$"
 AIO_industry_reverse_desc: "确定矿物分离与温度控制的稳定范围，保留增产潜力并减少损耗。"

 AIO_industry_backlash_1: "冶炼过载 I"
 AIO_industry_backlash_1_desc: "矿物与合金生产潜力上升；若有殖民地，炉衬、备件和新设施的需求也会增加。"
 AIO_industry_backlash_2: "冶炼过载 II"
 AIO_industry_backlash_2_desc: "材料相变继续加速；若有殖民地，矿石供应、维护需求和扩建成本随之上升。"
 AIO_industry_backlash_3: "冶炼过载 III"
 AIO_industry_backlash_3_desc: "矿物与合金增益达到峰值；若有殖民地，高产将依赖更多原料与频繁的设备更换。"
 AIO_industry_backlash_collapse_colony: "工业停摆"
 AIO_industry_backlash_collapse_colony_desc: "异常热流与矿渣层将长期阻碍开发；若有殖民地，矿场与精炼厂也会长期减产。"

 d_AIO_industry_slag_residue: "£blocker£ 矿渣残层"
 d_AIO_industry_slag_residue_desc: "矿渣与凝固的铁水填塞运输通道，烧毁的设备骨架仍需拆除。"

 AIO_interference_events.440.name: "出炉时间提前"
 AIO_interference_events.440.desc.maker: "矿石比以往更容易分离，冶炼过程也在更短的时间内完成。干涉场下的矿场与精炼厂纷纷提高了产量，旧的生产计划已经跟不上新的出炉速度。\n\n负责设备维护的人员同时发现，炉衬的更换周期也缩短了。我们调整了材料的性质，炉子本身显然也算材料。"
 AIO_interference_events.440.desc.other: "[from.GetName]的干涉场改变了我们殖民地上的冶炼过程。同样的矿石更快完成分离，精炼厂甚至不必更换设备就能提高产量。\n\n不过，炉温记录出现了难以解释的波动，几批原本还能继续使用的炉衬被提前报废。厂方正在核算这笔意外收入究竟能留下多少。"
 AIO_interference_events.440.option.maker: "检查一下炉衬。"

 AIO_interference_events.441.name: "余热未尽"
 AIO_interference_events.441.desc.maker: "降低加热功率后，几座冶炼炉的温度仍在上升。冷却泵在连续满负荷运转后停机，来不及处理的熔融物溢出了导流槽，迫使附近的运输与加工设施一同停工。\n\n我们原以为更快的反应意味着更早结束工作。目前看来，至少冷却系统不会如此。"
 AIO_interference_events.441.desc.other: "异常热流冲击了受[from.GetName]干涉场影响的工业设施。几处冶炼厂在降低功率后仍无法控制炉温，冷却设备相继故障，溢出的熔融物损坏了运输线路。\n\n当地已经开始减慢供料。再高的产量，也得先能从炉子里安全地运出来。"
 AIO_interference_events.441.option.maker: "先让冷却系统恢复工作。"

 AIO_interference_events.442.name: "趁热维修"
 AIO_interference_events.442.desc.maker: "新换上的部件比上一批坏得更快。异常热流沿加工与运输设施蔓延，输送设备变形，矿渣在尚未清理的通道中继续堆积。为了维持生产，殖民地不得不把更多材料投入维修和改建。\n\n精炼厂仍在不断运出合金，只是其中越来越多又被送回厂里，成为下一批备用零件。"
 AIO_interference_events.442.desc.other: "[from.GetName]干涉场内的工业设施再次受损。此前更换的部件没能撑过新一轮过热，运输线停摆，重建工程又需要追加材料。\n\n我们的工厂确实生产了更多合金。可看着不断增长的维修订单，很难说这让我们富裕了多少。"
 AIO_interference_events.442.option.maker: "这样生产下去可不划算。"

 AIO_interference_events.443.name: "合格出厂"
 AIO_interference_events.443.desc.maker: "在重新调整干涉参数与供料速度后，炉温终于回到了冷却设备能够应付的范围。矿物分离仍比过去高效，精炼厂也保住了额外产量，而新装的部件已经连续通过数次检查。\n\n当地的物理常数暂时稳定在了修改后的数值。我们终于可以把多生产的合金用于别处，而不是继续拿它修理生产合金的机器。"
 AIO_interference_events.443.desc.other: "[from.GetName]稳定了干涉场，困扰我们矿场与精炼厂的异常高温开始回落。生产效率仍高于实验前，设备却不再以同样惊人的速度报废。\n\n厂方重新核算了收益。这一次，他们愿意把增加的产量计入可交付的货物了。"

 AIO_interference_events.444.name: "冷却之后"
 AIO_interference_events.444.desc.maker: "冷却回路最终没能撑住。失控的熔融物冲出生产设施，沿运输通道流淌，随后与矿渣、设备残骸凝固在一起。受影响殖民地的工业区遭到严重破坏，许多地方需要先重新开掘，才能谈得上修复。\n\n物理常数正在回归原值，炉温也终于降了下来。预计还需要数年清理这些已经冷却的成果。"
 AIO_interference_events.444.desc.other: "[from.GetName]的实验留下了大片凝固的矿渣。我们的冷却设施在最后一轮过热中相继失效，熔融物淹没运输通道，将设备和厂房底部封在了一起。\n\n高温正在消退，但矿场与精炼厂已无法正常运转。拆除残骸、清理通道和恢复生产将耗费数年。"
 AIO_interference_events.444.option.maker: "留下样本，其余的清走。"

 AIO_interference_events.445.name: "正常炉温"
 AIO_interference_events.445.desc.maker: "随着干涉场的影响消退，冶炼过程重新遵循原有的参数。降低功率终于能让炉温下降，维修人员也可以靠近那些此前过热的设备。受损输送线和残留矿渣仍需处理。\n\n我们保留了全部生产记录。下一次设计实验时，负责冷却系统的人应该也有一个席位。"
 AIO_interference_events.445.desc.other: "[from.GetName]的干涉场正在减弱。我们工业设施内的异常热流逐渐消退，炉温恢复可控，矿场与精炼厂可以重新安排检修。\n\n额外的产量也在回落。至少，备用零件的消耗总算慢了下来。"

 #endregion


 #region 度规工程反噬

 AIO_interference_metric_backlash: "度规工程反噬"
 AIO_interference_metric_backlash_type: "$AIO_interference_metric_backlash$"
 AIO_interference_metric_backlash_desc: "我国干涉场覆盖的多个星系正出现空间折叠。航道距离缩短，受影响殖民地的可用区划增加，但坐标漂移使道路、管线和航行承压。"
 AIO_interference_metric_backlash_monthly_change_tooltip: "度规工程政策生效时，$AIO_interference_backlash_monthly_change_tooltip$"

 AIO_metric_maintain: "$AIO_interference_backlash_maintain$"
 AIO_metric_maintain_desc: "维持现有干涉参数，继续测量折叠区域的容量与稳定性。"
 AIO_metric_blockade: "$AIO_interference_backlash_blockade$"
 AIO_metric_blockade_desc: "封闭不稳定的折叠区域与航道，让局部空间逐步恢复原有几何。"
 AIO_metric_reverse: "$AIO_interference_backlash_reverse$"
 AIO_metric_reverse_desc: "为星体、航道和潜在建设区域建立统一的空间基准，保留可用面积并限制回弹。"

 AIO_metric_backlash_1: "几何畸变 I"
 AIO_metric_backlash_1_desc: "可用空间与航行速度提高，导航校准更难；若有殖民地，可开发区划和施工速度也会上升。"
 AIO_metric_backlash_2: "几何畸变 II"
 AIO_metric_backlash_2_desc: "折叠持续扩展，火控误差增加；若有殖民地，道路、管线与区划维护也会受扰。"
 AIO_metric_backlash_3: "几何畸变 III"
 AIO_metric_backlash_3_desc: "可用空间与航行效应达到峰值，坐标漂移干扰火控；若有殖民地，施工和居民出行也会受阻。"
 AIO_metric_backlash_collapse_colony: "几何崩塌"
 AIO_metric_backlash_collapse_colony_desc: "部分可用空间回缩，航行长期受阻；若有殖民地，施工和区划维护也将承压。"

 d_AIO_metric_fold_residue: "£blocker£ 折叠残区"
 d_AIO_metric_fold_residue_desc: "路面与建筑基础在局部交叠，维护人员必须反复测绘相邻区划，暂时无法安全施工。"

 AIO_interference_events.450.name: "额外空间"
 AIO_interference_events.450.desc.maker: "测绘人员在两处旧地标之间量出了更多土地，而航行同一条航道的舰船却比预计更早抵达。重复测量排除了仪器故障：我们确实让需要的地方变大，让需要经过的地方变短了。\n\n殖民地已经提交了新的开发方案。只是他们随附的地图，在送达时又有些过时了。"
 AIO_interference_events.450.desc.other: "[from.GetName]的干涉场使我们境内的距离发生了变化。殖民地测出了此前不存在的可用空间，舰船也提前完成了熟悉的航程。\n\n这些变化本可以令人欣喜，但测绘人员发现，同一个地点的坐标在两次测量之间仍会移动。暂时还不宜按新地图动工。"
 AIO_interference_events.450.option.maker: "先保留旧版地图。"

 AIO_interference_events.451.name: "此路暂时不通"
 AIO_interference_events.451.desc.maker: "一次空间回弹使部分道路与管线的两端短暂错开。等坐标重新对齐时，断裂的管道并没有接回去，沿途建筑的地基也留下了裂缝。轨道上的舰船则被迫紧急修正航向。\n\n测绘部门强调，他们此前提供的数据在测量时完全正确。我们没有理由怀疑这一点，但工程队还是需要一张能用得更久的地图。"
 AIO_interference_events.451.desc.other: "[from.GetName]干涉场内的空间发生了一次突然回弹。几处殖民地的街道与地下管线短暂错位，建筑地基受损，航道上也出现了危险的导航偏差。\n\n当地已经封闭受损街段。路还在那里，只是不能再保证它通向地图上标出的地方。"
 AIO_interference_events.451.option.maker: "重新测量，先别动工。"

 AIO_interference_events.452.name: "请重新规划路线"
 AIO_interference_events.452.desc.maker: "新一轮回弹再次破坏了殖民地设施。刚测好的地块发生偏移，修复后的管线重新断开，施工队不得不停下来等待下一次测量。舰船也在降速复核航线，火控系统则越来越难以确定目标的实际距离。\n\n航程依旧比过去短。我们省下的时间，正在被用来确认自己究竟到了哪里。"
 AIO_interference_events.452.desc.other: "[from.GetName]的干涉场仍在改变空间。我们的殖民地再次遭到回弹冲击，几处工程因为无法确定边界而停工，舰船必须放慢速度，不断校正航向与射击参数。\n\n导航系统还在推荐更短的路线。舰队已经要求它先推荐一条不会移动的。"
 AIO_interference_events.452.option.maker: "先让坐标固定下来。"

 AIO_interference_events.453.name: "地图定稿"
 AIO_interference_events.453.desc.maker: "我们为干涉场建立的空间基准终于稳定下来。连续几次测量给出了相同的坐标，新增的土地没有消失，缩短的航道也没有再次回弹。工程队可以按图施工，舰船可以相信自己的导航仪了。\n\n当地空间暂时保留了修改后的几何性质。测绘部门提交了最终版地图，并特意为“最终版”加了下划线。"
 AIO_interference_events.453.desc.other: "[from.GetName]似乎找到了固定折叠空间的办法。我们境内的坐标不再漂移，额外的可用土地与缩短的航程都保留了下来。\n\n当地已开始更新地图、检查道路和管线。这一次，维修人员至少知道明天该去哪里继续工作。"

 AIO_interference_events.454.name: "空间不足"
 AIO_interference_events.454.desc.maker: "折叠区域在最后一次回弹中急剧回缩。原本留有间隔的路面与建筑基础挤在一起，管线被扯断，航道坐标大幅偏移。受影响的殖民地遭到严重破坏，一些区域在重新测绘前已无法安全进入。\n\n空间正在恢复原有的尺度，却没能把里面的建筑摆回原位。我们曾为新增的土地规划了许多用途，现在得先规划如何拆除它们。"
 AIO_interference_events.454.desc.other: "[from.GetName]的空间实验发生了灾难性回缩。我们的道路与建筑地基在部分区域交叠，地下管网大面积断裂，舰船也失去了可靠的航道坐标。\n\n干涉造成的额外空间正在消失，留下的错位却仍将妨碍重建和航行。当地必须重新测绘，旧地图和新地图如今都不能用了。"
 AIO_interference_events.454.option.maker: "先确认还能从哪里进去。"

 AIO_interference_events.455.name: "熟悉的距离"
 AIO_interference_events.455.desc.maker: "随着干涉场的影响减弱，折叠空间逐渐恢复原有的尺度。地标之间的距离不再反复变化，航道坐标也趋于稳定。受损街段仍需修复，但施工队终于能够确定管线的另一端在哪里。\n\n我们重新启用了实验前的地图。它们当然还需要修订，不过这次主要是为了标出维修地点。"
 AIO_interference_events.455.desc.other: "[from.GetName]的干涉场正在减弱。我们境内的距离逐渐恢复正常，导航坐标不再漂移，舰船可以重新使用熟悉的航线。\n\n殖民地仍需测绘残留的错位并修复受损设施。路程可能比前几天更长，但至少终点不会再变了。"

 #endregion
