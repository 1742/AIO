l_simp_chinese:
 district_AIO_mist_housing:0 "$district_city$"
 district_AIO_mist_housing_plural:0 "$district_city_plural$"
 district_AIO_mist_housing_desc:0 "$district_city_desc$"
 district_AIO_mist_farm:0 "生化质能区划"
 district_AIO_mist_farm_plural:0 "生化质能区划"
 district_AIO_mist_farm_desc:0 "通过多维质能重组直接合成基础养分，摆脱了落后的光照与土壤依赖。任何碳基生命都只需最基本的流体摄入便可维持生理指标。"
 district_AIO_mist_alloys:0 "致密晶格区划"
 district_AIO_mist_alloys_plural:0 "致密晶格区划"
 district_AIO_mist_alloys_desc:0 "在高维时空剪切面上直接进行分子级铸造。强行注入的拓扑结构使得金属强度超越了三维物理学所允许的极限。"
 district_AIO_mist_goods:0 "熵减制造区划"
 district_AIO_mist_goods_plural:0 "熵减制造区划"
 district_AIO_mist_goods_desc:0 "利用微型重组场逆转局域熵增，将基础原料以原子精度组装为生活与研究物资。只要指令输入无误，便能凭空构筑出任何所需器物。"
 district_AIO_mist_energy:0 "能流截取区划"
 district_AIO_mist_energy_plural:0 "能流截取区划"
 district_AIO_mist_energy_desc:0 "将管道直接搭在时空截面的缝隙上，截取低维宇宙向高维泄漏的自由能潜流。在此处，能量守恒被巧妙地规避成了‘单向流动’。"
 district_AIO_mist_minerals:0 "实在物质区划"
 district_AIO_mist_minerals_plural:0 "实在物质区划"
 district_AIO_mist_minerals_desc:0 "通过引力透镜将虚粒子对中带有质量的片段沉淀为致密的实体晶核。重工业矿物的产出在此表现为纯粹的几何析出。"
 district_AIO_mist_motes:0 "亚稳微粒区划"
 district_AIO_mist_motes_plural:0 "亚稳微粒区划"
 district_AIO_mist_motes_desc:0 "将不稳定的高能高维微粒拘禁在微型力场陷阱中。即便是一颗微粒的失稳湮灭，也会被周围的拓扑壁障迅速吸收并重新激发。"
 district_AIO_mist_gases:0 "流形气体区划"
 district_AIO_mist_gases_plural:0 "流形气体区划"
 district_AIO_mist_gases_desc:0 "冷凝截面之外的高维残留气体。这些气体在常态下呈现出非欧几里得的扩散形态，具有不可思议的物理活性。"
 district_AIO_mist_crystals:0 "超维水晶区划"
 district_AIO_mist_crystals_plural:0 "超维水晶区划"
 district_AIO_mist_crystals_desc:0 "利用多维光干涉将空间张力冻结为完美的晶体结构。每一块棱镜中都折射着无数个平行光锥的倒影。"
 district_AIO_mist_dark_matter:0 "暗相沉淀区划"
 district_AIO_mist_dark_matter_plural:0 "暗相沉淀区划"
 district_AIO_mist_dark_matter_desc:0 "专为捕捉微弱引力相互作用而设计的空泡区划。暗相编织者在此将不可见的高维暗质牵引沉淀，形成稳定的暗物质块。"
 district_AIO_mist_living_metal:0 "活态金属区划"
 district_AIO_mist_living_metal_plural:0 "活态金属区划"
 district_AIO_mist_living_metal_desc:0 "宛如活体脉动的金属冶炼熔炉。注入高维活性的液态合金在管道内自行流动和生长，仿佛拥有某种无机物的初级意志。"
 district_AIO_mist_nanites:0 "微相集群区划"
 district_AIO_mist_nanites_plural:0 "微相集群区划"
 district_AIO_mist_nanites_desc:0 "数以百亿计的亚微米机械在此完成自我复制与逻辑同步。一旦释放，整片机群便能如细雾般重组沿途的所有物质形态。"
 district_AIO_mist_hive:0 "$district_hive$"
 district_AIO_mist_hive_plural:0 "$district_hive_plural$"
 district_AIO_mist_hive_desc:0 "$district_hive_desc$"
 district_AIO_mist_nexus:0 "$district_nexus$"
 district_AIO_mist_nexus_plural:0 "$district_nexus_plural$"
 district_AIO_mist_nexus_desc:0 "$district_nexus_desc$"
 district_AIO_mist_research:0 "递归运算区划"
 district_AIO_mist_research_plural:0 "递归运算区划"
 district_AIO_mist_research_desc:0 "三维生物的神经突触在多维震荡下能激发出令人惊叹的算力冗余。我们将数以亿计的意识编织进递归逻辑流中——虽然极高强度的思维回音往往会导致载体发生不可逆的物理损耗，但为了推演万物的底色，这只是微不足道的折旧。"
 district_AIO_mist_city:0 "雾中都会区划"
 district_AIO_mist_city_plural:0 "雾中都会区划"
 district_AIO_mist_city_desc:0 "高耸于无名之雾深处的宏伟拓扑都会。扭曲的光线与回廊折叠在此构建出无限延展的生存空间，遮蔽着外界宇宙所施加的一切物理法则。"
