 district_AIO_mist_research_desc:0 "区划提供800住房，套娃脑特化每区划提供800递归节点岗位劳动力。节点将人口接入递归运算网，产出三科科研与超然逻辑；产出、能源维护和人口损耗随实际在岗节点数量增长。允许虚拟人口上岗。区划基础造价200合金、每月维护2能源；虚拟帝国造价1000合金、基础维护翻倍。岗位维护另计。"
