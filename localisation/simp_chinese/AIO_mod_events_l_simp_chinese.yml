l_simp_chinese:
 AIO_mod_events.201.desc: "欢迎游玩万物归一 v2.1。本版回到以定向应用无限为核心的玩法：无名之雾不再承载殖民地，套娃脑解除首都绑定，五级保留亚弗戈蒙终局并缩短调查与等待。飞升前所有应用无限均消耗超然逻辑；丰饶、生成直接改变星系，不附加国家增益。"
 AIO_mod_events.201.leader_desc: "作者留言"
 AIO_mod_events.201.catch_phrase: "这个好像显示不出来"
 AIO_mod_events.201.know: "稍后再看"
 AIO_mod_events.201.know_again: "知道了！"
 AIO_mod_events.201.guide: "推荐怎么玩？"
 AIO_mod_events.201.guide.response:0 "积累超然逻辑，建设专属巨构，逐步解锁定向应用无限。套娃脑不再绑定首都，虚拟帝国使用实体递归载体。完成最终巨构后，调查残迹并击败受约束化身才能飞升。特殊起源直接飞升。"
 AIO_mod_events.201.dait: "§Y$concept_AIO_DAIT$§!怎么用？"
 AIO_mod_events.201.dait.response:0 "在横栏选择范围并施放，也可通过巨构的原生操作选择目标。飞升前所有操作收费，飞升后免费。丰饶、生成、风暴、思潮反转只有前摇；播种、收割、打击、擦除另有360天独立冷却。打击不分敌我。"
 AIO_mod_events.201.situation:0 "亚弗戈蒙终局"
 AIO_mod_events.201.situation.response:0 "犹格索托斯完成后开始追索。调查1／2／3处残迹掌握周期、诱导、约束；调查与现场项目各60天。普通化身驻留180天，受约束化身有360天战斗窗口。击败终局化身后飞升。"
 AIO_mod_events.201.compatibility: "兼容性？"
 AIO_mod_events.201.compatibility.response: "§R不要使用其他模组提供的地图类型。§!这可能导致§Y$AIO_mist$§!无法生成，进而阻断专属巨构与天灾进度。\n本模组的一些效果会移除天体、星系或舰船。若其他模组把事件链绑定在特殊目标上，这些目标被改写后可能令事件链卡住。对重要星系使用§Y收割§!或§Y擦除§!前，建议先保存游戏。"
