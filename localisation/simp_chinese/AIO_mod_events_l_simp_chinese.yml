l_simp_chinese:
 AIO_mod_events.201.desc: "欢迎游玩万物归一！现在飞升不再限定格式塔，普通帝国、蜂巢思维和机械智能均可选择，其他条件以飞升面板为准。\n\n这次的重点是§Y无名之雾殖民地§!与§Y亚弗戈蒙终局§!：在雾中建设生产基地、改写银河规则，再面对最终的追索。完成犹格索托斯会立即开启终局，记得先把科研船和舰队准备好。下面可以查看玩法说明。"
 AIO_mod_events.201.leader_desc: "作者留言"
 AIO_mod_events.201.catch_phrase: "这个好像显示不出来"
 AIO_mod_events.201.know: "稍后再看"
 AIO_mod_events.201.know_again: "知道了！"
 AIO_mod_events.201.guide: "推荐怎么玩？"
 AIO_mod_events.201.guide.response: "先积累§Y超然逻辑§!、研究专属科技并建造§Y$AIO_horizon_engine$§!，再升级现实侧的门，进入§Y$AIO_mist$§!。天灾等级同时受逻辑积累和科技、巨构进度限制，可以在天灾面板查看。\n\n在雾中建设居所，继续升级银时之匙、永恒王座与犹格索托斯，逐步解锁更多定向应用无限操作。提前储备£energy£能量币、£alloys£合金、£sr_dark_matter£暗物质、£sr_living_metal£活体金属与£nanites£纳米机器人，后面的巨构可不便宜。"
 AIO_mod_events.201.compatibility: "兼容性？"
 AIO_mod_events.201.compatibility.response: "§R不要使用其他模组提供的地图类型。§!这可能导致§Y$AIO_mist$§!无法生成，进而阻断专属巨构与天灾进度。\n本模组的一些效果会移除天体、星系或舰船。若其他模组把事件链绑定在特殊目标上，这些目标被改写后可能令事件链卡住。对重要星系使用§Y收割§!或§Y擦除§!前，建议先保存游戏。"
 AIO_mod_events.201.mist: "无名之雾怎么建设？"
 AIO_mod_events.201.mist.response: "开门后自动建立§Y无名之雾居所§!；游牧帝国使用固定的舰载居所。生产岗位由区划特化提供，部分资源区划需要研究对应的规则科技。规则科技会改变整个银河的收益与代价，雾中居所享有对应的本地豁免。\n\n§Y套娃脑§!的递归运算特化可生产科研与超然逻辑，但要留意能源维护和人口损耗。\n\n居所容量从§Y12§!随巨构升级提高到§Y24／40／64§!。最终巨构完成后，可反复用扩展决议支付§Y5000能量币、2000合金§!，历时§Y360天§!增加§G8§!点区划容量。"
 AIO_mod_events.201.final: "终局怎么应对？（剧透）"
 AIO_mod_events.201.final.response: "§Y犹格索托斯建成后立即开启追索，不会直接获胜。§!亚弗戈蒙每轮显现前的预警越来越短，外部星系在其驻留360天后被抹除，留下调查项目。\n\n调查§Y1／2／6§!处残迹，依次掌握周期、解锁诱导和约束。项目研究需要§Y360天§!，有效期§Y1000天§!，失败或取消不恢复。诱导、约束必须在前兆结束前完成；约束同时完成诱导，改变目标不会重置倒计时。\n\n在外部星系于驻留结束前击败§Y受约束化身§!才能飞升。若它抵达无名之雾，雾与穷极之门将被清除。飞升结局会清除殖民地并转变帝国形态。\n\n胜利后解锁§Y远程投射§!：锁定没有其他锁定或亚弗戈蒙的星系，召来风暴，§Y720天§!后仅在该星系召唤化身。"
