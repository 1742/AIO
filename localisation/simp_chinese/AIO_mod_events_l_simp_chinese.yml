l_simp_chinese:
 AIO_mod_events.201.desc: "欢迎来到万物归一 v2.1。本版重新回到以定向应用无限为核心。\n\n更新时间：北京时间 2026/10/17\n - 套娃脑可以在所有殖民地建造，但分别计算递归节点数量\n - 无名之雾移除特殊殖民地\n - DAIT 菜单优化，完成万门之门后可在法令里打开\n - 亚弗戈蒙终局，数值未经验证，如果时间太少来不及机动和调查，请在创意工坊评论区反馈"
 AIO_mod_events.201.leader_desc: "作者留言"
 AIO_mod_events.201.catch_phrase: "修 mod 好累。。。"
 AIO_mod_events.201.know: "稍后再看"
 AIO_mod_events.201.know_again: "知道了！"
 AIO_mod_events.201.guide: "推荐怎么玩？"
 AIO_mod_events.201.guide.response:0 "先速物种飞，存合金造出万门之门，之后丰饶+戴森云/电弧熔炉，想要多少资源自己填。"
 AIO_mod_events.201.dait: "§Y$concept_AIO_DAIT$§!怎么用？"
 AIO_mod_events.201.dait.response:0 "点击屏幕底部的固定悬浮球展开菜单，选择目标、操作与适用范围，再点击确认。右上角“×”可收起菜单，保留悬浮球；右下角“退出菜单”才会关闭菜单并隐藏悬浮球，可用法令重新打开，操作与范围会保留。仅进入星系视图不算选中目标；空星系可选择“虚空”对象，思潮则可在外交界面选择国家。"
 AIO_mod_events.201.situation:0 "亚弗戈蒙终局"
 AIO_mod_events.201.situation.response:0 "犹格·索托斯完成后，宇宙将开始修正我们的升维工程。前五轮优先选择外部星系，此后默认指向无名之雾；无有效外部目标时会提前转向无名之雾。前兆首轮300天，每轮缩短60天，最低180天。\n\n调查1／2／3处不同残迹，依次掌握周期、诱导与约束；调查和现场项目均需配有科学官的科研船工作60天。诱导与约束通过应用无限菜单选址，须在显现前完成，不会重置计时；约束已经包含诱导。普通化身驻留180天，受约束化身提供360天战斗窗口。\n\n击败受约束化身即可选择飞升。若暂留，将获得不限期的“晋升”项目，随时研究30天即可再次选择。"
 AIO_mod_events.201.compatibility: "兼容性？"
 AIO_mod_events.201.compatibility.response: "§R不要使用其他模组提供的地图类型。§!这可能导致§Y$AIO_mist$§!无法生成，进而阻断专属巨构与天灾进度。\n本模组的一些效果会移除天体、星系或舰船。若其他模组把事件链绑定在特殊目标上，这些目标被改写后可能令事件链卡住。对重要星系使用§Y收割§!或§Y擦除§!前，建议先保存游戏。"
