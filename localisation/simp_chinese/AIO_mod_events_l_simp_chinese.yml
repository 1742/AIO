l_simp_chinese:
 AIO_mod_events.201.desc: "欢迎游玩万物归一模组，这次4.4改动比较大，旧的 DAIT 由于未知原因会造成较高内存占用被废弃了（不过原来的计算确实复杂），重新设计玩法、UI等花了很长时间。"
 AIO_mod_events.201.leader_desc: "作者留言"
 AIO_mod_events.201.catch_phrase: "这个好像显示不出来"
 AIO_mod_events.201.know: "稍后再看"
 AIO_mod_events.201.know_again: "知道了！"
 AIO_mod_events.201.guide: "推荐怎么玩？"
 AIO_mod_events.201.guide.response: "前期速物种飞升不说了，飞完可以转物理学出§Y$tech_AIO_exponential_learning_theory$§!和§Y$AIO_horizon_engine$§!。天灾1级建议多停留一阵，用视界引擎供能，烧突触起科研。\n\n同时储备£energy£能量币、£sr_dark_matter£暗物质、£nanites£纳米机器人与£sr_living_metal£活体金属，后续巨构升级会大量消耗这些资源。"
 AIO_mod_events.201.compatibility: "兼容性？"
 AIO_mod_events.201.compatibility.response: "§R不要使用其他模组提供的地图类型。§!这可能导致§Y$AIO_HYPER_DIMENSIONAL_SPACE$§!无法生成，进而阻断专属巨构与天灾进度。\n本模组的一些效果会移除天体、星系或舰船。若其他模组把事件链绑定在特殊目标上，这些目标被改写后可能令事件链卡住。对重要星系使用§Y收割§!或§Y擦除§!前，建议先保存游戏。"
