l_simp_chinese:
 AIO_final_events.201.title:0 "追索的征兆"
 AIO_final_events.201.desc:0 "犹格索托斯已经完成。外部星系出现了异常，亚弗戈蒙正循着我们改变现实的痕迹显现。前五次显现之后，它将直接追索无名之雾。调查抹除后的残迹，研究如何将它引向别处并加以约束。"
 AIO_final_events.201.option:0 "开始观测。"
 AIO_final_events.202.title:0 "显现周期"
 AIO_final_events.202.desc:0 "第一处残迹揭示了周期的规律。每次显现后，下一轮的等待时间都会缩短。地点局势记录当前目标和本轮期限。"
 AIO_final_events.202.option:0 "继续研究。"
 AIO_final_events.unlock_location:0 "已完成 1 处残迹调查，掌握显现周期。"
 AIO_final_events.203.title:0 "诱导显现"
 AIO_final_events.203.desc:0 "三处残迹的数据让我们能够制造诱导条件。通过犹格索托斯选择外部星系，再派科研船完成当地项目，便可改变本轮目的地。原倒计时不会重置。"
 AIO_final_events.203.option:0 "准备诱导。"
 AIO_final_events.unlock_induction:0 "已完成 3 处残迹调查，解锁终局诱导。"
 AIO_final_events.204.title:0 "约束显现"
 AIO_final_events.204.desc:0 "七处残迹的研究已经完成。约束项目将接替单纯的诱导：科研船完成项目时，同时改变本轮目的地并准备约束条件。必须在本轮驻留期结束前摧毁显现。"
 AIO_final_events.204.option:0 "准备约束。"
 AIO_final_events.unlock_constraint:0 "已完成 7 处残迹调查，解锁同时执行诱导的约束项目。"
 AIO_final_events.205.title:0 "无名之雾的终结"
 AIO_final_events.205.desc:0 "我们未能阻止亚弗戈蒙抵达家园。无名之雾与万门之门已被摧毁，本次研究与追索流程结束。幸存的殖民地只能在外部宇宙继续存在。"
 AIO_final_main_situation:0 "亚弗戈蒙研究"
 AIO_final_main_situation_type:0 "亚弗戈蒙研究"
 AIO_final_main_situation_desc:0 "已调查残迹：§Y[Owner.AIO_final_research]§!。调查 1／3／7 处不同残迹，依次掌握周期、诱导与约束。每处仅计数一次。\n\n约束项目同时完成诱导；研究完成后，仍须在外部星系及时击败显现才能飞升并解锁远程投射。"
 AIO_final_main_situation_monthly_change_tooltip:0 "研究不随时间增长。科研船每完成一处不同残迹的现场项目，研究进度增加 1。"
 AIO_final_approach:0 "调查残迹"
 AIO_final_research_stage_1:0 "识别周期"
 AIO_final_research_stage_2:0 "研究诱导"
 AIO_final_research_stage_3:0 "研究约束"
 AIO_final_location_situation:0 "亚弗戈蒙追索：[Target.GetName]"
 AIO_final_location_situation_type:0 "亚弗戈蒙追索"
 AIO_final_location_situation_desc:0 "当前目的地：§Y[Target.GetName]§!。本轮前兆长度为 §Y[Owner.AIO_final_wait] 天§!；之后显现驻留 §Y360 天§!。前兆每轮缩短 200 天，最低 200 天。\n\n诱导或约束项目必须在前兆结束前完成；选址和研究过程不会改变原目标。项目完成只改变目的地，不重置计时。\n\n§R抵达无名之雾时立即失败。外部显现驻留超时将抹除当地星系内容。§!"
 AIO_final_location_situation_monthly_change_tooltip:0 "每月推进 30 点。进度条依次表示前兆和驻留期限。"
 AIO_final_location_approach:0 "准备应对"
 AIO_final_omen_stage:0 "前兆"
 AIO_final_manifestation_stage:0 "显现驻留"
 AIO_final_location_started:0 "亚弗戈蒙的新一轮显现目标已经确定。"
 AIO_final_location_completed:0 "亚弗戈蒙的显现已经结束，当地星系被抹除。"
 AIO_final_location_arrived:0 "亚弗戈蒙已在目标星系显现，驻留期限开始。"
 AIO_FINAL_RESEARCH:0 "调查抹除残迹"
 AIO_FINAL_RESEARCH_DESC:0 "派遣一艘配有科学官的科研船，进行 360 天现场研究。每处不同残迹增加 1 点终局研究进度。项目有效期为 1000 天，失败或取消后不会自动恢复。"
 AIO_FINAL_INDUCTION:0 "诱导亚弗戈蒙"
 AIO_FINAL_INDUCTION_DESC:0 "进行 360 天现场研究，在本轮显现前完成即可改变目的地，原计时不变。显现开始时未完成的项目将被取消。项目有效期为 1000 天，失败或取消后不会自动恢复。"
 AIO_FINAL_CONSTRAINT:0 "诱导并约束亚弗戈蒙"
 AIO_FINAL_CONSTRAINT_DESC:0 "进行 360 天现场研究，同时改变本轮目的地并准备约束条件。原计时不变；仍须在驻留期限内击败显现。项目有效期为 1000 天，失败或取消后不会自动恢复。"
 AIO_final_induction_action:0 "诱导亚弗戈蒙"
 AIO_final_induction_activity:0 "诱导至 $NAME$"
 AIO_final_induction_action_tooltip:0 "选择外部星系，花费 £AIO_advanced_logic£ §Y10,000§! 启动 360 天科研船现场项目。完成时改变本轮目的地，计时不重置。取消不退款。"
 AIO_final_constraint_action:0 "诱导并约束亚弗戈蒙"
 AIO_final_constraint_activity:0 "在 $NAME$ 诱导并约束"
 AIO_final_constraint_action_tooltip:0 "选择外部星系，花费 £AIO_advanced_logic£ §Y10,000§! 和 £sr_dark_matter£ §Y2,000§! 启动 360 天现场项目。同时完成本轮诱导与约束准备，计时不重置。取消不退款。"
 AIO_final_fail.target:0 "目标必须是有恒星的外部星系，且未被抹除、没有亚弗戈蒙显现。不能选择无名之雾或穷极之门。"
 AIO_final_fail.unavailable:0 "需要 10,000 超然逻辑，且处于本轮前兆阶段、没有进行中的诱导或约束项目，也尚未完成本轮诱导。"
 AIO_projection_fail.need_final:0 "需要完成亚弗戈蒙终局。"
 mod_AIO_final_location_situation_max_progress_add:0 "亚弗戈蒙追索总长度"
 mod_AIO_final_location_situation_max_progress_mult:0 "$mod_AIO_final_location_situation_max_progress_add$"
 AIO_final_main_situation_ready_desc:0 "约束研究已完成。通过犹格索托斯选择外部星系，完成同时执行诱导的约束项目，再于本轮驻留期限内摧毁显现。研究完成本身不会结束追索。"
