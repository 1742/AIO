l_simp_chinese:
 AIO_final_events.201.title:0 "清算者降临"
 AIO_final_events.201.desc:0 "犹格·索托斯已然屹立。然而，宇宙的底层逻辑不容亵渎——现实被扭曲至极点的时空反扑，正以最纯粹的毁灭意志在星海中具象化。那是一尊由绝对物理律与因果纠正编织而成的行刑者，落后物种战栗地称其为‘亚弗戈蒙’。\n\n祂循着我们改写现实的痕迹而来，祂的降临将熄灭沿途的一切星辰。前五次降临优先选择外部星系，此后祂的视线将直接锁定无名之雾；若已无有效的外部目标，清算也会提前抵达。调查祂降临抹除后的星系残迹，反向解构祂的降临规律——哪怕是宇宙意志的代行神明，我们也必将亲手将其诱导、约束并击坠。"
 AIO_final_events.201.option:0 "观测祂的降临。"
 AIO_final_events.202.title:0 "降临周期闭环"
 AIO_final_events.202.desc:0 "首处被亚弗戈蒙降临抹除的星系残迹证实了我们的猜想：作为宇宙的排异意志，祂的降临具有自加速性——现实创口的撕裂越深，祂每一次降临的间歇就越短。\n\n地点局势已锁定了祂的降临目标与期限。这是一场与神圣清算赛跑的博弈。"
 AIO_final_events.202.option:0 "记录降临轨迹。"
 AIO_final_events.unlock_location:0 "已完成 1 处残迹调查，掌握降临周期。"
 AIO_final_events.203.title:0 "诱导降临"
 AIO_final_events.203.desc:0 "两处残迹的数据让我们洞悉了亚弗戈蒙的降临偏好。既然祂只循着因果畸变最极端之处降临，我们便能通过犹格·索托斯在指定的外部星系伪造一处更致命的‘逻辑溃决点’。\n\n派遣科研船完成现场工程，便能操纵这位审判者的降临坐标。原倒计时不会重置。"
 AIO_final_events.203.option:0 "引渡降临。"
 AIO_final_events.unlock_induction:0 "已完成 2 处残迹调查，解锁诱导降临。"
 AIO_final_events.204.title:0 "约束降临"
 AIO_final_events.204.desc:0 "对三处残迹的彻底测绘完成了解构的终章。我们不再仅是引开祂——配合暗物质相位发生器，我们将在诱导星系周围布设高维约束力场。\n\n当亚弗戈蒙再次降临，祂那看似无可匹敌的躯体将被强行钉死在三维坐标中。在祂驻留的期限内，以舰队将其彻底斩落！"
 AIO_final_events.204.option:0 "准备行刑。"
 AIO_final_events.unlock_constraint:0 "已完成 3 处残迹调查，解锁约束降临项目。"
 AIO_final_events.205.title:0 "截面坍陷"
 AIO_final_events.205.desc:0 "我们错估了清算的收敛速度。修正的怒火毫无阻隔地灌入了无名之雾，将犹格·索托斯连同我们苦心构筑的维度泡彻底抹去。\n\n避难所已不复存在。我们仍能标出它曾经所在的坐标，却再也无法抵达那片超脱现实的时空。昔日的神迹，只留下不可挽回的空白。"
 AIO_final_main_situation:0 "解构亚弗戈蒙"
 AIO_final_main_situation_type:0 "终局研究"
 AIO_final_main_situation_desc:0 "被擦除的星系仍在引力与因果中留下回声。已调查残迹：§Y[Owner.AIO_final_research]§!。调查1／2／3处不同残迹，依次掌握降临周期、诱导与约束；每处仅计数一次。\n\n约束项目同时完成诱导。完成研究后，仍须在外部星系约束降临化身，并在驻留期限内将其击败，才能获得飞升选择及完整的应用无限权限。"
 AIO_final_main_situation_monthly_change_tooltip:0 "研究不随时间增长。科研船每完成一处不同残迹的现场项目，研究进度增加 1。"
 AIO_final_approach:0 "调查残迹"
 AIO_final_research_stage_1:0 "解析周期"
 AIO_final_research_stage_2:0 "诱导降临"
 AIO_final_research_stage_3:0 "约束降临"
 AIO_final_location_situation:0 "亚弗戈蒙降临：[Target.GetName]"
 AIO_final_location_situation_type:0 "降临清算"
 AIO_final_location_situation_desc:0 "修正正在向§Y[Target.GetName]§!收敛。本轮前兆持续§Y[Owner.AIO_final_wait]天§!；首轮300天，随后每轮缩短60天，最低180天。未约束化身驻留180天，受约束化身的战斗窗口为360天。\n\n诱导或约束项目均需60天，必须在显现前完成；改变目的地不会重置计时。抵达无名之雾将立即导致终局失败；在外部星系驻留超时，则会擦除当地星系并开始下一轮降临。"
 AIO_final_location_situation_monthly_change_tooltip:0 "每月推进 30 点。进度条依次表示前兆和降临驻留期限。"
 AIO_final_location_approach:0 "准备应对"
 AIO_final_omen_stage:0 "降临前兆"
 AIO_final_manifestation_stage:0 "降临驻留"
 AIO_final_location_started:0 "亚弗戈蒙的新一轮降临目标已经确定。"
 AIO_final_location_completed:0 "亚弗戈蒙降临驻留结束，当地星系被彻底抹除。"
 AIO_final_location_arrived:0 "亚弗戈蒙已降临目标星系，驻留期限开始。"
 AIO_FINAL_RESEARCH:0 "调查降临抹除残迹"
 AIO_FINAL_RESEARCH_DESC:0 "星系已经消失，修正的回声却尚未散尽。派遣一艘配有科学官的科研船，进行60天现场研究，从虚空中的引力残迹重建降临过程。\n\n每处不同残迹提供1点终局研究进度。项目有效期为1000天，失败或取消后不会自动恢复。"
 AIO_FINAL_INDUCTION:0 "诱导亚弗戈蒙降临"
 AIO_FINAL_INDUCTION_DESC:0 "在选定星系制造一道足以引来修正的因果创口。派遣一艘配有科学官的科研船，完成60天现场研究后，改变本轮降临目的地。\n\n原计时不变；显现开始时，未完成的项目将被取消。项目有效期为1000天，失败或取消后不会自动恢复，已付费用不退还。"
 AIO_FINAL_CONSTRAINT:0 "诱导并约束降临"
 AIO_FINAL_CONSTRAINT_DESC:0 "在因果创口周围布设暗物质约束场，为即将降临的修正铸造一具可以击毁的躯体。派遣一艘配有科学官的科研船，完成60天现场研究，同时改变本轮目的地并约束降临化身。\n\n原计时不变；显现开始时，未完成的项目将被取消。受约束化身仍须在360天驻留期限内被击败。项目有效期为1000天，失败或取消后不会自动恢复，已付费用不退还。"
 AIO_final_induction_action:0 "诱导亚弗戈蒙降临"
 AIO_final_induction_action_tooltip:0 "选择有效的外部星系，花费£AIO_advanced_logic£§Y10,000§!，启动配有科学官的科研船执行的60天现场项目。须在显现前完成；完成后改变本轮目的地，计时不重置。取消不退款。"
 AIO_final_constraint_action:0 "诱导并约束降临"
 AIO_final_constraint_action_tooltip:0 "选择有效的外部星系，花费£AIO_advanced_logic£§Y10,000§!和£sr_dark_matter£§Y2,000§!，启动配有科学官的科研船执行的60天现场项目。须在显现前完成，同时执行本轮诱导与约束，计时不重置。取消不退款。"
 AIO_final_fail.target:0 "目标须为有恒星、尚未被擦除的外部星系，且没有降临化身或其他占用。无名之雾、穷极之门、天灾巨构星系及受保护的特殊目标不可选。"
 AIO_final_fail.unavailable:0 "需要 10,000 超然逻辑，且处于本轮前兆阶段、没有进行中的诱导或约束项目，也尚未完成本轮诱导。"
 mod_AIO_final_location_situation_max_progress_add:0 "亚弗戈蒙追索总长度"
 mod_AIO_final_location_situation_max_progress_mult:0 "$mod_AIO_final_location_situation_max_progress_add$"
 AIO_final_main_situation_ready_desc:0 "我们已经知道如何让修正停留在炮火能够触及的地方。通过应用无限菜单选择有效的外部星系，完成同时执行诱导的约束项目，再于360天驻留期限内摧毁降临化身。完成研究本身不会终止清算。"

 AIO_final_location_complete_tooltip:0 "外部降临驻留结束时，亚弗戈蒙消失并抹除目标星系，留下可供科研船调查的残迹，随后开始下一轮降临。若目标为无名之雾，则终局失败。"
 AIO_final_location_approach_desc:0 "等待当前降临；在显现前可完成诱导或约束项目。受约束的实体必须在驻留期限内被舰队击败。"
