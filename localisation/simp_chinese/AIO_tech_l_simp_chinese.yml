 #region 应用无限

 tech_AIO_rule_energy:0 "应用无限：能量定向流"
 tech_AIO_rule_energy_desc:0 "热力学第一定律只是低维封闭系统的狭隘经验。通过在时空深处打通高维势能泄洪口，我们让能量如泉涌般凭空漫溢，而矿物原子的键能衰变代价则全由外部银河承担。"
 tech_AIO_rule_energy_effect:0 "二级。全银河岗位能源产出+20%，矿物产出−10%；无名之雾抵消矿物代价并解锁能源区划。"
 tech_AIO_rule_matter:0 "应用无限：实在物质沉淀"
 tech_AIO_rule_matter_desc:0 "质能方程不再是双向平衡，我们将能量不可逆地压入重子晶格。实体矿物的丰裕诞生自基础有机质的降解崩溃，但只要生产机器在轰鸣，谁在乎低维生物的口粮？"
 tech_AIO_rule_matter_effect:0 "三级。全银河岗位矿物产出+20%，食物产出−10%；无名之雾抵消食物代价并解锁矿物区划。"
 tech_AIO_rule_structure:0 "应用无限：超维晶格流形"
 tech_AIO_rule_structure_desc:0 "自然界的原子键合方式过于单调。强行导入的拓扑应力让稀有资源在常规物质中如霜雪般自发结晶，尽管维持这种强扭常数的能耗令人发指，但在无名之雾的庇护下，这一切皆为净利。"
 tech_AIO_rule_structure_effect:0 "四级。全银河岗位三稀有产出+15%，岗位能源维护+10%；无名之雾抵消维护代价，分别解锁微粒、气体、水晶区划。"
 tech_AIO_rule_dark_matter:0 "应用无限：暗相实在化"
 tech_AIO_rule_dark_matter_desc:0 "弱相互作用与引力不再捉摸不定。我们将隐秘的高维潜流捕获至宏观视界，为我们揭示未曾设想的科研真理，而平庸物种只能在日益昂贵的消费品短缺中承受代价。"
 tech_AIO_rule_dark_matter_effect:0 "三级。全银河科研岗位产出+10%，岗位消费品维护+10%；无名之雾抵消维护代价并解锁暗物质区划。银时之匙使用暗物质。"
 tech_AIO_rule_living_metal:0 "应用无限：自组织流形"
 tech_AIO_rule_living_metal_desc:0 "无机物与生命体的界限在数学上被抹杀。金属晶格学会了如原生质般自我修复与无限延展，整座银河的冶金工业都将被这场活态革命所同化重塑。"
 tech_AIO_rule_living_metal_effect:0 "四级。全银河岗位产出+10%，岗位合金产出−10%；无名之雾抵消合金代价并解锁活体金属区划。永恒王座使用活体金属。"
 tech_AIO_rule_nanites:0 "应用无限：纳米连续体"
 tech_AIO_rule_nanites_desc:0 "一切宏观结构在此退化为无数受控微粒的连续洪流。物质在瞬间解离又在瞬间重聚，低维宇宙的能流电网在狂暴的分子级重组中枯竭，换取的是战无不胜的高维构型洪流。"
 tech_AIO_rule_nanites_effect:0 "五级。全银河岗位合金产出+15%，能源产出−10%；无名之雾抵消能源代价并解锁纳米机器人区划。最终巨构使用纳米机器人。"

 #endregion
