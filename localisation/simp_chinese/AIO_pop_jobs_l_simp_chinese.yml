l_simp_chinese:
 # 岗位类型
 pop_cat_AIO_chips: "递归思维计算"
 pop_cat_AIO_chips_plural: "$pop_cat_AIO_chips$"
 pop_cat_AIO_chips_desc: "这是基于自反馈神经网络与类意识嵌套的并行模型构建逻辑。每一层结构都在递归调用其它层的状态，从而产生高维推演能力。"
 # 岗位
 job_AIO_chips: "递归节点"
 job_AIO_chips_plural: "$job_AIO_chips$"
 job_AIO_chips_desc: "这些意识结构被设计为彼此嵌套、自我调用，它们同时进行模拟、观测与反馈，在无限回响中逼近真理。"
 job_AIO_chips_effect_desc: "[AIO_chips.GetIcon]§Y[AIO_chips.GetNamePlural]§!将$r_energy$转化为$r_research$和£AIO_advanced_logic£§Y$AIO_advanced_logic$§!"
 mod_job_AIO_chips_add_desc: "£job_AIO_chips£ $job_AIO_chips$岗位"
 job_AIO_dormant_chassis: "休眠载体"
