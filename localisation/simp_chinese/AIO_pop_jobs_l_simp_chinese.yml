l_simp_chinese:
 # 岗位类型
 pop_cat_AIO_chips: "递归思维计算"
 pop_cat_AIO_chips_plural: "$pop_cat_AIO_chips$"
 pop_cat_AIO_chips_desc: "作为套娃脑运算节点接入逻辑网络的人口。"
 # 岗位
 job_AIO_chips: "递归节点"
 job_AIO_chips_plural: "$job_AIO_chips$"
 job_AIO_chips_desc: "将思维脉冲作为高维逻辑流的载体。无论是有机神经突触还是实体运算核心，在此处都不过是防止超然逻辑回路过载的自消耗熔断丝。"
 job_AIO_chips_effect_desc: "[AIO_chips.GetIcon]§Y[AIO_chips.GetNamePlural]§!将$r_energy$转化为$r_research$和£AIO_advanced_logic£§Y$AIO_advanced_logic$§!，任职人口会持续损耗。"
 mod_job_AIO_chips_add_desc: "£job_AIO_chips£ $job_AIO_chips$岗位"
 job_AIO_dormant_chassis: "休眠载体"
 job_AIO_dormant_chassis_plural: "$job_AIO_dormant_chassis$"
 job_AIO_dormant_chassis_desc: "反馈回路暂时断开，散热阵列逐层熄灭。这些载体在最低功耗下保存着仍可投入演算的结构，等待网络再次需要它们。"
 mod_job_AIO_dormant_chassis_add: "£job_AIO_chips£ $job_AIO_dormant_chassis$岗位"
 d_AIO_dormant_chassis_array: "载体待机阵列"
 d_AIO_dormant_chassis_array_desc: "一组用于保存递归载体、维持其最低限度机能的待机接口。"
 decision_AIO_add_dormant_chassis_jobs: "扩充载体待机阵列"
 decision_AIO_add_dormant_chassis_jobs_desc: "将一部分递归载体从运算网络切换至低功耗待机，以降低递归节点的规模和维护费。该决议可以重复执行。"
 decision_AIO_add_dormant_chassis_jobs_requirements: "至少需要§Y333§!个在岗的£job_AIO_chips£ $job_AIO_chips$"
 decision_AIO_add_dormant_chassis_jobs_effect: "增加§Y333§!个£job_ark_deep_sleep£ $job_AIO_dormant_chassis$岗位。递归载体会优先进入这些岗位。"
 decision_AIO_remove_dormant_chassis_jobs: "关闭载体待机阵列"
 decision_AIO_remove_dormant_chassis_jobs_desc: "关闭一组待机接口，使其中的递归载体重新投入递归计算。该决议可以重复执行。"
 decision_AIO_remove_dormant_chassis_jobs_effect: "移除§Y333§!个£job_ark_deep_sleep£ $job_AIO_dormant_chassis$岗位。"
 # 净化类型
 purge_AIO_chips: "思想余烬"
 purge_AIO_chips_tooltip: "人口在无休止的递归运算与高维逻辑回音中逐渐磨损耗尽。"
 purge_AIO_chips_tooltip_delayed: "§L唯余思化作薪柴，于天演中永恒燃烧。§!"
