 AIO_DAIT_spawn_situation:0 "应用无限：生成"
 AIO_DAIT_spawn_situation_desc:0 "目标星系：§Y[Target.GetName]§!。范围：$AIO_DAIT_range_0$。预计生效日期：§Y[Owner.AIO_DAIT_spawn_due]§!。\n\n局势完成时再次核验范围内目标并执行“生成”。中心目标失效或失去操作权限将取消施放，退还一半实付费用且不进入冷却。其他国家只在效果触发时收到通知。"
