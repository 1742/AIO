 AIO_DAIT_ethic_situation_desc:0 "目标国家：§Y[Target.GetName]§!。预计生效日期：§Y[Owner.AIO_DAIT_ethic_due]§!。\n\n施放开始时锁定国家。局势完成时反转该国思潮并重组政府，不受原选中对象的位置、存续或所有权变化影响。目标灭亡、成为格式塔或不再满足国家类型条件，或施放者失去权限时，取消施放、退还一半实付费用且不进入冷却。"
