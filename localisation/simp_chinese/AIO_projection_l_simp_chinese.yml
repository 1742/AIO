l_simp_chinese:
 AIO_projection_aforgomon_action:0 "投射：亚弗戈蒙降临"
 AIO_projection_aforgomon_activity:0 "锁定降临坐标：$NAME$"
 AIO_projection_aforgomon_action_tooltip:0 "选择一个外部星系，花费 £AIO_advanced_logic£ §Y100,000§!，在 £time£ §Y720 天§!后诱发时空排异并降临亚弗戈蒙。仅作用于选定星系。冷却：§Y3600 天§!。\n\n§R警告：代行清算的亚弗戈蒙敌视一切宏观实体，包括我们及盟友。§!"
 AIO_projection_fail.target:0 "目标已有等待中的投射或现存的亚弗戈蒙降临。"
 AIO_projection_fail.need_mega_04:0 "需要拥有 §Y$AIO_mega_04$§!。"
 AIO_projection_fail.cooldown:0 "远程投射仍在冷却。"
 AIO_projection_confirm:0 "偃熄星辰"
 AIO_projection_confirm_tooltip:0 "720 天后，亚弗戈蒙降临锁定星系。确认后无法撤销；目标失效或已有显现时不重复降临，亦不退款。"
 AIO_projection_events.301.title:0 "$AIO_Aforgomon$"
 AIO_projection_events.301.desc:0 "通过犹格·索托斯的超维投射中枢，我们能够在 §Y[From.GetName]§! 星系制造出无可弥合的因果崩塌，引渡代行宇宙清算的‘亚弗戈蒙’降临其上。\n\n降临的审判者将不可阻挡地抹除当地的一切结构与存在。\n\n费用：£AIO_advanced_logic£ §Y100,000§!\n延迟：£time£ §Y720 天§!\n冷却：§Y3600 天§!\n\n§R警告：$AIO_Aforgomon$不区分敌我，降临实体将彻底抹除当地星系的一切。§!"
 AIO_projection_Aforgomon.located: "虚空已为清算者敞开，亚弗戈蒙将在 §Y720 天§!后降临 §Y[event_target:AIO_projection_Aforgomon_target.GetName]§!。"
 AIO_projection_Aforgomon.advented: "星辰沉寂，虚无裂解——亚弗戈蒙已降临于 §Y[event_target:AIO_projection_Aforgomon_target.GetName]§!！"
