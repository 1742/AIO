l_simp_chinese:
 AIO_projection_aforgomom_action: "召唤亚弗戈蒙"
 AIO_projection_aforgomom_activity: "撕裂 $NAME$"
 AIO_projection_aforgomom_action_tooltip: "舰队尚在计算航程，我们已替灾厄选好了降临之地。\n\n选择星系并投入超然逻辑，建立能够自行防卫的召唤锚点。无需宣战，也不需要舰队抵达。\n\n投入：£AIO_advanced_logic£ §Y100,000／200,000／400,000§!，对应锚点 §Y1／2／4 倍§!舰体与武器伤害。\n仪式时长：约 §Y720 天§!。\n范围：启动时的§Y干涉范围§!，按超空间跳数计算，包含中心，忽略虫洞等旁路。\n冷却：§Y10 年§!，确认投入后开始。\n\n§R锚点及化身敌视所有帝国，包括我们、盟友和附属国。§!摧毁锚点可阻止本次召唤；停战和领土易手不会中断仪式。中止不退款、不重置冷却。"
 AIO_projection_fail_center: "这个星系已经存在锚点。"
 AIO_projection_events.202.title: "为亚弗戈蒙选择落点"
 AIO_projection_events.202.desc: "星图上的§Y[From.GetName]§!仍标注着疆界、驻军与航道。那里的人依然相信，要摧毁他们，就得先穿过这些防线。\n\n犹格索托斯已为我们指出另一条路。我们可以扭曲现实，制造悖论奇点，亚弗戈蒙便会在那里找到入口。\n\n选择一次性投入，以决定锚点的舰体与火力。仪式约需 §Y720 天§!，范围在启动时锁定为当前的 §Y[Root.AIO_interference_range] 跳§!干涉范围。\n\n§R锚点释放后立即敌视所有帝国，包括我们、盟友及附属国。§!它不能移动、不会复活，任何国家都可将其摧毁。启动时会解除范围内的现有风暴覆盖，并在中心生成枢纽风暴。"
 AIO_projection_invest_basic: "开启入口。〔基础：100,000 超然逻辑〕"
 AIO_projection_invest_reinforced: "让他们付出代价才能关上它。〔强化：200,000〕"
 AIO_projection_invest_overcharged: "让他们倾尽舰队来阻止我们。〔过载：400,000〕"
 AIO_projection_invest_basic_tooltip: "支付 £AIO_advanced_logic£ §Y100,000§!，生成基础舰体与火力的锚点，并开始 §Y10 年§!冷却。"
 AIO_projection_invest_reinforced_tooltip: "支付 £AIO_advanced_logic£ §Y200,000§!，生成 §Y2 倍§!基础舰体与武器伤害的锚点，并开始 §Y10 年§!冷却。"
 AIO_projection_invest_overcharged_tooltip: "支付 £AIO_advanced_logic£ §Y400,000§!，生成 §Y4 倍§!基础舰体与武器伤害的锚点，并开始 §Y10 年§!冷却。"
 AIO_projection_cancel: "容我三思。"
 AIO_projection_Aforgomom: "亚弗戈蒙降临：[Target.GetName]"
 AIO_projection_Aforgomom_type: "亚弗戈蒙远程投射"
 AIO_projection_Aforgomom_desc: "我们已在§Y[Target.GetName]§!钉下锚点。现实正围绕它缓缓开裂，亚弗戈蒙的降临只待仪式完成。各国可以争论这是否属于战争，也可以集结舰队，试着替这片星空争取更多时间。\n\n我们不需要他们承认我们的力量。他们赶来摧毁锚点的每一艘战舰，都已承认。\n\n仪式完成后，将在中心及 §Y[This.AIO_projection_range] 跳§!内的星系召唤亚弗戈蒙；已有化身的星系不会重复生成。\n本次锚点强度：§Y[This.AIO_projection_strength] 倍§!基础舰体与武器伤害。\n\n§R锚点和化身均敌视所有帝国。§!锚点被击毁则本次仪式中止；外交变化和领土易手不影响仪式。"
 AIO_projection_Aforgomom_monthly_change_tooltip: "每月推进 1 点，24 点完成。其他帝国可以通过观察局势查看进度；摧毁本次锚点可以阻止召唤。"
 AIO_projection_maintain_ritual: "让仪式继续"
 AIO_projection_maintain_ritual_desc: "命令已经下达。我们将看着现实一点点让步，直到它容得下我们召来的东西。\n\n仪式以固定速度推进，投入强度已锁定，无法主动取消或加速。"
 mod_AIO_projection_Aforgomom_max_progress_add: "亚弗戈蒙投射所需进度"
 mod_AIO_projection_Aforgomom_max_progress_mult: "$mod_AIO_projection_Aforgomom_max_progress_add$"
 AIO_projection_anchor: "现实锚点"
 AIO_projection_anchor_plural: "$AIO_projection_anchor$"
 NAME_AIO_projection_anchor: "$AIO_projection_anchor$"
 NAME_AIO_projection_anchor_design: "$AIO_projection_anchor$"
 AIO_PROJECTION_ANCHOR_LANCE: "僭越之罚"
 AIO_PROJECTION_ANCHOR_LANCE_DESC: "每一道逼近锚点的航迹，都在现实裂隙中激起电弧。后来者将从先行舰船的残骸中学会：试图关上这扇门，同样需要付出代价。"
 AIO_projection_anchor_reinforced: "强化锚点"
 AIO_projection_anchor_overcharged: "过载锚点"
 AIO_projection_notice_ack: "记下这一刻。"
 AIO_projection_notice_start.name: "亚弗戈蒙：降临坐标"
 AIO_projection_notice_start.desc: "§Y[From.GetName]§!已在§Y[FromFrom.GetName]§!建立现实锚点。舰队尚可拦截，航道尚可封锁，如今却有一场灾厄绕过这一切，直接在星图上获得了坐标。\n\n约 §Y24 个月§!后，亚弗戈蒙将在周围星系降临。召唤者为它选定了入口，却没有任何旗帜能换来它的宽恕。\n\n§R锚点与化身敌视所有帝国，包括召唤者及其盟友。§!各国均可派遣舰队摧毁锚点，阻止本次召唤；停战不能中断仪式。可在局势日志中查看进度。"
 AIO_projection_notice_abort.name: "亚弗戈蒙：门扉破碎"
 AIO_projection_notice_abort.desc: "§Y[FromFrom.GetName]§!的现实锚点已经消失。失去支撑的裂隙开始闭合，§Y[From.GetName]§!为亚弗戈蒙铺设的道路在最后一步之前断了。\n\n这一次，星图上留下的仍是一个地名，而非一场降临的注脚。然而，令现实开裂的方法依然掌握在召唤者手中。"
 AIO_projection_notice_complete.name: "亚弗戈蒙：应召而至"
 AIO_projection_notice_complete.desc: "§Y[From.GetName]§!在§Y[FromFrom.GetName]§!的召唤仪式已经完成。锚点消散，亚弗戈蒙的化身出现在中心与仪式锁定范围内的星系。此前星图上标出的威胁范围，如今有了形体。\n\n边界、条约与敌我识别信号，对这些存在毫无意义。召唤者证明了自己有能力将灾厄送往远方；它们接下来的每一次攻击，都将提醒银河，这份能力从未包含驾驭。\n\n§R所有帝国的舰队都可能遭到攻击，包括召唤者的舰队。§!已有化身的星系不会重复生成。本次锚点已消散，其他锚点与当地风暴不受影响。"
 AIO_projection_fail.need_mega_04: "需要拥有§Y犹格索托斯§!。"
 AIO_projection_fail.cooldown: "远程投射仍在冷却中。"
 AIO_projection_fail.exist: "本国已经有进行中的远程投射。"
 AIO_projection_observer: "降临倒计时：[Target.Solar_System.GetName]"
 AIO_projection_observer_type: "亚弗戈蒙召唤警报"
 AIO_projection_observer_desc: "§Y[Target.Solar_System.GetName]§!的现实裂隙正在扩大。锚点每多存在一天，亚弗戈蒙就离这片星空更近一步。无论召唤者打算用它惩罚谁，我们都不在它的豁免名单上。\n\n锚点仍然可以被摧毁。趁着威胁还能被标成一个目标，舰队必须抓住这个机会。\n\n仪式完成后，中心及 §Y[This.AIO_projection_range] 跳§!内的星系将受到影响。\n锚点强度：§Y[This.AIO_projection_strength] 倍§!基础舰体与武器伤害。\n\n§R锚点和化身敌视所有帝国。§!派遣舰队摧毁锚点可以阻止本次召唤。此局势仅用于观察仪式进度，无法通过方案改变它。"
 AIO_projection_observer_monthly_change_tooltip: "每月更新召唤仪式的进度。此警报不会自行推进；仪式达到 24 点时完成。"
 AIO_projection_observe_ritual: "紧盯裂隙"
 AIO_projection_observe_ritual_desc: "我们需要知道还剩多少时间，更需要有人在时间耗尽前抵达那里。\n\n持续追踪召唤仪式。反制需要派遣舰队摧毁锚点。"
