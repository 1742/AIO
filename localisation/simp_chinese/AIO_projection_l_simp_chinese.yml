l_simp_chinese:
 AIO_projection_aforgomom_action:0 "召唤亚弗戈蒙"
 AIO_projection_aforgomom_activity:0 "投射至 $NAME$"
 AIO_projection_aforgomom_action_tooltip:0 "选择星系并投入超然逻辑，建立能够自行防卫的召唤锚点。无需宣战，也不需要舰队抵达。\n\n投入：£AIO_advanced_logic£ §Y100,000／200,000／400,000§!，对应锚点 §Y1／2／4 倍§!舰体与武器伤害。\n前摇：约 §Y720 天§!。\n范围：启动时的§Y干涉范围§!，按超空间跳数计算，包含中心，忽略虫洞等旁路。\n冷却：§Y10 年§!，确认投入后开始。\n\n§R锚点及化身敌视所有帝国，包括我们、盟友和附属国。§!摧毁锚点可阻止本次召唤；停战和领土易手不会中断仪式。中止不退款、不重置冷却。"
 AIO_projection_fail_center:0 "这个星系已经存在召唤锚点。"
 AIO_projection_events.202.title:0 "远程投射：投入强度"
 AIO_projection_events.202.desc:0 "将在§Y[From.GetName]§!建立武装现实锚点。选择一次性投入，决定锚点的舰体和火力；三档投入的前摇与召唤范围相同。\n\n仪式约需 §Y720 天§!，范围取我们当前的 §Y[Root.AIO_interference_range] 跳§!干涉范围并在启动时锁定。\n\n§R锚点一经释放就敌视所有帝国，包括我们及附属国。§!它不能移动、不会复活，所有国家都可以将其摧毁。启动时会解除范围内的现有风暴覆盖，并在中心生成枢纽风暴。"
 AIO_projection_invest_basic:0 "基础锚点：100,000 超然逻辑"
 AIO_projection_invest_reinforced:0 "强化锚点：200,000 超然逻辑"
 AIO_projection_invest_overcharged:0 "过载锚点：400,000 超然逻辑"
 AIO_projection_invest_basic_tooltip:0 "支付 £AIO_advanced_logic£ §Y100,000§!，生成基础舰体与火力的锚点，并开始 §Y10 年§!冷却。"
 AIO_projection_invest_reinforced_tooltip:0 "支付 £AIO_advanced_logic£ §Y200,000§!，生成 §Y2 倍§!基础舰体与武器伤害的锚点，并开始 §Y10 年§!冷却。"
 AIO_projection_invest_overcharged_tooltip:0 "支付 £AIO_advanced_logic£ §Y400,000§!，生成 §Y4 倍§!基础舰体与武器伤害的锚点，并开始 §Y10 年§!冷却。"
 AIO_projection_cancel:0 "取消，不进行投射"
 AIO_projection_Aforgomom:0 "亚弗戈蒙投射：[Target.GetName]"
 AIO_projection_Aforgomom_type:0 "亚弗戈蒙远程投射"
 AIO_projection_Aforgomom_desc:0 "§Y[Target.GetName]§!的武装锚点正在维持召唤。仪式完成后，将在中心及 §Y[This.AIO_projection_range] 跳§!内的星系召唤亚弗戈蒙。\n\n本次锚点强度：§Y[This.AIO_projection_strength] 倍§!基础舰体与武器伤害。\n\n§R锚点和化身均敌视所有帝国。§!锚点被击毁则本次仪式中止；外交变化和领土易手不影响仪式。已有化身的星系不会重复生成。"
 AIO_projection_Aforgomom_monthly_change_tooltip:0 "每月推进 1 点，24 点完成。其他帝国可以通过观察局势查看进度；摧毁本次锚点可以阻止召唤。"
 AIO_projection_maintain_ritual:0 "维持召唤仪式"
 AIO_projection_maintain_ritual_desc:0 "仪式以固定速度推进，投入强度已锁定，不提供主动取消或加速。"
 mod_AIO_projection_Aforgomom_max_progress_add:0 "亚弗戈蒙投射所需进度"
 mod_AIO_projection_Aforgomom_max_progress_mult:0 "$mod_AIO_projection_Aforgomom_max_progress_add$"
 AIO_projection_anchor:0 "现实锚点"
 AIO_projection_anchor_plural:0 "现实锚点"
 NAME_AIO_projection_anchor:0 "亚弗戈蒙现实锚点"
 NAME_AIO_projection_anchor_design:0 "亚弗戈蒙现实锚点"
 AIO_PROJECTION_ANCHOR_LANCE:0 "锚定电弧"
 AIO_PROJECTION_ANCHOR_LANCE_DESC:0 "锚点通过现实裂隙释放电弧，攻击接近的舰队。"
 AIO_projection_anchor_reinforced:0 "强化锚点"
 AIO_projection_anchor_overcharged:0 "过载锚点"
 AIO_projection_notice_ack:0 "已知悉。"
 AIO_projection_notice_start.name:0 "亚弗戈蒙：现实锚定"
 AIO_projection_notice_start.desc:0 "§Y[From.GetName]§!在§Y[FromFrom.GetName]§!建立了武装现实锚点。约 §Y24 个月§!后，仪式将在周围星系召唤亚弗戈蒙。\n\n§R锚点与化身敌视所有帝国，包括施法者及其盟友。§!各国均可派舰队摧毁锚点；停战不能阻止召唤。可以在局势日志中查看仪式进度。"
 AIO_projection_notice_abort.name:0 "亚弗戈蒙：仪式中止"
 AIO_projection_notice_abort.desc:0 "§Y[From.GetName]§!在§Y[FromFrom.GetName]§!的召唤仪式失去了锚点，本次召唤已中止。\n\n投入不返还，冷却保留。其他仪式和已经存在的化身不受影响；当地风暴继续运行。"
 AIO_projection_notice_complete.name:0 "亚弗戈蒙：降临"
 AIO_projection_notice_complete.desc:0 "§Y[From.GetName]§!完成了§Y[FromFrom.GetName]§!的召唤仪式。中心及启动时锁定范围内的星系已召唤亚弗戈蒙；已有化身的星系不会重复生成。\n\n§R所有帝国的舰队都可能遭到攻击。§!本次锚点已消散，其他锚点与当地风暴不受影响。"
 AIO_projection_fail.need_mega_04:0 "需要拥有§Y犹格索托斯§!。"
 AIO_projection_fail.cooldown:0 "远程投射仍在冷却中。"
 AIO_projection_fail.exist:0 "本国已经有进行中的远程投射。"
 AIO_projection_observer:0 "亚弗戈蒙警报：[Target.Solar_System.GetName]"
 AIO_projection_observer_type:0 "亚弗戈蒙召唤警报"
 AIO_projection_observer_desc:0 "§Y[Target.Solar_System.GetName]§!的武装现实锚点正在召唤亚弗戈蒙。仪式完成后，中心及 §Y[This.AIO_projection_range] 跳§!内的星系将受到影响。\n\n锚点强度：§Y[This.AIO_projection_strength] 倍§!基础舰体与武器伤害。\n\n§R锚点和化身敌视所有帝国。§!派遣舰队摧毁锚点可以阻止本次召唤。此局势用于观察仪式进度，无法通过方案改变它。"
 AIO_projection_observer_monthly_change_tooltip:0 "每月更新召唤仪式的进度。此警报不会自行推进；仪式达到 24 点时完成。"
 AIO_projection_observe_ritual:0 "监视现实裂隙"
 AIO_projection_observe_ritual_desc:0 "追踪召唤仪式。反制需要派遣舰队摧毁锚点。"
