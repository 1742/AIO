l_simp_chinese:
 concept_AIO_mist_system: "$AIO_mist$"
 concept_AIO_mist_system_desc: "常规维度之外的空间，为逐级升格至§Y$AIO_mega_04$§!的专属巨构提供锚点。通常出现在星图左上方，可经穷极之门抵达。\n§R其他模组提供的地图类型可能使无名之雾无法生成，并阻断后续进度。§!"
 concept_AIO_gate_system: "$AIO_gate$"
 concept_AIO_gate_system_desc: "现实与['concept_AIO_mist_system']之间的门关。所有抵达此处的航路，都朝着一个不属于星图的方向延伸；唯持有银匙者，能够从门内看见彼端。"
 concept_AIO_DAIT: "定向应用无限"
 concept_AIO_DAIT_desc: "通过专属巨构，将对宇宙的理解转化为可以指定目标的干涉。飞升前消耗£AIO_advanced_logic£§Y$AIO_advanced_logic$§!，逐步解锁对星系的改造；飞升后开放全部操作，包括针对国家的思潮反转，且免费、免冷却，仍有生效时间。\n§Y点击屏幕底部的固定悬浮球展开或收起菜单；右上角“×”也可收起。右下角“退出菜单”可关闭菜单与悬浮球，再通过法令重新打开。§!"
