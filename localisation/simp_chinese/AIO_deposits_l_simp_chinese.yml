l_simp_chinese:
 d_AIO_enrich_dark_matter:0 "暗物质沉淀"
 d_AIO_enrich_dark_matter_desc:0 "高维干涉留下的致密引力沉淀。此处的亚原子结构被永久扭曲，源源不断地析出高纯度暗物质。"
 d_AIO_enrich_living_metal:0 "活体金属脉络"
 d_AIO_enrich_living_metal_desc:0 "物理法则松动后析出的自组织流体金属，在天体表面自发聚集成液态矿脉。"
 d_AIO_enrich_nanites:0 "纳米自律集群"
 d_AIO_enrich_nanites_desc:0 "微观因果律重构后的副产物，大量具有自我复制与重构能力的纳米机械聚合于地表之下。"
 d_AIO_enrich_zro:0 "灵能尘埃"
 d_AIO_enrich_zro_desc:0 "现实帷幕撕裂时渗入三维星空的灵能沉淀物，散发着跨越维度的微弱共鸣。"
 d_AIO_enrich_minor_artifacts:0 "时空因果残片"
 d_AIO_enrich_minor_artifacts_desc:0 "平行时空残片跌落于此形成的因果化石，凝固着无数可能被抹去或从未诞生的文明遗物。"
 d_AIO_enrich_astral_threads:0 "多维晶化丝缕"
 d_AIO_enrich_astral_threads_desc:0 "多维空间缝隙渗出的晶化丝缕，静静附着在天体深处，记录着跨维度的时空张力。"
