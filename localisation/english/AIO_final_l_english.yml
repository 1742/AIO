l_english:
 AIO_final_events.201.title:0 "Advent of the Purger"
 AIO_final_events.201.desc:0 "Yog-Sothoth stands complete. Yet, the foundational logic of the cosmos will brook no desecration — the violent spacetime rebound triggered by our extreme warping of reality is incarnating across the stars in its purest destructive form. It is an executioner woven from absolute physical law and causal correction; primitive species tremble and name it 'Aforgomon'.\n\nIt trails our violations across reality, and its advent shall extinguish all stars in its path. After five advents, its gaze will fix unblinkingly upon the Nameless Mist. Investigate the remnants of systems erased by its descent, reverse-engineer its patterns of arrival — even should this entity be the executing avatar of the cosmic will itself, we shall induce, constrain, and strike it down with our own hands."
 AIO_final_events.201.option:0 "Witness its advent."
 AIO_final_events.202.title:0 "The Advent Cycle"
 AIO_final_events.202.desc:0 "Remnants from the first system expunged by Aforgomon confirm our hypothesis: as the universe's immune response, its descent is self-accelerating — the deeper the wounds torn into reality, the shorter the interval between each arrival.\n\nThe location situation has tracked its current destination and deadline. This is a wager against the pace of sacred cleansing."
 AIO_final_events.202.option:0 "Record the trajectory of descent."
 AIO_final_events.unlock_location:0 "1 remnant investigated: advent cycle mastered."
 AIO_final_events.203.title:0 "Causal Induction Theory"
 AIO_final_events.203.desc:0 "Data harvested from two remnants grants us insight into Aforgomon's arrival bias. Since it descends only where causal anomalies peak in severity, we can utilize Yog-Sothoth to fabricate a far deadlier 'logical rupture point' in a designated external system.\n\nDispatching a science ship to conduct field engineering will allow us to manipulate the descending coordinates of this arbiter. The existing timer will not reset."
 AIO_final_events.203.option:0 "Tune the induction beacon."
 AIO_final_events.unlock_induction:0 "2 remnants investigated: advent induction unlocked."
 AIO_final_events.204.title:0 "Topological Constraint Array"
 AIO_final_events.204.desc:0 "Thorough surveying across three erased systems completes the final chapter of its dissection. We are no longer merely diverting its descent — utilizing dark matter phase generators, we shall deploy a hyperdimensional constraint field around the target system.\n\nWhen Aforgomon descends anew, its seemingly invincible form will be forcefully pinned onto three-dimensional coordinates. Within its residence window, our fleets shall strike it down once and for all!"
 AIO_final_events.204.option:0 "Prepare the execution."
 AIO_final_events.unlock_constraint:0 "3 remnants investigated: advent constraint project unlocked."
 AIO_final_events.205.title:0 "Cross-section Collapse"
 AIO_final_events.205.desc:0 "We miscalculated the convergence velocity of the purge wave. Unchecked, the wrath of corrective law poured directly into the Nameless Mist, annihilating the Gate of Gates alongside the dimensional bubble we so painstakingly forged.\n\nThe sanctuary is no more. Surviving remnants have been violently cast back into the scarred three-dimensional universe they once sought to transcend; the grand monuments of our past apotheosis reduced to irrecoverable ash."
 AIO_final_main_situation:0 "Deconstructing Aforgomon"
 AIO_final_main_situation_type:0 "Purge Deconstruction Situation"
 AIO_final_main_situation_desc:0 "Remnants investigated: §Y[Owner.AIO_final_research]§!. Investigate 1 / 2 / 3 distinct remnants to successively master the cycle, induction, and constraint. Each site counts once.\n\nThe constraint project also performs induction; upon completing research, the descending entity must still be defeated in an external system in time to ascend and unlock all Apply Infinity operations."
 AIO_final_main_situation_monthly_change_tooltip:0 "Research does not advance over time. Progress increases by 1 each time a science ship completes a field project at a distinct remnant site."
 AIO_final_approach:0 "Investigate Remnants"
 AIO_final_research_stage_1:0 "Analyze the Cycle"
 AIO_final_research_stage_2:0 "Induce the Advent"
 AIO_final_research_stage_3:0 "Constrain the Advent"
 AIO_final_location_situation:0 "Advent of Aforgomon: [Target.GetName]"
 AIO_final_location_situation_type:0 "Cleansing Advent Situation"
 AIO_final_location_situation_desc:0 "Destination: §Y[Target.GetName]§!. Omens last §Y[Owner.AIO_final_wait] days§!: initially 300, reduced by 60 each round to a minimum of 180. Unbound manifestations last 180 days; constrained combat lasts 360 days.\n\nInduction/constraint requires 60 days and must finish before manifestation. Redirecting does not reset the timer. Reaching the Nameless Mist causes immediate failure; an expired external manifestation erases the system."
 AIO_final_location_situation_monthly_change_tooltip:0 "Advances by 30 points each month. Progress bars indicate omen and advent residence periods."
 AIO_final_location_approach:0 "Prepare a Response"
 AIO_final_omen_stage:0 "Advent Omen"
 AIO_final_manifestation_stage:0 "Advent Residence"
 AIO_final_location_started:0 "A destination has been identified for Aforgomon’s next advent."
 AIO_final_location_completed:0 "Aforgomon’s advent residence has concluded, completely erasing the local star system."
 AIO_final_location_arrived:0 "Aforgomon has descended upon the target system; the residence period has begun."
 AIO_FINAL_RESEARCH:0 "Survey Advent Erasure Remnants"
 AIO_FINAL_RESEARCH_DESC:0 "Dispatch a science ship with a scientist for 60 days of field research, analyzing the void fracture left by Aforgomon's erasure. Each distinct remnant provides 1 endgame research progress. Expires after 1000 days and is not automatically restored upon cancellation or failure."
 AIO_FINAL_INDUCTION:0 "Induce the Advent of Aforgomon"
 AIO_FINAL_INDUCTION_DESC:0 "Dispatch a science ship for 60 days of field research, generating severe causal distortion in the target system to alter the advent coordinates. Timer does not reset. Incomplete projects are cancelled once the advent begins. Expires after 1000 days."
 AIO_FINAL_CONSTRAINT:0 "Induce and Constrain the Advent"
 AIO_FINAL_CONSTRAINT_DESC:0 "Conduct 60 days of field research to redirect the advent destination while erecting dark matter phase constraint rings to lock the descending entity in local coordinates. Timer does not reset; the entity must still be defeated during its residence window. Expires after 1000 days."
 AIO_final_induction_action:0 "Induce Advent of Aforgomon"
 AIO_final_induction_activity:0 "Inducing Advent at $NAME$"
 AIO_final_induction_action_tooltip:0 "Choose an external system and pay £AIO_advanced_logic£ §Y10,000§! to launch a 60-day science ship project. Completion redirects the advent destination without resetting the timer. No refund on cancellation."
 AIO_final_constraint_action:0 "Induce and Constrain the Advent"
 AIO_final_constraint_activity:0 "Inducing and Constraining Advent at $NAME$"
 AIO_final_constraint_action_tooltip:0 "Choose an external system and pay £AIO_advanced_logic£ §Y10,000§! and £sr_dark_matter£ §Y2,000§! for a 60-day field project. Concurrently redirects and prepares the constraint without resetting the timer. No refund on cancellation."
 AIO_final_fail.target:0 "Choose an external system with a star that has not been erased and has no active manifestation. The Nameless Mist and the Ultimate Gate are excluded."
 AIO_final_fail.unavailable:0 "Requires 10,000 Advanced Logic, an active omen period, no pending induction or constraint project, and no completed induction this round."
 mod_AIO_final_location_situation_max_progress_add:0 "Aforgomon Pursuit Duration"
 mod_AIO_final_location_situation_max_progress_mult:0 "$mod_AIO_final_location_situation_max_progress_add$"
 AIO_final_main_situation_ready_desc:0 "Constraint research is complete. Select an external system through Yog-Sothoth, complete the combined constraint and induction project, then destroy the descending entity before its residence window expires. Research alone does not end the pursuit."

 AIO_final_location_complete_tooltip:0 "When residence ends at an external destination, Aforgomon disappears and erases the system, leaving remnants for science ships to investigate before the next advent begins. An advent at the Nameless Mist ends in failure."
 AIO_final_location_approach_desc:0 "Await the current advent. Induction or constraint projects must finish before manifestation; a constrained entity must be defeated during its residence window."
