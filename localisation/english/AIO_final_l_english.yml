l_english:
 AIO_final_events.201.title:0 "Signs of Pursuit"
 AIO_final_events.201.desc:0 "Yog-Sothoth is complete. Aforgomon is following the traces of our changes to reality. After four external manifestations, it will pursue the Nameless Mist. Investigate the remnants to learn how to redirect and constrain it."
 AIO_final_events.201.option:0 "Begin observations."
 AIO_final_events.202.title:0 "The Manifestation Cycle"
 AIO_final_events.202.desc:0 "The first remnant reveals a repeating cycle. Each manifestation shortens the next waiting period. The location situation tracks the current destination and deadline."
 AIO_final_events.202.option:0 "Continue the research."
 AIO_final_events.unlock_location:0 "1 remnant investigated: manifestation cycle understood."
 AIO_final_events.203.title:0 "Redirecting the Manifestation"
 AIO_final_events.203.desc:0 "Data from three remnants lets us redirect a manifestation. Select an external system through Yog-Sothoth, then complete its science ship project. The current countdown will not reset."
 AIO_final_events.203.option:0 "Prepare the induction."
 AIO_final_events.unlock_induction:0 "3 remnants investigated: induction unlocked."
 AIO_final_events.204.title:0 "Constraining the Manifestation"
 AIO_final_events.204.desc:0 "Seven remnants have been investigated. The constraint project now replaces induction: completion both redirects this round and prepares the constraint. Destroy the manifestation before its residence period ends."
 AIO_final_events.204.option:0 "Prepare the constraint."
 AIO_final_events.unlock_constraint:0 "7 remnants investigated: combined constraint and induction unlocked."
 AIO_final_events.205.title:0 "The End of the Nameless Mist"
 AIO_final_events.205.desc:0 "We failed to stop Aforgomon from reaching our home. The Nameless Mist and the Ultimate Gate have been destroyed. Research and pursuit have ended; any surviving colonies must continue in the external universe."
 AIO_final_main_situation:0 "Aforgomon Research"
 AIO_final_main_situation_type:0 "Aforgomon Research"
 AIO_final_main_situation_desc:0 "Remnants investigated: §Y[Owner.AIO_final_research]§!. Investigate 1 / 3 / 7 distinct remnants to understand the cycle, induce and constrain manifestations. Each site counts once.\n\nConstraint also performs induction. Complete the external battle before its deadline to ascend and unlock remote projection."
 AIO_final_main_situation_monthly_change_tooltip:0 "Research does not advance with time. Each distinct remnant investigated by a science ship adds 1 progress."
 AIO_final_approach:0 "Investigate Remnants"
 AIO_final_research_stage_1:0 "Identify the Cycle"
 AIO_final_research_stage_2:0 "Research Induction"
 AIO_final_research_stage_3:0 "Research Constraint"
 AIO_final_location_situation:0 "Aforgomon Pursuit: [Target.GetName]"
 AIO_final_location_situation_type:0 "Aforgomon Pursuit"
 AIO_final_location_situation_desc:0 "Destination: §Y[Target.GetName]§!. This round has §Y[Owner.AIO_final_wait] days§! of omens followed by §Y360 days§! of manifestation. The omen period shortens by 200 days per round, to a minimum of 200.\n\nFinish induction or constraint before the omen period ends. Selecting or researching a project does not change the original destination. Completion changes the destination without resetting the timer.\n\n§RArrival at the Nameless Mist causes immediate failure. An external manifestation erases the system when its residence period ends.§!"
 AIO_final_location_situation_monthly_change_tooltip:0 "Advances by 30 each month. The bar tracks the omen and residence periods."
 AIO_final_location_approach:0 "Prepare a Response"
 AIO_final_omen_stage:0 "Omens"
 AIO_final_manifestation_stage:0 "Manifestation"
 AIO_final_location_started:0 "A destination has been identified for Aforgomon’s next manifestation."
 AIO_final_location_completed:0 "Aforgomon’s manifestation has ended, erasing the system."
 AIO_FINAL_RESEARCH:0 "Investigate Erasure Remnants"
 AIO_FINAL_RESEARCH_DESC:0 "Send a science ship with a scientist for 100 days of research. Each distinct remnant adds 1 endgame research progress. The project expires after 1000 days and is not automatically restored after failure or cancellation."
 AIO_FINAL_INDUCTION:0 "Induce Aforgomon"
 AIO_FINAL_INDUCTION_DESC:0 "Complete 100 days of field research before this round manifests to redirect it without changing the timer. Unfinished projects are cancelled when manifestation begins. The project expires after 1000 days and is not automatically restored after failure or cancellation."
 AIO_FINAL_CONSTRAINT:0 "Induce and Constrain Aforgomon"
 AIO_FINAL_CONSTRAINT_DESC:0 "Complete 100 days of field research to both redirect this round and prepare its constraint. The timer is unchanged; defeat the manifestation before its residence period ends. The project expires after 1000 days and is not automatically restored after failure or cancellation."
 AIO_final_induction_action:0 "Induce Aforgomon"
 AIO_final_induction_activity:0 "Induce at $NAME$"
 AIO_final_induction_action_tooltip:0 "Choose an external system and pay £AIO_advanced_logic£ §Y10,000§! for a 100-day science ship project. Completion redirects this round without resetting its timer. No refund on cancellation."
 AIO_final_constraint_action:0 "Induce and Constrain Aforgomon"
 AIO_final_constraint_activity:0 "Induce and constrain at $NAME$"
 AIO_final_constraint_action_tooltip:0 "Pay £AIO_advanced_logic£ §Y10,000§! and £sr_dark_matter£ §Y2,000§! for a 100-day field project. Completion both redirects and prepares the constraint for this round without resetting its timer. No refund on cancellation."
 AIO_final_fail.target:0 "Choose an external system with a star that has not been erased and has no manifestation. The Nameless Mist and the Ultimate Gate are excluded."
 AIO_final_fail.unavailable:0 "Requires 10,000 Advanced Logic, an active omen period, no pending induction or constraint project, and no completed induction this round."
 AIO_projection_fail.need_final:0 "Complete the Aforgomon endgame first."
 mod_AIO_final_location_situation_max_progress_add:0 "Aforgomon Pursuit Duration"
 mod_AIO_final_location_situation_max_progress_mult:0 "$mod_AIO_final_location_situation_max_progress_add$"
 AIO_final_main_situation_ready_desc:0 "Constraint research is complete. Select an external system through Yog-Sothoth, complete its combined constraint and induction project, then destroy the manifestation before this round expires. Research alone does not end the pursuit."
