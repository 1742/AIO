l_english:
 AIO_final_events.201.title:0 "Advent of the Purger"
 AIO_final_events.201.desc:0 "Yog-Sothoth stands complete. Yet, the foundational logic of the cosmos will brook no desecration — the violent spacetime rebound triggered by our extreme warping of reality is incarnating across the stars in its purest destructive form. It is an executioner woven from absolute physical law and causal correction; primitive species tremble and name it 'Aforgomon'.\n\nIt trails our violations across reality, and its advent shall extinguish all stars in its path. The first five advents favor external systems; thereafter, its gaze will fix unblinkingly upon the Nameless Mist. If no eligible external destination remains, the reckoning will reach it sooner. Investigate the remnants of systems erased by its descent, reverse-engineer its patterns of arrival — even should this entity be the executing avatar of the cosmic will itself, we shall induce, constrain, and strike it down with our own hands."
 AIO_final_events.201.option:0 "Witness its advent."
 AIO_final_events.202.title:0 "The Advent Cycle"
 AIO_final_events.202.desc:0 "Remnants from the first system expunged by Aforgomon confirm our hypothesis: as the universe's immune response, its descent is self-accelerating — the deeper the wounds torn into reality, the shorter the interval between each arrival.\n\nThe location situation has tracked its current destination and deadline. This is a wager against the pace of sacred cleansing."
 AIO_final_events.202.option:0 "Record the trajectory of descent."
 AIO_final_events.unlock_location:0 "1 remnant investigated: advent cycle mastered."
 AIO_final_events.203.title:0 "Causal Induction Theory"
 AIO_final_events.203.desc:0 "Data harvested from two remnants grants us insight into Aforgomon's arrival bias. Since it descends only where causal anomalies peak in severity, we can utilize Yog-Sothoth to fabricate a far deadlier 'logical rupture point' in a designated external system.\n\nDispatching a science ship to conduct field engineering will allow us to manipulate the descending coordinates of this arbiter. The existing timer will not reset."
 AIO_final_events.203.option:0 "Tune the induction beacon."
 AIO_final_events.unlock_induction:0 "2 remnants investigated: advent induction unlocked."
 AIO_final_events.204.title:0 "Topological Constraint Array"
 AIO_final_events.204.desc:0 "Thorough surveying across three erased systems completes the final chapter of its dissection. We are no longer merely diverting its descent — utilizing dark matter phase generators, we shall deploy a hyperdimensional constraint field around the target system.\n\nWhen Aforgomon descends anew, its seemingly invincible form will be forcefully pinned onto three-dimensional coordinates. Within its residence window, our fleets shall strike it down once and for all!"
 AIO_final_events.204.option:0 "Prepare the execution."
 AIO_final_events.unlock_constraint:0 "3 remnants investigated: advent constraint project unlocked."
 AIO_final_events.205.title:0 "Cross-section Collapse"
 AIO_final_events.205.desc:0 "We miscalculated the convergence velocity of the purge wave. Unchecked, the wrath of corrective law poured directly into the Nameless Mist, annihilating Yog-Sothoth alongside the dimensional bubble we so painstakingly forged.\n\nThe sanctuary is no more. We can still mark the coordinates where it once stood, but can no longer reach that spacetime beyond reality. Our former wonders have left only an irretrievable blank."
 AIO_final_main_situation:0 "Deconstructing Aforgomon"
 AIO_final_main_situation_type:0 "Endgame Research"
 AIO_final_main_situation_desc:0 "Erased systems still leave echoes in gravity and causality. Remnants investigated: §Y[Owner.AIO_final_research]§!. Investigate 1 / 2 / 3 distinct remnants to understand the advent cycle, induction and constraint in turn. Each site counts once.\n\nThe constraint project also performs induction. Research must be followed by constraining a manifestation in an external system and defeating it before its stay expires. Only then can we choose ascension and gain full access to Apply Infinity."
 AIO_final_main_situation_monthly_change_tooltip:0 "Research does not advance over time. Progress increases by 1 each time a science ship completes a field project at a distinct remnant site."
 AIO_final_approach:0 "Investigate Remnants"
 AIO_final_research_stage_1:0 "Analyze the Cycle"
 AIO_final_research_stage_2:0 "Induce the Advent"
 AIO_final_research_stage_3:0 "Constrain the Advent"
 AIO_final_location_situation:0 "Advent of Aforgomon: [Target.GetName]"
 AIO_final_location_situation_type:0 "Advent of Correction"
 AIO_final_location_situation_desc:0 "The correction is converging on §Y[Target.GetName]§!. This round’s omens last §Y[Owner.AIO_final_wait] days§!: 300 initially, decreasing by 60 each round to a minimum of 180. Unconstrained manifestations remain for 180 days; constrained manifestations allow 360 days for battle.\n\nInduction and constraint projects each take 60 days and must finish before manifestation. Changing the destination does not reset the timer. Arrival at the Nameless Mist causes immediate endgame failure; an expired stay in an external system erases that system and starts the next advent."
 AIO_final_location_situation_monthly_change_tooltip:0 "Advances by 30 points each month. Progress bars indicate omen and advent residence periods."
 AIO_final_location_approach:0 "Prepare a Response"
 AIO_final_omen_stage:0 "Advent Omen"
 AIO_final_manifestation_stage:0 "Advent Residence"
 AIO_final_location_started:0 "A destination has been identified for Aforgomon’s next advent."
 AIO_final_location_completed:0 "Aforgomon’s advent residence has concluded, completely erasing the local star system."
 AIO_final_location_arrived:0 "Aforgomon has descended upon the target system; the residence period has begun."
 AIO_FINAL_RESEARCH:0 "Survey Advent Erasure Remnants"
 AIO_FINAL_RESEARCH_DESC:0 "The system is gone, but the echoes of its correction have yet to fade. Dispatch a science ship with a scientist for 60 days of field research to reconstruct the advent from gravitational traces in the void.\n\nEach distinct remnant provides 1 point of endgame research progress. The project expires after 1000 days and is not automatically restored after failure or cancellation."
 AIO_FINAL_INDUCTION:0 "Induce the Advent of Aforgomon"
 AIO_FINAL_INDUCTION_DESC:0 "Create a causal wound deep enough to draw the correction into the selected system. Dispatch a science ship with a scientist; completing 60 days of field research redirects this round’s advent.\n\nThe timer does not reset. Unfinished projects are cancelled when manifestation begins. The project expires after 1000 days, is not automatically restored after failure or cancellation, and does not refund the paid cost."
 AIO_FINAL_CONSTRAINT:0 "Induce and Constrain the Advent"
 AIO_FINAL_CONSTRAINT_DESC:0 "Build a dark matter constraint field around the causal wound, giving the approaching correction a body that can be destroyed. Dispatch a science ship with a scientist for 60 days of field research to redirect this round’s advent and constrain its manifestation.\n\nThe timer does not reset. Unfinished projects are cancelled when manifestation begins. The constrained avatar must still be defeated within its 360-day stay. The project expires after 1000 days, is not automatically restored after failure or cancellation, and does not refund the paid cost."
 AIO_final_induction_action:0 "Induce Advent of Aforgomon"
 AIO_final_induction_action_tooltip:0 "Select an eligible external system and pay £AIO_advanced_logic£ §Y10,000§! to start a 60-day field project requiring a science ship with a scientist. It must finish before manifestation; completion redirects this round’s advent without resetting the timer. No refund on cancellation."
 AIO_final_constraint_action:0 "Induce and Constrain the Advent"
 AIO_final_constraint_action_tooltip:0 "Select an eligible external system and pay £AIO_advanced_logic£ §Y10,000§! and £sr_dark_matter£ §Y2,000§! to start a 60-day field project requiring a science ship with a scientist. It must finish before manifestation and performs both induction and constraint without resetting the timer. No refund on cancellation."
 AIO_final_fail.target:0 "Choose an unerased external system with a star and no manifestation or conflicting operation. The Nameless Mist, the Ultimate Gate, crisis megastructure systems and protected special targets are excluded."
 AIO_final_fail.unavailable:0 "Requires 10,000 Advanced Logic, an active omen period, no pending induction or constraint project, and no completed induction this round."
 mod_AIO_final_location_situation_max_progress_add:0 "Aforgomon Pursuit Duration"
 mod_AIO_final_location_situation_max_progress_mult:0 "$mod_AIO_final_location_situation_max_progress_add$"
 AIO_final_main_situation_ready_desc:0 "We know how to hold the correction where our weapons can reach it. Select an eligible external system in the Apply Infinity menu, complete the combined induction and constraint project, then destroy the manifestation within its 360-day stay. Research alone will not end the reckoning."

 AIO_final_location_complete_tooltip:0 "When residence ends at an external destination, Aforgomon disappears and erases the system, leaving remnants for science ships to investigate before the next advent begins. An advent at the Nameless Mist ends in failure."
 AIO_final_location_approach_desc:0 "Await the current advent. Induction or constraint projects must finish before manifestation; a constrained entity must be defeated during its residence window."
