 #region building

 building_AIO_reality_proof_facility: "Reality Proof Facility"
 building_AIO_reality_proof_facility_desc: "Researchers test how readily local reality can be rewritten."
 building_AIO_reality_proof_facility_tt: "Each 100 £job_physicist£ §Y$job_AIO_proof_researcher$§! add §G0.5§! monthly intensity to the local Reality Interference Field, counting at most 1,000 per system."

 #endregion


 #region job

 job_AIO_proof_researcher: "Reality Prover"
 job_AIO_proof_researcher_plural: "Reality Provers"
 job_AIO_proof_researcher_desc: "Demonstrates that familiar physical laws are merely one possible solution."
 mod_job_AIO_proof_researcher_add: "£job_physicist£ $job_AIO_proof_researcher$ Jobs"
 job_AIO_proof_drone: "Reality Proof Subroutine"
 job_AIO_proof_drone_plural: "Reality Proof Subroutines"
 job_AIO_proof_drone_desc: "Continuously validates and revises the laws governing local reality."
 mod_job_AIO_proof_drone_add: "£job_physicist£ $job_AIO_proof_drone$ Jobs"

 #endregion



 #region megastructure

 AIO_reality_interferometer: "Reality Interferometer"
 AIO_reality_interferometer_plural: "$AIO_reality_interferometer$"
 AIO_reality_interferometer_DESC: "A colossal apparatus that uses transcendent logic to force local reality toward a predetermined conclusion. When activated, it creates and intensifies a Reality Interference Field, replacing any Psionic Aura already present."
 AIO_reality_interferometer_MEGASTRUCTURE_DETAILS: "Construction activates a uniform source under the empire interference doctrine. Effects stack from up to three sources covering a system; effects on our assets also scale with aura level. Only one may be built in each system, and an empire may initially maintain up to five."
 AIO_requires_no_existing_reality_interferometer: "$TRIGGER_FAIL$A $AIO_reality_interferometer$ already exists in this system."
 AIO_requires_reality_interferometer_capacity: "$TRIGGER_FAIL$We can maintain no more than §Y5§! $AIO_reality_interferometer_plural$."

 #endregion


 #region modifier

 mod_AIO_interferometer_range: "Interferometer Effect Range"

 #endregion


 #region tooltips

 AIO_interferometer_completed: "The $AIO_reality_interferometer$ in the §H[from.GetName]§! system has completed."

 #endregion


 #region policy

 policy_policy_AIO_interference_doctrine: "Reality Interference Doctrine"
 policy_policy_AIO_interference_doctrine_desc: "Sets the combined effects produced by our Reality Interference Fields. Changing doctrine alters benefits, not field coverage or intensity."
 policy_AIO_interference_balanced: "Balanced Interference"
 policy_AIO_interference_energy: "Zero Point Energy"
 policy_AIO_interference_ecology: "Ecology Evolution"
 policy_AIO_interference_industry: "Refine Manufacture"
 policy_AIO_interference_metric: "Metric Engineering"

 AIO_interference_energy_backlash: "Zero Point Grid Backlash: [Target.GetName]"
 AIO_interference_energy_backlash_type: "Zero Point Grid Backlash"
 AIO_interference_energy_backlash_desc: "The energy network in [Target.GetName] is losing synchronization with its reality field. The field continues to grow separately; this situation tracks one accident. At the left edge the experiment is cancelled, while the right edge completes it. Either ending resets the field to the beginning of level 2."
 AIO_interference_energy_backlash_monthly_change_tooltip: "With Zero Point Energy active, maintenance and reversal advance by the field's theoretical monthly growth: 1 plus connected sources and local employed Provers, doubled by the current policy switch acceleration. Blockade withdraws 12 monthly; another policy withdraws 8 monthly. Residual bonuses do not count as the original policy."
 AIO_energy_stage_one: "Grid Desynchronization"
 AIO_energy_stage_one_desc: "Initial oscillations. Crossing 35 causes a one time energy loss."
 AIO_energy_stage_two: "Feedback Surges"
 AIO_energy_stage_two_desc: "At 35, grid repair costs 500 energy, or 250 under blockade. The loss is not refunded if progress falls."
 AIO_energy_stage_three: "Cascade Threshold"
 AIO_energy_stage_three_desc: "At 70, lose 1,500 energy, or 750 under blockade. Owned colonies in this system suffer energy and physics disruption until the accident ends (at most five years)."
 AIO_energy_maintain: "Maintain Experiment"
 AIO_energy_maintain_desc: "Costs 50 energy and 20 physics research monthly. Advances at theoretical field growth. Each 100 employed Provers nationwide contribute 1 research point monthly, shared evenly among active experiments and reversals (maximum 20 per situation)."
 AIO_energy_blockade: "Emergency Blockade"
 AIO_energy_blockade_desc: "Costs 150 energy and 25 alloys monthly. Withdraws 12 progress monthly and halves one time energy losses. This cancels the experiment at the left edge and earns no research or reversal points."
 AIO_energy_reverse: "Reverse the Backlash"
 AIO_energy_reverse_desc: "Requires the third crisis tier's Silver Key progression. Costs 100 Transcendent Logic and 100 energy monthly. Advances at theoretical field growth. Shared national Provers accumulate reversal points, up to 20 monthly per situation. At completion, 50/150/300 points unlock permanent +5/+10/+20% energy job output, replacing earlier tiers."
 AIO_energy_progress_active: "Connected field: theoretical growth"
 AIO_energy_progress_blockade: "Emergency blockade: -12"
 AIO_energy_progress_policy_mismatch: "Zero Point Energy inactive or field disconnected: -8"
 AIO_energy_accidence_planet: "Grid Instability"
 AIO_energy_accidence_planet_desc: "The local power system remains damaged after a cascade surge."
 AIO_energy_reversal_1: "Harnessed Backlash I"
 AIO_energy_reversal_1_desc: "Reversed energy feedback improves generator work."
 AIO_energy_reversal_2: "Harnessed Backlash II"
 AIO_energy_reversal_2_desc: "Reversed energy feedback improves generator work."
 AIO_energy_reversal_3: "Harnessed Backlash III"
 AIO_energy_reversal_3_desc: "Reversed energy feedback improves generator work."
 AIO_interference_events.310.name: "Grid Frequency Divergence"
 AIO_interference_events.310.desc: "The [Target.GetName] field has reached critical intensity. Its zero point grid now oscillates between incompatible energy states. Our response will decide whether we stop the experiment, study it, or reverse the feedback."
 AIO_interference_events.310.option: "Open the accident protocol."
 AIO_interference_events.311.name: "The First Surge"
 AIO_interference_events.311.desc: "The grid has discharged stored energy. Emergency blockade halves the immediate loss; the surge itself has already happened."
 AIO_interference_events.311.option: "Record the damage."
 AIO_interference_events.312.name: "Cascade Through the Grid"
 AIO_interference_events.312.desc: "A second surge damages energy systems on our colonies in [Target.GetName]. The disruption lasts until the accident ends, at most five years; the energy already lost cannot be recovered by reducing progress."
 AIO_interference_events.312.option: "Keep the grid isolated."
 AIO_interference_events.313.name: "The Experiment Concludes"
 AIO_interference_events.313.desc: "The cascade has run its course. Physics research and Transcendent Logic depend on research points accumulated month by month: at 50/150/300 points, cumulative awards are 500/2,000/5,000 physics and 100/400/1,000 Logic. Reversal points at the same thresholds grant cumulative 1,000/4,000/10,000 energy and the strongest permanent generator output tier reached. The field returns to the start of level 2."
 AIO_interference_events.313.option: "Archive the findings."
 AIO_interference_events.314.name: "The Experiment Is Cancelled"
 AIO_interference_events.314.desc: "The grid settles before the cascade can complete. Accumulated research is lost and spent energy is not refunded. Emergency grid penalties are cleared. The field returns to the start of level 2."
 AIO_interference_events.314.option: "Shut it down."

 #endregion
