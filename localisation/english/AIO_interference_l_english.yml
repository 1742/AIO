 #region psionic auras

 AIO_reality_interference_aura: "Reality Interference Field"
 AIO_reality_interference_aura_level_1_tt: "§HMild Reality Distortion§!"
 AIO_reality_interference_aura_level_2_tt: "§HSignificant Reality Distortion§!"
 AIO_reality_interference_aura_level_3_tt: "§RCritical Reality Distortion§!"
 AIO_interference_source_intensity_desc: "Reality Interferometer"
 AIO_interference_proof_intensity_desc: "Employed Reality Provers"
 AIO_interference_disconnected_desc: "Disconnected from Reality Interference Source"

 #endregion


 #region building

 building_AIO_reality_proof_facility: "Reality Proof Facility"
 building_AIO_reality_proof_facility_desc: "Researchers test how readily local reality can be rewritten."
 building_AIO_reality_proof_facility_tt: "Each 100 £job_physicist£ §Y$job_AIO_proof_researcher$§! add §G0.5§! monthly intensity to the local Reality Interference Field, counting at most 1,000 per system."

 #endregion


 #region job

 job_AIO_proof_researcher: "Reality Prover"
 job_AIO_proof_researcher_plural: "Reality Provers"
 job_AIO_proof_researcher_desc: "Demonstrates that familiar physical laws are merely one possible solution."
 mod_job_AIO_proof_researcher_add: "£job_physicist£ $job_AIO_proof_researcher$ Jobs"
 job_AIO_proof_drone: "Reality Proof Subroutine"
 job_AIO_proof_drone_plural: "Reality Proof Subroutines"
 job_AIO_proof_drone_desc: "Continuously validates and revises the laws governing local reality."
 mod_job_AIO_proof_drone_add: "£job_physicist£ $job_AIO_proof_drone$ Jobs"

 #endregion



 #region megastructure

 AIO_reality_interferometer: "Reality Interferometer"
 AIO_reality_interferometer_plural: "$AIO_reality_interferometer$"
 AIO_reality_interferometer_DESC: "A colossal apparatus that uses transcendent logic to force local reality toward a predetermined conclusion. When activated, it creates and intensifies a Reality Interference Field, replacing any Psionic Aura already present."
 AIO_reality_interferometer_MEGASTRUCTURE_DETAILS: "Construction activates a uniform source under the empire interference doctrine. Effects stack from up to three sources covering a system; effects on our assets also scale with aura level. Only one may be built in each system, and an empire may initially maintain up to five."
 AIO_requires_no_existing_reality_interferometer: "$TRIGGER_FAIL$A $AIO_reality_interferometer$ already exists in this system."
 AIO_requires_reality_interferometer_capacity: "$TRIGGER_FAIL$We can maintain no more than §Y5§! $AIO_reality_interferometer_plural$."

 #endregion


 #region modifier

 mod_AIO_interferometer_range: "Interferometer Effect Range"

 #endregion


 #region tooltips

 AIO_interferometer_completed: "The $AIO_reality_interferometer$ in the §H[from.GetName]§! system has completed."

 #endregion


 #region policy

 policy_policy_AIO_interference_doctrine: "Reality Interference Doctrine"
 policy_policy_AIO_interference_doctrine_desc: "Sets the combined effects produced by our Reality Interference Fields. Changing doctrine alters benefits, not field coverage or intensity."
 policy_AIO_interference_balanced: "Balanced Interference"
 policy_AIO_interference_energy: "Zero Point Energy"
 policy_AIO_interference_ecology: "Ecological Evolution"
 policy_AIO_interference_industry: "Industrial Refining"
 policy_AIO_interference_metric: "Metric Engineering"

 #endregion


 #region interference accident (shared text)

 AIO_interference_accidence_maintain: "Maintain Experiment"
 AIO_interference_accidence_blockade: "Emergency Blockade"
 AIO_interference_accidence_reverse: "Reverse the Backlash"
 AIO_interference_accidence_progress_active: "Reality Interference Field"
 AIO_interference_accidence_progress_blockade: "$AIO_interference_accidence_blockade$"
 AIO_interference_accidence_progress_policy_mismatch: "Interference direction changed"
 AIO_interference_accidence_progress_disconnect: "Cut off from interference source"
 AIO_interference_accidence_backlash_monthly_change_tooltip: "Taking an active response means the situation is shaped by the §Ynumber of Reality Interference Field sources§! and by our §IProvers§!."
 AIO_interference_accidence_conclusion.no_reverse: "The field's grip on reality weakened after this burst. The universe seems to destabilise badly when a contradiction peaks, then snaps back into shape - it always drifts toward a steady state."
 AIO_interference_accidence_conclusion.reverse: "This is unlike our earlier experiments: the accident site now holds a different set of cosmic constants from everything around it, and our changes appear to be lasting."
 AIO_interference_accidence_option.abort: "A pity."
 AIO_interference_accidence_option.collapse: "A necessary sacrifice."
 AIO_interference_accidence_option.reverse: "We understand the universe a little better."

 #endregion


 #region backlash opinion and notice


 opinion_AIO_interference_accident: "Messing with reality"
 AIO_interference_notice.option: "Report received."
 AIO_interference_notice.collapse_option: "We will remember this."
 AIO_interference_events.410.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: Balanced interference raises several resource readings together, drawing supply and maintenance cycles into the same period. Colonies, if present, also gain output."
 AIO_interference_events.411.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: The first disruption desynchronizes power, processing, and transit. Any colonies in the system suffer damage."
 AIO_interference_events.412.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: Production cycles converge again, disrupting trade and construction. Any colonies in the system suffer further damage."
 AIO_interference_events.413.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: The experimenter stabilizes the balanced field, retaining its unusual gains while ending the cascading disruption."
 AIO_interference_events.414.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: Supply, power, and maintenance systems fail in succession, leaving long-lasting waste and production obstacles. Any colonies suffer severe damage."
 AIO_interference_events.415.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: The balanced field is weakening and resource readings are separating again, though earlier losses remain."
 AIO_interference_events.420.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: Zero-point frequencies diverge, desynchronizing orbital and shipboard power. Colonial grids, where present, also come under pressure."
 AIO_interference_events.421.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: The first feedback pulse crosses the system, briefly disrupting shipboard power and striking colonial circuits where present."
 AIO_interference_events.422.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: A second surge reaches several areas through the field. Ship weapons gain power while shields falter; any colonies suffer further damage."
 AIO_interference_events.423.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: The experimenter recalibrates the zero-point waveform, controlling the surges while retaining the abnormal energy output."
 AIO_interference_events.424.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: Cascading surges leave a persistent field of orbital discharges. Power remains unstable for years, and any colonies suffer severe damage."
 AIO_interference_events.425.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: The zero-point waveform is settling and the cascading surges have stopped, though residual discharges still need monitoring."
 AIO_interference_events.430.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: Ecological interference spreads the local biome rapidly, pushing spore and root readings beyond safe limits. Any colonies also gain output."
 AIO_interference_events.431.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: The first growth wave spreads roots and spores through more territory. Farms and cultivation chambers on any colonies are struck."
 AIO_interference_events.432.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: The biome spreads into new regions and occupies usable ground. Any colonies suffer further damage."
 AIO_interference_events.433.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: The experimenter stabilizes the growth cycle. The anomalous biome stays within its boundary, allowing cleanup to begin."
 AIO_interference_events.434.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: Overcrowded biomes exhaust their nutrients and die back, leaving roots and decay that will obstruct development for years. Any colonies suffer severe damage."
 AIO_interference_events.435.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: The ecological field is weakening and abnormal growth has slowed. Dense vegetation still needs clearing."
 AIO_interference_events.440.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: Ore separation and material phase changes accelerate as anomalous heat nears safe limits. Mines and refineries on any colonies gain output."
 AIO_interference_events.441.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: The first overheating episode produces molten ejecta and broken ore. Furnaces and transport lines on any colonies are struck."
 AIO_interference_events.442.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: Anomalous heat continues to disrupt ore bodies and transport. Any colonial production lines suffer further damage."
 AIO_interference_events.443.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: The experimenter finds a stable range for material phase changes. Abnormal heat recedes while extraction and smelting retain their gains."
 AIO_interference_events.444.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: Molten material cools into broad slag beds, obstructing extraction and construction for years. Any colonies suffer severe damage."
 AIO_interference_events.445.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: The manufacturing field is weakening and anomalous heat is falling. Residual slag still needs clearing."
 AIO_interference_events.450.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: Survey coordinates for worlds and ship routes begin to fold together. Travel shortens but navigation records diverge; any colonies gain usable districts."
 AIO_interference_events.451.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: The first spatial rebound briefly displaces routes and surface coordinates. Buildings and utilities on any colonies are struck."
 AIO_interference_events.452.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: Folded space rebounds again and ships slow to recalculate their routes. Any colonies suffer further damage."
 AIO_interference_events.453.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: The experimenter establishes a common spatial reference. The folds stabilize and the extra usable space remains."
 AIO_interference_events.454.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: Folded regions contract abruptly, leaving routes and surfaces misaligned for years. Any colonies suffer severe damage to buildings and utilities."
 AIO_interference_events.455.desc.other: "[event_target:AIO_accident_owner.GetName] has caused a new development in our [event_target:AIO_accident_system.GetName] system: The metric field is weakening and navigation coordinates agree again. Residual displacement still needs surveying."

 #endregion


 #region balanced backlash

 AIO_interference_balanced_backlash: "Balanced Interference Backlash: [Target.GetName]"
 AIO_interference_balanced_backlash_type: "Balanced Interference Backlash"
 AIO_interference_balanced_backlash_desc: "The field in [Target.GetName] accelerates several resource and production processes at once, drawing their supply and repair cycles together. Where colonies exist, sectors gain output but risk cascading shutdowns; readings on uninhabited worlds are also growing more extreme."
 AIO_interference_balanced_backlash_monthly_change_tooltip: "With Balanced Interference active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_balanced_stage_one: "Synchronized Output"
 AIO_balanced_stage_one_desc: "Several resource readings rise together. Where colonies exist, facilities increase output together and a single supply interruption could slow several lines."
 AIO_balanced_stage_two: "Scheduling Bottleneck"
 AIO_balanced_stage_two_desc: "The field concentrates material and maintenance demand into the same period. Colonies, if present, face pressure on transport and construction resources; automated surveys also lose synchronization."
 AIO_balanced_stage_three: "Systemwide Threshold"
 AIO_balanced_stage_three_desc: "Several interference effects approach their peaks at once. Colonies, if present, can no longer stagger repairs; resource and transit readings grow unstable even in an uninhabited system."

 AIO_balanced_maintain: "$AIO_interference_accidence_maintain$"
 AIO_balanced_maintain_desc: "Keep the current field settings and observe how far several resource and production effects can rise together."
 AIO_balanced_blockade: "$AIO_interference_accidence_blockade$"
 AIO_balanced_blockade_desc: "Isolate unstable field frequencies and reduce synchronization among resource and production processes."
 AIO_balanced_reverse: "$AIO_interference_accidence_reverse$"
 AIO_balanced_reverse_desc: "Retune the timing of the field effects, preserving the gains while limiting cascading disruptions."

 AIO_balanced_accidence_1: "Synchronized Output I"
 AIO_balanced_accidence_1_desc: "Several resource and production effects rise together; colonies, if present, face pressure on delivery and construction resources."
 AIO_balanced_accidence_2: "Synchronized Output II"
 AIO_balanced_accidence_2_desc: "The field gains strength; trade and construction on any colonies slow as their production cycles converge."
 AIO_balanced_accidence_3: "Synchronized Output III"
 AIO_balanced_accidence_3_desc: "The field reaches peak strength; colonies, if present, gain output while trade and construction remain disrupted."
 AIO_balanced_collapse_colony: "Cascading Shutdown"
 AIO_balanced_collapse_colony_desc: "The field falls broadly out of sync; damaged facilities and surplus material on any colonies will take years to clear."

 d_AIO_balanced_uniform_residue: "£blocker£ Mixed Waste Layer"
 d_AIO_balanced_uniform_residue_desc: "Ore dust, slag, and discarded materials left by the shutdown have hardened around the facilities. Clearing them will take time."

 AIO_interference_events.410.name: "Balanced Interference at Critical Strength"
 AIO_interference_events.410.desc.maker.colony: "The field in [event_target:AIO_accident_system.GetName] has reached critical strength. Mineral, food, alloy, and research output are rising together, but supply and repair systems are falling behind. Every sector appears to be running normally; their fault reports now point to the same shift."
 AIO_interference_events.410.desc.maker.no_colony: "The field in [event_target:AIO_accident_system.GetName] has reached critical strength. Mineral, soil, and energy readings on uninhabited worlds are shifting together; models suggest that future supply and maintenance cycles would also converge."
 AIO_interference_events.410.option.maker: "Begin accident response procedures."
 AIO_interference_events.411.name: "Synchronized Shutdown"
 AIO_interference_events.411.desc.maker.colony: "In the first disruption, several facilities enter emergency shutdown at once. Power, processing, and transport briefly fall out of step, damaging the colonies in [event_target:AIO_accident_system.GetName]. The field keeps raising capacity, but actual deliveries collapse."
 AIO_interference_events.411.desc.maker.no_colony: "The first disruption sweeps through [event_target:AIO_accident_system.GetName]. Power, transmission, and data processing at remote probes briefly fall out of step, leaving gaps in the records while the field keeps growing stronger."
 AIO_interference_events.411.option.maker: "Review the shutdown records."
 AIO_interference_events.412.name: "Scheduling Breakdown"
 AIO_interference_events.412.desc.maker.colony: "Production cycles are converging again. Raw materials arrive with no one available to receive them; repairs begin with no spare equipment at hand. The colonies suffer further damage as high output consumes public resources, slowing trade and construction."
 AIO_interference_events.412.desc.maker.no_colony: "A second disruption repeatedly desynchronizes automated probes and supply equipment in [event_target:AIO_accident_system.GetName]. No colony is damaged, but resource readings and transit schedules throughout the system have become unreliable."
 AIO_interference_events.412.option.maker: "Record the losses in each sector."
 AIO_interference_events.413.name: "Harnessed Backlash"
 AIO_interference_events.413.desc.maker.colony: "Our researchers have adjusted the field in [event_target:AIO_accident_system.GetName] so extraction, transport, and processing no longer reach peak load at once. Production still benefits from the interference, and the supply chain has room to recover. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.413.desc.maker.no_colony: "Our researchers have adjusted the field in [event_target:AIO_accident_system.GetName] so its resource fluctuations no longer peak together. The unusual yields remain accessible, while telemetry and transit schedules stabilize. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.414.name: "Cascading Shutdown"
 AIO_interference_events.414.desc.maker.colony: "Supply, power, and repair systems across [event_target:AIO_accident_system.GetName] fail in succession. Damaged facilities and unprocessed materials leave broad layers of waste, while the colonies suffer severe damage. Restoring output will take years. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.414.desc.maker.no_colony: "Several resource fluctuations across [event_target:AIO_accident_system.GetName] collapse at once, and automated stations lose contact. No colony is damaged, but these anomalies will disrupt future extraction and travel for years. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.414.option.maker: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.415.name: "The Experiment Is Cancelled"
 AIO_interference_events.415.desc.maker.colony: "The field's influence is weakening. Sectors in [event_target:AIO_accident_system.GetName] are returning to independent schedules and supply chains are reconnecting, though losses from earlier shutdowns still need to be addressed. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.415.desc.maker.no_colony: "The field's influence is weakening. Resource readings in [event_target:AIO_accident_system.GetName] are decoupling and automated stations are synchronizing again, though earlier observations cannot be recovered. $AIO_interference_accidence_conclusion.no_reverse$"

 #endregion


 #region zero point energy backlash

 AIO_interference_energy_backlash: "Zero Point Energy Backlash: [Target.GetName]"
 AIO_interference_energy_backlash_type: "Zero Point Energy Backlash"
 AIO_interference_energy_backlash_desc: "Zero-point energy in [Target.GetName] repeatedly falls out of phase, and surges are reaching ships and orbital space. Colonies, if present, gain power output but face disruption to distribution and construction. We must reduce the load or retune the waveform."
 AIO_interference_energy_backlash_monthly_change_tooltip: "With Zero Point Energy active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_energy_stage_one: "Grid Desynchronization"
 AIO_energy_stage_one_desc: "Zero-point energy output keeps rising, providing new anomalous waveforms for study. Transmission and construction equipment on any colonies begin to lose synchronization."
 AIO_energy_stage_two: "Feedback Surges"
 AIO_energy_stage_two_desc: "Feedback pulses travel through the field. Ship weapons charge faster while shields lose stability; colonial breakers, where present, trip repeatedly."
 AIO_energy_stage_three: "Cascade Threshold"
 AIO_energy_stage_three_desc: "Surges strike several parts of the system at once. Ship weapons reach peak output and shields falter; any colonies struggle to maintain reliable power and construction."

 AIO_energy_maintain: "$AIO_interference_accidence_maintain$"
 AIO_energy_maintain_desc: "Keep the current field settings and study the relationship between zero-point output and frequency drift."
 AIO_energy_blockade: "$AIO_interference_accidence_blockade$"
 AIO_energy_blockade_desc: "Isolate unstable energy frequencies, reduce output, and block feedback surges."
 AIO_energy_reverse: "$AIO_interference_accidence_reverse$"
 AIO_energy_reverse_desc: "Retune the zero-point waveform and route surplus energy along controlled paths."

 AIO_energy_accidence_1: "Grid Overload I"
 AIO_energy_accidence_1_desc: "Zero-point energy and anomalous physics readings rise; transmission faults slow construction on any colonies."
 AIO_energy_accidence_2: "Grid Overload II"
 AIO_energy_accidence_2_desc: "Surges strengthen ship weapons but destabilize shields; any colonies gain power output while construction slows."
 AIO_energy_accidence_3: "Grid Overload III"
 AIO_energy_accidence_3_desc: "Zero-point energy and ship weapons reach peak output while shields remain unstable; colonial facilities, if present, also face repeated shocks."
 AIO_energy_grid_collapse_colony: "Grid Collapse"
 AIO_energy_grid_collapse_colony_desc: "Zero-point energy remains unstable for years; power distribution on any colonies is severely limited."

 d_AIO_energy_cascade_residue: "£blocker£ Fused Grid Debris"
 d_AIO_energy_cascade_residue_desc: "Burned conductors and insulation have fused together. Some areas still carry a residual charge."

 AIO_interference_events.420.name: "Grid Frequency Divergence"
 AIO_interference_events.420.desc.maker.colony: "The frequency of the zero-point grid in [event_target:AIO_accident_system.GetName] has begun to jump between two states. Generation continues to rise, but distribution equipment and port power systems cannot stay in sync. Fault reports are mounting."
 AIO_interference_events.420.desc.maker.no_colony: "Zero-point energy in [event_target:AIO_accident_system.GetName] has begun jumping between two frequencies. Discharges appear above uninhabited worlds and in orbit, making shipboard power systems difficult to synchronize."
 AIO_interference_events.420.option.maker: "Open the accident protocol."
 AIO_interference_events.421.name: "The First Surge"
 AIO_interference_events.421.desc.maker.colony: "A feedback pulse trips substations across several colonies in [event_target:AIO_accident_system.GetName]. Some generators go offline, construction stops, and distribution rooms catch fire; the field still drives generation capacity higher."
 AIO_interference_events.421.desc.maker.no_colony: "A feedback pulse crosses [event_target:AIO_accident_system.GetName], briefly cutting power to orbital probes and passing ships. No colonial substations are damaged, but the field continues to drive energy output higher."
 AIO_interference_events.421.option.maker: "Record the damage."
 AIO_interference_events.422.name: "Cascade Through the Grid"
 AIO_interference_events.422.desc.maker.colony: "The second surge bypasses the cables and travels through the field to several power nodes at once. The grid in [event_target:AIO_accident_system.GetName] is forced to reduce voltage, and the colonies suffer further damage; ship weapons charge faster, but shields repeatedly lose stability."
 AIO_interference_events.422.desc.maker.no_colony: "The second surge bypasses physical circuits and reaches several parts of [event_target:AIO_accident_system.GetName] through the field. Ship weapons charge faster while shields lose stability; discharges scar uninhabited worlds."
 AIO_interference_events.422.option.maker: "Keep the grid isolated."
 AIO_interference_events.423.name: "Harnessed Backlash"
 AIO_interference_events.423.desc.maker.colony: "Our researchers have recalibrated generation and demand in [event_target:AIO_accident_system.GetName]. Surplus power now flows through controlled transmission circuits; the zero-point plants retain higher output without surges striking the colonies. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.423.desc.maker.no_colony: "Our researchers have recalibrated the zero-point waveform in [event_target:AIO_accident_system.GetName]. Excess energy now follows controlled paths, and passing ships no longer face sudden surges. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.424.name: "Grid Collapse"
 AIO_interference_events.424.desc.maker.colony: "A cascade of surges burns through the main transmission circuits in [event_target:AIO_accident_system.GetName]. Colonies suffer severe damage and fused debris blocks vital facilities. This system's power supply will take years to recover. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.424.desc.maker.no_colony: "Cascading surges sweep [event_target:AIO_accident_system.GetName], leaving a residual field of persistent orbital discharges. No colonial grid collapses, but shipboard power and future construction will be disrupted for years. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.424.option.maker: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.425.name: "The Experiment Is Cancelled"
 AIO_interference_events.425.desc.maker.colony: "The field's influence is weakening, generator output is settling, and the distribution grid is stable again. Damaged circuits still need repair, but the cascading failures have stopped. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.425.desc.maker.no_colony: "The field's influence is weakening, and the zero-point waveform in [event_target:AIO_accident_system.GetName] is settling. Orbital discharges still need monitoring, but the cascading surges have stopped. $AIO_interference_accidence_conclusion.no_reverse$"

 #endregion

 #region ecology backlash

 AIO_interference_ecology_backlash: "Ecological Evolution Backlash: [Target.GetName]"
 AIO_interference_ecology_backlash_type: "Ecological Evolution Backlash"
 AIO_interference_ecology_backlash_desc: "The field accelerates growth cycles in [Target.GetName], creating abnormal biomes even on uninhabited worlds. Colonies, if present, gain food and biomass but face roots, spores, and supply pressure. We can contain the spread or stabilize it."
 AIO_interference_ecology_backlash_monthly_change_tooltip: "With Ecological Evolution active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_ecology_stage_one: "Overgrowth"
 AIO_ecology_stage_one_desc: "Biological activity and terraforming potential rise throughout the system, along with spore counts. Fields and cultivation chambers on any colonies yield earlier harvests."
 AIO_ecology_stage_two: "Runaway Biome"
 AIO_ecology_stage_two_desc: "Roots and spores spread into more territory, occupying potential building sites. Colonies, if present, face pressure on utilities, filtration, and household supplies."
 AIO_ecology_stage_three: "Biosphere Overload"
 AIO_ecology_stage_three_desc: "The biome reaches peak growth and steadily covers usable ground. Colonies, if present, gain food and biomass but face worsening air, water, and living conditions."

 AIO_ecology_maintain: "$AIO_interference_accidence_maintain$"
 AIO_ecology_maintain_desc: "Keep the current field settings and observe how growth and environmental adaptation change."
 AIO_ecology_blockade: "$AIO_interference_accidence_blockade$"
 AIO_ecology_blockade_desc: "Isolate the expanding biome and keep roots and spores from reaching more territory."
 AIO_ecology_reverse: "$AIO_interference_accidence_reverse$"
 AIO_ecology_reverse_desc: "Retune the effect on growth cycles, preserving productive potential while limiting the spread."

 AIO_ecology_accidence_1: "Ecological Swell I"
 AIO_ecology_accidence_1_desc: "Biological activity and terraforming accelerate; any colonies gain food and biomass while supply pressure begins to rise."
 AIO_ecology_accidence_2: "Ecological Swell II"
 AIO_ecology_accidence_2_desc: "Vegetation occupies usable ground; colonies, if present, face greater filtration and household supply costs."
 AIO_ecology_accidence_3: "Ecological Swell III"
 AIO_ecology_accidence_3_desc: "The expanding biome reaches its peak and reduces usable land; living conditions on any colonies also deteriorate."
 AIO_ecology_collapse_colony: "Biosphere Collapse"
 AIO_ecology_collapse_colony_desc: "Widespread dieback leaves the environment difficult to develop for years; farms and supplies on any colonies also suffer."

 d_AIO_ecology_overgrowth: "£blocker£ Root Residue"
 d_AIO_ecology_overgrowth_desc: "Dead roots and decaying matter cover utility lines and buildable land. The area must be cleared before development resumes."

 AIO_interference_events.430.name: "Ecological Threshold"
 AIO_interference_events.430.desc.maker.colony: "The field in [event_target:AIO_accident_system.GetName] has reached critical strength. Crops and cultivated organisms keep growing faster, and terraforming is accelerating; spore counts and root density have also passed safe limits."
 AIO_interference_events.430.desc.maker.no_colony: "The field in [event_target:AIO_accident_system.GetName] has reached critical strength. Native biomes and microorganisms on uninhabited worlds are spreading rapidly, with spore counts and root density passing safe limits."
 AIO_interference_events.430.option.maker: "Open the accident protocol."
 AIO_interference_events.431.name: "The First Spread"
 AIO_interference_events.431.desc.maker.colony: "The first wave of growth sweeps through [event_target:AIO_accident_system.GetName]. Roots split irrigation pipes and warehouse foundations, while spores enter cultivation chambers. Harvests fall on the affected colonies even as their need for supplies rises."
 AIO_interference_events.431.desc.maker.no_colony: "The first wave of growth sweeps across uninhabited worlds in [event_target:AIO_accident_system.GetName]. Roots spread through the soil and spore clouds rise into the atmosphere. No farms are damaged, but planned terraforming sites are already overgrown."
 AIO_interference_events.431.option.maker: "Record the losses."
 AIO_interference_events.432.name: "Runaway Spread"
 AIO_interference_events.432.desc.maker.colony: "The growth spreads into new districts along water, ventilation, and transport systems. Farms and cultivation chambers in [event_target:AIO_accident_system.GetName] lose output, terraforming slows, and the colonies suffer further damage; new vegetation continues to appear."
 AIO_interference_events.432.desc.maker.no_colony: "The biome spreads further across [event_target:AIO_accident_system.GetName], covering more potentially usable land. No colonial facilities are damaged, but terraforming probes are losing contact and future development is growing harder."
 AIO_interference_events.432.option.maker: "Keep the biome contained."
 AIO_interference_events.433.name: "Harnessed Backlash"
 AIO_interference_events.433.desc.maker.colony: "Our researchers have adjusted the field in [event_target:AIO_accident_system.GetName]. Crops and cultivated organisms remain highly productive, while roots and spores no longer spread beyond production areas. Cleanup can begin. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.433.desc.maker.no_colony: "Our researchers have adjusted the field in [event_target:AIO_accident_system.GetName]. Growth remains vigorous, but roots and spores no longer cross the designated boundary; biological samples can now be recovered safely. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.434.name: "Biosphere Collapse"
 AIO_interference_events.434.desc.maker.colony: "The crowded biome exhausts its nutrients within a single growth cycle, then dies back across a wide area. Roots and decaying matter cover colonies in [event_target:AIO_accident_system.GetName]; farms and cultivation chambers will take years to recover. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.434.desc.maker.no_colony: "Overcrowded biomes in [event_target:AIO_accident_system.GetName] exhaust their nutrients within one growth cycle and die off. Roots and decaying matter cover the uninhabited surface, complicating terraforming and settlement for years. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.434.option.maker: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.435.name: "The Experiment Is Cancelled"
 AIO_interference_events.435.desc.maker.colony: "The field's influence is weakening and excessive growth is slowing. Affected facilities still need clearing, but the spread is under control. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.435.desc.maker.no_colony: "The field's influence is weakening, and abnormal growth in [event_target:AIO_accident_system.GetName] is slowing. Dense vegetation remains on uninhabited worlds, but its spread is under control. $AIO_interference_accidence_conclusion.no_reverse$"

 #endregion

 #region industry backlash

 AIO_interference_industry_backlash: "Industrial Refining Backlash: [Target.GetName]"
 AIO_interference_industry_backlash_type: "Industrial Refining Backlash"
 AIO_interference_industry_backlash_desc: "Ore separation and material phase changes in [Target.GetName] are accelerating, along with anomalous heat. Colonies, if present, gain mineral and alloy output but face higher maintenance and construction costs. We can lower the load or seek stable parameters."
 AIO_interference_industry_backlash_monthly_change_tooltip: "With Industrial Refining active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_industry_stage_one: "Overcapacity"
 AIO_industry_stage_one_desc: "Ore separation and alloy reactions become more efficient while anomalous heat approaches safe limits. Any colonies face rising furnace and spare-part demand."
 AIO_industry_stage_two: "Runaway Wear"
 AIO_industry_stage_two_desc: "Mineral and alloy potential keeps rising while heat grows less stable. Colonies, if present, face greater furnace wear, maintenance demand, and expansion costs."
 AIO_industry_stage_three: "Full-Load Threshold"
 AIO_industry_stage_three_desc: "Anomalous heat approaches its limit and material phase changes could run out of control. On any colonies, one shutdown could block full-load mines and furnaces."

 AIO_industry_maintain: "$AIO_interference_accidence_maintain$"
 AIO_industry_maintain_desc: "Keep the current field settings and continue measuring ore separation and anomalous heat."
 AIO_industry_blockade: "$AIO_interference_accidence_blockade$"
 AIO_industry_blockade_desc: "Slow material phase changes and isolate overheated regions while anomalous heat recedes."
 AIO_industry_reverse: "$AIO_interference_accidence_reverse$"
 AIO_industry_reverse_desc: "Find a stable range for ore separation and temperature, preserving productive potential while reducing wear."

 AIO_industry_accidence_1: "Smelter Overload I"
 AIO_industry_accidence_1_desc: "Mineral and alloy potential rises; colonies, if present, need more furnace linings, spare parts, and new facilities."
 AIO_industry_accidence_2: "Smelter Overload II"
 AIO_industry_accidence_2_desc: "Material phase changes accelerate; colonies, if present, face higher ore, maintenance, and expansion costs."
 AIO_industry_accidence_3: "Smelter Overload III"
 AIO_industry_accidence_3_desc: "Mineral and alloy gains reach their peak; sustained output on any colonies requires more feedstock and frequent repairs."
 AIO_industry_collapse_colony: "Industrial Shutdown"
 AIO_industry_collapse_colony_desc: "Anomalous heat and slag obstruct development for years; mines and refineries on any colonies also lose output."

 d_AIO_industry_slag_residue: "£blocker£ Slag Residue"
 d_AIO_industry_slag_residue_desc: "Slag and solidified iron clog transport routes; the burned-out equipment frames still need dismantling."

 AIO_interference_events.440.name: "Refining at the Limit"
 AIO_interference_events.440.desc.maker.colony: "The field in [event_target:AIO_accident_system.GetName] has reached critical strength. Ore shipments and alloy casting are rising together, but furnace temperatures and maintenance material use have passed design limits. Cooling and transport systems are nearing full load."
 AIO_interference_events.440.desc.maker.no_colony: "The field in [event_target:AIO_accident_system.GetName] has reached critical strength. Ore separation readings and material phase changes are accelerating on uninhabited worlds; simulated smelting cycles predict unsafe heat levels."
 AIO_interference_events.440.option.maker: "Open the accident protocol."
 AIO_interference_events.441.name: "The First Overheat"
 AIO_interference_events.441.desc.maker.colony: "The first furnace banks in [event_target:AIO_accident_system.GetName] exceed safe temperatures. Cooling pumps stop, molten iron spills from the channels, and ore transport and smelting slow down. Output on the damaged colonies falls temporarily."
 AIO_interference_events.441.desc.maker.no_colony: "Minerals in [event_target:AIO_accident_system.GetName] abruptly change phase, and probes record extreme heat and molten ejecta. No mines or furnaces are damaged, but automated samplers must withdraw."
 AIO_interference_events.441.option.maker: "Record the losses."
 AIO_interference_events.442.name: "Production Jam"
 AIO_interference_events.442.desc.maker.colony: "Ore piles up on conveyors after repeated equipment failures. Mines upstream must slow down, while furnaces downstream still demand feedstock at full load. Colonies in [event_target:AIO_accident_system.GetName] suffer further damage, and clearing and rebuilding the lines takes more material."
 AIO_interference_events.442.desc.maker.no_colony: "Molten material and broken ore keep accumulating on uninhabited worlds in [event_target:AIO_accident_system.GetName]. No colonial production line is halted, but shifting ore bodies will make future extraction harder to clear."
 AIO_interference_events.442.option.maker: "Keep the lines pressed."
 AIO_interference_events.443.name: "Harnessed Backlash"
 AIO_interference_events.443.desc.maker.colony: "Our researchers have found stable ranges for ore supply and furnace temperature in [event_target:AIO_accident_system.GetName]. Molten iron flows steadily into the casting lines; mines and refineries retain higher output without uncontrolled wear. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.443.desc.maker.no_colony: "Our researchers have found a stable range for mineral phase changes in [event_target:AIO_accident_system.GetName]. Ore remains easy to separate, while abnormal heat recedes; extraction can be planned safely. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.444.name: "Industrial Shutdown"
 AIO_interference_events.444.desc.maker.colony: "Cooling loops fail in succession across [event_target:AIO_accident_system.GetName]. Molten iron spills from the channels and solidifies across transport routes. Slag covers the damaged colonies' production facilities; restoring mines and refineries will take years. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.444.desc.maker.no_colony: "Anomalous heat across [event_target:AIO_accident_system.GetName] runs out of control, and molten material cools into broad slag beds. No colonial industry is destroyed, but extraction and construction will face obstacles for years. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.444.option.maker: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.445.name: "The Experiment Is Cancelled"
 AIO_interference_events.445.desc.maker.colony: "The field's influence is weakening and furnace temperatures are falling. Damaged conveyors still need repair, while mines and refineries return toward their design loads. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.445.desc.maker.no_colony: "The field's influence is weakening, and abnormal heat in [event_target:AIO_accident_system.GetName] is falling. Solidified slag still needs to be surveyed, but the overheating has stopped. $AIO_interference_accidence_conclusion.no_reverse$"

 #endregion

 #region metric backlash

 AIO_interference_metric_backlash: "Metric Engineering Backlash: [Target.GetName]"
 AIO_interference_metric_backlash_type: "Metric Engineering Backlash"
 AIO_interference_metric_backlash_desc: "Spatial coordinates in [Target.GetName] are folding, drawing distant worlds and routes together on survey maps. Colonies, if present, gain sites and faster construction but risk displaced roads and utilities; ship routes already need recalibration."
 AIO_interference_metric_backlash_monthly_change_tooltip: "With Metric Engineering active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_metric_stage_one: "Spatial Folding"
 AIO_metric_stage_one_desc: "Coordinates once kilometres apart now appear close together, shortening travel. Survey maps show new potential districts on any colonies."
 AIO_metric_stage_two: "Metric Instability"
 AIO_metric_stage_two_desc: "Spatial folds keep changing surveyed distances. Ships travel faster but fire-control needs constant recalibration; roads, utilities, and foundations on any colonies can shift out of alignment."
 AIO_metric_stage_three: "Geometric Threshold"
 AIO_metric_stage_three_desc: "Layers of space overlap, improving travel and construction potential. Coordinates change faster than surveys and fire-control can update; residents on any colonies also struggle to navigate."

 AIO_metric_maintain: "$AIO_interference_accidence_maintain$"
 AIO_metric_maintain_desc: "Keep the current field settings and measure the capacity and stability of the folded regions."
 AIO_metric_blockade: "$AIO_interference_accidence_blockade$"
 AIO_metric_blockade_desc: "Close unstable folds and routes while local geometry gradually returns to its former shape."
 AIO_metric_reverse: "$AIO_interference_accidence_reverse$"
 AIO_metric_reverse_desc: "Establish a common spatial reference for worlds, routes, and potential building sites, preserving usable space while limiting rebounds."

 AIO_metric_accidence_1: "Geometric Distortion I"
 AIO_metric_accidence_1_desc: "Usable space and travel speed increase while navigation grows harder; any colonies gain districts and faster construction."
 AIO_metric_accidence_2: "Geometric Distortion II"
 AIO_metric_accidence_2_desc: "The folds spread and fire-control errors rise; roads, utilities, and district upkeep on any colonies also suffer."
 AIO_metric_accidence_3: "Geometric Distortion III"
 AIO_metric_accidence_3_desc: "Usable space and travel effects peak while coordinate drift disrupts gunnery; construction and travel on any colonies also suffer."
 AIO_metric_collapse_colony: "Geometric Collapse"
 AIO_metric_collapse_colony_desc: "Some usable space contracts and travel remains disrupted; construction and district upkeep on any colonies also face years of pressure."

 d_AIO_metric_fold_residue: "£blocker£ Residual Fold"
 d_AIO_metric_fold_residue_desc: "Roads and building foundations overlap in one area. Crews must repeatedly survey adjacent districts before construction can resume."

 AIO_interference_events.450.name: "Metric Threshold"
 AIO_interference_events.450.desc.maker.colony: "The field in [event_target:AIO_accident_system.GetName] has reached critical strength. Street intersections draw closer on maps and distant buildings repeat in the same view. More districts can be developed and construction speeds up, but coordinate records no longer agree."
 AIO_interference_events.450.desc.maker.no_colony: "The field in [event_target:AIO_accident_system.GetName] has reached critical strength. Survey coordinates for uninhabited worlds and ship routes overlap, making distant locations appear adjacent. Navigation records are increasingly inconsistent."
 AIO_interference_events.450.option.maker: "Open the accident protocol."
 AIO_interference_events.451.name: "The First Rebound"
 AIO_interference_events.451.desc.maker.colony: "The first rebound shifts several streets in [event_target:AIO_accident_system.GetName] sideways, breaks utility lines, and damages the foundations of unfinished buildings. Colonies sound alarms, and ships crossing the system must reduce speed."
 AIO_interference_events.451.desc.maker.no_colony: "The first rebound briefly shifts routes and the surfaces of uninhabited worlds in [event_target:AIO_accident_system.GetName]. Survey probes lose contact and passing ships slow down; no streets or buildings are damaged."
 AIO_interference_events.451.option.maker: "Record the deformation."
 AIO_interference_events.452.name: "Geometric Recoil"
 AIO_interference_events.452.desc.maker.colony: "Intersections once adjacent are suddenly kilometres apart; old foundations no longer line up with new roads. New districts still appear, but colonies in [event_target:AIO_accident_system.GetName] suffer further damage. Building work slows, ships recalculate routes at reduced speed, and district upkeep rises."
 AIO_interference_events.452.desc.maker.no_colony: "Folded space in [event_target:AIO_accident_system.GetName] rebounds again, separating routes that were adjacent moments ago. Coordinates on uninhabited worlds keep drifting, and ships must slow to recalculate their course."
 AIO_interference_events.452.option.maker: "Keep the metric pinned."
 AIO_interference_events.453.name: "Harnessed Backlash"
 AIO_interference_events.453.desc.maker.colony: "Our researchers have established a common spatial reference for [event_target:AIO_accident_system.GetName]. The folded districts hold steady and the additional sites remain usable; roads, buildings, and routes no longer rebound without warning. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.453.desc.maker.no_colony: "Our researchers have established a common spatial reference for [event_target:AIO_accident_system.GetName]. The folds hold steady and the extra usable space remains, while ship routes no longer rebound without warning. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.454.name: "Geometric Collapse"
 AIO_interference_events.454.desc.maker.colony: "Folded districts across [event_target:AIO_accident_system.GetName] contract at once, removing some usable land and tearing through foundations and utility lines. Colonies suffer severe damage; displaced streets obstruct construction, travel, and district maintenance for years. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.454.desc.maker.no_colony: "Folded regions across [event_target:AIO_accident_system.GetName] contract at once, shearing the surfaces of uninhabited worlds and throwing routes out of alignment. No colony is damaged, but construction and travel will remain disrupted for years. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.454.option.maker: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.455.name: "The Experiment Is Cancelled"
 AIO_interference_events.455.desc.maker.colony: "The field's influence is weakening, repeated streets are merging back into place, and navigation coordinates agree again. Damaged streets still need repair, but the wider rebounds have stopped. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.455.desc.maker.no_colony: "The field's influence is weakening, overlapping space in [event_target:AIO_accident_system.GetName] is settling, and navigation coordinates agree again. Survey probes still need redeployment, but the wider rebounds have stopped. $AIO_interference_accidence_conclusion.no_reverse$"

 #endregion
