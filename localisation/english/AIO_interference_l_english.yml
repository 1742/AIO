l_english:
 #region psionic auras

 AIO_reality_interference_aura: "Reality Interference Field"
 AIO_reality_interference_aura_level_1_tt: "§HMild Reality Distortion§!"
 AIO_reality_interference_aura_level_2_tt: "§HSignificant Reality Distortion§!"
 AIO_reality_interference_aura_level_3_tt: "§RCritical Reality Distortion§!"
 AIO_interference_source_intensity_desc: "Reality Interferometer"
 AIO_interference_proof_intensity_desc: "Employed Reality Provers"
 AIO_interference_disconnected_desc: "Disconnected from Reality Interference Source"

 #endregion


 #region building

 building_AIO_reality_proof_facility: "Reality Proof Facility"
 building_AIO_reality_proof_facility_desc: "Researchers test how readily local reality can be rewritten."
 building_AIO_reality_proof_facility_tt: "Each 100 £job_physicist£ §Y$job_AIO_proof_researcher$§! add §G0.5§! monthly intensity to the local Reality Interference Field, counting at most 1,000 per system."

 #endregion


 #region job

 job_AIO_proof_researcher: "Reality Prover"
 job_AIO_proof_researcher_plural: "Reality Provers"
 job_AIO_proof_researcher_desc: "Demonstrates that familiar physical laws are merely one possible solution."
 mod_job_AIO_proof_researcher_add: "£job_physicist£ $job_AIO_proof_researcher$ Jobs"
 job_AIO_proof_drone: "Reality Proof Subroutine"
 job_AIO_proof_drone_plural: "Reality Proof Subroutines"
 job_AIO_proof_drone_desc: "Continuously validates and revises the laws governing local reality."
 mod_job_AIO_proof_drone_add: "£job_physicist£ $job_AIO_proof_drone$ Jobs"

 #endregion



 #region megastructure

 AIO_reality_interferometer: "Reality Interferometer"
 AIO_reality_interferometer_plural: "$AIO_reality_interferometer$"
 AIO_reality_interferometer_DESC: "A colossal apparatus that uses transcendent logic to force local reality toward a predetermined conclusion. When activated, it creates and intensifies a Reality Interference Field, replacing any Psionic Aura already present."
 AIO_reality_interferometer_MEGASTRUCTURE_DETAILS: "Construction activates a uniform source under the empire interference doctrine. Effects stack from up to three sources covering a system; effects on our assets also scale with aura level. Only one may be built in each system, and an empire may initially maintain up to five."
 AIO_requires_no_existing_reality_interferometer: "$TRIGGER_FAIL$A $AIO_reality_interferometer$ already exists in this system."
 AIO_requires_reality_interferometer_capacity: "$TRIGGER_FAIL$We can maintain no more than §Y5§! $AIO_reality_interferometer_plural$."

 #endregion


 #region modifier

 mod_AIO_interferometer_range: "Interferometer Effect Range"

 #endregion


 #region tooltips

 AIO_interferometer_completed: "The $AIO_reality_interferometer$ in the §H[from.GetName]§! system has completed."

 #endregion


 #region policy

 policy_policy_AIO_interference_doctrine: "Reality Interference Doctrine"
 policy_policy_AIO_interference_doctrine_desc: "Sets the combined effects produced by our Reality Interference Fields. Changing doctrine alters benefits, not field coverage or intensity."
 policy_AIO_interference_balanced: "Balanced Interference"
 policy_AIO_interference_energy: "Zero Point Energy"
 policy_AIO_interference_ecology: "Ecological Evolution"
 policy_AIO_interference_industry: "Industrial Refining"
 policy_AIO_interference_metric: "Metric Engineering"

 #endregion


 #region interference accident (shared text)

 AIO_interference_accidence_maintain: "Maintain Experiment"
 AIO_interference_accidence_blockade: "Emergency Blockade"
 AIO_interference_accidence_reverse: "Reverse the Backlash"
 AIO_interference_accidence_progress_active: "Reality Interference Field"
 AIO_interference_accidence_progress_blockade: "$AIO_interference_accidence_blockade$"
 AIO_interference_accidence_progress_policy_mismatch: "Interference direction changed"
 AIO_interference_accidence_progress_disconnect: "Cut off from interference source"
 AIO_interference_accidence_backlash_monthly_change_tooltip: "Taking an active response means the situation is shaped by the §Ynumber of Reality Interference Field sources§! and by our §IProvers§!."
 AIO_interference_accidence_conclusion.no_reverse: "The field's grip on reality weakened after this burst. The universe seems to destabilise badly when a contradiction peaks, then snaps back into shape - it always drifts toward a steady state."
 AIO_interference_accidence_conclusion.reverse: "This is unlike our earlier experiments: the accident site now holds a different set of cosmic constants from everything around it, and our changes appear to be lasting."
 AIO_interference_accidence_option.abort: "A pity."
 AIO_interference_accidence_option.collapse: "A necessary sacrifice."
 AIO_interference_accidence_option.reverse: "We understand the universe a little better."

 #endregion


 #region backlash opinion and notice

 opinion_AIO_interference_accident: "Messing with reality"
 AIO_interference_events.390.name: "An Experiment Across the Border"
 AIO_interference_events.390.desc: "For months the readings in our system kept losing their footing, and our engineers wrote them off as faulty equipment. Now the truth has arrived: [event_target:AIO_accident_owner.GetName] was using our system as a test site, and all it left behind is wrecked facilities and a note saying the data has been archived."
 AIO_interference_events.390.option: "Note it down."

 #endregion


 #region balanced backlash

 AIO_interference_balanced_backlash: "Balanced Interference Backlash: [Target.GetName]"
 AIO_interference_balanced_backlash_type: "Balanced Interference Backlash"
 AIO_interference_balanced_backlash_desc: "Mines, farms, factories, and laboratories in [Target.GetName] are all raising output. The field drives these sectors to expand at a similar pace, crowding deliveries, repairs, and shift changes into the same hours. A single supply failure could bring several production lines down in succession."
 AIO_interference_balanced_backlash_monthly_change_tooltip: "With Balanced Interference active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_balanced_stage_one: "Synchronized Output"
 AIO_balanced_stage_one_desc: "Facilities across every sector are setting production records. But a single interruption in supply could slow several lines at once."
 AIO_balanced_stage_two: "Scheduling Bottleneck"
 AIO_balanced_stage_two_desc: "Raw materials, spare parts, and household supplies compete for the same transport capacity. Notably, repair requests always arrive together; expanding production consumes public resources, delaying infrastructure projects and drawing residents' complaints."
 AIO_balanced_stage_three: "Systemwide Threshold"
 AIO_balanced_stage_three_desc: "Every sector is running at full capacity, with no room left for staggered repairs. One broken link in the supply chain could halt an entire industrial district."

 AIO_balanced_maintain: "$AIO_interference_accidence_maintain$"
 AIO_balanced_maintain_desc: "Keep the current field settings and observe the limits of synchronized production."
 AIO_balanced_blockade: "$AIO_interference_accidence_blockade$"
 AIO_balanced_blockade_desc: "Isolate the affected facilities and let each sector return gradually to its former load."
 AIO_balanced_reverse: "$AIO_interference_accidence_reverse$"
 AIO_balanced_reverse_desc: "Adjust how the field affects each production stage, preserving its gains while restoring staggered operations."

 AIO_balanced_accidence_1: "Synchronized Output I"
 AIO_balanced_accidence_1_desc: "Facilities across every sector raise output, but transport and construction resources are growing scarce."
 AIO_balanced_accidence_2: "Synchronized Output II"
 AIO_balanced_accidence_2_desc: "Output keeps rising while trade slows and construction projects fall behind."
 AIO_balanced_accidence_3: "Synchronized Output III"
 AIO_balanced_accidence_3_desc: "Every line runs at full capacity. Output is high, but trade and construction remain disrupted."
 AIO_balanced_misalignment: "Out of Step"
 AIO_balanced_misalignment_desc: "Power generation, processing, and transport fail in succession, sharply reducing output and Trade Value."
 AIO_balanced_drift: "Scheduling Breakdown"
 AIO_balanced_drift_desc: "Sectors compete for supplies and repair windows. Output and Trade Value fall as construction is delayed."
 AIO_balanced_collapse: "Cascading Shutdown"
 AIO_balanced_collapse_desc: "Supply chains fail across the system. Damaged facilities and stockpiled materials will take years to clear."

 d_AIO_balanced_uniform_residue: "£blocker£ Mixed Waste Layer"
 d_AIO_balanced_uniform_residue_desc: "Ore dust, slag, and discarded materials left by the shutdown have hardened around the facilities. Clearing them will take time."

 AIO_interference_events.310.name: "Balanced Interference at Critical Strength"
 AIO_interference_events.310.desc: "The field in [Target.GetName] has reached critical strength. Mineral, food, alloy, and research output are rising together, but supply and repair systems are falling behind. Every sector appears to be running normally; their fault reports now point to the same shift."
 AIO_interference_events.310.option: "Begin accident response procedures."
 AIO_interference_events.311.name: "Synchronized Shutdown"
 AIO_interference_events.311.desc: "In the first disruption, several facilities enter emergency shutdown at once. Power, processing, and transport briefly fall out of step, damaging the colonies in [Target.GetName]. The field keeps raising capacity, but actual deliveries collapse."
 AIO_interference_events.311.option: "Review the shutdown records."
 AIO_interference_events.312.name: "Scheduling Breakdown"
 AIO_interference_events.312.desc: "Production cycles are converging again. Raw materials arrive with no one available to receive them; repairs begin with no spare equipment at hand. The colonies suffer further damage as high output consumes public resources, slowing trade and construction."
 AIO_interference_events.312.option: "Record the losses in each sector."
 AIO_interference_events.313.name: "Harnessed Backlash"
 AIO_interference_events.313.desc: "Our researchers have adjusted the field in [Target.GetName] so extraction, transport, and processing no longer reach peak load at once. Production still benefits from the interference, and the supply chain has room to recover. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.313.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.314.name: "Cascading Shutdown"
 AIO_interference_events.314.desc: "Supply, power, and repair systems across [Target.GetName] fail in succession. Damaged facilities and unprocessed materials leave broad layers of waste, while the colonies suffer severe damage. Restoring output will take years. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.314.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.315.name: "The Experiment Is Cancelled"
 AIO_interference_events.315.desc: "The field's influence is weakening. Sectors in [Target.GetName] are returning to independent schedules and supply chains are reconnecting, though losses from earlier shutdowns still need to be addressed. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.315.option: "$AIO_interference_accidence_option.abort$"

 #endregion


 #region zero point energy backlash

 AIO_interference_energy_backlash: "Zero Point Energy Backlash: [Target.GetName]"
 AIO_interference_energy_backlash_type: "Zero Point Energy Backlash"
 AIO_interference_energy_backlash_desc: "The zero-point grid in [Target.GetName] is falling out of sync. Generators keep raising output, but distribution breakers trip repeatedly, disrupting construction sites and ports. The field continues to drive production higher; we must either reduce the load or retune the grid to use this energy safely."
 AIO_interference_energy_backlash_monthly_change_tooltip: "With Zero Point Energy active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_energy_stage_one: "Grid Desynchronization"
 AIO_energy_stage_one_desc: "Generator output keeps rising while transmission circuits drift out of phase. Cranes stall intermittently, slowing construction; the anomalous waveforms also give our physicists new data."
 AIO_energy_stage_two: "Feedback Surges"
 AIO_energy_stage_two_desc: "Surplus power feeds back through the distribution grid, repeatedly tripping colony breakers. Ship weapons charge faster, but shields struggle to remain stable; construction can proceed only between surges."
 AIO_energy_stage_three: "Cascade Threshold"
 AIO_energy_stage_three_desc: "The field carries surges past the cables, striking several sites at once. Generation and ship weapons reach peak output, while shields falter, construction lags, and reliable power for the colonies grows harder to maintain."

 AIO_energy_maintain: "$AIO_interference_accidence_maintain$"
 AIO_energy_maintain_desc: "Keep the current field settings and record how generation rises as the grid falls out of sync."
 AIO_energy_blockade: "$AIO_interference_accidence_blockade$"
 AIO_energy_blockade_desc: "Isolate the affected circuits, reduce generator load, and block the path of the returning surges."
 AIO_energy_reverse: "$AIO_interference_accidence_reverse$"
 AIO_energy_reverse_desc: "Recalibrate generation and demand, directing surplus power into controlled transmission circuits."

 AIO_energy_accidence_1: "Grid Overload I"
 AIO_energy_accidence_1_desc: "Generation and anomalous physics readings rise as transmission faults slow construction."
 AIO_energy_accidence_2: "Grid Overload II"
 AIO_energy_accidence_2_desc: "Surges raise power generation and ship weapon output while construction delays and shield instability worsen."
 AIO_energy_accidence_3: "Grid Overload III"
 AIO_energy_accidence_3_desc: "Generation and ship weapons reach peak output as shields and colonial facilities take sustained strain."
 AIO_energy_blackout: "Local Blackout"
 AIO_energy_blackout_desc: "Substation breakers trip in succession, taking some generators offline and halting construction temporarily."
 AIO_energy_grid_drain: "Grid Brownout"
 AIO_energy_grid_drain_desc: "The grid runs at reduced voltage to suppress the surges, temporarily lowering generation."
 AIO_energy_grid_collapse: "Grid Collapse"
 AIO_energy_grid_collapse_desc: "Main transmission circuits have burned out, limiting this system's power supply for years."

 d_AIO_energy_cascade_residue: "£blocker£ Fused Grid Debris"
 d_AIO_energy_cascade_residue_desc: "Burned conductors and insulation have fused together. Some areas still carry a residual charge."

 AIO_interference_events.320.name: "Grid Frequency Divergence"
 AIO_interference_events.320.desc: "The frequency of the zero-point grid in [Target.GetName] has begun to jump between two states. Generation continues to rise, but distribution equipment and port power systems cannot stay in sync. Fault reports are mounting."
 AIO_interference_events.320.option: "Open the accident protocol."
 AIO_interference_events.321.name: "The First Surge"
 AIO_interference_events.321.desc: "A feedback pulse trips substations across several colonies in [Target.GetName]. Some generators go offline, construction stops, and distribution rooms catch fire; the field still drives generation capacity higher."
 AIO_interference_events.321.option: "Record the damage."
 AIO_interference_events.322.name: "Cascade Through the Grid"
 AIO_interference_events.322.desc: "The second surge bypasses the cables and travels through the field to several power nodes at once. The grid in [Target.GetName] is forced to reduce voltage, and the colonies suffer further damage; ship weapons charge faster, but shields repeatedly lose stability."
 AIO_interference_events.322.option: "Keep the grid isolated."
 AIO_interference_events.323.name: "Harnessed Backlash"
 AIO_interference_events.323.desc: "Our researchers have recalibrated generation and demand in [Target.GetName]. Surplus power now flows through controlled transmission circuits; the zero-point plants retain higher output without surges striking the colonies. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.323.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.324.name: "Grid Collapse"
 AIO_interference_events.324.desc: "A cascade of surges burns through the main transmission circuits in [Target.GetName]. Colonies suffer severe damage and fused debris blocks vital facilities. This system's power supply will take years to recover. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.324.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.325.name: "The Experiment Is Cancelled"
 AIO_interference_events.325.desc: "The field's influence is weakening, generator output is settling, and the distribution grid is stable again. Damaged circuits still need repair, but the cascading failures have stopped. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.325.option: "$AIO_interference_accidence_option.abort$"

 #endregion

 #region ecology backlash

 AIO_interference_ecology_backlash: "Ecological Evolution Backlash: [Target.GetName]"
 AIO_interference_ecology_backlash_type: "Ecological Evolution Backlash"
 AIO_interference_ecology_backlash_desc: "Crops and cultivated organisms in [Target.GetName] are multiplying at an abnormal rate. Food and biomass output rise, and terraforming advances faster. But roots penetrate utility lines, spores enter ventilation, and supporting the population takes more supplies. We can contain the spread or study how to stabilize this growth."
 AIO_interference_ecology_backlash_monthly_change_tooltip: "With Ecological Evolution active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_ecology_stage_one: "Overgrowth"
 AIO_ecology_stage_one_desc: "Fields and cultivation chambers are ready for harvest ahead of schedule, while terraforming crews establish new groundcover faster. Meanwhile, spore counts in air filters are rising."
 AIO_ecology_stage_two: "Runaway Biome"
 AIO_ecology_stage_two_desc: "Roots push through irrigation pipes and cable ducts, while new vegetation takes land reserved for construction. Filtration and cleanup crews expand, and household supplies begin to run short."
 AIO_ecology_stage_three: "Biosphere Overload"
 AIO_ecology_stage_three_desc: "Food, biomass, and research samples flood storage facilities. But vegetation steadily takes over buildable land, spores and decay contaminate air and water, and acceptable living conditions are harder to maintain."

 AIO_ecology_maintain: "$AIO_interference_accidence_maintain$"
 AIO_ecology_maintain_desc: "Keep the current field settings and observe changes in growth rates and environmental tolerance."
 AIO_ecology_blockade: "$AIO_interference_accidence_blockade$"
 AIO_ecology_blockade_desc: "Isolate farms, cultivation chambers, and residential areas to keep the growth out of vital facilities."
 AIO_ecology_reverse: "$AIO_interference_accidence_reverse$"
 AIO_ecology_reverse_desc: "Adjust how the field affects growth cycles, retaining higher output while limiting the spread of roots and spores."

 AIO_ecology_accidence_1: "Ecological Swell I"
 AIO_ecology_accidence_1_desc: "Food and biomass production rise and terraforming accelerates; air filtration and population supplies come under strain."
 AIO_ecology_accidence_2: "Ecological Swell II"
 AIO_ecology_accidence_2_desc: "Vegetation encroaches on buildable land, spores strain filters, and residents need more supplies."
 AIO_ecology_accidence_3: "Ecological Swell III"
 AIO_ecology_accidence_3_desc: "Production and terraforming peak, but the spreading biome keeps shrinking habitable and buildable space."
 AIO_ecology_bloom: "Ecological Bloom"
 AIO_ecology_bloom_desc: "Roots split irrigation lines and spores contaminate cultivation chambers, temporarily reducing food and biomass output."
 AIO_ecology_choke: "Ecological Choke"
 AIO_ecology_choke_desc: "Dense growth shades crops and obstructs terraforming; living conditions deteriorate as food and biomass output falls."
 AIO_ecology_collapse: "Biosphere Collapse"
 AIO_ecology_collapse_desc: "Widespread die-off leaves farms and cultivation chambers damaged for years while the population's supply needs remain high."

 d_AIO_ecology_overgrowth: "£blocker£ Root Residue"
 d_AIO_ecology_overgrowth_desc: "Dead roots and decaying matter cover utility lines and buildable land. The area must be cleared before development resumes."

 AIO_interference_events.330.name: "Ecological Threshold"
 AIO_interference_events.330.desc: "The field in [Target.GetName] has reached critical strength. Crops and cultivated organisms keep growing faster, and terraforming is accelerating; spore counts and root density have also passed safe limits."
 AIO_interference_events.330.option: "Open the accident protocol."
 AIO_interference_events.331.name: "The First Spread"
 AIO_interference_events.331.desc: "The first wave of growth sweeps through [Target.GetName]. Roots split irrigation pipes and warehouse foundations, while spores enter cultivation chambers. Harvests fall on the affected colonies even as their need for supplies rises."
 AIO_interference_events.331.option: "Record the losses."
 AIO_interference_events.332.name: "Runaway Spread"
 AIO_interference_events.332.desc: "The growth spreads into new districts along water, ventilation, and transport systems. Farms and cultivation chambers in [Target.GetName] lose output, terraforming slows, and the colonies suffer further damage; new vegetation continues to appear."
 AIO_interference_events.332.option: "Keep the biome contained."
 AIO_interference_events.333.name: "Harnessed Backlash"
 AIO_interference_events.333.desc: "Our researchers have adjusted the field in [Target.GetName]. Crops and cultivated organisms remain highly productive, while roots and spores no longer spread beyond production areas. Cleanup can begin. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.333.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.334.name: "Biosphere Collapse"
 AIO_interference_events.334.desc: "The crowded biome exhausts its nutrients within a single growth cycle, then dies back across a wide area. Roots and decaying matter cover colonies in [Target.GetName]; farms and cultivation chambers will take years to recover. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.334.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.335.name: "The Experiment Is Cancelled"
 AIO_interference_events.335.desc: "The field's influence is weakening and excessive growth is slowing. Affected facilities still need clearing, but the spread is under control. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.335.option: "$AIO_interference_accidence_option.abort$"

 #endregion

 #region industry backlash

 AIO_interference_industry_backlash: "Industrial Refining Backlash: [Target.GetName]"
 AIO_interference_industry_backlash_type: "Industrial Refining Backlash"
 AIO_interference_industry_backlash_desc: "Mines and refineries in [Target.GetName] are both exceeding design capacity. The field makes ore easier to separate and furnace reactions more complete, increasing mineral and alloy output. Furnace linings wear faster, while maintenance and the cost of new production lines keep rising. We can reduce the load or find stable settings for sustained output."
 AIO_interference_industry_backlash_monthly_change_tooltip: "With Industrial Refining active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_industry_stage_one: "Overcapacity"
 AIO_industry_stage_one_desc: "Ore extraction and alloy casting rise together. Furnace temperatures edge above specification, increasing demand for feedstock, spare parts, and expansion equipment."
 AIO_industry_stage_two: "Runaway Wear"
 AIO_industry_stage_two_desc: "Minerals and alloys continue to rise, but furnace linings need replacing ever more often. Production and repair compete for the same ore, while new furnace banks cost more to build."
 AIO_industry_stage_three: "Full-Load Threshold"
 AIO_industry_stage_three_desc: "Mines, conveyors, and furnaces are all running at full load. Heat approaches the cooling system's limit, and output needs ever more feedstock and spare parts. One shutdown could block the entire line."

 AIO_industry_maintain: "$AIO_interference_accidence_maintain$"
 AIO_industry_maintain_desc: "Keep the current field settings and track ore extraction, alloy casting, and equipment wear."
 AIO_industry_blockade: "$AIO_interference_accidence_blockade$"
 AIO_industry_blockade_desc: "Take high-load furnace banks offline in stages and isolate the affected mines and production lines."
 AIO_industry_reverse: "$AIO_interference_accidence_reverse$"
 AIO_industry_reverse_desc: "Recalibrate mining and smelting so higher output stays within the limits of cooling and feedstock supply."

 AIO_industry_accidence_1: "Smelter Overload I"
 AIO_industry_accidence_1_desc: "Mineral and alloy output rises, along with demand for furnace linings, spare parts, and new facilities."
 AIO_industry_accidence_2: "Smelter Overload II"
 AIO_industry_accidence_2_desc: "Production keeps rising, while ore supply, maintenance demand, and expansion costs rise with it."
 AIO_industry_accidence_3: "Smelter Overload III"
 AIO_industry_accidence_3_desc: "High output depends on extra feedstock and frequent part replacement; rebuilding now takes far more material."
 AIO_industry_overheat: "Furnace Overheat"
 AIO_industry_overheat_desc: "Furnace temperatures cross safe limits and cooling loops fail, temporarily reducing ore transport and smelting output."
 AIO_industry_jam: "Production Jam"
 AIO_industry_jam_desc: "Ore conveyors jam, leaving some furnaces short of feedstock; clearing the blockage and replacing equipment takes extra material."
 AIO_industry_collapse: "Industrial Shutdown"
 AIO_industry_collapse_desc: "Mines and refineries remain below capacity, while damaged equipment keeps maintenance and rebuilding costs high."

 d_AIO_industry_slag_residue: "£blocker£ Slag Residue"
 d_AIO_industry_slag_residue_desc: "Slag and solidified iron clog transport routes; the burned-out equipment frames still need dismantling."

 AIO_interference_events.340.name: "Refining at the Limit"
 AIO_interference_events.340.desc: "The field in [Target.GetName] has reached critical strength. Ore shipments and alloy casting are rising together, but furnace temperatures and maintenance material use have passed design limits. Cooling and transport systems are nearing full load."
 AIO_interference_events.340.option: "Open the accident protocol."
 AIO_interference_events.341.name: "The First Overheat"
 AIO_interference_events.341.desc: "The first furnace banks in [Target.GetName] exceed safe temperatures. Cooling pumps stop, molten iron spills from the channels, and ore transport and smelting slow down. Output on the damaged colonies falls temporarily."
 AIO_interference_events.341.option: "Record the losses."
 AIO_interference_events.342.name: "Production Jam"
 AIO_interference_events.342.desc: "Ore piles up on conveyors after repeated equipment failures. Mines upstream must slow down, while furnaces downstream still demand feedstock at full load. Colonies in [Target.GetName] suffer further damage, and clearing and rebuilding the lines takes more material."
 AIO_interference_events.342.option: "Keep the lines pressed."
 AIO_interference_events.343.name: "Harnessed Backlash"
 AIO_interference_events.343.desc: "Our researchers have found stable ranges for ore supply and furnace temperature in [Target.GetName]. Molten iron flows steadily into the casting lines; mines and refineries retain higher output without uncontrolled wear. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.343.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.344.name: "Industrial Shutdown"
 AIO_interference_events.344.desc: "Cooling loops fail in succession across [Target.GetName]. Molten iron spills from the channels and solidifies across transport routes. Slag covers the damaged colonies' production facilities; restoring mines and refineries will take years. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.344.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.345.name: "The Experiment Is Cancelled"
 AIO_interference_events.345.desc: "The field's influence is weakening and furnace temperatures are falling. Damaged conveyors still need repair, while mines and refineries return toward their design loads. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.345.option: "$AIO_interference_accidence_option.abort$"

 #endregion

 #region metric backlash

 AIO_interference_metric_backlash: "Metric Engineering Backlash: [Target.GetName]"
 AIO_interference_metric_backlash_type: "Metric Engineering Backlash"
 AIO_interference_metric_backlash_desc: "Streets and buildings in [Target.GetName] have begun to repeat from different perspectives. Intersections several blocks apart appear adjacent on surveys, opening new building sites and accelerating construction. But roads, utility lines, and ship routes need constant recalibration; a sudden rebound would displace existing facilities."
 AIO_interference_metric_backlash_monthly_change_tooltip: "With Metric Engineering active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_metric_stage_one: "Spatial Folding"
 AIO_metric_stage_one_desc: "Intersections once kilometres apart now stand close together. Survey maps show new districts and building materials travel shorter routes, but coordinates change from day to day."
 AIO_metric_stage_two: "Metric Instability"
 AIO_metric_stage_two_desc: "Streets and facades fold like mirrors, misaligning old utility lines with new foundations. District upkeep rises and ships cover routes faster, but fire-control systems must repeatedly recalculate target range."
 AIO_metric_stage_three: "Geometric Threshold"
 AIO_metric_stage_three_desc: "Several layers of streets overlap at different angles, adding building sites and speeding construction and travel. Coordinates now change faster than surveys and fire-control systems can update; residents struggle to recognize familiar routes."

 AIO_metric_maintain: "$AIO_interference_accidence_maintain$"
 AIO_metric_maintain_desc: "Keep the current field settings and measure the capacity and stability of the folded districts."
 AIO_metric_blockade: "$AIO_interference_accidence_blockade$"
 AIO_metric_blockade_desc: "Close unstable streets and construction routes while local geometry gradually returns to its former shape."
 AIO_metric_reverse: "$AIO_interference_accidence_reverse$"
 AIO_metric_reverse_desc: "Establish a common spatial reference for roads, buildings, and routes, preserving usable area while limiting rebounds."

 AIO_metric_accidence_1: "Geometric Distortion I"
 AIO_metric_accidence_1_desc: "More districts become available and construction and ship travel accelerate; upkeep and navigation calibration grow harder."
 AIO_metric_accidence_2: "Geometric Distortion II"
 AIO_metric_accidence_2_desc: "The folds spread, repeatedly shifting streets and utility lines while upkeep and fire-control errors increase."
 AIO_metric_accidence_3: "Geometric Distortion III"
 AIO_metric_accidence_3_desc: "New space, construction, and travel reach their peak, but shifting coordinates disrupt gunnery and daily movement."
 AIO_metric_shear: "Metric Shear"
 AIO_metric_shear_desc: "Folded streets slip apart, delaying work on buildings and forcing ships to slow while crossing the system."
 AIO_metric_inversion: "Metric Inversion"
 AIO_metric_inversion_desc: "Surveyed distances across streets and ship routes shift abruptly, slowing construction and manoeuvres while district upkeep rises."
 AIO_metric_collapse: "Geometric Collapse"
 AIO_metric_collapse_desc: "Some usable space contracts, slowing construction and travel while district upkeep stays high for years."

 d_AIO_metric_fold_residue: "£blocker£ Residual Fold"
 d_AIO_metric_fold_residue_desc: "Roads and building foundations overlap in one area. Crews must repeatedly survey adjacent districts before construction can resume."

 AIO_interference_events.350.name: "Metric Threshold"
 AIO_interference_events.350.desc: "The field in [Target.GetName] has reached critical strength. Street intersections draw closer on maps and distant buildings repeat in the same view. More districts can be developed and construction speeds up, but coordinate records no longer agree."
 AIO_interference_events.350.option: "Open the accident protocol."
 AIO_interference_events.351.name: "The First Rebound"
 AIO_interference_events.351.desc: "The first rebound shifts several streets in [Target.GetName] sideways, breaks utility lines, and damages the foundations of unfinished buildings. Colonies sound alarms, and ships crossing the system must reduce speed."
 AIO_interference_events.351.option: "Record the deformation."
 AIO_interference_events.352.name: "Geometric Recoil"
 AIO_interference_events.352.desc: "Intersections once adjacent are suddenly kilometres apart; old foundations no longer line up with new roads. New districts still appear, but colonies in [Target.GetName] suffer further damage. Building work slows, ships recalculate routes at reduced speed, and district upkeep rises."
 AIO_interference_events.352.option: "Keep the metric pinned."
 AIO_interference_events.353.name: "Harnessed Backlash"
 AIO_interference_events.353.desc: "Our researchers have established a common spatial reference for [Target.GetName]. The folded districts hold steady and the additional sites remain usable; roads, buildings, and routes no longer rebound without warning. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.353.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.354.name: "Geometric Collapse"
 AIO_interference_events.354.desc: "Folded districts across [Target.GetName] contract at once, removing some usable land and tearing through foundations and utility lines. Colonies suffer severe damage; displaced streets obstruct construction, travel, and district maintenance for years. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.354.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.355.name: "The Experiment Is Cancelled"
 AIO_interference_events.355.desc: "The field's influence is weakening, repeated streets are merging back into place, and navigation coordinates agree again. Damaged streets still need repair, but the wider rebounds have stopped. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.355.option: "$AIO_interference_accidence_option.abort$"

 #endregion
