 #region psionic auras

 AIO_reality_interference_aura: "Reality Interference Field"
 AIO_reality_interference_aura_level_1_tt: "§HMild Reality Distortion§!"
 AIO_reality_interference_aura_level_2_tt: "§HSignificant Reality Distortion§!"
 AIO_reality_interference_aura_level_3_tt: "§RCritical Reality Distortion§!"
 AIO_interference_source_intensity_desc: "Reality Interferometer"
 AIO_interference_proof_intensity_desc: "Employed Reality Provers"
 AIO_interference_disconnected_desc: "Disconnected from Reality Interference Source"

 #endregion


 #region building

 building_AIO_reality_proof_facility: "Reality Proof Facility"
 building_AIO_reality_proof_facility_desc: "Researchers test how readily local reality can be rewritten."
 building_AIO_reality_proof_facility_tt: "Each 100 £job_physicist£ §Y$job_AIO_proof_researcher$§! add §G0.5§! monthly intensity to the local Reality Interference Field, counting at most 1,000 per system."

 #endregion


 #region job

 job_AIO_proof_researcher: "Reality Prover"
 job_AIO_proof_researcher_plural: "Reality Provers"
 job_AIO_proof_researcher_desc: "Demonstrates that familiar physical laws are merely one possible solution."
 mod_job_AIO_proof_researcher_add: "£job_physicist£ $job_AIO_proof_researcher$ Jobs"
 job_AIO_proof_drone: "Reality Proof Subroutine"
 job_AIO_proof_drone_plural: "Reality Proof Subroutines"
 job_AIO_proof_drone_desc: "Continuously validates and revises the laws governing local reality."
 mod_job_AIO_proof_drone_add: "£job_physicist£ $job_AIO_proof_drone$ Jobs"

 #endregion



 #region megastructure

 AIO_reality_interferometer: "Reality Interferometer"
 AIO_reality_interferometer_plural: "$AIO_reality_interferometer$"
 AIO_reality_interferometer_DESC: "A colossal apparatus that uses transcendent logic to force local reality toward a predetermined conclusion. When activated, it creates and intensifies a Reality Interference Field, replacing any Psionic Aura already present."
 AIO_reality_interferometer_MEGASTRUCTURE_DETAILS: "Construction activates a uniform source under the empire interference doctrine. Effects stack from up to three sources covering a system; effects on our assets also scale with aura level. Only one may be built in each system, and an empire may initially maintain up to five."
 AIO_requires_no_existing_reality_interferometer: "$TRIGGER_FAIL$A $AIO_reality_interferometer$ already exists in this system."
 AIO_requires_reality_interferometer_capacity: "$TRIGGER_FAIL$We can maintain no more than §Y5§! $AIO_reality_interferometer_plural$."

 #endregion


 #region modifier

 mod_AIO_interferometer_range: "Interferometer Effect Range"

 #endregion


 #region tooltips

 AIO_interferometer_completed: "The $AIO_reality_interferometer$ in the §H[from.GetName]§! system has completed."

 #endregion


 #region policy

 policy_policy_AIO_interference_doctrine: "Reality Interference Doctrine"
 policy_policy_AIO_interference_doctrine_desc: "Sets the combined effects produced by our Reality Interference Fields. Changing doctrine alters benefits, not field coverage or intensity."
 policy_AIO_interference_balanced: "Balanced Interference"
 policy_AIO_interference_energy: "Zero Point Energy"
 policy_AIO_interference_ecology: "Ecological Evolution"
 policy_AIO_interference_industry: "Industrial Refining"
 policy_AIO_interference_metric: "Metric Engineering"

 #endregion


 #region interference accident (shared text)

 AIO_interference_accidence_maintain: "Maintain Experiment"
 AIO_interference_accidence_blockade: "Emergency Blockade"
 AIO_interference_accidence_reverse: "Reverse the Backlash"
 AIO_interference_backlash_progress.interferometer: "Reality Interference Field"
 AIO_interference_backlash_progress.blockade: "$AIO_interference_accidence_blockade$"
 AIO_interference_backlash_progress.policy_mismatch: "Interference direction changed"
 AIO_interference_backlash_progress.disconnect: "Cut off from interference source"
 AIO_interference_accidence_backlash_monthly_change_tooltip: "Taking an active response means the situation is shaped by the §Ynumber of Reality Interference Field sources§! and by our §IProvers§!."
 AIO_interference_accidence_conclusion.no_reverse: "The field's grip on reality weakened after this burst. The universe seems to destabilise badly when a contradiction peaks, then snaps back into shape - it always drifts toward a steady state."
 AIO_interference_accidence_conclusion.reverse: "This is unlike our earlier experiments: the accident site now holds a different set of cosmic constants from everything around it, and our changes appear to be lasting."
 AIO_interference_accidence_option.abort: "A pity."
 AIO_interference_accidence_option.collapse: "A necessary sacrifice."
 AIO_interference_accidence_option.reverse: "We understand the universe a little better."

 #endregion


 #region backlash opinion and notice


 opinion_AIO_interference_accident: "Messing with reality"
 AIO_interference_notice.option: "Report received."
 AIO_interference_notice.collapse_option: "We will remember this."

 #endregion


 #region balanced backlash

 AIO_interference_balanced_backlash: "Balanced Interference Backlash: [Target.GetName]"
 AIO_interference_balanced_backlash_type: "Balanced Interference Backlash"
 AIO_interference_balanced_backlash_desc: "Our interference field is disrupting production across several systems. Affected colonies gain output, but their supply, transport, and repair schedules risk cascading shutdowns."
 AIO_interference_balanced_backlash_monthly_change_tooltip: "With Balanced Interference active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_balanced_maintain: "$AIO_interference_accidence_maintain$"
 AIO_balanced_maintain_desc: "Keep the current field settings and observe how far several resource and production effects can rise together."
 AIO_balanced_blockade: "$AIO_interference_accidence_blockade$"
 AIO_balanced_blockade_desc: "Isolate unstable field frequencies and reduce synchronization among resource and production processes."
 AIO_balanced_reverse: "$AIO_interference_accidence_reverse$"
 AIO_balanced_reverse_desc: "Retune the timing of the field effects, preserving the gains while limiting cascading disruptions."

 AIO_balanced_backlash_1: "Synchronized Output I"
 AIO_balanced_backlash_1_desc: "Several resource and production effects rise together; colonies, if present, face pressure on delivery and construction resources."
 AIO_balanced_backlash_2: "Synchronized Output II"
 AIO_balanced_backlash_2_desc: "The field gains strength; trade and construction on any colonies slow as their production cycles converge."
 AIO_balanced_backlash_3: "Synchronized Output III"
 AIO_balanced_backlash_3_desc: "The field reaches peak strength; colonies, if present, gain output while trade and construction remain disrupted."
 AIO_balanced_backlash_collapse_colony: "Cascading Shutdown"
 AIO_balanced_backlash_collapse_colony_desc: "The field falls broadly out of sync; damaged facilities and surplus material on any colonies will take years to clear."

 d_AIO_balanced_uniform_residue: "£blocker£ Mixed Waste Layer"
 d_AIO_balanced_uniform_residue_desc: "Ore dust, slag, and discarded materials left by the shutdown have hardened around the facilities. Clearing them will take time."

 AIO_interference_events.410.name: "Balanced Interference at Critical Strength"
 AIO_interference_events.410.desc.maker: "Our interference field has reached critical strength across several systems. Affected colonies gain output, while supply and repairs struggle to keep pace."
 AIO_interference_events.410.desc.other: "[from.GetName]'s interference field has reached critical strength. Output rises across affected systems, but logistics are under strain."
 AIO_interference_events.410.option.maker: "Begin accident response procedures."

 AIO_interference_events.411.name: "Synchronized Shutdown"
 AIO_interference_events.411.desc.maker: "Facilities across the field shut down together. Power, processing, and transport fall out of step, damaging affected colonies."
 AIO_interference_events.411.desc.other: "A synchronized shutdown has disrupted colonies in the interference field of [from.GetName]."
 AIO_interference_events.411.option.maker: "Review the shutdown records."

 AIO_interference_events.412.name: "Scheduling Breakdown"
 AIO_interference_events.412.desc.maker: "Production cycles converge again. Affected colonies suffer further damage as high output strains trade and construction."
 AIO_interference_events.412.desc.other: "The interference field of [from.GetName] has caused another wave of production disruptions on affected colonies."
 AIO_interference_events.412.option.maker: "Record the losses in each sector."

 AIO_interference_events.413.name: "Harnessed Backlash"
 AIO_interference_events.413.desc.maker: "Our researchers have stabilized production across the field. The gains remain, while supply chains have room to recover. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.413.desc.other: "[from.GetName] has stabilized its interference field, preserving the gains while ending the disruptions."

 AIO_interference_events.414.name: "Cascading Shutdown"
 AIO_interference_events.414.desc.maker: "Supply, power, and repair systems across the field fail in succession. Affected colonies suffer severe damage and will need years to recover. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.414.desc.other: "The interference field of [from.GetName] has collapsed, severely damaging affected colonies."
 AIO_interference_events.414.option.maker: "$AIO_interference_accidence_option.collapse$"

 AIO_interference_events.415.name: "The Experiment Is Cancelled"
 AIO_interference_events.415.desc.maker: "The field is weakening and production schedules are separating again. Earlier losses still need attention. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.415.desc.other: "The interference field of [from.GetName] is weakening and the disruptions are ending."

 #endregion


 #region zero point energy backlash

 AIO_interference_energy_backlash: "Zero Point Energy Backlash: [Target.GetName]"
 AIO_interference_energy_backlash_type: "Zero Point Energy Backlash"
 AIO_interference_energy_backlash_desc: "Zero-point energy is falling out of phase across several systems in our interference field. Surges reach ships and orbital space; affected colonies gain power output but face disruption to distribution and construction."
 AIO_interference_energy_backlash_monthly_change_tooltip: "With Zero Point Energy active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_energy_maintain: "$AIO_interference_accidence_maintain$"
 AIO_energy_maintain_desc: "Keep the current field settings and study the relationship between zero-point output and frequency drift."
 AIO_energy_blockade: "$AIO_interference_accidence_blockade$"
 AIO_energy_blockade_desc: "Isolate unstable energy frequencies, reduce output, and block feedback surges."
 AIO_energy_reverse: "$AIO_interference_accidence_reverse$"
 AIO_energy_reverse_desc: "Retune the zero-point waveform and route surplus energy along controlled paths."

 AIO_energy_backlash_1: "Grid Overload I"
 AIO_energy_backlash_1_desc: "Zero-point energy and anomalous physics readings rise; transmission faults slow construction on any colonies."
 AIO_energy_backlash_2: "Grid Overload II"
 AIO_energy_backlash_2_desc: "Surges strengthen ship weapons but destabilize shields; any colonies gain power output while construction slows."
 AIO_energy_backlash_3: "Grid Overload III"
 AIO_energy_backlash_3_desc: "Zero-point energy and ship weapons reach peak output while shields remain unstable; colonial facilities, if present, also face repeated shocks."
 AIO_energy_backlash_collapse_colony: "Grid Collapse"
 AIO_energy_backlash_collapse_colony_desc: "Zero-point energy remains unstable for years; power distribution on any colonies is severely limited."

 d_AIO_energy_cascade_residue: "£blocker£ Fused Grid Debris"
 d_AIO_energy_cascade_residue_desc: "Burned conductors and insulation have fused together. Some areas still carry a residual charge."

 AIO_interference_events.420.name: "Grid Frequency Divergence"
 AIO_interference_events.420.desc.maker: "The zero-point grid is jumping between frequencies across our field. Generation rises, but distribution and shipboard power cannot stay in sync."
 AIO_interference_events.420.desc.other: "The zero-point grid in the interference field of [from.GetName] is falling out of phase."
 AIO_interference_events.420.option.maker: "Open the accident protocol."

 AIO_interference_events.421.name: "The First Surge"
 AIO_interference_events.421.desc.maker: "A feedback pulse trips substations across affected colonies. Generators go offline and construction stops, while the field keeps driving output higher."
 AIO_interference_events.421.desc.other: "A feedback surge from [from.GetName]'s interference field has struck affected ships and colonial grids."
 AIO_interference_events.421.option.maker: "Record the damage."

 AIO_interference_events.422.name: "Cascade Through the Grid"
 AIO_interference_events.422.desc.maker: "A second surge travels through the field to several power nodes. Affected colonies suffer damage; ship weapons charge faster while shields falter."
 AIO_interference_events.422.desc.other: "A second surge from [from.GetName]'s interference field has disrupted affected colonies and ships."
 AIO_interference_events.422.option.maker: "Keep the grid isolated."

 AIO_interference_events.423.name: "Harnessed Backlash"
 AIO_interference_events.423.desc.maker: "Our researchers have recalibrated the zero-point waveform. Surplus power follows controlled paths and the surges stop. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.423.desc.other: "[from.GetName] has stabilized its zero-point waveform and brought the surges under control."

 AIO_interference_events.424.name: "Grid Collapse"
 AIO_interference_events.424.desc.maker: "Cascading surges burn through transmission circuits across the field. Affected colonies suffer severe damage and will need years to recover. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.424.desc.other: "The zero-point grid in [from.GetName]'s interference field has collapsed, damaging affected colonies."
 AIO_interference_events.424.option.maker: "$AIO_interference_accidence_option.collapse$"

 AIO_interference_events.425.name: "The Experiment Is Cancelled"
 AIO_interference_events.425.desc.maker: "The field's influence is weakening, generator output is settling, and the distribution grid is stable again. Damaged circuits still need repair, but the cascading failures have stopped. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.425.desc.other: "The interference field of [from.GetName] is weakening and its zero-point surges are ending."

 #endregion

 #region ecology backlash

 AIO_interference_ecology_backlash: "Ecological Evolution Backlash: [Target.GetName]"
 AIO_interference_ecology_backlash_type: "Ecological Evolution Backlash"
 AIO_interference_ecology_backlash_desc: "Abnormal growth is spreading through several systems covered by our field. Affected colonies gain food and biomass but face roots, spores, and growing supply demands."
 AIO_interference_ecology_backlash_monthly_change_tooltip: "With Ecological Evolution active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_ecology_maintain: "$AIO_interference_accidence_maintain$"
 AIO_ecology_maintain_desc: "Keep the current field settings and observe how growth and environmental adaptation change."
 AIO_ecology_blockade: "$AIO_interference_accidence_blockade$"
 AIO_ecology_blockade_desc: "Isolate the expanding biome and keep roots and spores from reaching more territory."
 AIO_ecology_reverse: "$AIO_interference_accidence_reverse$"
 AIO_ecology_reverse_desc: "Retune the effect on growth cycles, preserving productive potential while limiting the spread."

 AIO_ecology_backlash_1: "Ecological Swell I"
 AIO_ecology_backlash_1_desc: "Biological activity and terraforming accelerate; any colonies gain food and biomass while supply pressure begins to rise."
 AIO_ecology_backlash_2: "Ecological Swell II"
 AIO_ecology_backlash_2_desc: "Vegetation occupies usable ground; colonies, if present, face greater filtration and household supply costs."
 AIO_ecology_backlash_3: "Ecological Swell III"
 AIO_ecology_backlash_3_desc: "The expanding biome reaches its peak and reduces usable land; living conditions on any colonies also deteriorate."
 AIO_ecology_backlash_collapse_colony: "Biosphere Collapse"
 AIO_ecology_backlash_collapse_colony_desc: "Widespread dieback leaves the environment difficult to develop for years; farms and supplies on any colonies also suffer."

 d_AIO_ecology_overgrowth: "£blocker£ Root Residue"
 d_AIO_ecology_overgrowth_desc: "Dead roots and decaying matter cover utility lines and buildable land. The area must be cleared before development resumes."

 AIO_interference_events.430.name: "Ecological Threshold"
 AIO_interference_events.430.desc.maker: "Abnormal growth is spreading through systems covered by our interference field. Affected colonies gain food and biomass output while roots, spores, and supply demands strain their infrastructure."
 AIO_interference_events.430.desc.other: "Abnormal growth is spreading through systems covered by [from.GetName]'s ecological interference field. Biomes are expanding in our affected systems and colonial supplies are under pressure."
 AIO_interference_events.430.option.maker: "Open the accident protocol."

 AIO_interference_events.431.name: "The First Spread"
 AIO_interference_events.431.desc.maker: "The first growth wave sweeps across the field. Roots invade utility lines and spores enter cultivation facilities, briefly damaging production on affected colonies."
 AIO_interference_events.431.desc.other: "The first growth wave from [from.GetName]'s field has struck utility lines and cultivation facilities on our affected colonies."
 AIO_interference_events.431.option.maker: "Record the losses."

 AIO_interference_events.432.name: "Runaway Spread"
 AIO_interference_events.432.desc.maker: "The biome spreads along water, ventilation, and transport networks. Affected colonies suffer further damage as vegetation occupies usable ground."
 AIO_interference_events.432.desc.other: "The biome in [from.GetName]'s field continues to spread. Our affected colonies suffer further damage and lose usable ground."
 AIO_interference_events.432.option.maker: "Keep the biome contained."

 AIO_interference_events.433.name: "Harnessed Backlash"
 AIO_interference_events.433.desc.maker: "Our researchers have stabilized growth cycles throughout the field. Crops remain productive while roots and spores stay out of production areas. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.433.desc.other: "[from.GetName] has stabilized its ecological field. The abnormal spread through our affected systems has stopped and cleanup can begin."

 AIO_interference_events.434.name: "Biosphere Collapse"
 AIO_interference_events.434.desc.maker: "Overcrowded biomes exhaust their nutrients and die back across the field. Affected colonies suffer severe damage, and roots and decay will obstruct development for years. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.434.desc.other: "[from.GetName] has suffered a biosphere collapse. Our affected colonies are severely damaged, and dead vegetation will obstruct development for years."
 AIO_interference_events.434.option.maker: "$AIO_interference_accidence_option.collapse$"

 AIO_interference_events.435.name: "The Experiment Is Cancelled"
 AIO_interference_events.435.desc.maker: "The field is weakening and abnormal growth is slowing. Affected facilities still need clearing, but the spread is under control. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.435.desc.other: "[from.GetName]'s ecological field is weakening. The abnormal spread in our affected systems has stopped, though residual vegetation remains."

 #endregion

 #region industry backlash

 AIO_interference_industry_backlash: "Industrial Refining Backlash: [Target.GetName]"
 AIO_interference_industry_backlash_type: "Industrial Refining Backlash"
 AIO_interference_industry_backlash_desc: "Material phase changes and anomalous heat are accelerating through several systems covered by our field. Affected mines and refineries gain output while maintenance and construction costs rise."
 AIO_interference_industry_backlash_monthly_change_tooltip: "With Industrial Refining active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_industry_maintain: "$AIO_interference_accidence_maintain$"
 AIO_industry_maintain_desc: "Keep the current field settings and continue measuring ore separation and anomalous heat."
 AIO_industry_blockade: "$AIO_interference_accidence_blockade$"
 AIO_industry_blockade_desc: "Slow material phase changes and isolate overheated regions while anomalous heat recedes."
 AIO_industry_reverse: "$AIO_interference_accidence_reverse$"
 AIO_industry_reverse_desc: "Find a stable range for ore separation and temperature, preserving productive potential while reducing wear."

 AIO_industry_backlash_1: "Smelter Overload I"
 AIO_industry_backlash_1_desc: "Mineral and alloy potential rises; colonies, if present, need more furnace linings, spare parts, and new facilities."
 AIO_industry_backlash_2: "Smelter Overload II"
 AIO_industry_backlash_2_desc: "Material phase changes accelerate; colonies, if present, face higher ore, maintenance, and expansion costs."
 AIO_industry_backlash_3: "Smelter Overload III"
 AIO_industry_backlash_3_desc: "Mineral and alloy gains reach their peak; sustained output on any colonies requires more feedstock and frequent repairs."
 AIO_industry_backlash_collapse_colony: "Industrial Shutdown"
 AIO_industry_backlash_collapse_colony_desc: "Anomalous heat and slag obstruct development for years; mines and refineries on any colonies also lose output."

 d_AIO_industry_slag_residue: "£blocker£ Slag Residue"
 d_AIO_industry_slag_residue_desc: "Slag and solidified iron clog transport routes; the burned-out equipment frames still need dismantling."

 AIO_interference_events.440.name: "Refining at the Limit"
 AIO_interference_events.440.desc.maker: "Ore separation and material phase changes are accelerating throughout our field. Affected colonies gain mineral and alloy output while anomalous heat and maintenance demand rise."
 AIO_interference_events.440.desc.other: "Anomalous heat is rising in systems covered by [from.GetName]'s industrial field. Our affected mines and refineries gain output but face greater maintenance demands."
 AIO_interference_events.440.option.maker: "Open the accident protocol."

 AIO_interference_events.441.name: "The First Overheat"
 AIO_interference_events.441.desc.maker: "The first overheating wave strikes the field. Cooling pumps stop and molten material spills from channels, forcing ore transport and smelting on affected colonies to slow."
 AIO_interference_events.441.desc.other: "The first overheating wave from [from.GetName]'s field has struck mines and transport lines on our affected colonies."
 AIO_interference_events.441.option.maker: "Record the losses."

 AIO_interference_events.442.name: "Production Jam"
 AIO_interference_events.442.desc.maker: "Anomalous heat continues to disrupt ore bodies and transport. Affected colonies suffer further damage as clearing and rebuilding production lines consumes more material."
 AIO_interference_events.442.desc.other: "[from.GetName]'s industrial field overheats again, causing further damage to production lines on our affected colonies."
 AIO_interference_events.442.option.maker: "Keep the lines pressed."

 AIO_interference_events.443.name: "Harnessed Backlash"
 AIO_interference_events.443.desc.maker: "Our researchers have found a stable range for ore supply and furnace temperatures. Minerals and alloys remain abundant without uncontrolled equipment wear. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.443.desc.other: "[from.GetName] has stabilized its industrial field. Abnormal heat has receded in our affected systems while extraction and smelting retain their gains."

 AIO_interference_events.444.name: "Industrial Shutdown"
 AIO_interference_events.444.desc.maker: "Cooling loops fail in succession, and molten material solidifies into broad slag beds. Affected colonies suffer severe damage; mines and refineries will take years to recover. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.444.desc.other: "[from.GetName]'s industrial field has collapsed. Our affected colonies are severely damaged, and slag will obstruct development for years."
 AIO_interference_events.444.option.maker: "$AIO_interference_accidence_option.collapse$"

 AIO_interference_events.445.name: "The Experiment Is Cancelled"
 AIO_interference_events.445.desc.maker: "The field is weakening and anomalous heat is falling. Damaged transport lines still need repair, but widespread overheating has stopped. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.445.desc.other: "[from.GetName]'s industrial field is weakening. Anomalous heat has receded in our affected systems, though residual slag remains."

 #endregion

 #region metric backlash

 AIO_interference_metric_backlash: "Metric Engineering Backlash: [Target.GetName]"
 AIO_interference_metric_backlash_type: "Metric Engineering Backlash"
 AIO_interference_metric_backlash_desc: "Space is folding through several systems covered by our field. Routes shorten and affected colonies gain usable districts, but coordinate drift strains infrastructure and navigation."
 AIO_interference_metric_backlash_monthly_change_tooltip: "With Metric Engineering active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_metric_maintain: "$AIO_interference_accidence_maintain$"
 AIO_metric_maintain_desc: "Keep the current field settings and measure the capacity and stability of the folded regions."
 AIO_metric_blockade: "$AIO_interference_accidence_blockade$"
 AIO_metric_blockade_desc: "Close unstable folds and routes while local geometry gradually returns to its former shape."
 AIO_metric_reverse: "$AIO_interference_accidence_reverse$"
 AIO_metric_reverse_desc: "Establish a common spatial reference for worlds, routes, and potential building sites, preserving usable space while limiting rebounds."

 AIO_metric_backlash_1: "Geometric Distortion I"
 AIO_metric_backlash_1_desc: "Usable space and travel speed increase while navigation grows harder; any colonies gain districts and faster construction."
 AIO_metric_backlash_2: "Geometric Distortion II"
 AIO_metric_backlash_2_desc: "The folds spread and fire-control errors rise; roads, utilities, and district upkeep on any colonies also suffer."
 AIO_metric_backlash_3: "Geometric Distortion III"
 AIO_metric_backlash_3_desc: "Usable space and travel effects peak while coordinate drift disrupts gunnery; construction and travel on any colonies also suffer."
 AIO_metric_backlash_collapse_colony: "Geometric Collapse"
 AIO_metric_backlash_collapse_colony_desc: "Some usable space contracts and travel remains disrupted; construction and district upkeep on any colonies also face years of pressure."

 d_AIO_metric_fold_residue: "£blocker£ Residual Fold"
 d_AIO_metric_fold_residue_desc: "Roads and building foundations overlap in one area. Crews must repeatedly survey adjacent districts before construction can resume."

 AIO_interference_events.450.name: "Metric Threshold"
 AIO_interference_events.450.desc.maker: "Space is folding throughout the systems covered by our field. Routes shorten and usable districts expand, but surveys, roads, and utility lines are increasingly difficult to align."
 AIO_interference_events.450.desc.other: "[from.GetName]'s metric field is folding space in our affected systems. Routes shorten while surveys and infrastructure maintenance become more difficult."
 AIO_interference_events.450.option.maker: "Open the accident protocol."

 AIO_interference_events.451.name: "The First Rebound"
 AIO_interference_events.451.desc.maker: "The first spatial rebound briefly displaces routes and surfaces across the field. Roads, utility lines, and building foundations on affected colonies suffer damage."
 AIO_interference_events.451.desc.other: "The first rebound from [from.GetName]'s metric field has struck buildings and utilities on our affected colonies."
 AIO_interference_events.451.option.maker: "Record the deformation."

 AIO_interference_events.452.name: "Geometric Recoil"
 AIO_interference_events.452.desc.maker: "Folded space rebounds again and route coordinates keep drifting. Affected colonies suffer further damage, construction slows, and ships must reduce speed to recalculate their courses."
 AIO_interference_events.452.desc.other: "[from.GetName]'s metric field rebounds again. Our affected colonies suffer further damage while ships recalculate their courses."
 AIO_interference_events.452.option.maker: "Keep the metric pinned."

 AIO_interference_events.453.name: "Harnessed Backlash"
 AIO_interference_events.453.desc.maker: "Our researchers have established a common spatial reference. Folded regions hold steady and new districts remain usable; roads, buildings, and routes no longer rebound without warning. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.453.desc.other: "[from.GetName] has stabilized its metric field. The folds in our affected systems have settled and the additional usable space remains."

 AIO_interference_events.454.name: "Geometric Collapse"
 AIO_interference_events.454.desc.maker: "Folded regions contract at once and route coordinates drift sharply. Affected colonies suffer severe damage; displaced terrain will obstruct construction and travel for years. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.454.desc.other: "[from.GetName]'s metric field has collapsed. Our affected colonies are severely damaged, and routes and surfaces will remain displaced for years."
 AIO_interference_events.454.option.maker: "$AIO_interference_accidence_option.collapse$"

 AIO_interference_events.455.name: "The Experiment Is Cancelled"
 AIO_interference_events.455.desc.maker: "The field is weakening and overlapping space is settling. Navigation coordinates agree again, though damaged streets still need repair. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.455.desc.other: "[from.GetName]'s metric field is weakening. Navigation coordinates in our affected systems agree again, though residual displacement remains."

 #endregion
