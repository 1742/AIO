l_english:
 #region psionic auras

 AIO_reality_interference_aura: "Reality Interference Field"
 AIO_reality_interference_aura_level_1_tt: "§HMild Reality Distortion§!"
 AIO_reality_interference_aura_level_2_tt: "§HSignificant Reality Distortion§!"
 AIO_reality_interference_aura_level_3_tt: "§RCritical Reality Distortion§!"
 AIO_interference_source_intensity_desc: "Reality Interferometer"
 AIO_interference_proof_intensity_desc: "Employed Reality Provers"
 AIO_interference_disconnected_desc: "Disconnected from Reality Interference Source"

 #endregion


 #region building

 building_AIO_reality_proof_facility: "Reality Proof Facility"
 building_AIO_reality_proof_facility_desc: "Researchers test how readily local reality can be rewritten."
 building_AIO_reality_proof_facility_tt: "Each 100 £job_physicist£ §Y$job_AIO_proof_researcher$§! add §G0.5§! monthly intensity to the local Reality Interference Field, counting at most 1,000 per system."

 #endregion


 #region job

 job_AIO_proof_researcher: "Reality Prover"
 job_AIO_proof_researcher_plural: "Reality Provers"
 job_AIO_proof_researcher_desc: "Demonstrates that familiar physical laws are merely one possible solution."
 mod_job_AIO_proof_researcher_add: "£job_physicist£ $job_AIO_proof_researcher$ Jobs"
 job_AIO_proof_drone: "Reality Proof Subroutine"
 job_AIO_proof_drone_plural: "Reality Proof Subroutines"
 job_AIO_proof_drone_desc: "Continuously validates and revises the laws governing local reality."
 mod_job_AIO_proof_drone_add: "£job_physicist£ $job_AIO_proof_drone$ Jobs"

 #endregion



 #region megastructure

 AIO_reality_interferometer: "Reality Interferometer"
 AIO_reality_interferometer_plural: "$AIO_reality_interferometer$"
 AIO_reality_interferometer_DESC: "A colossal apparatus that uses transcendent logic to force local reality toward a predetermined conclusion. When activated, it creates and intensifies a Reality Interference Field, replacing any Psionic Aura already present."
 AIO_reality_interferometer_MEGASTRUCTURE_DETAILS: "Construction activates a uniform source under the empire interference doctrine. Effects stack from up to three sources covering a system; effects on our assets also scale with aura level. Only one may be built in each system, and an empire may initially maintain up to five."
 AIO_requires_no_existing_reality_interferometer: "$TRIGGER_FAIL$A $AIO_reality_interferometer$ already exists in this system."
 AIO_requires_reality_interferometer_capacity: "$TRIGGER_FAIL$We can maintain no more than §Y5§! $AIO_reality_interferometer_plural$."

 #endregion


 #region modifier

 mod_AIO_interferometer_range: "Interferometer Effect Range"

 #endregion


 #region tooltips

 AIO_interferometer_completed: "The $AIO_reality_interferometer$ in the §H[from.GetName]§! system has completed."

 #endregion


 #region policy

 policy_policy_AIO_interference_doctrine: "Reality Interference Doctrine"
 policy_policy_AIO_interference_doctrine_desc: "Sets the combined effects produced by our Reality Interference Fields. Changing doctrine alters benefits, not field coverage or intensity."
 policy_AIO_interference_balanced: "Balanced Interference"
 policy_AIO_interference_energy: "Zero Point Energy"
 policy_AIO_interference_ecology: "Ecology Evolution"
 policy_AIO_interference_industry: "Refine Manufacture"
 policy_AIO_interference_metric: "Metric Engineering"

 #endregion


 #region interference accident (shared text)

 AIO_interference_accidence_maintain: "Maintain Experiment"
 AIO_interference_accidence_blockade: "Emergency Blockade"
 AIO_interference_accidence_reverse: "Reverse the Backlash"
 AIO_interference_accidence_progress_active: "Reality Interference Field"
 AIO_interference_accidence_progress_blockade: "$AIO_interference_accidence_blockade$"
 AIO_interference_accidence_progress_policy_mismatch: "Interference direction changed"
 AIO_interference_accidence_progress_disconnect: "Cut off from interference source"
 AIO_interference_accidence_backlash_monthly_change_tooltip: "Taking an active response means the situation is shaped by the §Ynumber of Reality Interference Field sources§! and by our §IProvers§!."
 AIO_interference_accidence_conclusion.no_reverse: "The field's grip on reality weakened after this burst. The universe seems to destabilise badly when a contradiction peaks, then snaps back into shape - it always drifts toward a steady state."
 AIO_interference_accidence_conclusion.reverse: "This is unlike our earlier experiments: the accident site now holds a different set of cosmic constants from everything around it, and our changes appear to be lasting."
 AIO_interference_accidence_option.abort: "A pity."
 AIO_interference_accidence_option.collapse: "A necessary sacrifice."
 AIO_interference_accidence_option.reverse: "We understand the universe a little better."

 #endregion


 #region backlash opinion and notice

 opinion_AIO_interference_accident: "Messing with reality"
 AIO_interference_events.390.name: "An Experiment Across the Border"
 AIO_interference_events.390.desc: "For months the readings in our system kept losing their footing, and our engineers wrote them off as faulty equipment. Now the truth has arrived: [event_target:AIO_accident_owner.GetName] was using our system as a test site, and all it left behind is wrecked facilities and a note saying the data has been archived."
 AIO_interference_events.390.option: "Note it down."

 #endregion


 #region balanced backlash

 AIO_interference_balanced_backlash: "Balanced Interference Backlash: [Target.GetName]"
 AIO_interference_balanced_backlash_type: "Balanced Interference Backlash"
 AIO_interference_balanced_backlash_desc: "Reality in [Target.GetName] is evening out. The field is erasing every distinction: output, upkeep, growth, all of it drawn toward one flat line. At first it is a gift - every colony runs at the same efficiency, with no weak points. But evenness leaves no slack, and once something starts to drift, the whole region drifts with it."
 AIO_interference_balanced_backlash_monthly_change_tooltip: "With Balanced Interference active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_balanced_stage_one: "Converging Values"
 AIO_balanced_stage_one_desc: "Differences in output vanish first: every report comes back identical, and our planners find they have nothing left to decide - every figure is the same figure."
 AIO_balanced_stage_two: "Flattened Ratios"
 AIO_balanced_stage_two_desc: "The evenness spreads deeper. Comfort and order are dragged toward the same line, and no one can name what is wrong, only that everything is exactly adequate, and that adequacy feels wrong."
 AIO_balanced_stage_three: "Homogeneity Threshold"
 AIO_balanced_stage_three_desc: "The whole region has been dragged onto a single line. Output is absurd and the infrastructure cannot keep up, because nothing here stands out any more."

 AIO_balanced_maintain: "$AIO_interference_accidence_maintain$"
 AIO_balanced_maintain_desc: "What a beautiful equilibrium. We should take this chance and see how far the evenness can be pushed."
 AIO_balanced_blockade: "$AIO_interference_accidence_blockade$"
 AIO_balanced_blockade_desc: "Cut the colonies off from the field and let local differences grow back on their own. The accident stops here."
 AIO_balanced_reverse: "$AIO_interference_accidence_reverse$"
 AIO_balanced_reverse_desc: "We have seen how this average forms. Now we take it apart."

 AIO_balanced_accidence_1: "Homogenization I"
 AIO_balanced_accidence_1_desc: "Every figure drifts toward the middle, and the blessings and the bills arrive together."
 AIO_balanced_accidence_2: "Homogenization II"
 AIO_balanced_accidence_2_desc: "Output keeps climbing and so does the price: nothing here is tuned for efficiency any more."
 AIO_balanced_accidence_3: "Homogenization III"
 AIO_balanced_accidence_3_desc: "The whole region has been pulled onto one line: astonishing output, astonishing cost."
 AIO_balanced_misalignment: "Misalignment Shock"
 AIO_balanced_misalignment_desc: "The average lurched, every reading swung at once, and the colonies were dragged along with it."
 AIO_balanced_drift: "Ratio Drift"
 AIO_balanced_drift_desc: "The average is drifting, the whole region drifts with it, and every job costs more."
 AIO_balanced_collapse: "Homogeneous Collapse"
 AIO_balanced_collapse_desc: "A whole region was pulled to a single figure and collapsed all at once; this system will take years to be distinct again."

 d_AIO_balanced_uniform_residue: "£blocker£ Uniform Residue"
 d_AIO_balanced_uniform_residue_desc: "Ravines and wreckage pressed into a layer of featureless grey soil. Nothing can be built to stand out on it."

 AIO_interference_events.310.name: "Critical Evenness"
 AIO_interference_events.310.desc: "The field in [Target.GetName] is critical. Reality here is being smoothed flat: output and upkeep are both drawn toward a single line, and that line is drifting downward. We can act now, or watch a little longer and see how far it goes."
 AIO_interference_events.310.option: "Open the accident protocol."
 AIO_interference_events.311.name: "The First Misalignment"
 AIO_interference_events.311.desc: "The average lurched. Every reading in [Target.GetName] swung at the same instant, the colonies were dragged back and forth, the power failed, and output is still climbing."
 AIO_interference_events.311.option: "Record the deviation."
 AIO_interference_events.312.name: "Ratios Adrift"
 AIO_interference_events.312.desc: "The average is no longer stable, and the whole region is dragged along with it. Output is still absurd, but the evenness is being paid for in efficiency: nothing here can be optimised on its own any more."
 AIO_interference_events.312.option: "Keep the deviation suppressed."
 AIO_interference_events.313.name: "Harnessed Backlash"
 AIO_interference_events.313.desc: "Under the intervention of our finest scientists, the figures in [Target.GetName] are no longer forced onto a single line, but allowed to move freely inside a range we choose. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.313.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.314.name: "Homogeneous Collapse"
 AIO_interference_events.314.desc: "A whole region was flattened to a single figure and then collapsed all at once: colonies scorched, the ground pressed into a layer of uniform dust, and national output that will take years to be distinct again. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.314.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.315.name: "The Experiment Is Cancelled"
 AIO_interference_events.315.desc: "The accident is over, and the average is slowly scattering back into shape. This time nothing permanent was lost. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.315.option: "$AIO_interference_accidence_option.abort$"

 #endregion


 #region zero point energy backlash

 AIO_interference_energy_backlash: "Zero Point Energy Backlash: [Target.GetName]"
 AIO_interference_energy_backlash_type: "Zero Point Energy Backlash"
 AIO_interference_energy_backlash_desc: "The grid in [Target.GetName] is losing sync with its field. Stored charge is being thrown into the seams of reality: output climbs higher and higher, and it slips further and further out of our control. We can tune our equipment to hold it down, or take the chance to study how physical law is being rewritten."
 AIO_interference_energy_backlash_monthly_change_tooltip: "With Zero Point Energy active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_energy_stage_one: "Grid Desynchronization"
 AIO_energy_stage_one_desc: "The generators run smoother than they ever have, while the appliances stop matching: cranes stall without cause, and colonial broadcasts pick up static that should not exist."
 AIO_energy_stage_two: "Feedback Surges"
 AIO_energy_stage_two_desc: "The grid starts pushing its surplus charge back into the colonies. Lights burn too bright, shields flicker in dock, and the grid itself burns down into a blackout in a single instant."
 AIO_energy_stage_three: "Cascade Threshold"
 AIO_energy_stage_three_desc: "The surge no longer needs cables to travel. Every power system in the system hangs off the edge of the field: output is absurd, the same current is eating through the infrastructure, and nothing is stable any more."

 AIO_energy_maintain: "$AIO_interference_accidence_maintain$"
 AIO_energy_maintain_desc: "What a magnificent phenomenon. We should seize this rare chance and study it!"
 AIO_energy_blockade: "$AIO_interference_accidence_blockade$"
 AIO_energy_blockade_desc: "Cut the colonies off from the grid and let the surges spend themselves in the isolation layer. The accident stops here."
 AIO_energy_reverse: "$AIO_interference_accidence_reverse$"
 AIO_energy_reverse_desc: "With what we know of cosmic law and higher dimensions, we will guide the flow of energy back into place."

 AIO_energy_accidence_1: "Grid Overload I"
 AIO_energy_accidence_1_desc: "The generators like it; the motors do not."
 AIO_energy_accidence_2: "Grid Overload II"
 AIO_energy_accidence_2_desc: "The surges grow stronger and generation keeps climbing, and the bill spreads from the foundations to the docks and the fleet."
 AIO_energy_accidence_3: "Grid Overload III"
 AIO_energy_accidence_3_desc: "The whole system is trembling with the grid, and the surge has left common sense behind."
 AIO_energy_blackout: "Grid Blackout"
 AIO_energy_blackout_desc: "The surge burned through the local power systems and the colony is offline."
 AIO_energy_grid_drain: "Grid Brownout"
 AIO_energy_grid_drain_desc: "The surges wash back and forth through the system and the grid is forced to run at reduced load."
 AIO_energy_grid_collapse: "Grid Collapse"
 AIO_energy_grid_collapse_desc: "The zero point grid burned through; this system's power supply will take years to recover."

 d_AIO_energy_cascade_residue: "£blocker£ Cascade Residue"
 d_AIO_energy_cascade_residue_desc: "Ionized slag left where the grid burned through, still humming as it discharges."

 AIO_interference_events.320.name: "Grid Frequency Divergence"
 AIO_interference_events.320.desc: "The field in [Target.GetName] is critical. The zero point grid swings between two incompatible energy states, and every swing leaves a mark in reality that cannot be scrubbed out. We can act now, or watch a little longer and see how far it goes."
 AIO_interference_events.320.option: "Open the accident protocol."
 AIO_interference_events.321.name: "The First Surge"
 AIO_interference_events.321.desc: "The grid threw its stored charge in one go. Several fires broke out across the colonies in [Target.GetName], their power systems blacked out, and energy output is still climbing."
 AIO_interference_events.321.option: "Record the damage."
 AIO_interference_events.322.name: "Cascade Through the Grid"
 AIO_interference_events.322.desc: "The second surge stopped following the cables and started following the field instead. The national grid is forced to run at reduced load for a year, the colonies are damaged again, and the output curve is still terrifyingly high."
 AIO_interference_events.322.option: "Keep the grid isolated."
 AIO_interference_events.323.name: "Harnessed Backlash"
 AIO_interference_events.323.desc: "Under the intervention of our finest scientists, the surge of energy in [Target.GetName] is gradually brought under control, the flow turning from chaotic turbulence into a steady river. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.323.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.324.name: "Grid Collapse"
 AIO_interference_events.324.desc: "A colossal energy surge burned through the grid in [Target.GetName]: colonies scorched, ionized residue heaped over the ruins, and national power that will take years to recover. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.324.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.325.name: "The Experiment Is Cancelled"
 AIO_interference_events.325.desc: "The accident is over, and by luck the grid is not a total write-off. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.325.option: "$AIO_interference_accidence_option.abort$"

 #endregion

 #region ecology backlash

 AIO_interference_ecology_backlash: "Ecology Evolution Backlash: [Target.GetName]"
 AIO_interference_ecology_backlash_type: "Ecology Evolution Backlash"
 AIO_interference_ecology_backlash_desc: "The biosphere of [Target.GetName] is slipping out of control. The field makes every plant, every animal and every colony of them grow faster than they should: the output curve climbs, and the same vitality is eating through the infrastructure that carries it. We can pour equipment into holding it down, or take the chance to study why life can grow like this."
 AIO_interference_ecology_backlash_monthly_change_tooltip: "With Ecology Evolution active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_ecology_stage_one: "Overgrowth"
 AIO_ecology_stage_one_desc: "The first thing to change is the paperwork from the fields and the pens: nothing can be harvested fast enough, and everything grows quicker than it used to."
 AIO_ecology_stage_two: "Runaway Biome"
 AIO_ecology_stage_two_desc: "What grew no longer obeys. Roots get into the cable trenches, spores clog the vents, and maintenance runs around the clock just to keep the growth outside the habitable decks."
 AIO_ecology_stage_three: "Biosphere Overload"
 AIO_ecology_stage_three_desc: "The biosphere of the whole system has merged into one organism. Output is astonishing, and the same growth is feeding on the foundations, the conduits and the docks."

 AIO_ecology_maintain: "$AIO_interference_accidence_maintain$"
 AIO_ecology_maintain_desc: "What magnificent life. We should take this chance and see how far it can grow."
 AIO_ecology_blockade: "$AIO_interference_accidence_blockade$"
 AIO_ecology_blockade_desc: "Cut the colonies off from the biome and let each side keep to its own bounds. The accident stops here."
 AIO_ecology_reverse: "$AIO_interference_accidence_reverse$"
 AIO_ecology_reverse_desc: "We have seen the rules this growth follows. Now we draw it a new boundary."

 AIO_ecology_accidence_1: "Ecological Swell I"
 AIO_ecology_accidence_1_desc: "Every field and every pen overshoots its quota, and nobody has stopped to ask why."
 AIO_ecology_accidence_2: "Ecological Swell II"
 AIO_ecology_accidence_2_desc: "Roots in the conduits, spores in the vents, and the crews on permanent damage control."
 AIO_ecology_accidence_3: "Ecological Swell III"
 AIO_ecology_accidence_3_desc: "One organism, one appetite, and the infrastructure is on the menu."
 AIO_ecology_bloom: "Ecological Bloom"
 AIO_ecology_bloom_desc: "The growth went past every bound at once: spores and roots everywhere, and the colonies are paying for it."
 AIO_ecology_choke: "Ecological Choke"
 AIO_ecology_choke_desc: "The biome is strangling everything around it: terraforming stalls, and every job pays more for the privilege."
 AIO_ecology_collapse: "Biosphere Collapse"
 AIO_ecology_collapse_desc: "A whole biosphere overshot its limit and came down together; this system will take years to recover."

 d_AIO_ecology_overgrowth: "£blocker£ Overgrowth Residue"
 d_AIO_ecology_overgrowth_desc: "Thick mats of root and rot left where the bloom died back. Nothing can be planted on it with any confidence."

 AIO_interference_events.330.name: "Critical Ecosystem"
 AIO_interference_events.330.desc: "The field in [Target.GetName] is critical. The biosphere here is accelerating: output and growth both shoot upwards, and the structures that carry them are thinning out. We can act now, or watch a little longer and see how far it goes."
 AIO_interference_events.330.option: "Open the accident protocol."
 AIO_interference_events.331.name: "The First Bloom"
 AIO_interference_events.331.desc: "The first bloom: spores and roots went past their tolerances at once, colony after colony raised alarms in [Target.GetName], the pens and the silos burst - and output is still climbing."
 AIO_interference_events.331.option: "Record the losses."
 AIO_interference_events.332.name: "Runaway Spread"
 AIO_interference_events.332.desc: "The biome no longer needs a medium to spread through. The biosphere of the whole region has grown into a single body, national upkeep is being pushed up, the colonies are damaged again, and the output curve is still astonishing."
 AIO_interference_events.332.option: "Keep the biome contained."
 AIO_interference_events.333.name: "Harnessed Backlash"
 AIO_interference_events.333.desc: "Under the intervention of our finest scientists, growth in [Target.GetName] is once again confined to its own bounds: the vitality remains, the runaway is over. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.333.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.334.name: "Biosphere Collapse"
 AIO_interference_events.334.desc: "A whole biosphere went past its limit in a single instant and came down together: colonies buried under root and rot, and output that will take years to recover. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.334.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.335.name: "The Experiment Is Cancelled"
 AIO_interference_events.335.desc: "The accident is over, and the surplus growth is receding on its own. This time nothing permanent was lost. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.335.option: "$AIO_interference_accidence_option.abort$"

 #endregion

 #region industry backlash

 AIO_interference_industry_backlash: "Refine Manufacture Backlash: [Target.GetName]"
 AIO_interference_industry_backlash_type: "Refine Manufacture Backlash"
 AIO_interference_industry_backlash_desc: "The smelting districts of [Target.GetName] are running past their tolerances. The field makes every pass through the furnaces more thorough than the last: the mineral and alloy curves climb together, and the plant is wearing itself out at the same rate. We can pour equipment into cooling it down, or take the chance to study how far matter can be refined."
 AIO_interference_industry_backlash_monthly_change_tooltip: "With Refine Manufacture active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_industry_stage_one: "Overrun"
 AIO_industry_stage_one_desc: "The first change shows up on the output sheets: every mine and every furnace is beating its quota, and the equipment runs a little hotter than the design allows."
 AIO_industry_stage_two: "Runaway Wear"
 AIO_industry_stage_two_desc: "The wear is showing. Maintenance crews work around the clock, and it takes more ore every week to hold the same output."
 AIO_industry_stage_three: "Redline Threshold"
 AIO_industry_stage_three_desc: "The whole district is screaming at full load. Output is astonishing, rebuilding costs are just as astonishing, and every machine is one fault away from stopping."

 AIO_industry_maintain: "$AIO_interference_accidence_maintain$"
 AIO_industry_maintain_desc: "What magnificent plant. We should take this chance and see how far it can be squeezed."
 AIO_industry_blockade: "$AIO_interference_accidence_blockade$"
 AIO_industry_blockade_desc: "Cut the colonies off from the smelting districts and let the furnaces cool back to their design limits. The accident stops here."
 AIO_industry_reverse: "$AIO_interference_accidence_reverse$"
 AIO_industry_reverse_desc: "We have seen the rules this refining follows. Now we fit it with a safety valve."

 AIO_industry_accidence_1: "Smelter Overload I"
 AIO_industry_accidence_1_desc: "Every furnace beats its quota, and the crews have logged the temperature as an oddity rather than a fault."
 AIO_industry_accidence_2: "Smelter Overload II"
 AIO_industry_accidence_2_desc: "Replacement parts around the clock, and more ore every week for the same output."
 AIO_industry_accidence_3: "Smelter Overload III"
 AIO_industry_accidence_3_desc: "Full load everywhere, output and rebuilding costs in a race, and one fault away from silence."
 AIO_industry_overheat: "Furnace Overheat"
 AIO_industry_overheat_desc: "The furnaces threw off their control systems: the lines stopped for a cycle, and output is still climbing."
 AIO_industry_jam: "Production Jam"
 AIO_industry_jam_desc: "The plant runs flat out because it cannot stop: national upkeep is climbing, and so is the price of rebuilding any of it."
 AIO_industry_collapse: "Industrial Shutdown"
 AIO_industry_collapse_desc: "The whole smelting district went past its limit in a single instant and stopped together; this system will take years to bring its costs back down."

 d_AIO_industry_slag_residue: "£blocker£ Slag Residue"
 d_AIO_industry_slag_residue_desc: "Caked slag and burnt-out frames left where the smelting districts stopped. It cannot be cleared in any hurry."

 AIO_interference_events.340.name: "Critical Refining"
 AIO_interference_events.340.desc: "The field in [Target.GetName] is critical. The smelting districts here are running past their tolerances: mineral and alloy output both shoot upwards, and the service life of the plant is shrinking at the same rate. We can act now, or watch a little longer and see how far it goes."
 AIO_interference_events.340.option: "Open the accident protocol."
 AIO_interference_events.341.name: "The First Overheat"
 AIO_interference_events.341.desc: "The first overheat: furnace temperatures ran away from the control systems, colony after colony raised alarms in [Target.GetName], the lines were forced to stop for a cycle - and output is still climbing."
 AIO_interference_events.341.option: "Record the losses."
 AIO_interference_events.342.name: "Production Jam"
 AIO_interference_events.342.desc: "The lines are no longer under control. The whole district is being forced to run at full load, national upkeep is being pushed up, rebuilding costs are climbing with it, and the colonies are damaged again."
 AIO_interference_events.342.option: "Keep the lines pressed."
 AIO_interference_events.343.name: "Harnessed Backlash"
 AIO_interference_events.343.desc: "Under the intervention of our finest scientists, the refining process in [Target.GetName] is pressed back inside its design range: the output remains, the runaway is over. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.343.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.344.name: "Industrial Shutdown"
 AIO_interference_events.344.desc: "The whole smelting district went past its limit in a single instant and stopped together: colonies buried in slag, and rebuilding costs that will take years to come back down. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.344.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.345.name: "The Experiment Is Cancelled"
 AIO_interference_events.345.desc: "The accident is over, and the excess load is bleeding off on its own. This time nothing permanent was lost. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.345.option: "$AIO_interference_accidence_option.abort$"

 #endregion

 #region metric backlash

 AIO_interference_metric_backlash: "Metric Engineering Backlash: [Target.GetName]"
 AIO_interference_metric_backlash_type: "Metric Engineering Backlash"
 AIO_interference_metric_backlash_desc: "The geometry of [Target.GetName] is being folded over and over. The field flattens distance, which fits more usable space into the system and moves construction along at an impossible pace - and the metric holding it together is not stable: every so often it springs back a little. We can pour equipment into pinning it down, or take the chance to study what the space of reality actually is."
 AIO_interference_metric_backlash_monthly_change_tooltip: "With Metric Engineering active, $AIO_interference_accidence_backlash_monthly_change_tooltip$"

 AIO_metric_stage_one: "Spatial Folding"
 AIO_metric_stage_one_desc: "Distance starts to compress. Planners keep finding more usable area in the same ground, construction crews get their materials far sooner than they should, and nobody wants to be the one to ask why."
 AIO_metric_stage_two: "Metric Instability"
 AIO_metric_stage_two_desc: "The folding no longer holds. Every so often the creases spring back a little: conduits misalign, foundations are re-laid, and the district maintenance bill starts to run away."
 AIO_metric_stage_three: "Geometric Threshold"
 AIO_metric_stage_three_desc: "The whole region hangs on an unstable metric. Space is packed with structures, construction is absurdly fast, and the metric itself could turn over at any moment."

 AIO_metric_maintain: "$AIO_interference_accidence_maintain$"
 AIO_metric_maintain_desc: "What magnificent space. We should take this chance and see how deep it can be folded."
 AIO_metric_blockade: "$AIO_interference_accidence_blockade$"
 AIO_metric_blockade_desc: "Cut the colonies off from the folded region and let the metric spring back on its own. The accident stops here."
 AIO_metric_reverse: "$AIO_interference_accidence_reverse$"
 AIO_metric_reverse_desc: "We have seen the rules this folding follows. Now we set it a baseline."

 AIO_metric_accidence_1: "Geometric Distortion I"
 AIO_metric_accidence_1_desc: "The same ground measures out more usable area, and nobody has stopped to ask why."
 AIO_metric_accidence_2: "Geometric Distortion II"
 AIO_metric_accidence_2_desc: "The creases start springing back: conduits misalign, foundations are re-laid, and the bill arrives with them."
 AIO_metric_accidence_3: "Geometric Distortion III"
 AIO_metric_accidence_3_desc: "Space is packed full, construction is absurdly fast, and the metric could turn over at any moment."
 AIO_metric_shear: "Metric Shear"
 AIO_metric_shear_desc: "A crease in space tore open: construction stalled for a cycle, and our ships could barely move through the system."
 AIO_metric_inversion: "Metric Inversion"
 AIO_metric_inversion_desc: "The metric turned over: distances stopped being trustworthy, district upkeep went through the roof, and fleet gunnery could not solve for anything."
 AIO_metric_collapse: "Geometric Collapse"
 AIO_metric_collapse_desc: "The folded metric came down all at once and took its extra room with it; this system will take years to measure out those areas again."

 d_AIO_metric_fold_residue: "£blocker£ Fold Residue"
 d_AIO_metric_fold_residue_desc: "Ground where the metric never fully settled back. The residual crease still eats into district upkeep."

 AIO_interference_events.350.name: "Critical Metric"
 AIO_interference_events.350.desc: "The field in [Target.GetName] is critical. Space here is being folded over and over: usable area appears out of nothing, construction runs at an impossible pace, and the metric that carries it all is losing its footing. We can act now, or watch a little longer and see how far it goes."
 AIO_interference_events.350.option: "Open the accident protocol."
 AIO_interference_events.351.name: "The First Fold"
 AIO_interference_events.351.desc: "The first springback: the creases in space let go all at once, colony after colony raised alarms in [Target.GetName], work in progress had to be redone - and the usable area is still growing."
 AIO_interference_events.351.option: "Record the deformation."
 AIO_interference_events.352.name: "Geometric Recoil"
 AIO_interference_events.352.desc: "The metric is no longer under control. Creases across the whole region pull against each other, district upkeep is being pushed up, our ships struggle to manoeuvre inside the system, and the colonies are damaged again."
 AIO_interference_events.352.option: "Keep the metric pinned."
 AIO_interference_events.353.name: "Harnessed Backlash"
 AIO_interference_events.353.desc: "Under the intervention of our finest scientists, the folding in [Target.GetName] is pinned back to a stable baseline: the extra room remains, the runaway is over. $AIO_interference_accidence_conclusion.reverse$"
 AIO_interference_events.353.option: "$AIO_interference_accidence_option.reverse$"
 AIO_interference_events.354.name: "Geometric Collapse"
 AIO_interference_events.354.desc: "The folded metric came down in a single instant: the extra room, the works in progress and the ships in dock were all dragged down with it, and this system will take years to recover. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.354.option: "$AIO_interference_accidence_option.collapse$"
 AIO_interference_events.355.name: "The Experiment Is Cancelled"
 AIO_interference_events.355.desc: "The accident is over, and the leftover creases are smoothing out on their own. This time nothing permanent was lost. $AIO_interference_accidence_conclusion.no_reverse$"
 AIO_interference_events.355.option: "$AIO_interference_accidence_option.abort$"

 #endregion
