l_english:
 #region psionic auras

 AIO_reality_interference_aura: "Reality Interference Field"
 AIO_interference_source_intensity_desc: "Reality Interferometer"
 AIO_interference_proof_intensity_desc: "Employed Reality Provers"
 AIO_interference_disconnected_desc: "Disconnected from Reality Interference Source"

 #endregion


 #region building

 building_AIO_reality_proof_facility: "Reality Proof Facility"
 building_AIO_reality_proof_facility_desc: "Researchers test how readily local reality can be rewritten."
 building_AIO_reality_proof_facility_tt: "Each 100 £job_physicist£ §Y$job_AIO_proof_researcher$§! add §G0.5§! monthly intensity to the local Reality Interference Field, counting at most 1,000 per system."

 #endregion


 #region job

 job_AIO_proof_researcher: "Reality Prover"
 job_AIO_proof_researcher_plural: "Reality Provers"
 job_AIO_proof_researcher_desc: "Demonstrates that familiar physical laws are merely one possible solution."
 mod_job_AIO_proof_researcher_add: "£job_physicist£ $job_AIO_proof_researcher$ Jobs"
 job_AIO_proof_drone: "Reality Proof Subroutine"
 job_AIO_proof_drone_plural: "Reality Proof Subroutines"
 job_AIO_proof_drone_desc: "Continuously validates and revises the laws governing local reality."
 mod_job_AIO_proof_drone_add: "£job_physicist£ $job_AIO_proof_drone$ Jobs"

 #endregion



 #region megastructure

 AIO_reality_interferometer: "Reality Interferometer"
 AIO_reality_interferometer_plural: "$AIO_reality_interferometer$"
 AIO_reality_interferometer_DESC: "A colossal apparatus that uses transcendent logic to force local reality toward a predetermined conclusion. When activated, it creates and intensifies a Reality Interference Field, replacing any Psionic Aura already present."
 AIO_reality_interferometer_MEGASTRUCTURE_DETAILS: "Construction activates a uniform source under the empire interference doctrine. Effects stack from up to three sources covering a system; effects on our assets also scale with aura level. Only one may be built in each system, and an empire may initially maintain up to five."
 AIO_requires_no_existing_reality_interferometer: "$TRIGGER_FAIL$A $AIO_reality_interferometer$ already exists in this system."
 AIO_requires_reality_interferometer_capacity: "$TRIGGER_FAIL$We can maintain no more than §Y5§! $AIO_reality_interferometer_plural$."

 #endregion


 #region modifier

 mod_AIO_interferometer_range: "Interferometer Effect Range"

 #endregion


 #region tooltips

 AIO_interferometer_completed: "The $AIO_reality_interferometer$ in the §H[from.GetName]§! system has completed."

 #endregion


 #region policy

 policy_policy_AIO_interference_doctrine: "Reality Interference Doctrine"
 policy_policy_AIO_interference_doctrine_desc: "Sets the combined effects produced by our Reality Interference Fields. Changing doctrine alters benefits, not field coverage or intensity."
 policy_AIO_interference_balanced: "Balanced Interference"
 policy_AIO_interference_energy: "Zero Point Energy"
 policy_AIO_interference_ecology: "Ecological Evolution"
 policy_AIO_interference_industry: "Industrial Refining"
 policy_AIO_interference_metric: "Metric Engineering"

 #endregion


 #region interference accident (shared text)

 AIO_interference_backlash_maintain: "Maintain Experiment"
 AIO_interference_backlash_blockade: "Emergency Blockade"
 AIO_interference_backlash_reverse: "Reverse the Backlash"
 AIO_interference_backlash_progress.interferometer: "Reality Interference Field"
 AIO_interference_backlash_progress.blockade: "$AIO_interference_backlash_blockade$"
 AIO_interference_backlash_progress.policy_mismatch: "Interference direction changed"
 AIO_interference_backlash_progress.disconnect: "Cut off from interference source"
 AIO_interference_backlash_monthly_change_tooltip: "Taking an active response means the situation is shaped by the §Ynumber of Reality Interference Field sources§! and by our §IProvers§!."
 AIO_interference_backlash_conclusion.no_reverse: "The field's grip on reality weakened after this burst. The universe seems to destabilise badly when a contradiction peaks, then snaps back into shape - it always drifts toward a steady state."
 AIO_interference_backlash_conclusion.reverse: "This is unlike our earlier experiments: the accident site now holds a different set of cosmic constants from everything around it, and our changes appear to be lasting."
 AIO_interference_backlash_option.abort: "A pity."
 AIO_interference_backlash_option.collapse: "A necessary sacrifice."
 AIO_interference_backlash_option.reverse: "We understand the universe a little better."

 #endregion


 #region backlash opinion and notice


 opinion_AIO_interference_backlash: "Messing with reality"
 AIO_interference_notice.option: "Report received."
 AIO_interference_notice.collapse_option: "We will remember this."

 #endregion


 #region balanced backlash

 AIO_interference_balanced_backlash: "Balanced Interference Backlash"
 AIO_interference_balanced_backlash_type: "$AIO_interference_balanced_backlash$"
 AIO_interference_balanced_backlash_desc: "Our interference field is disrupting production across several systems. Affected colonies gain output, but their supply, transport, and repair schedules risk cascading shutdowns."
 AIO_interference_balanced_backlash_monthly_change_tooltip: "With Balanced Interference active, $AIO_interference_backlash_monthly_change_tooltip$"

 AIO_balanced_maintain: "$AIO_interference_backlash_maintain$"
 AIO_balanced_maintain_desc: "Keep the current field settings and observe how far several resource and production effects can rise together."
 AIO_balanced_blockade: "$AIO_interference_backlash_blockade$"
 AIO_balanced_blockade_desc: "Isolate unstable field frequencies and reduce synchronization among resource and production processes."
 AIO_balanced_reverse: "$AIO_interference_backlash_reverse$"
 AIO_balanced_reverse_desc: "Retune the timing of the field effects, preserving the gains while limiting cascading disruptions."

 AIO_balanced_backlash_1: "Synchronized Output I"
 AIO_balanced_backlash_1_desc: "Several resource and production effects rise together; colonies, if present, face pressure on delivery and construction resources."
 AIO_balanced_backlash_2: "Synchronized Output II"
 AIO_balanced_backlash_2_desc: "The field gains strength; trade and construction on any colonies slow as their production cycles converge."
 AIO_balanced_backlash_3: "Synchronized Output III"
 AIO_balanced_backlash_3_desc: "The field reaches peak strength; colonies, if present, gain output while trade and construction remain disrupted."
 AIO_balanced_backlash_collapse_colony: "Cascading Shutdown"
 AIO_balanced_backlash_collapse_colony_desc: "The field falls broadly out of sync; damaged facilities and surplus material on any colonies will take years to clear."

 d_AIO_balanced_uniform_residue: "£blocker£ Mixed Waste Layer"
 d_AIO_balanced_uniform_residue_desc: "Ore dust, slag, and discarded materials left by the shutdown have hardened around the facilities. Clearing them will take time."

 AIO_interference_events.410.name: "An Embarrassment of Riches"
 AIO_interference_events.410.desc.maker: "At first, we assumed the colonial production reports were mistaken. Warehouses held more supplies than their intake records accounted for, and mines were shipping ore they had never extracted. Repeated audits have finally confirmed it: our interference field is creating resources out of nothing.\n\nThis is, of course, good news. The warehouse administrators have already submitted several requests for expansion, however. They seem rather less pleased than we are."
 AIO_interference_events.410.desc.other: "Colonies affected by [from.GetName]'s interference field report a curious occurrence: supplies with no intake records have appeared in warehouses, while mines have shipped ore that was never extracted. Local officials were investigating the accounts until the same materials began appearing in empty cargo holds.\n\nNo one can yet explain where these resources come from. Our ports have already begun making room for them."
 AIO_interference_events.410.option.maker: "We need more warehouses."

 AIO_interference_events.411.name: "A Full Load"
 AIO_interference_events.411.desc.maker: "Another wave of resources materialized ahead of schedule. Several freight yards filled before they could be cleared, conveyor belts snapped under the weight, and emergency shutdowns disrupted processing and power supplies. The colonies have had to divert construction equipment to remove raw materials from transport routes.\n\nOur researchers are delighted with the increase. The local damage reports, after all, are addressed to someone else."
 AIO_interference_events.411.desc.other: "The experiments of [from.GetName] have delivered another shipment to our colonies. There was no warning, and no unloading: already laden transport equipment suddenly found itself carrying more weight, causing a series of accidents in the freight yards.\n\nOperations have stopped for the cleanup. Vehicles and engineering equipment intended for construction are now occupied with all this additional wealth."
 AIO_interference_events.411.option.maker: "Send them the damage reports as well."

 AIO_interference_events.412.name: "Nowhere to Put It"
 AIO_interference_events.412.desc.maker: "Cleanup crews can no longer keep pace with the material appearing around them. Newly cleared yards fill again almost immediately, freighters waiting to unload occupy every berth, and repair equipment is stuck in transit. Our colonies have more supplies than ever, yet find it increasingly difficult to get anything where it is needed.\n\nWe have demonstrated that resources can appear from nothing. Where to put them was outside the scope of the original experiment."
 AIO_interference_events.412.desc.other: "Our ports have begun refusing new cargo requests. Colonies within the interference field have nowhere left to store the supplies that keep appearing. Accumulated freight obstructs maintenance, and fresh accidents slow the cleanup further. Trade and construction are both suffering.\n\n[from.GetName] continues its experiments. We can only keep making room for the results."
 AIO_interference_events.412.option.maker: "That belongs in the calculations too."

 AIO_interference_events.413.name: "To Each According to Need"
 AIO_interference_events.413.desc.maker: "After repeated adjustments, we have finally brought the rate of materialization into line with our colonies' processing capacity. Freight yards no longer fill overnight, transports can unload, and factories receive their materials on time. The expanded warehouses are at last serving their intended purpose.\n\nBetter still, the local physical constants have not immediately reverted. This time, we may persuade the universe to remain generous a little longer."
 AIO_interference_events.413.desc.other: "Colonies affected by [from.GetName]'s interference field can finally take stock of their gains. Supplies are still increasing abnormally, but no longer overwhelm local transport and processing facilities.\n\nThey seem to have found a way to control the experiment. At least our ports can accept ordinary cargo again."

 AIO_interference_events.414.name: "Cascading Shutdown"
 AIO_interference_events.414.desc.maker: "The final wave of resources overwhelmed the facilities still operating. Material feeds and power supplies failed in succession, leaving ore dust, slag, and unshipped stock piled throughout the industrial grounds. Many areas are now impassable. Cleanup and repairs will take years.\n\nThen the abnormal production stopped. Measurements show the physical constants returning to their original values. The universe has corrected our experiment, leaving us to clean up after it."
 AIO_interference_events.414.desc.other: "The experiments of [from.GetName] have ended in disaster. A final wave of material overwhelmed production facilities on our affected colonies, leaving the shuttered industrial grounds choked with ore dust, slag, and discarded supplies. Restoring production will take years.\n\nThe resources appearing from nothing have finally stopped multiplying. Now we must pay to have them removed."
 AIO_interference_events.414.option.maker: "At least we know where the limit is."

 AIO_interference_events.415.name: "Supply Meets Demand"
 AIO_interference_events.415.desc.maker: "As the field weakens, warehouse inventories finally match the accounts again. Our colonies are clearing freight backlogs and bringing idle facilities back online, though the earlier damage still needs attention.\n\nThe physical constants are also returning to familiar values. For a brief time, we had inexhaustible resources. Unfortunately, we did not also have inexhaustible warehouse space."
 AIO_interference_events.415.desc.other: "The interference field of [from.GetName] is weakening. Our colonies no longer report new material appearing, ports are clearing their freight backlogs, and damaged facilities are being repaired.\n\nLocal transport schedules can finally be based on how much is actually produced."

 #endregion


 #region zero point energy backlash

 AIO_interference_energy_backlash: "Zero Point Energy Backlash"
 AIO_interference_energy_backlash_type: "$AIO_interference_energy_backlash$"
 AIO_interference_energy_backlash_desc: "Zero-point energy is falling out of phase across several systems in our interference field. Surges reach ships and orbital space; affected colonies gain power output but face disruption to distribution and construction."
 AIO_interference_energy_backlash_monthly_change_tooltip: "With Zero Point Energy active, $AIO_interference_backlash_monthly_change_tooltip$"

 AIO_energy_maintain: "$AIO_interference_backlash_maintain$"
 AIO_energy_maintain_desc: "Keep the current field settings and study the relationship between zero-point output and frequency drift."
 AIO_energy_blockade: "$AIO_interference_backlash_blockade$"
 AIO_energy_blockade_desc: "Isolate unstable energy frequencies, reduce output, and block feedback surges."
 AIO_energy_reverse: "$AIO_interference_backlash_reverse$"
 AIO_energy_reverse_desc: "Retune the zero-point waveform and route surplus energy along controlled paths."

 AIO_energy_backlash_1: "Grid Overload I"
 AIO_energy_backlash_1_desc: "Zero-point energy and anomalous physics readings rise; transmission faults slow construction on any colonies."
 AIO_energy_backlash_2: "Grid Overload II"
 AIO_energy_backlash_2_desc: "Surges strengthen ship weapons but destabilize shields; any colonies gain power output while construction slows."
 AIO_energy_backlash_3: "Grid Overload III"
 AIO_energy_backlash_3_desc: "Zero-point energy and ship weapons reach peak output while shields remain unstable; colonial facilities, if present, also face repeated shocks."
 AIO_energy_backlash_collapse_colony: "Grid Collapse"
 AIO_energy_backlash_collapse_colony_desc: "Zero-point energy remains unstable for years; power distribution on any colonies is severely limited."

 d_AIO_energy_cascade_residue: "£blocker£ Fused Grid Debris"
 d_AIO_energy_cascade_residue_desc: "Burned conductors and insulation have fused together. Some areas still carry a residual charge."

 AIO_interference_events.420.name: "Additional Power"
 AIO_interference_events.420.desc.maker: "Zero-point generators within the field are exceeding their rated output without any additional input from us. At first, technicians suspected faulty instruments, until the backups returned identical readings.\n\nThe only concern is that the grid frequency has begun jumping between two values. Protective systems keep sounding alarms, but the generation figures look better by the day."
 AIO_interference_events.420.desc.other: "Under the influence of [from.GetName]'s interference field, our generating facilities have increased their output without any modifications. Meanwhile, grid frequencies have begun fluctuating repeatedly, and ships in orbit report similar power anomalies.\n\nThe additional energy remains usable for now, but our technicians have asked us not to ignore the persistent alarms."
 AIO_interference_events.420.option.maker: "Find out what is triggering the alarms."

 AIO_interference_events.421.name: "Power Surge"
 AIO_interference_events.421.desc.maker: "An unexpected energy pulse swept through the colonial grids. Substations tripped in succession, several distribution rooms caught fire, and construction sites ground to a halt. While technicians isolated the damaged circuits, the generators still running set another output record.\n\nOur method of extracting energy is clearly effective. The existing grid was not built for quite this degree of success."
 AIO_interference_events.421.desc.other: "An energy surge from [from.GetName]'s interference field has struck our transmission facilities. Protective systems on the surface tripped in succession, while ships in orbit experienced brief power interruptions.\n\nRepair crews are isolating damaged circuits. Generator output continues to rise, making it all the harder to restore power."
 AIO_interference_events.421.option.maker: "How much did the safeguards hold back?"

 AIO_interference_events.422.name: "No Wires Required"
 AIO_interference_events.422.desc.maker: "Disconnecting the lines failed to stop the second surge. Equipment already isolated from the grid still discharged, and several power nodes caught fire almost simultaneously. Energy is reaching them directly through the interference field, bypassing our isolation measures.\n\nThe fleet also reports substantially increased weapons output, accompanied by frequent shield instability. We appear to have solved the problem of transmitting energy over long distances. We simply cannot yet choose its destination."
 AIO_interference_events.422.desc.other: "A second surge struck equipment that had already been disconnected. Our isolation measures failed to stop energy passing through [from.GetName]'s interference field. More power facilities caught fire, forcing the colonies to reduce grid voltage.\n\nThe fleet reports increased weapons power, but increasingly unreliable shields. Those required to crew the ships find this a poor consolation."
 AIO_interference_events.422.option.maker: "We must address the field itself."

 AIO_interference_events.423.name: "Controlled Discharge"
 AIO_interference_events.423.desc.maker: "After recalibrating the field, we have successfully directed surplus energy into designated circuits. Monitoring equipment recorded the expected discharges, and the colonies reported no new fires. Zero-point generators continue to deliver impressive output.\n\nFor now, local physical constants have settled at their modified values. We can finally use this extra power without waiting for the next distribution room to explode."
 AIO_interference_events.423.desc.other: "[from.GetName] seems to have finally brought its interference field under control. Our power facilities no longer suffer sudden surges, while the abnormal increase in output remains.\n\nTechnicians are cautiously restoring power. They are not yet willing to remove the firefighting equipment stationed outside the distribution rooms."

 AIO_interference_events.424.name: "Grid Collapse"
 AIO_interference_events.424.desc.maker: "The final surge exceeded everything the grid could withstand. Main transmission lines burned out, conductors fused with their insulation, and colonies within the field lost power one after another. Some ruins are still discharging, preventing repair crews from even approaching. Reconstruction is expected to take years.\n\nThen the energy readings began to fall, and the physical constants slowly reverted. The experiment is over. The output records we once took such pride in are now the last data recorded before the disaster."
 AIO_interference_events.424.desc.other: "The zero-point energy experiments of [from.GetName] have finally burned out the grids on our affected colonies. Main transmission lines have melted through, power facilities lie in ruins that still discharge electricity, and extensive areas have lost power.\n\nEnergy levels within the field are falling, but that will not restore the ruined equipment. We face years of reconstruction to pay for this experiment."
 AIO_interference_events.424.option.maker: "Save the final readings."

 AIO_interference_events.425.name: "All Clear"
 AIO_interference_events.425.desc.maker: "The field's influence is fading. Zero-point generator output is falling, and grid frequencies have finally stabilized. Repair crews can begin replacing damaged lines without expecting another surge at any moment.\n\nThe physical constants are returning to their original values. The experiment has left us with plenty of worthwhile data, and a rather substantial list of repairs."
 AIO_interference_events.425.desc.other: "As [from.GetName]'s interference field weakens, our grid frequencies are returning to normal. Ships in orbit no longer report new power anomalies.\n\nDamaged lines still need replacing, but fresh surges are no longer interrupting the repairs."

 #endregion


 #region ecology backlash

 AIO_interference_ecology_backlash: "Ecological Evolution Backlash"
 AIO_interference_ecology_backlash_type: "$AIO_interference_ecology_backlash$"
 AIO_interference_ecology_backlash_desc: "Abnormal growth is spreading through several systems covered by our field. Affected colonies gain food and biomass but face roots, spores, and growing supply demands."
 AIO_interference_ecology_backlash_monthly_change_tooltip: "With Ecological Evolution active, $AIO_interference_backlash_monthly_change_tooltip$"

 AIO_ecology_maintain: "$AIO_interference_backlash_maintain$"
 AIO_ecology_maintain_desc: "Keep the current field settings and observe how growth and environmental adaptation change."
 AIO_ecology_blockade: "$AIO_interference_backlash_blockade$"
 AIO_ecology_blockade_desc: "Isolate the expanding biome and keep roots and spores from reaching more territory."
 AIO_ecology_reverse: "$AIO_interference_backlash_reverse$"
 AIO_ecology_reverse_desc: "Retune the effect on growth cycles, preserving productive potential while limiting the spread."

 AIO_ecology_backlash_1: "Ecological Swell I"
 AIO_ecology_backlash_1_desc: "Biological activity and terraforming accelerate; any colonies gain food and biomass while supply pressure begins to rise."
 AIO_ecology_backlash_2: "Ecological Swell II"
 AIO_ecology_backlash_2_desc: "Vegetation occupies usable ground; colonies, if present, face greater filtration and household supply costs."
 AIO_ecology_backlash_3: "Ecological Swell III"
 AIO_ecology_backlash_3_desc: "The expanding biome reaches its peak and reduces usable land; living conditions on any colonies also deteriorate."
 AIO_ecology_backlash_collapse_colony: "Biosphere Collapse"
 AIO_ecology_backlash_collapse_colony_desc: "Widespread dieback leaves the environment difficult to develop for years; farms and supplies on any colonies also suffer."

 d_AIO_ecology_overgrowth: "£blocker£ Root Residue"
 d_AIO_ecology_overgrowth_desc: "Dead roots and decaying matter cover utility lines and buildable land. The area must be cleared before development resumes."

 AIO_interference_events.430.name: "Life in Abundance"
 AIO_interference_events.430.desc.maker: "Crops within the interference field have matured ahead of schedule. Subsequent reports describe similar changes in pastures, cultivation pools, and even roadside vegetation. We have given life more favorable conditions, and life has responded immediately.\n\nThe agricultural authorities predict an unprecedented harvest this season. Those responsible for weeding have requested a revised budget."
 AIO_interference_events.430.desc.other: "The interference field of [from.GetName] has brought our colonies an unusually prosperous growing season. Food crops are maturing early, wild vegetation is spreading rapidly, and populations of several small animal species have noticeably increased.\n\nFor now, the farms are still celebrating the harvest. The pests in their fields appear to be doing rather well too."
 AIO_interference_events.430.option.maker: "They seem to like the new conditions."

 AIO_interference_events.431.name: "Breaking Ground"
 AIO_interference_events.431.desc.maker: "Vigorous root systems have found their way into urban utilities. They are splitting water pipes, invading cable ducts, and forcing their way up through several newly repaired roads. Meanwhile, air filters have begun clogging repeatedly. Removed cartridges are coated in spores.\n\nOur researchers remind us that this demonstrates how much better the modified environment supports life. Maintenance crews would like them to come and see for themselves."
 AIO_interference_events.431.desc.other: "Under the influence of [from.GetName]'s interference field, vegetation on our colonies has begun invading infrastructure. Roots are splitting underground pipes, spores are entering ventilation systems, and agricultural facilities have discovered growths that no one planted.\n\nLocal crews are removing the intruders, but fresh shoots often emerge before the workers have even left."
 AIO_interference_events.431.option.maker: "Give the researchers the utility plans."

 AIO_interference_events.432.name: "New Habitats"
 AIO_interference_events.432.desc.maker: "Water and ventilation systems have become ideal routes for the spread. We sealed several entry points, only to find new colonies of organisms at the other end of the pipes. Construction sites are rapidly turning green, and crews now spend more time clearing foundations than pouring them.\n\nEcological surveys indicate that the area available for habitation is increasing. The urban planning authorities take a different view."
 AIO_interference_events.432.desc.other: "Our clearance crews can no longer contain the vegetation. Roots spread along water pipes, spores enter sealed buildings through ventilation systems, and construction has been abandoned on several development sites. Previously repaired facilities have suffered fresh damage.\n\nThe abundance created by [from.GetName] is covering our colonies. At this rate, we may soon have to live in the gaps."
 AIO_interference_events.432.option.maker: "Leave some room for our cities."

 AIO_interference_events.433.name: "Everything in Moderation"
 AIO_interference_events.433.desc.maker: "We have finally found a way to limit the abnormal growth. The adjusted field still accelerates crop maturation, but no longer drives roots and spores to expand without restraint. Vegetation removed yesterday has not grown back today.\n\nLocal physical constants are holding at their new values for now. The agricultural authorities have kept their harvest, and the urban planners have kept their cities. Both are willing to call this a success."
 AIO_interference_events.433.desc.other: "[from.GetName] has adjusted its ecological interference field, finally halting the abnormal spread on our colonies. Crops are still thriving, but roots in the pipes no longer grow back overnight.\n\nClearance crews can at last move from one section of pipe to the next. Land occupied by vegetation may soon be usable again."

 AIO_interference_events.434.name: "The End of Growth"
 AIO_interference_events.434.desc.maker: "The densest growths were the first to wither. Rapid expansion exhausted the nutrients in the soil, and widespread dieback followed. Cultivation facilities were not spared. Colonies within the field are now covered in decaying biomass, with roots still firmly embedded in their utility networks.\n\nThe physical constants are reverting, but local ecosystems will take years to recover. We successfully shortened the process of growth, along with the time required to exhaust the land."
 AIO_interference_events.434.desc.other: "The lush growth within [from.GetName]'s interference field is rapidly dying back. Overcrowded organisms have exhausted their nutrients, cultivation facilities are severely damaged, and dead roots and decaying matter cover extensive tracts of land.\n\nThe pipes once blocked by vegetation are still blocked. Life has stopped expanding, but has not returned the space it occupied. Restoring the local environment will take years."
 AIO_interference_events.434.option.maker: "Include nutrients in the next calculation."

 AIO_interference_events.435.name: "The Growing Season Ends"
 AIO_interference_events.435.desc.maker: "As the field weakens, colonial growth cycles are returning to normal. Weeding is finally making progress, and air filters no longer clog with spores immediately after replacement. Damaged pipes and overgrown sites still require individual attention.\n\nThe physical constants are gradually reverting. Our researchers have begun cataloguing the experiment's biological samples, a considerable proportion of which were supplied by the maintenance department."
 AIO_interference_events.435.desc.other: "The interference field of [from.GetName] is weakening. Vegetation on our colonies has resumed its normal rate of growth, and clearance crews can finally keep pace.\n\nRoots still need digging out and pipes still need replacing, but at least a freshly cleared road can now stay open."

 #endregion


 #region industry backlash

 AIO_interference_industry_backlash: "Industrial Refining Backlash"
 AIO_interference_industry_backlash_type: "$AIO_interference_industry_backlash$"
 AIO_interference_industry_backlash_desc: "Material phase changes and anomalous heat are accelerating through several systems covered by our field. Affected mines and refineries gain output while maintenance and construction costs rise."
 AIO_interference_industry_backlash_monthly_change_tooltip: "With Industrial Refining active, $AIO_interference_backlash_monthly_change_tooltip$"

 AIO_industry_maintain: "$AIO_interference_backlash_maintain$"
 AIO_industry_maintain_desc: "Keep the current field settings and continue measuring ore separation and anomalous heat."
 AIO_industry_blockade: "$AIO_interference_backlash_blockade$"
 AIO_industry_blockade_desc: "Slow material phase changes and isolate overheated regions while anomalous heat recedes."
 AIO_industry_reverse: "$AIO_interference_backlash_reverse$"
 AIO_industry_reverse_desc: "Find a stable range for ore separation and temperature, preserving productive potential while reducing wear."

 AIO_industry_backlash_1: "Smelter Overload I"
 AIO_industry_backlash_1_desc: "Mineral and alloy potential rises; colonies, if present, need more furnace linings, spare parts, and new facilities."
 AIO_industry_backlash_2: "Smelter Overload II"
 AIO_industry_backlash_2_desc: "Material phase changes accelerate; colonies, if present, face higher ore, maintenance, and expansion costs."
 AIO_industry_backlash_3: "Smelter Overload III"
 AIO_industry_backlash_3_desc: "Mineral and alloy gains reach their peak; sustained output on any colonies requires more feedstock and frequent repairs."
 AIO_industry_backlash_collapse_colony: "Industrial Shutdown"
 AIO_industry_backlash_collapse_colony_desc: "Anomalous heat and slag obstruct development for years; mines and refineries on any colonies also lose output."

 d_AIO_industry_slag_residue: "£blocker£ Slag Residue"
 d_AIO_industry_slag_residue_desc: "Slag and solidified iron clog transport routes; the burned-out equipment frames still need dismantling."

 AIO_interference_events.440.name: "Ahead of Schedule"
 AIO_interference_events.440.desc.maker: "Ore separates more readily than before, and smelting takes less time. Mines and refineries within the interference field are increasing their output, leaving the old production schedules behind.\n\nMaintenance staff have also found that furnace linings need replacing sooner. We altered the properties of materials. Apparently, the furnaces themselves count as materials."
 AIO_interference_events.440.desc.other: "The interference field of [from.GetName] has altered smelting on our colonies. The same ore separates more quickly, allowing refineries to increase output without replacing any equipment.\n\nHowever, furnace temperatures are fluctuating inexplicably, and several batches of serviceable linings have been scrapped ahead of schedule. Plant administrators are calculating how much of this windfall they will actually get to keep."
 AIO_interference_events.440.option.maker: "Inspect the furnace linings."

 AIO_interference_events.441.name: "Residual Heat"
 AIO_interference_events.441.desc.maker: "Temperatures in several furnaces continued rising after heating power was reduced. Cooling pumps failed under sustained maximum load, and molten material overflowed its channels, forcing nearby transport and processing facilities to shut down.\n\nWe had assumed that faster reactions would mean finishing work sooner. The cooling systems, at least, appear to have other commitments."
 AIO_interference_events.441.desc.other: "Anomalous heat has struck industrial facilities affected by [from.GetName]'s interference field. Several smelters could not control furnace temperatures even after reducing power. Cooling equipment failed in succession, and spilled molten material damaged transport lines.\n\nLocal facilities have begun slowing their feedstock supply. However much they produce, they must first get it safely out of the furnace."
 AIO_interference_events.441.option.maker: "Get the cooling systems running first."

 AIO_interference_events.442.name: "Repairs in the Heat of the Moment"
 AIO_interference_events.442.desc.maker: "Replacement parts are failing faster than the previous batch. Anomalous heat is spreading through processing and transport facilities, warping conveyors and adding slag to passages that have yet to be cleared. To maintain production, the colonies must devote ever more material to repairs and modifications.\n\nThe refineries are still shipping alloys. Increasingly, those alloys are being shipped straight back as the next batch of spare parts."
 AIO_interference_events.442.desc.other: "Industrial facilities within [from.GetName]'s interference field have suffered further damage. Replacement parts failed to survive another bout of overheating, transport lines have stopped, and reconstruction requires still more material.\n\nOur factories are certainly producing more alloys. Looking at the growing repair orders, it is hard to say how much richer this has made us."
 AIO_interference_events.442.option.maker: "This hardly seems economical."

 AIO_interference_events.443.name: "Passed Inspection"
 AIO_interference_events.443.desc.maker: "After readjusting the interference parameters and feed rates, we have finally brought furnace temperatures within the capacity of the cooling equipment. Ore separation remains more efficient, the refineries have retained their extra output, and newly installed parts have passed several consecutive inspections.\n\nLocal physical constants are holding at their modified values for now. We can finally put the additional alloys to other uses, rather than repairing the machines that make them."
 AIO_interference_events.443.desc.other: "[from.GetName] has stabilized its interference field, and the abnormal heat troubling our mines and refineries is subsiding. Production remains above its previous level, but equipment is no longer being scrapped at an equally impressive rate.\n\nPlant administrators have recalculated their gains. This time, they are willing to count the additional output as goods available for delivery."

 AIO_interference_events.444.name: "After Cooling"
 AIO_interference_events.444.desc.maker: "The cooling circuits finally gave out. Molten material escaped the production facilities, flowed along transport routes, and solidified together with slag and ruined equipment. Industrial areas on the affected colonies are severely damaged. Many must be excavated before repairs can even begin.\n\nThe physical constants are reverting, and furnace temperatures have finally fallen. Clearing away these cooled results is expected to take several more years."
 AIO_interference_events.444.desc.other: "The experiments of [from.GetName] have left vast deposits of solidified slag. Our cooling facilities failed during the final bout of overheating, allowing molten material to flood transport routes and seal equipment into the bases of factory buildings.\n\nThe heat is subsiding, but mines and refineries can no longer operate normally. Dismantling wreckage, clearing routes, and restoring production will take years."
 AIO_interference_events.444.option.maker: "Keep samples. Clear away the rest."

 AIO_interference_events.445.name: "Normal Operating Temperature"
 AIO_interference_events.445.desc.maker: "As the field's influence fades, smelting processes are returning to their original parameters. Reducing power finally lowers furnace temperatures, and maintenance crews can approach previously overheated equipment. Damaged transport lines and residual slag still need attention.\n\nWe have retained all production records. Whoever is responsible for cooling should have a seat at the table when we design the next experiment."
 AIO_interference_events.445.desc.other: "The interference field of [from.GetName] is weakening. Anomalous heat in our industrial facilities is subsiding, furnace temperatures are manageable again, and mines and refineries can schedule maintenance.\n\nThe additional output is falling too. At least we are finally getting through fewer spare parts."

 #endregion

 #region metric backlash

 AIO_interference_metric_backlash: "Metric Engineering Backlash"
 AIO_interference_metric_backlash_type: "$AIO_interference_metric_backlash$"
 AIO_interference_metric_backlash_desc: "Space is folding through several systems covered by our field. Routes shorten and affected colonies gain usable districts, but coordinate drift strains infrastructure and navigation."
 AIO_interference_metric_backlash_monthly_change_tooltip: "With Metric Engineering active, $AIO_interference_backlash_monthly_change_tooltip$"

 AIO_metric_maintain: "$AIO_interference_backlash_maintain$"
 AIO_metric_maintain_desc: "Keep the current field settings and measure the capacity and stability of the folded regions."
 AIO_metric_blockade: "$AIO_interference_backlash_blockade$"
 AIO_metric_blockade_desc: "Close unstable folds and routes while local geometry gradually returns to its former shape."
 AIO_metric_reverse: "$AIO_interference_backlash_reverse$"
 AIO_metric_reverse_desc: "Establish a common spatial reference for worlds, routes, and potential building sites, preserving usable space while limiting rebounds."

 AIO_metric_backlash_1: "Geometric Distortion I"
 AIO_metric_backlash_1_desc: "Usable space and travel speed increase while navigation grows harder; any colonies gain districts and faster construction."
 AIO_metric_backlash_2: "Geometric Distortion II"
 AIO_metric_backlash_2_desc: "The folds spread and fire-control errors rise; roads, utilities, and district upkeep on any colonies also suffer."
 AIO_metric_backlash_3: "Geometric Distortion III"
 AIO_metric_backlash_3_desc: "Usable space and travel effects peak while coordinate drift disrupts gunnery; construction and travel on any colonies also suffer."
 AIO_metric_backlash_collapse_colony: "Geometric Collapse"
 AIO_metric_backlash_collapse_colony_desc: "Some usable space contracts and travel remains disrupted; construction and district upkeep on any colonies also face years of pressure."

 d_AIO_metric_fold_residue: "£blocker£ Residual Fold"
 d_AIO_metric_fold_residue_desc: "Roads and building foundations overlap in one area. Crews must repeatedly survey adjacent districts before construction can resume."

 AIO_interference_events.450.name: "Additional Space"
 AIO_interference_events.450.desc.maker: "Surveyors have measured more land between two established landmarks, while ships following familiar routes have arrived ahead of schedule. Repeated measurements have ruled out instrument failure: we really have made places larger where we need room, and distances shorter where we need to travel.\n\nThe colonies have already submitted new development proposals. Unfortunately, the attached maps were somewhat out of date by the time they arrived."
 AIO_interference_events.450.desc.other: "The interference field of [from.GetName] has changed distances within our territory. Colonies have measured usable space that did not previously exist, and ships have completed familiar journeys ahead of schedule.\n\nThese changes might be welcome, but surveyors have found that the coordinates of a single location still shift between measurements. It would be unwise to build from the new maps just yet."
 AIO_interference_events.450.option.maker: "Keep the old maps for now."

 AIO_interference_events.451.name: "Road Temporarily Closed"
 AIO_interference_events.451.desc.maker: "A spatial rebound briefly displaced sections of roads and utility lines. When the coordinates realigned, the broken pipes did not reconnect, and nearby building foundations were left cracked. Ships in orbit were forced to make emergency course corrections.\n\nThe survey department insists that its previous data was entirely correct at the time of measurement. We have no reason to doubt this, but the construction crews still need a map with a longer useful life."
 AIO_interference_events.451.desc.other: "Space within [from.GetName]'s interference field has undergone a sudden rebound. Streets and underground utilities on several colonies briefly shifted out of alignment, damaging building foundations and causing dangerous navigational errors along shipping routes.\n\nLocal authorities have closed the damaged streets. The roads are still there. We simply cannot guarantee that they lead where the maps say they do."
 AIO_interference_events.451.option.maker: "Survey again. Construction can wait."

 AIO_interference_events.452.name: "Recalculating Route"
 AIO_interference_events.452.desc.maker: "Another rebound has damaged colonial facilities. Newly surveyed plots have shifted, repaired pipes have broken again, and construction crews must wait for yet another survey. Ships are slowing down to verify their courses, while fire-control systems struggle to determine the actual distance to their targets.\n\nThe journeys are still shorter than before. We are spending the time saved establishing where we have actually arrived."
 AIO_interference_events.452.desc.other: "The interference field of [from.GetName] continues to alter space. Our colonies have suffered another rebound, several construction projects have stopped because their boundaries cannot be determined, and ships must slow down to keep correcting their courses and targeting solutions.\n\nNavigation systems are still recommending shorter routes. The fleet has asked them to recommend one that stays put."
 AIO_interference_events.452.option.maker: "Make the coordinates stay put first."

 AIO_interference_events.453.name: "The Final Map"
 AIO_interference_events.453.desc.maker: "The spatial reference established for our interference field has finally stabilized. Successive surveys return identical coordinates, the additional land has not vanished, and the shortened routes have not rebounded again. Construction crews can follow their plans, and ships can trust their navigators.\n\nFor now, local space retains its modified geometry. The survey department has submitted the final edition of its maps, with particular emphasis on the word 'final'."
 AIO_interference_events.453.desc.other: "[from.GetName] seems to have found a way to hold folded space in place. Coordinates within our territory have stopped drifting, while the additional usable land and shorter journeys remain.\n\nLocal authorities have begun updating maps and checking roads and utility lines. This time, maintenance crews at least know where to return to work tomorrow."

 AIO_interference_events.454.name: "Insufficient Space"
 AIO_interference_events.454.desc.maker: "The folded regions contracted sharply in the final rebound. Previously separate roads and building foundations were forced together, utility lines snapped, and route coordinates shifted dramatically. The affected colonies have suffered severe damage. Some areas cannot be entered safely until they have been surveyed again.\n\nSpace is returning to its original dimensions, but has failed to put the buildings back where they belong. We had many plans for the additional land. We must now plan how to dismantle what we built on it."
 AIO_interference_events.454.desc.other: "The spatial experiments of [from.GetName] have ended in a catastrophic contraction. Roads and building foundations overlap in places, underground utilities have suffered extensive ruptures, and ships no longer have reliable route coordinates.\n\nThe additional space created by the interference is disappearing, but the displacement left behind will continue to obstruct reconstruction and travel. New surveys are needed. Neither the old maps nor the new ones are of any use now."
 AIO_interference_events.454.option.maker: "First, find a way in."

 AIO_interference_events.455.name: "Familiar Distances"
 AIO_interference_events.455.desc.maker: "As the field weakens, folded space is gradually returning to its original dimensions. Distances between landmarks have stopped changing, and route coordinates are stabilizing. Damaged streets still need repairs, but construction crews can finally locate the other end of a pipe.\n\nWe have returned to our maps from before the experiment. They will need revisions, of course, but mostly to mark the repair sites."
 AIO_interference_events.455.desc.other: "The interference field of [from.GetName] is weakening. Distances within our territory are returning to normal, navigational coordinates have stopped drifting, and ships can follow familiar routes again.\n\nOur colonies still need to survey residual displacement and repair damaged facilities. The journey may be longer than it was a few days ago, but at least the destination will stay where it is."

 #endregion
