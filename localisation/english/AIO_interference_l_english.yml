 #region megastructure

 AIO_reality_interferometer: "Reality Interferometer"
 AIO_reality_interferometer_plural: "$AIO_reality_interferometer$"
 AIO_reality_interferometer_DESC: "A colossal apparatus that uses transcendent logic to force local reality toward a predetermined conclusion. When activated, it creates and intensifies a Reality Interference Field, replacing any Psionic Aura already present."
 AIO_reality_interferometer_MEGASTRUCTURE_DETAILS: "Select an interference effect after construction. Only one may be built in each system, and an empire may initially maintain up to five."
 AIO_requires_no_existing_reality_interferometer: "$TRIGGER_FAIL$A $AIO_reality_interferometer$ already exists in this system."
 AIO_requires_reality_interferometer_capacity: "$TRIGGER_FAIL$We can maintain no more than §Y5§! $AIO_reality_interferometer_plural$."

 #endregion


 #region tooltips

 AIO_interference_events.201.title: "Calibrating the Reality Interferometer"
 AIO_interference_events.201.desc: "The $AIO_reality_interferometer$ in the §H[event_target:AIO_interferometer_system.GetName]§! system is complete. The apparatus requires a precise logical conclusion before it can begin rewriting nearby reality."
 AIO_interference_events.201.energy: "Make matter obey our production needs."
 AIO_interference_events.201.resource: "Make causality obey our weapons."

