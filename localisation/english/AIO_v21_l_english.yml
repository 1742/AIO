 AIO_DAIT_menu_desc:0 "Select a system or body, then an operation and range. Enrich, Harvest, Strike and Erase support 0 to 5 jumps; Generate, Seed and Storm are fixed at 0 jumps; Ethics targets a country selected in diplomacy, or the owner of a selected fleet, ship, colony or system. Ascension adds Strike across witnessed empires."
 edict_AIO_DAIT_menu:0 "Apply Infinity: Open Menu"
 edict_AIO_DAIT_menu_desc:0 "Open the movable Apply Infinity toolbar without cost or delay. Select a target system or celestial body, then choose an operation and range. Close it with Exit or Esc."
 AIO_DAIT_spawn_situation:0 "Apply Infinity: Generate"
 AIO_DAIT_spawn_situation_desc:0 "Target: §Y[Target.GetName]§!. Range: $AIO_DAIT_range_0$. Expected completion: §Y[Owner.AIO_DAIT_spawn_due]§!.\n\nCompletion rechecks affected targets and resolves Generate. Losing the central target or permission cancels the cast, refunds half the paid cost, and imposes no cooldown. Other empires are notified only when effects resolve."
 AIO_DAIT_seed_situation:0 "Apply Infinity: Seed"
 AIO_DAIT_seed_situation_desc:0 "Target: §Y[Target.GetName]§!. Range: $AIO_DAIT_range_0$. Expected completion: §Y[Owner.AIO_DAIT_seed_due]§!.\n\nCompletion rechecks affected targets and resolves Seed. Losing the central target or permission cancels the cast, refunds half the paid cost, and imposes no cooldown. Other empires are notified only when effects resolve."
 AIO_DAIT_ethic_situation:0 "Apply Infinity: Ethics Inversion"
 AIO_DAIT_ethic_situation_desc:0 "Target country: §Y[Target.GetName]§!. Expected completion: §Y[Owner.AIO_DAIT_ethic_due]§!.\n\nThe country is captured when casting begins. Completion inverts its ethics and restructures its government, regardless of the selected object's later location, existence or ownership. Losing the country, its eligible type or non-gestalt status, or the caster's permission cancels the cast, refunds half the paid cost and imposes no cooldown."
