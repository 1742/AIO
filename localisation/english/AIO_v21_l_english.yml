 #region DAIT menu - void anchor

 AIO_DAIT_void_anchor:0 "Void Coordinate"
 AIO_DAIT_void_anchor_desc:0 "A coordinate anchor left by an erased system. Select this object, then use Spawn in the Apply Infinity menu to rebuild the system."

 #endregion

 #region DAIT menu - ascension rules

 AIO_DAIT_ascended_no_cooldown:0 "No cooldown after ascension."

 #endregion

 #region crisis event

 AIO_crisis_events.602.desc:0 "The unification is complete.\nWe are no longer an empire, nor are we entities. Our will stands at the intersection of infinite dimensions, the structural principle of all that exists.\nExtinguished stars fall silent even as they burn. Tides rise in dry ocean basins, only to become salt-dust before reaching shore; forests with no ancestors rise upon barren worlds, while unsown seeds sprout wherever their trees fall; broken hyperlanes rejoin and open onto two different skies, while ships lost for a thousand years enter both their home ports and their own wreckage. Billions of futures once hostile to one another are now born and perish beneath the same stars.\nThe stars flare and fade, because we write both their beginnings and their ends; life turns in its cycle, because the last page of every story is the first page of another.\nThere is no immortality. There is no oblivion. Beyond every gate, birth and farewell unfold as one.\nI/We are §MYog-Sothoth§!."

 #endregion

 #region district

 zone_AIO_lm_production_regular:0 "Living Metal Condensation"
 zone_AIO_lm_production_regular_desc:0 "Metal in the furnaces has begun seeking its own molds. Divert a share of the alloy production line, and components can learn to grow before they are even cast."

 #endregion

 #region edict

 edict_AIO_DAIT_menu:0 "Apply Infinity Menu"
 edict_AIO_DAIT_menu_desc:0 "Opens the Apply Infinity menu. Click the fixed orb at the bottom to expand or collapse it. The upper-right × exits and hides the orb; the menu will not reopen automatically. Use this edict to open it again with the selected operation and range preserved. Esc still opens the game menu."

 #endregion

 #region DAIT situation

 AIO_DAIT_spawn_situation:0 "Apply Infinity: Spawn"
 AIO_DAIT_spawn_situation_desc:0 "Range: $AIO_DAIT_range_0$.\n\nReality is being rearranged. Completion rebuilds a void or harvested system, or alters an ordinary system’s star and eligible bodies. An invalid central target or lost permission cancels the cast, refunds half the paid cost and imposes no cooldown. Other empires are notified only when the effect resolves."
 AIO_DAIT_seed_situation:0 "Apply Infinity: Seed"
 AIO_DAIT_seed_situation_desc:0 "Range: $AIO_DAIT_range_0$.\n\nA new species and civilization are acquiring the conditions for existence. Completion creates a spacefaring civilization on an eligible, unpopulated habitable body. Loss of the central target, permission or an eligible body cancels the cast, refunds half the paid cost and imposes no cooldown. Other empires are notified only when the effect resolves."
 AIO_DAIT_ethic_situation:0 "Apply Infinity: Ethics Inversion"
 AIO_DAIT_ethic_situation_desc:0 "The country is captured when casting begins. Completion inverts its ethics and restructures its government, regardless of the selected object's later location, existence or ownership. Losing the country, its eligible type or non-gestalt status, or the caster's permission cancels the cast, refunds half the paid cost and imposes no cooldown."
 AIO_DAIT_storm_situation:0 "Apply Infinity: Storm"
 AIO_DAIT_storm_situation_desc:0 "Range: $AIO_DAIT_range_0$.\n\nStable space is gathering a storm that should not exist. Completion unleashes a random cosmic storm in the system. An invalid central target or lost permission cancels the cast, refunds half the paid cost and imposes no cooldown. Other empires are notified only when the effect resolves."
 AIO_DAIT_harvest_situation:0 "Apply Infinity: Harvest"
 AIO_DAIT_harvest_situation_desc:0 "Range: [Owner.GetAIO_DAIT_harvest_range_name].\n\nStars and strata are being translated into recoverable matter. Completion rechecks targets within range and harvests eligible bodies for resources. An invalid central target, lost permission or no eligible recipients cancels the cast, refunds half the paid cost and imposes no cooldown. Other empires are notified only when the effect resolves."
 AIO_DAIT_strike_situation:0 "Apply Infinity: Strike"
 AIO_DAIT_strike_situation_desc:0 "Range: [Owner.GetAIO_DAIT_strike_range_name].\n\nThe outline of an advent is forming beyond reality. Completion validates targets and summons avatars. Empire-wide range uses witnesses recorded at cast start and spreads through eligible systems they own when the effect resolves. Avatars are hostile to all. An invalid central target, lost permission or no eligible recipients cancels the cast, refunds half the paid cost and imposes no cooldown. Other empires are notified only when the effect resolves."
 AIO_DAIT_erase_situation:0 "Apply Infinity: Erase"
 AIO_DAIT_erase_situation_desc:0 "Range: [Owner.GetAIO_DAIT_erase_range_name].\n\nSpacetime is drawing inward along the chosen boundaries. Completion rechecks targets within range and erases eligible bodies, megastructures and fleets. An invalid central target, lost permission or no eligible recipients cancels the cast, refunds half the paid cost and imposes no cooldown. Other empires are notified only when the effect resolves."
 AIO_DAIT_windup_stage:0 "Causal Weaving"
 AIO_DAIT_wait_approach:0 "Awaiting Intervention"
 AIO_DAIT_wait_approach_desc:0 "Advances 30 days per month based on initial cast duration; changing menu target or range does not affect this situation."
 AIO_DAIT_situation_complete:0 "Causal convergence complete: verifies target and executes intervention; enters independent cooldown upon success."

 #endregion

 #region menp

 menp_AIO_dimensionality:0 "Dimensionality Hypothesis"
 menp_AIO_dimensionality_desc:0 "The first equation unwinding the three-dimensional cage has been solved. The bedrock of reality is no longer inviolable; it is merely raw clay awaiting our chisel."
 AIO_unlock_dark_matter_protocol:0 "Unlocks the §Y$edict_edict_AIO_dm_engine$§! edict."
 AIO_unlock_dark_matter_zone:0 "Unlocks the §Y$zone_AIO_dm_production$§! specialization."
 AIO_unlock_living_metal_zones:0 "Unlocks living metal production specializations appropriate to your empire and the §Y$edict_edict_AIO_living_metal_construction$§! edict."
 menp_AIO_dark_matter:0 "Dark Matter Engineering"
 menp_AIO_dark_matter_desc:0 "From power plants to ship reactors, thrusters and shields, dark matter now answers to a common engineering language. The gravitational shadows we once observed from afar have become the foundations of our industry."
 menp_AIO_living_metal:0 "Adaptive Morphology"
 menp_AIO_living_metal_desc:0 "Living metal is no longer merely fluid matter; enigmatic encodings grant it autonomous morphogenesis capable of bearing multidimensional stress."
 menp_AIO_transcend_causality:0 "Transcend Causality"
 menp_AIO_transcend_causality_desc:0 "Reality need not wait for the echoes of our previous command."
 menp_AIO_break_rules:0 "Shatter the Laws"
 menp_AIO_break_rules_desc:0 "The barriers of causality and time are no longer unbreakable dogmas. Upon the completion of Yog-Sothoth, the universe's ultimate corrective entity shall be forced to reveal itself."
 menp_AIO_break_rules_tt:0 "Completing §Y$AIO_mega_04$§! allows you to challenge Aforgomon and automatically begins the final situation."
 menp_AIO_transcend_causality_tt:0 "Reduces the cooldown of Seed, Harvest, Strike and Erase by §G25%§!: from 360 to 270 days."

 #endregion

 #region crisis objective

 crisobj_AIO_research_special_project_name:0 "Complete Special Projects"
 crisobj_AIO_research_special_project_desc:0 "Complete special projects with science ships to gain 800£AIO_advanced_logic£$AIO_advanced_logic$. Country-level research and endgame induction/constraint projects do not count."
 crisobj_AIO_explore_astral_name:0 "Explore Astral Rifts"
 crisobj_AIO_explore_astral_desc:0 "Complete an Astral Rift exploration to gain 1,200£AIO_advanced_logic£$AIO_advanced_logic$."

 #endregion

 #region deposits

 d_AIO_enrich_dark_matter:0 "Dark Matter Precipitation"
 d_AIO_enrich_dark_matter_desc:0 "Dense gravitational precipitation left behind by hyperdimensional intervention. Subatomic structures here are permanently warped, continually seeping high-purity dark matter."
 d_AIO_enrich_living_metal:0 "Living Metal Veins"
 d_AIO_enrich_living_metal_desc:0 "Self-organizing fluid metal precipitated as physical laws loosen, spontaneously coalescing into liquid veins across planetary crusts."
 d_AIO_enrich_nanites:0 "Autonomous Nanite Swarms"
 d_AIO_enrich_nanites_desc:0 "Byproducts of microscopic causal restructuring; vast quantities of self-replicating nanomachines congregate beneath the surface."
 d_AIO_enrich_zro:0 "Psionic Resonant Dust"
 d_AIO_enrich_zro_desc:0 "Psionic sediment that filtered into realspace when the cosmic veil was torn, radiating faint cross-dimensional harmonics."
 d_AIO_enrich_minor_artifacts:0 "Temporal Causal Shards"
 d_AIO_enrich_minor_artifacts_desc:0 "Causal fossils formed by shards of parallel timelines, freezing relics of countless civilizations that were erased or never born."
 d_AIO_enrich_astral_threads:0 "Multidimensional Crystallized Strands"
 d_AIO_enrich_astral_threads_desc:0 "Crystalline strands leaking from multidimensional fractures, adhering deep within celestial bodies and recording cross-dimensional spacetime tension."

 #endregion

 #region personality

 personality_AIO_transcendent:0 "Transcendent Will"
 personality_AIO_transcendent_desc:0 "This entity has woven its consciousness into the fundamental fabric of spacetime and universal law. To its gaze, mortal stellar domains are but creases upon paper; it impassively oversees three-dimensional civilizations, decreeing existence or oblivion from beyond reality."

 #endregion
