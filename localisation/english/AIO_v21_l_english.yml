 AIO_DAIT_spawn_situation_desc:0 "Target: §Y[Target.GetName]§!. Range: [Owner.GetAIO_DAIT_spawn_range_name]. Expected completion: §Y[Owner.AIO_DAIT_spawn_due]§!.\n\nCompletion rechecks affected targets and resolves Generate. Losing the central target or permission cancels the cast, refunds half the paid cost, and imposes no cooldown. Other empires are notified only when effects resolve."
