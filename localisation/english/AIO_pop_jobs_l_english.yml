l_english:
 # job category
 pop_cat_AIO_chips: "Recursive Thinking Calculations"
 pop_cat_AIO_chips_plural: "$pop_cat_AIO_chips$"
 pop_cat_AIO_chips_desc: "This is a parallel model construction logic based on self-feedback neural network nesting with consciousness-like nesting. Each layer structure recursively calls the states of other layers, resulting in high-dimensional deduction ability."
 # job
 job_AIO_chips: "Recursive Node"
 job_AIO_chips_plural: "$job_AIO_chips$"
 job_AIO_chips_desc: "These structures of consciousness are designed to nest and self-invoke each other, simulating, observing, and feeding at the same time, approaching the truth in infinite echoes."
 job_AIO_chips_effect_desc: "[AIO_chips.GetIcon]§Y[AIO_chips.GetNamePlural]§! make $r_energy$ into $r_research$ and £AIO_advanced_logic£ §Y$AIO_advanced_logic$§!"
 mod_job_AIO_chips_add_desc: "£job_AIO_chips£ $job_AIO_chips$ jobs"
 job_AIO_dormant_chassis: "Dormant Chassis"
 job_AIO_dormant_chassis_plural: "$job_AIO_dormant_chassis$"
 job_AIO_dormant_chassis_desc: "These recursive chassis have been disconnected from the computational network and placed in low-power standby, ready to return to recursive computation."
 mod_job_AIO_dormant_chassis_add: "£job_AIO_chips£ $job_AIO_dormant_chassis$ Jobs"
 d_AIO_dormant_chassis_array: "Chassis Standby Array"
 d_AIO_dormant_chassis_array_desc: "A bank of standby interfaces that preserves recursive chassis at minimum operating power."
 decision_AIO_add_dormant_chassis_jobs: "Expand Chassis Standby Array"
 decision_AIO_add_dormant_chassis_jobs_desc: "Switch some recursive chassis from the computational network into low-power standby, reducing the scale and upkeep of the recursive nodes. This decision can be enacted repeatedly."
 decision_AIO_add_dormant_chassis_jobs_requirements: "Requires at least §Y333§! employed £job_AIO_chips£ $job_AIO_chips$"
 decision_AIO_add_dormant_chassis_jobs_effect: "Adds §Y333§! £job_ark_deep_sleep£ $job_AIO_dormant_chassis$ Jobs. Recursive chassis will prioritize these jobs."
 decision_AIO_remove_dormant_chassis_jobs: "Deactivate Chassis Standby Array"
 decision_AIO_remove_dormant_chassis_jobs_desc: "Deactivate one bank of standby interfaces, returning its recursive chassis to recursive computation. This decision can be enacted repeatedly."
 decision_AIO_remove_dormant_chassis_jobs_effect: "Removes §Y333§! £job_ark_deep_sleep£ $job_AIO_dormant_chassis$ Jobs."
 # purge type
 purge_AIO_chips: "Embers of Thought"
 purge_AIO_chips_tooltip: "Serve as a recursive node."
 purge_AIO_chips_tooltip_delayed: "§LOnly my thoughts turn into firewood, which will burn forever in the cosmos.§!"
