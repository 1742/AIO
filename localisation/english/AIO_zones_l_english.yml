l_english:
 # matryoshka brain specialization
 zone_AIO_lathe: "Matryoshka Brain Specialization"
 zone_AIO_lathe_desc: "$district_AIO_lathe_desc$"
 # dark matter production
 zone_AIO_dm_production: "Dark Matter Synthesis Complex"
 zone_AIO_dm_production_desc: "Power plants now feed the shadowed side of gravity. Energy settles here into matter no ordinary light can reveal. The production ledger shows a little less electricity, and a new stockpile once classified as a mystery of the universe."
 # regular empire living metal production
 zone_AIO_lm_production_regular:0 "Living Metal Condensation"
 zone_AIO_lm_production_regular_desc:0 "Metal in the furnaces has begun seeking its own molds. Divert a share of the alloy production line, and components can learn to grow before they are even cast."
 # gestalt machine empire living metal production
 zone_AIO_lm_production_machine_empire: "Living Metal Synthetic Nexus"
 zone_AIO_lm_production_machine_empire_desc: "In the heat of the assembly line, silver fluid gathers along the seams of newborn machines. We taught metal to find its own shape. Each batch of drones now leaves behind a harvest of forms it has yet to use."
 # hive empire living metal production
 zone_AIO_lm_production_hive_empire: "Living Metal Incubation"
 zone_AIO_lm_production_hive_empire_desc: "Silver veins pulse beside the young within the spawning chambers. Nutrient fluid feeds both flesh and metal that has learned to grow. When the newborn drones depart, living metal continues to multiply along the chamber walls."
 # miners nanites production
 zone_AIO_nanites_production_minerals: "Nanite Extraction"
 zone_AIO_nanites_production_minerals_desc: "Mineral veins are cut into feedstock for microscopic machines, and the mining equipment awakens the first swarms. Thereafter, ore finds its own fractures, dismantles itself, and leaves the rock in a form capable of further excavation."
 # metallurgists nanites production
 zone_AIO_nanites_production_metallurgists: "Nanite Assembly"
 zone_AIO_nanites_production_metallurgists_desc: "The furnaces no longer commit metal to a final shape. Countless microscopic constructs assemble before cooling and stream along the production line, awaiting their next instruction. A piece of material can now be a set of tools, or a factory yet to unfold."
 # farmers nanites production
 zone_AIO_nanites_production_farmers: "Nanite Cultivation"
 zone_AIO_nanites_production_farmers_desc: "The fields and culture vats grow a crop that can harvest itself. Nutrients enter microscopic assembly cycles, and mature nanite swarms flow through irrigation pipes into storage. The agricultural staff need only adjust to one detail: the harvest sometimes seeks out the next field."
