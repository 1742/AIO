l_english:
 pc_AIO_mist:0 "The Habitat of Nameless Mist"
 pc_AIO_mist_desc:0 "An independent dimensional bubble carved out by tearing through the projective cross-section of three-dimensional spacetime. It exists beyond the physical causality and macroscopic thermodynamics of the outer universe; with the expansion of internal megastructures, its internal capacity can be topologically extended without limit."
 AIO_mist_anchor:0 "$pc_AIO_mist$"
 AIO_mist_anchor_plural:0 "$pc_AIO_mist$"
 NAME_AIO_Mist_Anchor:0 "$pc_AIO_mist$"
 NAME_AIO_Mist_Colony:0 "$pc_AIO_mist$"

 decision_AIO_expand_mist:0 "Topological Extension: Nameless Mist"
 decision_AIO_expand_mist_desc:0 "Inject immense energy and dense structural alloys into the perimeter of the Nameless Mist to tear open and unfurl deeper dimensional folds. Within this habitat devoid of physical frontiers, spatial capacity is bounded only by how much spacetime we dare to weave."
 decision_AIO_expand_mist_effects:0 "District capacity increases by §G8§!."
 starbase_level_AIO_mist_anchor:0 "Mist Anchorage"
 d_AIO_mist_exemption:0 "Beyond the Cross-section"
 d_AIO_mist_exemption_desc:0 "This expanse is anchored beyond the three-dimensional cross-section. Physical rebound, energetic turbulence, and constant decay triggered by altered universal laws across the outer universe cannot pierce its topological insulating barriers."
