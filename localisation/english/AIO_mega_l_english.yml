l_english:
 #region Horizon Engine

 AIO_horizon_engine: "Horizon Engine"
 AIO_horizon_engine_DESC: "We are not the only civilization with this technology, there are already other empires that have chosen this path. We have improved it, slowly and silently stripping and eroding reality from the shroud, turning the deepest structural meaning of our dimension into energy."
 AIO_horizon_engine_MEGASTRUCTURE_DETAILS: "Used to extract energy from reality and shroud."

 #endregion


 #region AIO megastructure

 AIO_mega_01_fact: "$AIO_mega_01$"
 AIO_mega_01_fact_DESC: "$AIO_mega_01_DESC$"
 AIO_mega_01: "Ultimate Gate"
 AIO_mega_01_DESC:0 "A passage connecting reality to the Mist. Initial colony capacity: 12; population fills its jobs."
 AIO_mega_01_MEGASTRUCTURE_DETAILS: "$AIO_mega_01_DESC$"
 AIO_mega_02: "Silver Key"
 AIO_mega_02_DESC:0 "Raises capacity to 24. Requires dark matter production unlocked by level-two rule research."
 AIO_mega_02_MEGASTRUCTURE_DETAILS: "$AIO_mega_02_DESC$"
 AIO_mega_03: "Eternal Throne"
 AIO_mega_03_DESC:0 "Raises capacity to 40. Requires living metal production unlocked by level-three rule research."
 AIO_mega_03_MEGASTRUCTURE_DETAILS: "$AIO_mega_03_DESC$"
 AIO_mega_04: "Yog Sothoth"
 AIO_mega_04_DESC:0 "Raises capacity to 64 and enables repeatable spatial expansion and remote projection. Requires nanite production."
 AIO_mega_04_MEGASTRUCTURE_DETAILS: "$AIO_mega_04_DESC$."
 AIO_mega_04_activate: "$AIO_mega_04$"
