l_english:
 district_AIO_mist_housing:0 "$district_city$"
 district_AIO_mist_housing_plural:0 "$district_city_plural$"
 district_AIO_mist_housing_desc:0 "$district_city_desc$"
 district_AIO_mist_farm:0 "Biochemical Mass-Energy District"
 district_AIO_mist_farm_plural:0 "Biochemical Mass-Energy Districts"
 district_AIO_mist_farm_desc:0 "Directly synthesizing essential nutrients through multi-dimensional mass-energy restructuring, entirely removing reliance on sunlight and arable soil. Any carbon-based organism requires only minimal fluid intake to maintain biological metrics."
 district_AIO_mist_alloys:0 "Dense Lattice District"
 district_AIO_mist_alloys_plural:0 "Dense Lattice Districts"
 district_AIO_mist_alloys_desc:0 "Direct molecular-scale casting upon higher-dimensional spacetime shear planes. Artificially imprinted topologies force material tensile strength far beyond the limits allowed by three-dimensional physics."
 district_AIO_mist_goods:0 "Negentropy Fabrication District"
 district_AIO_mist_goods_plural:0 "Negentropy Fabrication Districts"
 district_AIO_mist_goods_desc:0 "Utilizing micro-restructuring fields to reverse local entropy gain, assembling raw feedstocks with atomic precision into civil amenities and research instruments. Perfect execution of instructions yields any desired apparatus from the void."
 district_AIO_mist_energy:0 "Energy Stream Interception District"
 district_AIO_mist_energy_plural:0 "Energy Stream Interception Districts"
 district_AIO_mist_energy_desc:0 "Coupling conduits directly to fractures along spacetime cross-sections, siphoning free energy currents leaking from lower to higher dimensions. Here, conservation of energy is elegantly circumvented into a one-way flow."
 district_AIO_mist_minerals:0 "Substantive Matter District"
 district_AIO_mist_minerals_plural:0 "Substantive Matter Districts"
 district_AIO_mist_minerals_desc:0 "Condensing massive fragments of virtual particle pairs into dense physical crystalline nuclei via gravitational lensing. Heavy industrial mineral output manifests as purely geometric precipitation."
 district_AIO_mist_motes:0 "Metastable Mote District"
 district_AIO_mist_motes_plural:0 "Metastable Mote Districts"
 district_AIO_mist_motes_desc:0 "Confining unstable, hyper-energetic, high-dimensional motes within micro-forcefield traps. Even the decay and annihilation of a single mote is swiftly absorbed and re-excited by adjacent topological barriers."
 district_AIO_mist_gases:0 "Manifold Gas District"
 district_AIO_mist_gases_plural:0 "Manifold Gas Districts"
 district_AIO_mist_gases_desc:0 "Condensing high-dimensional ambient vapors seeping past the cross-section. These gases diffuse across non-Euclidean manifolds in their ambient states, displaying extraordinary physical reactivity."
 district_AIO_mist_crystals:0 "Hyperdimensional Crystal District"
 district_AIO_mist_crystals_plural:0 "Hyperdimensional Crystal Districts"
 district_AIO_mist_crystals_desc:0 "Freezing spatial tension into flawless crystalline matrices via multi-dimensional optical interference. Every faceted prism refracts shadows cast by countless parallel light cones."
 district_AIO_mist_dark_matter:0 "Dark Phase Precipitation District"
 district_AIO_mist_dark_matter_plural:0 "Dark Phase Precipitation Districts"
 district_AIO_mist_dark_matter_desc:0 "Bubble-districts tailored to capture subtle gravitational weak-interactions. Dark Phase Weavers draw unseen higher-dimensional mass currents into steady, machinable dark matter ingots."
 district_AIO_mist_living_metal:0 "Living Metal District"
 district_AIO_mist_living_metal_plural:0 "Living Metal Districts"
 district_AIO_mist_living_metal_desc:0 "Smelting forges pulsating with organic rhythms. Fluid alloys infused with high-dimensional vitality flow and expand along conduits as if possessing an embryonic inorganic consciousness."
 district_AIO_mist_nanites:0 "Micro-phase Swarm District"
 district_AIO_mist_nanites_plural:0 "Micro-phase Swarm Districts"
 district_AIO_mist_nanites_desc:0 "Trillions of sub-micron machines replicating and harmonizing their logic protocols. Once unleashed, the swarm reshapes all matter in its path like a pervasive fog."
 district_AIO_mist_hive:0 "$district_hive$"
 district_AIO_mist_hive_plural:0 "$district_hive_plural$"
 district_AIO_mist_hive_desc:0 "$district_hive_desc$"
 district_AIO_mist_nexus:0 "$district_nexus$"
 district_AIO_mist_nexus_plural:0 "$district_nexus_plural$"
 district_AIO_mist_nexus_desc:0 "$district_nexus_desc$"
 district_AIO_mist_research:0 "Recursive Computation District"
 district_AIO_mist_research_plural:0 "Recursive Computation Districts"
 district_AIO_mist_research_desc:0 "Three-dimensional neural synapses subjected to multi-dimensional oscillation unlock astonishing computational redundancy. Billions of minds are woven into recursive logic streams — while intense thought-resonance inevitably leads to irreversible physical burnout, such depreciation is negligible in the pursuit of reality's foundational truth."
 district_AIO_mist_city:0 "Metropolis of the Mist District"
 district_AIO_mist_city_plural:0 "Metropolis of the Mist Districts"
 district_AIO_mist_city_desc:0 "Towering topological metropolises anchoring the depths of the Nameless Mist. Refracted light and folded corridors carve out boundless living expanse, shielded from all external physical laws imposed by the universe beyond."
