 #region DAIT menu

 AIO_DAIT_events.203.title: "Directional Apply Infinity"
 AIO_DAIT_launcher_label:0 "§Y∞§!"
 AIO_DAIT_launcher_tooltip:0 "§HApply Infinity§!\nClick the fixed bottom orb to expand or collapse the menu, preserving the current selection. The upper-right × collapses the menu; use Exit Menu at the bottom to exit completely."
 AIO_DAIT_collapse_tooltip:0 "Collapse the menu, keeping the bottom orb and current selection."
 AIO_DAIT_exit_menu_label:0 "Exit Menu"
 AIO_DAIT_exit_tooltip:0 "Exit the menu and hide its orb. Reopen via the Apply Infinity edict."

 #endregion

 #region DAIT menu - target and requirements

 AIO_DAIT_toolbar:0 "Apply Infinity"
 AIO_DAIT_current_target:0 "[This.GetAIO_DAIT_selected_target]"
 AIO_DAIT_current_target_tooltip:0 "Select a system, celestial body, colony, fleet, ship, megastructure or ambient object to target its system. In an empty system, select the Void Coordinate. Merely entering the system view does not select a target."
 AIO_DAIT_need_target:0 "Select a valid system or celestial body."
 AIO_DAIT_unavailable:0 "Requires the operation to be unlocked, sufficient Advanced Logic and an applicable range. The selected operation must have no pending cast or cooldown."
 AIO_DAIT_invalid_target:0 "The target does not meet operation conditions, or already has a pending cast."
 AIO_DAIT_cancelled:0 "Apply Infinity cancelled: the target, permission or eligible recipients are no longer valid. Half the paid cost is refunded; no cooldown is imposed."
 AIO_DAIT_ready_text:0 "Ready"
 AIO_DAIT_need_unlock:0 "This operation is not unlocked."
 AIO_DAIT_need_range:0 "Select a range from 0 to 5 jumps. Empire-wide range is available only for Strike after ascension."
 AIO_DAIT_wait_pending:0 "This operation already has a pending cast."
 AIO_DAIT_wait_cooldown:0 "This operation is still on cooldown."
 AIO_DAIT_need_logic:0 "Insufficient Advanced Logic: Enrich, Harvest, Strike and Erase cost base cost times (1 + jumps) at 0 to 5 jumps, with Enrich additionally multiplied by repetitions; other operations use the 0-jump cost."
 AIO_DAIT_target_system_name:0 "System: [This.GetName]"
 AIO_DAIT_target_planet_system_name:0 "System: [This.System.GetName]"
 AIO_DAIT_target_ambient_system_name:0 "System: [This.GetStarName]"
 AIO_DAIT_target_none:0 "System: none selected"
 AIO_DAIT_menu_desc:0 "Select a system or empire target, choose one of eight operations and configure the range, then confirm to cast. Click the fixed bottom orb to expand or collapse the menu."
 AIO_DAIT_current_country:0 "[This.GetAIO_DAIT_selected_country]"
 AIO_DAIT_current_country_tooltip:0 "Invert Ethics targets the owner of the selected object, rather than its occupier or the controller of its system. Select a country in diplomacy, or select one of its fleets, ships, colonies or owned systems."
 AIO_DAIT_need_country_target:0 "Select a non-gestalt regular, Fallen or Awakened Empire in diplomacy, or select one of its fleets, ships, colonies or systems on the map."
 AIO_DAIT_target_country_name:0 "Empire: [This.GetName]"
 AIO_DAIT_target_owner_name:0 "Empire: [This.Owner.GetName]"
 AIO_DAIT_target_country_none:0 "Empire: none selected"
 AIO_DAIT_target_ship_system_name:0 "System: [This.Fleet.System.GetName]"

 #endregion

