 AIO_DAIT_enrich_multiplier_10:0 "Enrich: x10"
 AIO_DAIT_enrich_multiplier_tooltip:0 "Click to cycle repetitions: §Y1 → 5 → 10 → 1§!. Each repetition generates a full set of basic and rare resource deposits. Cost scales with repetitions; ascended empires remain exempt."

 AIO_DAIT_button_enrich:0 "Enrich"
 AIO_DAIT_button_enrich_tooltip:0 "Adds random deposits to celestial bodies within range, including basic and rare resources.\nCast time: §YInstant§!.\nNo cooldown."
 AIO_DAIT_enrich_pending_text:0 "Resolving instantly"
