 #region DAIT menu - spawn

 AIO_DAIT_button_spawn:0 "Spawn"
 AIO_DAIT_button_spawn_tooltip:0 "Reshapes the target system: rebuilds void or harvested systems into special systems; otherwise adjusts a star and converts eligible uncolonized bodies into habitable worlds.\nCast time: §Y90 days§!.\nNo cooldown."
 AIO_DAIT_spawn_pending_text:0 "Pending until [This.AIO_DAIT_spawn_due]"
 AIO_DAIT_spawn_cooldown_text:0 "Cooldown ends [This.AIO_DAIT_spawn_ready_date]"
 AIO_DAIT_spawn_completed:0 "Spawn cast by [event_target:AIO_DAIT_maker.GetName] around [event_target:AIO_DAIT_target_system.GetName] has resolved."
 AIO_DAIT_menu_button_spawn:0 "[From.GetAIO_DAIT_menu_button_spawn]"
 AIO_DAIT_menu_selected_spawn:0 "§Y$AIO_DAIT_button_spawn$§!"
 AIO_DAIT_menu_status_spawn:0 "[This.GetAIO_DAIT_spawn_state]"

 #endregion

 #region DAIT menu - seed

 AIO_DAIT_button_seed:0 "Seed"
 AIO_DAIT_button_seed_tooltip:0 "Creates a new species and spacefaring civilization on an unpopulated habitable body in the target system, with a starbase and starting ships.\nCast time: §Y90 days§!.\nCooldown: §Y360 days§! (§Y270 days§! with Transcend Causality).\n$AIO_DAIT_ascended_no_cooldown$"
 AIO_DAIT_seed_pending_text:0 "Pending until [This.AIO_DAIT_seed_due]"
 AIO_DAIT_seed_cooldown_text:0 "Cooldown ends [This.AIO_DAIT_seed_ready_date]"
 AIO_DAIT_seed_completed:0 "Seed cast by [event_target:AIO_DAIT_maker.GetName] around [event_target:AIO_DAIT_target_system.GetName] has resolved."
 AIO_DAIT_menu_button_seed:0 "[From.GetAIO_DAIT_menu_button_seed]"
 AIO_DAIT_menu_selected_seed:0 "§Y$AIO_DAIT_button_seed$§!"
 AIO_DAIT_menu_status_seed:0 "[This.GetAIO_DAIT_seed_state]"

 #endregion

 #region DAIT menu - ethic

 AIO_DAIT_button_ethic:0 "Invert Ethics"
 AIO_DAIT_button_ethic_tooltip:0 "Inverts a non-gestalt country’s ethics and restructures its government. Select a country in diplomacy or one of its fleets, ships, colonies or owned systems. The country is locked when casting begins; later movement, ownership changes or loss of the selected object do not change it.\nCast time: §Y90 days§!.\nNo cooldown."
 AIO_DAIT_ethic_pending_text:0 "Pending until [This.AIO_DAIT_ethic_due]"
 AIO_DAIT_ethic_cooldown_text:0 "Cooldown ends [This.AIO_DAIT_ethic_ready_date]"
 AIO_DAIT_ethic_completed:0 "Ethics Inversion cast by [event_target:AIO_DAIT_maker.GetName] on [event_target:AIO_DAIT_target_country.GetName] has resolved."
 AIO_DAIT_menu_button_ethic:0 "[From.GetAIO_DAIT_menu_button_ethic]"
 AIO_DAIT_menu_selected_ethic:0 "§Y$AIO_DAIT_button_ethic$§!"
 AIO_DAIT_menu_status_ethic:0 "[This.GetAIO_DAIT_ethic_state]"

 #endregion

 #region DAIT menu - storm

 AIO_DAIT_button_storm:0 "Storm"
 AIO_DAIT_button_storm_tooltip:0 "Tears open the target system’s spatial barriers to unleash a random cosmic storm.\nCast time: §Y90 days§!.\nNo cooldown."
 AIO_DAIT_storm_pending_text:0 "Pending until [This.AIO_DAIT_storm_due]"
 AIO_DAIT_storm_cooldown_text:0 "Cooldown ends [This.AIO_DAIT_storm_ready_date]"
 AIO_DAIT_storm_completed:0 "Storm cast by [event_target:AIO_DAIT_maker.GetName] around [event_target:AIO_DAIT_target_system.GetName] has resolved."
 AIO_DAIT_menu_button_storm:0 "[From.GetAIO_DAIT_menu_button_storm]"
 AIO_DAIT_menu_selected_storm:0 "§Y$AIO_DAIT_button_storm$§!"
 AIO_DAIT_menu_status_storm:0 "[This.GetAIO_DAIT_storm_state]"

 #endregion

 #region DAIT menu - harvest

 AIO_DAIT_button_harvest:0 "Harvest"
 AIO_DAIT_button_harvest_tooltip:0 "Breaks down eligible celestial bodies and colonies within range, yielding resources according to each body’s type and size.\nCast time: §Y90 days§!; +90 days per jump.\nCooldown: §Y360 days§! (§Y270 days§! with Transcend Causality).\n$AIO_DAIT_ascended_no_cooldown$"
 AIO_DAIT_harvest_pending_text:0 "Pending until [This.AIO_DAIT_harvest_due]"
 AIO_DAIT_harvest_cooldown_text:0 "Cooldown ends [This.AIO_DAIT_harvest_ready_date]"
 AIO_DAIT_harvest_completed:0 "Harvest cast by [event_target:AIO_DAIT_maker.GetName] around [event_target:AIO_DAIT_target_system.GetName] has resolved."
 AIO_DAIT_menu_button_harvest:0 "[From.GetAIO_DAIT_menu_button_harvest]"
 AIO_DAIT_menu_selected_harvest:0 "§Y$AIO_DAIT_button_harvest$§!"
 AIO_DAIT_menu_status_harvest:0 "[This.GetAIO_DAIT_harvest_state]"

 #endregion

 #region DAIT menu - strike

 AIO_DAIT_button_strike:0 "Strike"
 AIO_DAIT_button_strike_tooltip:0 "Summons §R$AIO_Aforgomon$§! at the intervention site. The avatar is hostile to all. Avatar strength scales with game difficulty and the Crisis Strength setting.\nCast time: §Y180 days§! for a weakened avatar, §Y90 days§! for a full avatar; +90 days per jump. Empire-wide range takes §Y360 days§!.\nCooldown: §Y360 days§! (§Y270 days§! with Transcend Causality).\nEmpire-wide range requires ascension. At cast start, fleets in the central system identify witnessing empires, excluding the avatar’s owner. On resolution, Strike spreads to their eligible owned systems; for nomadic witnesses, it also targets eligible systems containing their fleets at that time. Each system is struck once.\n$AIO_DAIT_ascended_no_cooldown$"
 AIO_DAIT_strike_pending_text:0 "Pending until [This.AIO_DAIT_strike_due]"
 AIO_DAIT_strike_cooldown_text:0 "Cooldown ends [This.AIO_DAIT_strike_ready_date]"
 AIO_DAIT_strike_completed:0 "Strike cast by [event_target:AIO_DAIT_maker.GetName] around [event_target:AIO_DAIT_target_system.GetName] has resolved."
 AIO_DAIT_menu_button_strike:0 "[From.GetAIO_DAIT_menu_button_strike]"
 AIO_DAIT_menu_selected_strike:0 "§Y$AIO_DAIT_button_strike$§!"
 AIO_DAIT_menu_status_strike:0 "[This.GetAIO_DAIT_strike_state]"

 #endregion

 #region DAIT menu - erase

 AIO_DAIT_button_erase:0 "Erase"
 AIO_DAIT_button_erase_tooltip:0 "Erases eligible celestial bodies, megastructures and fleets from systems within range, leaving void coordinates that Spawn can rebuild.\nCast time: §Y180 days§!; +90 days per jump.\nCooldown: §Y360 days§! (§Y270 days§! with Transcend Causality).\n$AIO_DAIT_ascended_no_cooldown$"
 AIO_DAIT_erase_pending_text:0 "Pending until [This.AIO_DAIT_erase_due]"
 AIO_DAIT_erase_cooldown_text:0 "Cooldown ends [This.AIO_DAIT_erase_ready_date]"
 AIO_DAIT_erase_completed:0 "Erase cast by [event_target:AIO_DAIT_maker.GetName] around [event_target:AIO_DAIT_target_system.GetName] has resolved."
 AIO_DAIT_menu_button_erase:0 "[From.GetAIO_DAIT_menu_button_erase]"
 AIO_DAIT_menu_selected_erase:0 "§Y$AIO_DAIT_button_erase$§!"
 AIO_DAIT_menu_status_erase:0 "[This.GetAIO_DAIT_erase_state]"

 #endregion

 #region DAIT menu - void anchor

 AIO_DAIT_void_anchor:0 "Void Coordinate"
 AIO_DAIT_void_anchor_desc:0 "A coordinate anchor left by an erased system. Select this object, then use Spawn in the Apply Infinity menu to rebuild the system."

 #endregion

 #region DAIT menu - ascension rules

 AIO_DAIT_ascended_no_cooldown:0 "No cooldown after ascension."

 #endregion

 #region DAIT situation

 AIO_DAIT_spawn_situation:0 "Apply Infinity: Spawn"
 AIO_DAIT_spawn_situation_desc:0 "Range: $AIO_DAIT_range_0$.\n\nReality is being rearranged. Completion rebuilds a void or harvested system, or alters an ordinary system’s star and eligible bodies. An invalid central target or lost permission cancels the cast, refunds half the paid cost and imposes no cooldown. Other empires are notified only when the effect resolves."
 AIO_DAIT_seed_situation:0 "Apply Infinity: Seed"
 AIO_DAIT_seed_situation_desc:0 "Range: $AIO_DAIT_range_0$.\n\nA new species and civilization are acquiring the conditions for existence. Completion creates a spacefaring civilization on an eligible, unpopulated habitable body. Loss of the central target, permission or an eligible body cancels the cast, refunds half the paid cost and imposes no cooldown. Other empires are notified only when the effect resolves."
 AIO_DAIT_ethic_situation:0 "Apply Infinity: Ethics Inversion"
 AIO_DAIT_ethic_situation_desc:0 "The country is captured when casting begins. Completion inverts its ethics and restructures its government, regardless of the selected object's later location, existence or ownership. Losing the country, its eligible type or non-gestalt status, or the caster's permission cancels the cast, refunds half the paid cost and imposes no cooldown."
 AIO_DAIT_storm_situation:0 "Apply Infinity: Storm"
 AIO_DAIT_storm_situation_desc:0 "Range: $AIO_DAIT_range_0$.\n\nStable space is gathering a storm that should not exist. Completion unleashes a random cosmic storm in the system. An invalid central target or lost permission cancels the cast, refunds half the paid cost and imposes no cooldown. Other empires are notified only when the effect resolves."
 AIO_DAIT_harvest_situation:0 "Apply Infinity: Harvest"
 AIO_DAIT_harvest_situation_desc:0 "Range: [Owner.GetAIO_DAIT_harvest_range_name].\n\nStars and strata are being translated into recoverable matter. Completion rechecks targets within range and harvests eligible bodies for resources. An invalid central target, lost permission or no eligible recipients cancels the cast, refunds half the paid cost and imposes no cooldown. Other empires are notified only when the effect resolves."
 AIO_DAIT_strike_situation:0 "Apply Infinity: Strike"
 AIO_DAIT_strike_situation_desc:0 "Range: [Owner.GetAIO_DAIT_strike_range_name].\n\nThe outline of an advent is forming beyond reality. Completion validates targets and summons avatars. Empire-wide range uses witnesses recorded at cast start and spreads through eligible systems they own when the effect resolves. Nomadic witnesses also contribute eligible systems containing their fleets at that time. Each system is struck once. Avatars are hostile to all. An invalid central target, lost permission or no eligible recipients cancels the cast, refunds half the paid cost and imposes no cooldown. Other empires are notified only when the effect resolves."
 AIO_DAIT_erase_situation:0 "Apply Infinity: Erase"
 AIO_DAIT_erase_situation_desc:0 "Range: [Owner.GetAIO_DAIT_erase_range_name].\n\nSpacetime is drawing inward along the chosen boundaries. Completion rechecks targets within range and erases eligible bodies, megastructures and fleets. An invalid central target, lost permission or no eligible recipients cancels the cast, refunds half the paid cost and imposes no cooldown. Other empires are notified only when the effect resolves."
 AIO_DAIT_windup_stage:0 "Causal Weaving"
 AIO_DAIT_wait_approach:0 "Awaiting Intervention"
 AIO_DAIT_wait_approach_desc:0 "Advances 30 days per month based on initial cast duration; changing menu target or range does not affect this situation."
 AIO_DAIT_situation_complete:0 "Causal convergence complete: verifies target and executes intervention; enters independent cooldown upon success."

 #endregion
