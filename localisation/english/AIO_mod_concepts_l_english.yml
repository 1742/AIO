l_english:
 concept_AIO_mist_system: "$AIO_mist$"
 concept_AIO_mist_system_desc: "A space beyond ordinary dimensions, anchoring the dedicated megastructures that culminate in §Y$AIO_mega_04$§!. It usually appears toward the upper left of the galaxy map, and is reached through the Ultimate Gate.\n§RGalaxy map types supplied by other mods may prevent $AIO_mist$ from spawning and block further progression.§!"
 concept_AIO_gate_system: "$AIO_gate$"
 concept_AIO_gate_system_desc: "The threshold between reality and ['concept_AIO_mist_system']. Every route reaching it extends in a direction absent from the star chart. Only those who hold the silver key can see the other side."
 concept_AIO_DAIT: "Directional Apply Infinity"
 concept_AIO_DAIT_desc: "The dedicated megastructures turn our understanding of the universe into targeted intervention. Before ascension, operations consume £AIO_advanced_logic£§Y$AIO_advanced_logic$§! and system alterations unlock in stages. Endgame victory unlocks Invert Ethics and Erase even if you remain as your current empire. Ascension makes every operation free of cost and cooldown; windups remain.\n§YClick the fixed bottom orb to expand or collapse the menu. The upper-right × also collapses it. Exit Menu at the bottom right closes the menu and orb; reopen it by edict.§!"
