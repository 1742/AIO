 # Stage POIs: only the text matching the current hidden tendency is shown
 AIO_crisis_stage_2_poi_name: "Reality Rebounds"
 AIO_crisis_stage_2_desc: "$AIO_crisis_stage_2_construct_desc$"
 AIO_crisis_stage_3_poi_name: "Restoration Delayed"
 AIO_crisis_stage_3_desc: "Opposing alterations are being erased at the same time. Reality attempts to return to one origin along two directions, while the two restorative processes continually undo one another's results. The anomalies still fade, but only after far longer than before.\nLet it try to catch up. Our next stroke is already written."
 AIO_crisis_stage_4_poi_name: "Corrections in Conflict"
 AIO_crisis_stage_4_desc: "Every law and its opposite now demand restoration. Correcting one makes the other anomalous; correcting the other revokes the previous result.\nLet it correct itself without end. We need only watch it exhaust itself between its own answers."
 AIO_crisis_stage_5_poi_name: "The Law of Self-Destruction"
 AIO_crisis_stage_5_desc: "Every correction now creates another contradiction. Whenever the universe restores one law, it must revoke another; whenever it fills an omission, it tears the same place open again.\nLet it remain faithful to itself. Every act of persistence merely brings it closer to the ending we have written."

 # events
 AIO_crisis_events_title: "$AIO_crisis_events_chain_title$"
 # unlock crisis level
 AIO_crisis_events.301.desc: "Physical constants, particle masses, gravity and the expansion of entropy are not immutable - they are merely parameters of the initial version, the original drafts awaiting revision. We haven't become the norm yet, but we have already started to hold the pen.\n\nTo reconstruct the universe, we must first have a sufficient understanding of it. We need more advanced computers to help us understand the operational logic of real laws."
 AIO_crisis_events.301.option: "We want more powerful computers!"
 AIO_crisis_events.302.desc: "The energy density of §Y$AIO_horizon_engine$§! is about to break through the boundaries of reality. Next, we need to use this energy to open a gate - it leading to countless times and spaces. Once activated, we will be able to change the rules in an infinite dimension."
 AIO_crisis_events.302.option: "We are Gate Builder."
 AIO_crisis_events.303.desc: "With the opening of §Y$AIO_mega_01$§!, time and space began to reveal an unprecedented vulnerability. It is not enough to merely drill a "hole" in the universe. Our most powerful brain has already conceived a megastructure capable of "selecting" time and space - §Y$AIO_mega_02$§!. It will pave the way for subsequent rule modifications."
 AIO_crisis_events.303.option: "$EXCELLENT$"
 AIO_crisis_events.304.desc: "§Y$AIO_mega_02$§! has become the key for us to reverse the fate of the universe, but its potential has not yet been fully unleashed. To further advance the integration process, we must forge it into a higher-dimensional base point - §Y$AIO_mega_03$§!. Only when §Y$AIO_mega_03$§! stands at the peak of multiple realities can we truly control the ultimate form of the law."
 AIO_crisis_events.304.option: "$menp_AIO_mega_04_desc$"
 AIO_crisis_events.305.desc: "§Y$AIO_mega_03$§! has already stood at the forefront of multiple realities. However, its existence is merely to carry the true us. Now, we must elevate it to its ultimate form - §M$AIO_mega_04$§!. It is no longer a structure, no longer an empire, but an equivalent of existence and law. When it is completed, the integration will be closed and rewriting will begin. All differences, all dimensions, all endings will..."
 AIO_crisis_events.305.option: "Just go for it."

 # ascension event
 AIO_crisis_events.end.option: "I/We are the truth."
 AIO_crisis_events.602.desc: "The unification is complete.\nWe are no longer an empire, nor are we entities. Our will stands at the intersection of infinite dimensions, the structural principle of all that exists.\nExtinguished stars fall silent even as they burn. Tides rise in dry ocean basins, only to become salt-dust before reaching shore; forests with no ancestors rise upon barren worlds, while unsown seeds sprout wherever their trees fall; broken hyperlanes rejoin and open onto two different skies, while ships lost for a thousand years enter both their home ports and their own wreckage. Billions of futures once hostile to one another are now born and perish beneath the same stars.\nThe stars flare and fade, because we write both their beginnings and their ends; life turns in its cycle, because the last page of every story is the first page of another.\nThere is no immortality. There is no oblivion. Beyond every gate, birth and farewell unfold as one.\nI/We are §MYog-Sothoth§!."

 #endregion


 #region crisis megastructure event

 # horizon engine finish
 AIO_crisis_events.402.desc: "The §Y$AIO_horizon_engine$§! located at [from.GetName] is completed."
 # Yog Sothoth finish
 AIO_crisis_events.403.desc: "The §Y$AIO_mega_01$§! located at [from.GetName] is completed.\nUnlock megastructure: §Y$AIO_mega_01_node$ node§!"
 AIO_crisis_events.404.desc: "The §Y$AIO_mega_02$§! located at [from.GetName] is completed."
 AIO_crisis_events.405.desc: "The §Y$AIO_mega_03$§! located at [from.GetName] is completed."
 AIO_crisis_events.406.desc: "The §Y$AIO_mega_04$§! located at [from.GetName] is completed."

 # Prompt to build a vision engine
 AIO_crisis_events.401.desc: "We have completed the closed-loop construction of the multi-dimensional interaction model. Simulations show that at specific gravitational shear and virtual realm fluctuation nodes, reality can be stably permeated. Based on this, we will build §Y$AIO_horizon_engine$§! - a structure that can penetrate the boundaries of physics and possibility and extract existing energy.\nWe are not the first empire to possess this technology. What's different is that we will use this energy to create a space-time that is countless times higher than the existing universe."
 AIO_crisis_events.401.option: "Establish a new process."

 #endregion


