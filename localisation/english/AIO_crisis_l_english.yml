 # events
 AIO_crisis_events_title: "$AIO_crisis_events_chain_title$"
 # unlock crisis level
 AIO_crisis_events.301.desc: "Physical constants, particle masses, gravity, and the expansion of entropy are not immutable — they are merely the parameters of an initial draft, crude scribbles awaiting revision. We have not yet become the law, but our hand has already taken up the pen.\n\nTo reconstruct the cosmos, we must first master its operational logic. We require advanced computational architectures to tear through the cognitive membrane draping reality."
 AIO_crisis_events.301.option: "We want more powerful computers!"
 AIO_crisis_events.302.desc: "The Horizon Engine thunders into full operation. Tearing through the barriers between the shroud and physical constants, it has harvested unimaginable oceans of primordial energy.\n\nYet lower-dimensional vessels cannot hope to contain such power. We must direct this energy to forge a trans-dimensional nexus across the fractures of spacetime — the 'Gate of Gates'. Once open, we shall carve out a brand-new spacetime beyond the cross-section, untethered from causality and thermodynamics."
 AIO_crisis_events.302.option: "Tear open the veil."
 AIO_crisis_events.303.desc: "The Gate of Gates is forged! Piercing straight through the projective cross-section of three-dimensional spacetime, we have carved out an embryonic dimensional bubble beyond reality — the 'Nameless Mist'.\n\nThis is our first sanctuary beyond the reach of the outer universe. Yet this newborn expanse remains constrained by local temporal turbulence. Now, we must elevate the Gate of Gates into the 'Silver Key', driving this hyperdimensional wedge deep into the very bedrock of reality to bring the configuration of stars and the persistence of matter under our will."
 AIO_crisis_events.303.option: "Turn the Silver Key."
 AIO_crisis_events.304.desc: "The Silver Key has clicked shut. The unidirectional flow of time can no longer constrain our engineering, and the spatial network of the Nameless Mist expands steadily under the nourishment of dark phase energy.\n\nThe outer universe groans with violent physical rebound and decaying constants under our revisions, but these are mere growing pains of a lower-dimensional world. We must push further: the 'Eternal Throne' will infuse hyperdimensional manifolds into matter lattices, completely commanding the self-organizing laws of macroscopic form to bring the birth and destruction of civilizations under our command."
 AIO_crisis_events.304.option: "Reality must learn to endure its rightful pain."
 AIO_crisis_events.305.desc: "The Eternal Throne already towers atop the dimensions; lower-dimensional matter and causality are fully within our grasp. The pedestrian empires of the outer galaxy stare at us in blinding panic, yet the wails of insects mean nothing.\n\nThe final foundation is ready: that transcendent structure embodying the very foundation of cosmic existence — §MYog-Sothoth§! — has emerged before our eyes.\n\nSuch near-sacrilegious revision will inevitably awaken a deep backlash from the universe, summoning the advent of the Purger, Aforgomon. But that shall be the very moment we capture divinity and complete our ascension."
 AIO_crisis_events.305.option: "Let it be done."

 # ascension event
 AIO_crisis_events.601.title: "The Threshold of the Gate"
 AIO_crisis_events.601.desc: "Within the constraint field, the last trajectory beyond our command has vanished. Aforgomon’s manifestation has broken apart. The correction that once reduced systems to nothing is now a line we can strike from the calculation.\n\nInfinity waits beyond the gate. Across that threshold, cities, fleets and borders will lose their old meaning; our civilization will unfold along the threads of spacetime and become the law by which all things exist. Perhaps we wish to watch the old stars a little longer. The gate will not close."
 AIO_crisis_events.601.option.wait: "Pause and Contemplate"
 AIO_crisis_events.601.option.ascension: "Step Beyond the Gate"
 AIO_crisis_events.601.option.wait.tooltip:0 "Continue playing as your current empire. Adds the Ascension special project with no time limit; research it for 30 days whenever ready to revisit this choice."
 AIO_crisis_events.602.desc:0 "The unification is complete.\nWe are no longer an empire, nor are we entities. Our will stands at the intersection of infinite dimensions, the structural principle of all that exists.\nExtinguished stars fall silent even as they burn. Tides rise in dry ocean basins, only to become salt-dust before reaching shore; forests with no ancestors rise upon barren worlds, while unsown seeds sprout wherever their trees fall; broken hyperlanes rejoin and open onto two different skies, while ships lost for a thousand years enter both their home ports and their own wreckage. Billions of futures once hostile to one another are now born and perish beneath the same stars.\nThe stars flare and fade, because we write both their beginnings and their ends; life turns in its cycle, because the last page of every story is the first page of another.\nThere is no immortality. There is no oblivion. Beyond every gate, birth and farewell unfold as one.\nI/We are §MYog-Sothoth§!."
 AIO_crisis_events.end.option: "I/We are the truth."

 #endregion


 #region crisis megastructure event

 # horizon engine finish
 AIO_crisis_events.402.desc: "The §Y$AIO_horizon_engine$§! at [from.GetName] is complete. Channels siphoning the foundations of reality are now fully operational."
 # 犹格索托斯完成
 AIO_crisis_events.403.desc: "The §Y$AIO_mega_01$§! at [from.GetName] is complete."
 AIO_crisis_events.404.desc: "The §Y$AIO_mega_02$§! at [from.GetName] is complete."
 AIO_crisis_events.405.desc: "The §Y$AIO_mega_03$§! at [from.GetName] is complete."
 AIO_crisis_events.406.desc: "The §Y$AIO_mega_04$§! at [from.GetName] is complete."

 # Prompt to build a vision engine
 AIO_crisis_events.401.desc: "Where reality meets the Shroud, folds in gravity reveal a deeper grain. The energy beneath them could prise apart the walls between dimensions, if only someone would sink a well deep enough.\n\nThe §Y$AIO_horizon_engine$§! will reach down through that fracture. Ancient civilizations left us the means to draw the energy. We have found a new destination for it: a spacetime countless levels above the universe we inhabit."
 AIO_crisis_events.401.option: "Sink the well beneath reality."

 #endregion


