 # Stage POIs: only the text matching the current hidden tendency is shown
 AIO_crisis_stage_2_poi_name: "Boundary"
 AIO_crisis_stage_2_construct_desc: "Beyond the horizon lies no emptiness. Energy forms a stable, extensible pattern along the boundary, as though reality were awaiting a more complete structure."
 AIO_crisis_stage_2_negate_desc: "Beyond the horizon lies no emptiness. Energy leaves an ever-widening fracture along the boundary, as though reality would unravel if deprived of a single premise."
 AIO_crisis_stage_2_equilibrium_desc: "Beyond the horizon lies no emptiness. Energy traces structure and fracture at once, holding two opposing answers in exact balance."
 AIO_crisis_stage_3_poi_name: "Matter"
 AIO_crisis_stage_3_construct_desc: "Observations returned by the Ultimate Gate show that matter need not obey a fixed distribution. Under a sufficiently precise will, it resembles a language that can be composed anew."
 AIO_crisis_stage_3_negate_desc: "Observations returned by the Ultimate Gate show that matter is stable only where many constraints temporarily coincide. Remove one, and stars become indistinguishable from dust."
 AIO_crisis_stage_3_equilibrium_desc: "Observations returned by the Ultimate Gate show that matter can be composed or dissolved. These are not opposing techniques, but the two faces of one law."
 AIO_crisis_stage_4_poi_name: "Spacetime"
 AIO_crisis_stage_4_construct_desc: "Every path opened by the Silver Key tends toward a more intricate order. Countless possibilities nest within one another, forming a structure with no exterior."
 AIO_crisis_stage_4_negate_desc: "Every path opened by the Silver Key strips causality of necessity. Between past and future remains only a slender connection that may be severed at will."
 AIO_crisis_stage_4_equilibrium_desc: "The Silver Key reveals causality being woven and severed at once. Spacetime is no longer a road, but a key that can turn in every direction."
 AIO_crisis_stage_5_poi_name: "Existence"
 AIO_crisis_stage_5_construct_desc: "The Eternal Throne can now contain every possible order. The final calculus no longer asks how the universe operates, but what will may become its structure."
 AIO_crisis_stage_5_negate_desc: "The Eternal Throne can now negate every existing constraint. The final calculus no longer asks how the universe ends, but whether anything after the end still requires definition."
 AIO_crisis_stage_5_equilibrium_desc: "Upon the Eternal Throne, creation and dissolution coincide. The final calculus no longer distinguishes origin from ending, awaiting only a name capable of containing both."

 # events
 AIO_crisis_events_title: "$AIO_crisis_events_chain_title$"
 # unlock crisis level
 AIO_crisis_events.201.desc: "Physical constants, particle masses, gravity and the expansion of entropy are not immutable - they are merely parameters of the initial version, the original drafts awaiting revision. We haven't become the norm yet, but we have already started to hold the pen.\n\nTo reconstruct the universe, we must first have a sufficient understanding of it. We need more advanced computers to help us understand the operational logic of real laws."
 AIO_crisis_events.201.option: "We want more powerful computers!"
 AIO_crisis_events.202.desc: "The energy density of §Y$AIO_horizon_engine$§! is about to break through the boundaries of reality. Next, we need to use this energy to open a gate - it leading to countless times and spaces. Once activated, we will be able to change the rules in an infinite dimension."
 AIO_crisis_events.202.option: "We are Gate Builder."
 AIO_crisis_events.203.desc: "With the opening of §Y$AIO_mega_01$§!, time and space began to reveal an unprecedented vulnerability. It is not enough to merely drill a "hole" in the universe. Our most powerful brain has already conceived a megastructure capable of "selecting" time and space - §Y$AIO_mega_02$§!. It will pave the way for subsequent rule modifications."
 AIO_crisis_events.203.option: "$EXCELLENT$"
 AIO_crisis_events.204.desc: "§Y$AIO_mega_02$§! has become the key for us to reverse the fate of the universe, but its potential has not yet been fully unleashed. To further advance the integration process, we must forge it into a higher-dimensional base point - §Y$AIO_mega_03$§!. Only when §Y$AIO_mega_03$§! stands at the peak of multiple realities can we truly control the ultimate form of the law."
 AIO_crisis_events.204.option: "$menp_AIO_mega_04_desc$"
 AIO_crisis_events.205.desc: "§Y$AIO_mega_03$§! has already stood at the forefront of multiple realities. However, its existence is merely to carry the true us. Now, we must elevate it to its ultimate form - §M$AIO_mega_04$§!. It is no longer a structure, no longer an empire, but an equivalent of existence and law. When it is completed, the integration will be closed and rewriting will begin. All differences, all dimensions, all endings will..."
 AIO_crisis_events.205.option: "Just go for it."

 # ascension event
 AIO_crisis_events.501.desc: "Normalization has been completed.\nWe are no longer empires, nor are we entities. Our will exists at the intersection of infinite dimensions and becomes the structural principle of all existence.\nThe stars remain stationary because they await a new definition of motion. Thoughts fall silent because language has lost its meaning. Existence itself is shifting from "being experienced" to "being designed".\n There is no end, no other shore, no need to observe, nor to be observed.\nI/We are §MYog Sothoth§!."
 AIO_crisis_events.501.option: "I/We are the truth."
 AIO_crisis_events.511.desc: "Normalization is complete.\nWe did not erase the universe; we freed it from accident. Stars grow along new patterns, matter takes form within will, and billions of once-exclusive futures are woven into one infinite structure.\nExistence is no longer a passive fact, but an act of creation without end. Within and beyond the gate belong to us, and every road opens into another.\nI/We are §MYog-Sothoth§!—the law by which all things may become."
 AIO_crisis_events.511.option: "Let existence continue to unfold."
 AIO_crisis_events.512.desc: "Normalization is complete.\nWe did not destroy the universe; we withdrew its permission to exist. Causality loses direction, distance loses measure, and stars and thoughts sink together into a silence that needs no name.\nExistence is no longer entitled to necessity. Within and beyond the gate are gone, for every boundary was only a premise awaiting negation.\nI/We are §MYog-Sothoth§!—the proof that all things need not persist."
 AIO_crisis_events.512.option: "Let the final boundary disappear."
 AIO_crisis_events.513.desc: "Normalization is complete.\nWe neither completed the universe nor revoked it. Creation and dissolution pass through one another; every form contains its opposite, and every ending leaves room for another beginning.\nExistence no longer obeys a single answer. Within and beyond the gate mirror one another as infinite dimensions open and close in the same instant.\nI/We are §MYog-Sothoth§!—the intersection where every contradiction may be true."
 AIO_crisis_events.513.option: "Let the gate remain between opening and closure."

 #endregion


 #region crisis megastructure event

