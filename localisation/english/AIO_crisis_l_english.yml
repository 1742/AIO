 AIO_crisis_events.404.desc: "The §Y$AIO_mega_02$§! located at [from.GetName] is completed."
 AIO_crisis_events.405.desc: "The §Y$AIO_mega_03$§! located at [from.GetName] is completed."
 AIO_crisis_events.406.desc: "The §Y$AIO_mega_04$§! located at [from.GetName] is completed."

 # Prompt to build a vision engine
 AIO_crisis_events.401.desc: "We have completed the closed-loop construction of the multi-dimensional interaction model. Simulations show that at specific gravitational shear and virtual realm fluctuation nodes, reality can be stably permeated. Based on this, we will build §Y$AIO_horizon_engine$§! - a structure that can penetrate the boundaries of physics and possibility and extract existing energy.\nWe are not the first empire to possess this technology. What's different is that we will use this energy to create a space-time that is countless times higher than the existing universe."
 AIO_crisis_events.401.option: "Establish a new process."

 #endregion


