 #region Reward

 # first stage
 menp_AIO_al_research: "Advanced Logic"
 menp_AIO_al_research_desc: "The universe is no longer merely a three-dimensional stage; our civilization has caught a glimpse of a higher flow of rules."
 unlocks_AIO_allinone_research: "Allows the accumulation of £AIO_advanced_logic£ §Y$menp_AIO_al_research$§! by completing §HCrisis Objectives§!."
 menp_AIO_buildings_1: "$menp_cosmo_buildings_1$"
 menp_AIO_buildings_1_desc: "$menp_cosmo_buildings_1_desc$"
 menp_AIO_component_1:0 "The Energy Frontier"
 menp_AIO_component_1_desc:0 "Dark matter is more than a source of power. Mastering it will prepare us to understand and rewrite the laws of the universe."
 unlocks_AIO_component_1:0 "Unlocks research options: §Y$tech_dark_matter_power_core$§!."
 menp_AIO_dimensionality:0 "Dimensional Hypothesis"
 menp_AIO_dimensionality_desc:0 "Three dimensions are merely the shallows that imprison consciousness. By constructing the Horizon Engine to devour reality's energy currents, we shall slice open the first fissure across spacetime leading into the Nameless Mist."
 # second stage
 menp_AIO_mega_02: "Gate Builder"
 menp_AIO_mega_02_desc: "Lesser beings call it a miracle or a rupture; on our engineering schematics, it is merely the 'Gate of Gates', waiting to be assembled with precision."
 unlocks_AIO_allinone_mega_01: "Unlocks Megastructure: §Y$AIO_mega_01$§!\n"
 menp_AIO_buildings_2: "$menp_cosmo_buildings_2$"
 menp_AIO_buildings_2_desc: "$menp_cosmo_buildings_2_desc$"
 menp_AIO_component_2:0 "Unbinding Energy"
 menp_AIO_component_2_desc:0 "The conservation of energy is no unassailable divine decree; it is merely a pedestrian constraint born of a three-dimensional universe's lack of imagination. Now, it is the first parameter to be rewritten."
 unlocks_AIO_component_2:0 "Unlocks research options: §Y$tech_enigmatic_decoder$§!, §Y$tech_dark_matter_propulsion$§!.\nUnlocks Applied Infinity research options: §Y$tech_AIO_rule_energy$§!. Completing the corresponding research unlocks §Y$district_AIO_mist_energy$§! in the Nameless Mist."
 menp_AIO_ship_escort: "$menp_cosmo_ship_2$"
 menp_AIO_ship_escort_desc: "$menp_cosmo_ship_2_desc$"
 # third stage
 menp_AIO_mega_03: "Space-Time Engineering"
 menp_AIO_mega_03_desc: "Time is no longer a one-way rushing torrent, but a geometric metric to be severed, folded, and reshaped at our whim. The Silver Key will reforge sequential causality into our staircase."
 unlocks_AIO_allinone_mega_02: "Unlocks Megastructure: §Y$AIO_mega_02$§!\n"
 menp_AIO_buildings_3: "$menp_cosmo_buildings_3$"
 menp_AIO_buildings_3_desc: "$menp_cosmo_buildings_3_desc$"
 menp_AIO_component_3:0 "Matter Realization"
 menp_AIO_component_3_desc:0 "The dichotomy between baryonic and dark matter is but a parochial artifact of the observer's frame. When we master the mandate of substantive realization, existence and void hang upon our mere discretion."
 unlocks_AIO_component_3:0 "Unlocks research options: §Y$tech_enigmatic_encoder$§!, §Y$tech_dark_matter_deflector$§!.\nUnlocks Applied Infinity research options: §Y$tech_AIO_rule_matter$§!, §Y$tech_AIO_rule_dark_matter$§!. Completing the corresponding research unlocks §Y$district_AIO_mist_minerals$§!, §Y$district_AIO_mist_dark_matter$§! in the Nameless Mist."
 menp_AIO_ship_3: "$menp_cosmo_ship_3$"
 menp_AIO_ship_3_desc: "$menp_cosmo_ship_3_desc$"
 # fourth stage
 menp_AIO_mega_04: "The Lord of Constant Vision"
 menp_AIO_mega_04_desc: "Matter must learn obedience before higher-dimensional will. The Eternal Throne shall stand tall atop the cross-section, looking down upon an entire cosmos trembling under our casual manipulation."
 unlocks_AIO_allinone_mega_03: "Unlocks Megastructure: §Y$AIO_mega_03$§!\n"
 menp_AIO_buildings_4: "$menp_cosmo_buildings_4$"
 menp_AIO_buildings_4_desc: "$menp_cosmo_buildings_4_desc$"
 menp_AIO_component_4:0 "Reshaping Structure"
 menp_AIO_component_4_desc:0 "The molecular configurations dictated by natural evolution are far too brittle. We forcefully infuse higher-dimensional manifolds into them, teaching baryons and crystal lattices to spontaneously grow and self-heal."
 unlocks_AIO_component_4:0 "Unlocks research options: §Y$tech_arc_emitter_1$§!, §Y$tech_dragon_armor$§!.\nUnlocks Applied Infinity research options: §Y$tech_AIO_rule_structure$§!, §Y$tech_AIO_rule_living_metal$§!. Completing the corresponding research unlocks §Y$district_AIO_mist_motes$§!, §Y$district_AIO_mist_gases$§!, §Y$district_AIO_mist_crystals$§!, §Y$district_AIO_mist_living_metal$§! in the Nameless Mist."
 menp_AIO_ship_titan: "$menp_cosmo_ship_4$"
 menp_AIO_ship_titan_desc: "$menp_cosmo_ship_4_desc$"
 # fifth stage
 menp_AIO_mega_05: "Dimension Embedding"
 menp_AIO_mega_05_desc: "To be omniscient is to be omnipotent. When Yog-Sothoth takes physical form within this realm, we no longer reside within the universe — we become the foundational structural principle of all existence."
 unlocks_AIO_allinone_mega_04: "Unlocks Megastructure: §Y$AIO_mega_04$§!\n"
 menp_AIO_buildings_5: "$menp_cosmo_buildings_5$"
 menp_AIO_buildings_5_desc: "$menp_cosmo_buildings_5_desc$"
 menp_AIO_component_5:0 "Nanite Continuum"
 menp_AIO_component_5_desc:0 "Deconstructing reality into infinite programmable particles. Macroscopic order dissolves in this instant, and all physical structures degrade into clay ready for our immediate revision."
 unlocks_AIO_component_5:0 "Unlocks research options: §Y$tech_nanite_transmutation$§!, §Y$tech_nanite_repair_system$§!, §Y$tech_nanite_autocannon$§!, §Y$tech_nanite_flak_batteries$§!.\nUnlocks Applied Infinity research options: §Y$tech_AIO_rule_nanites$§!. Completing the corresponding research unlocks §Y$district_AIO_mist_nanites$§! in the Nameless Mist."
 menp_AIO_break_rules: "$menp_cosmo_features_4$"
 menp_AIO_break_rules_desc: "$menp_cosmo_features_4_desc$"
 unlocks_AIO_mist_expansion:0 "Completing the final structure unlocks repeatable spatial expansion in the Nameless Mist."

 #endregion


 #region crisis event chain

 # event chain
 AIO_crisis_events_chain_title: "All in One"
 AIO_crisis_events_chain_desc: "$AIO_advanced_logic_crisis_howto$"
 AIO_crisis_events_chain: "$AIO_crisis_events_chain_title$"

 # Stage POIs
 AIO_crisis_stage_2_poi_name: "Reality Rebounds"
 AIO_crisis_stage_2_desc: "Every alteration is fading. Displaced mass returns to its former position, replaced chains of causality close once more, and even observational records gradually conform to restored reality. The universe still remembers precisely what it used to be."
 AIO_crisis_stage_3_poi_name: "Restoration Delayed"
 AIO_crisis_stage_3_desc: "Opposing alterations are being erased at the same time. Reality attempts to return to one origin along two directions, while the two restorative processes continually undo one another's results. The anomalies still fade, but only after far longer than before."
 AIO_crisis_stage_4_poi_name: "Corrections in Conflict"
 AIO_crisis_stage_4_desc: "Every law and its opposite now demand restoration. Correcting one makes the other anomalous; correcting the other revokes the previous result."
 AIO_crisis_stage_5_poi_name: "The Law of Self-Destruction"
 AIO_crisis_stage_5_desc: "Every correction now creates another contradiction. Whenever the universe restores one law, it must revoke another; whenever it fills an omission, it tears the same place open again."

 # events
 AIO_crisis_events_title: "$AIO_crisis_events_chain_title$"
 # unlock crisis level
 AIO_crisis_events.301.desc: "Physical constants, particle masses, gravity, and the expansion of entropy are not immutable — they are merely the parameters of an initial draft, crude scribbles awaiting revision. We have not yet become the law, but our hand has already taken up the pen.\n\nTo reconstruct the cosmos, we must first master its operational logic. We require advanced computational architectures to tear through the cognitive membrane draping reality."
 AIO_crisis_events.301.option: "Tear open the veil."
 AIO_crisis_events.302.desc:0 "The colossal energies harvested by the Horizon Engine have pierced the shear planes of macroscopic spacetime. Beyond the shadows of the three-dimensional horizon, we have carved out a geometric bubble immune to macroscopic thermodynamics and causal law — the 'Nameless Mist'.\n\nIt is our first foothold beyond reality. Here, matter and energy no longer adhere to inherited rules, reordered entirely at our discretion."
 AIO_crisis_events.302.option: "The Gate stands open."
 AIO_crisis_events.303.desc:0 "The dimensional bubble of the Nameless Mist has steadily hardened. The foundation of the Silver Key is unfurling, acting as a higher-dimensional wedge that anchors our colony from a fragile local horizon into a grander superstring network.\n\nThe retaliatory physics of three-dimensional space remain sealed beyond the cross-section; here, dark phases and vacuum sub-currents surge uninterrupted. It is time for our engineering to transcend the axis of time itself."
 AIO_crisis_events.303.option: "Spacetime is merely building material."
 AIO_crisis_events.304.desc:0 "The Silver Key holds causality firmly by the throat. With the construction of the Eternal Throne, the spatial capacity of the Nameless Mist leaps exponentially. The outer universe pays the price for our crude revisions — stellar aberrations, decomposing constants — while we sit upon our throne beyond the cross-section, reaping every reward and privilege in cold detachment.\n\nThe groans of reality grow ever louder. But the Throne is raised; even its right to protest shall be stripped away."
 AIO_crisis_events.304.option: "Reality must learn to endure its rightful pain."
 AIO_crisis_events.305.desc:0 "The foundations for the endgame are set; an ultimate structure governing all time and dimensions — §MYog-Sothoth§! — shall descend in full.\n\nThis is no longer an experiment, but an absolute overwrite of the cosmos's underlying source code. The deeper structures of reality will inevitably suffer violent convulsions and immune rejection storms, but that is our prime opportunity to seize the 'ultimate truth'."
 AIO_crisis_events.305.option: "Let it come; our scalpels are ready."

 # ascension event
 AIO_crisis_events.601.title: "The Threshold of the Gate"
 AIO_crisis_events.601.desc: "The final corrective mechanisms have fallen silent. The universe's immune storm has exhausted its last ounce of fury within our constraint fields; the remnants of Aforgomon have been reduced to the most submissive glyphs in the foundation of reality.\n\nThe infinity beyond the gate stands wide open. The boundary between observer and the observed dissolves in this instant — take one step forward, and our civilization will no longer be an empire of history, but the structural law governing all spacetime and existence."
 AIO_crisis_events.601.option.wait: "Pause and Contemplate"
 AIO_crisis_events.601.option.ascension: "Step Beyond the Gate"
 AIO_crisis_events.end.option: "I/We are the truth."
 AIO_crisis_events.602.desc: "The unification is complete.\nWe are no longer an empire, nor are we entities. Our will stands at the intersection of infinite dimensions, the structural principle of all that exists.\nExtinguished stars fall silent even as they burn. Tides rise in dry ocean basins, only to become salt-dust before reaching shore; forests with no ancestors rise upon barren worlds, while unsown seeds sprout wherever their trees fall; broken hyperlanes rejoin and open onto two different skies, while ships lost for a thousand years enter both their home ports and their own wreckage. Billions of futures once hostile to one another are now born and perish beneath the same stars.\nThe stars flare and fade, because we write both their beginnings and their ends; life turns in its cycle, because the last page of every story is the first page of another.\nThere is no immortality. There is no oblivion. Beyond every gate, birth and farewell unfold as one.\nI/We are §MYog-Sothoth§!."

 #endregion


 #region crisis megastructure event

 # horizon engine finish
 AIO_crisis_events.402.desc: "The §Y$AIO_horizon_engine$§! at [from.GetName] has reached critical operation: the curtain of spacetime is torn open, and higher-dimensional energy torrents pour through."
 # Yog Sothoth finish
 AIO_crisis_events.403.desc: "The §Y$AIO_mega_01$§! at [from.GetName] is forged: the Gate of Gates stands open, and the Nameless Mist beyond the cross-section has coalesced."
 AIO_crisis_events.404.desc: "The §Y$AIO_mega_02$§! at [from.GetName] is upgraded: the Silver Key clicks shut, prying open the one-way lock of time."
 AIO_crisis_events.405.desc: "The §Y$AIO_mega_03$§! at [from.GetName] is upgraded: the Eternal Throne towers atop the dimensions, commanding total obedience from the cross-section cosmos."
 AIO_crisis_events.406.desc: "The §Y$AIO_mega_04$§! at [from.GetName] reaches final completion: §MYog-Sothoth§! has descended upon the cross-section, and the cosmic immune storm is at hand!"

 # Prompt to build a vision engine
 AIO_crisis_events.401.desc: "We have finalized a closed-loop model for multi-dimensional interactions. Simulations indicate that reality can be stably penetrated at specific nodes of gravitational shear and shroud fluctuations. Using this as our foundation, we shall construct the §Y$AIO_horizon_engine$§! — a structure capable of piercing boundaries of physics and possibility to extract primordial energy.\nWe are not the first empire to possess this technology; what differs is that we will use this power to weave a spacetime infinitely higher than the existing universe."
 AIO_crisis_events.401.option: "Initialize the new sequence."

 #endregion


 # opinion modifier
 triggered_opinion_AIO_crisis_empire: "$triggered_opinion_crisis_empire$"
