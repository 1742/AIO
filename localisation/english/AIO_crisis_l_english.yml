 menp_AIO_component_3:0 "Matter Realization"
 menp_AIO_component_3_desc:0 "Visible matter and dark matter are different expressions of the same reality. We can decide how they are created."
 unlocks_AIO_component_3:0 "Unlocks research options: §Y$tech_enigmatic_encoder$§!, §Y$tech_dark_matter_deflector$§!.\nUnlocks Applied Infinity research options: §Y$tech_AIO_rule_matter$§!, §Y$tech_AIO_rule_dark_matter$§!. Completing the corresponding research unlocks §Y$district_AIO_mist_minerals$§!, §Y$district_AIO_mist_dark_matter$§! in the Nameless Mist."
