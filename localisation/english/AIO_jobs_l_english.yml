l_english:
 job_AIO_dark_matter_worker:0 "Dark Phase Weaver"
 job_AIO_dark_matter_worker_plural:0 "Dark Phase Weavers"
 job_AIO_dark_matter_worker_desc:0 "By tuning high-dimensional gravity wells, unseen currents of weak interaction are forced to solidify into stable dark matter. Anomalous gravitational constants precipitated in the process are tightly bound within the generator matrix."
 mod_job_AIO_dark_matter_worker_add:0 "Dark Phase Weaver Jobs"
 job_AIO_dark_matter_drone:0 "Dark Condensation Drone"
 job_AIO_dark_matter_drone_plural:0 "Dark Condensation Drones"
 job_AIO_dark_matter_drone_desc:0 "Drones dedicated to collecting and condensing weak-interaction turbulence from high-dimensional energy streams into solid dark matter precipitation."
 mod_job_AIO_dark_matter_drone_add:0 "Dark Condensation Drone Jobs"
 job_AIO_living_metal_worker:0 "Manifold Shaper"
 job_AIO_living_metal_worker_plural:0 "Manifold Shapers"
 job_AIO_living_metal_worker_desc:0 "Injects high-dimensional fluid vitality into rigid metallic lattices, endowing inorganic matter with the self-repairing and flexing will of protoplasm. Workers are strictly forbidden from gazing directly into the breathing cadence of the metal's surface."
 mod_job_AIO_living_metal_worker_add:0 "Manifold Shaper Jobs"
 job_AIO_living_metal_drone:0 "Manifold Molding Drone"
 job_AIO_living_metal_drone_plural:0 "Manifold Molding Drones"
 job_AIO_living_metal_drone_desc:0 "Computing sub-units that guide living metal into spontaneously forming complex topological structures."
 mod_job_AIO_living_metal_drone_add:0 "Manifold Molding Drone Jobs"
 job_AIO_nanites_worker:0 "Micro-phase Choreographer"
 job_AIO_nanites_worker_plural:0 "Micro-phase Choreographers"
 job_AIO_nanites_worker_desc:0 "Conducts an endless torrent of self-replicating mechanical particles at the sub-micron scale. As long as the underlying logic remains deadlock-free, this dust of matter can reshape everything in sight like living mist."
 mod_job_AIO_nanites_worker_add:0 "Micro-phase Choreographer Jobs"
 job_AIO_nanites_drone:0 "Micro-phase Swarm Drone"
 job_AIO_nanites_drone_plural:0 "Micro-phase Swarm Drones"
 job_AIO_nanites_drone_desc:0 "Collaborative drones acting as external command nodes for micro-scale nanite swarms."
 mod_job_AIO_nanites_drone_add:0 "Micro-phase Swarm Drone Jobs"
 job_AIO_chips:0 "Recursive Synapse"
 job_AIO_chips_plural:0 "Recursive Synapses"
 job_AIO_chips_desc:0 "Utilizes thought impulses as conductive conduits for higher-dimensional logic streams. Both organic neural synapses and virtual computing threads serve here as self-consuming fuses to prevent hyper-logical circuits from overloading."
 job_AIO_chips_effect_desc:0 "£job_neural_chip£ $job_AIO_chips_plural$ consume £energy£ §Y$energy$§! to produce £physics£ £society£ £engineering£ §YResearch§! and §Y$AIO_advanced_logic$§!, gradually consuming the working population."
 mod_job_AIO_chips_add:0 "$job_AIO_chips$ Jobs"
 pop_cat_AIO_chips:0 "Recursive Synapse"
 pop_cat_AIO_chips_plural:0 "Recursive Synapses"
 pop_cat_AIO_chips_desc:0 "Populations connected to the logical network as computational nodes in a Matryoshka Brain."
 purge_AIO_chips:0 "Synaptic Overload"
 purge_AIO_chips_tooltip:0 "Populations are gradually burned out and depleted through ceaseless recursive computation and higher-dimensional logical resonance."
