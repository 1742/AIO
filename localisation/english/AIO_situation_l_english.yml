l_english:
 #region merge cosmos

 situation_AIO_merge_cosmos: "Merge Cosmos"
 situation_AIO_merge_cosmos_type: "Merge Cosmos"
 situation_AIO_merge_cosmos_desc: "The universe was never designed to be unified, but we have mastered its basic structure. By adjusting the underlying expression of the law, we gradually converge each dimension and spatio-temporal state into a single existence model. The advancement of each stage will make the structure of "reality" more compliant, simpler and closer to our will. \n\n Effect: When the situation progresses, an §RInfinity Thesis§! is triggered every two years. It will affect systems and planets in the galaxy."
 situation_AIO_merge_cosmos_monthly_change_tooltip: ""
 AIO_merge_cosmos_advanced_logic_modifier: "$AIO_advanced_logic$ produce"
 AIO_merge_cosmos_apply_infinite_thesis_modifier: "§RApply Infinity Thesis§!"
 AIO_merge_cosmos_requires_AIO_mega_01: "£trigger_no£needs $AIO_mega_01$"
 AIO_merge_cosmos_requires_AIO_mega_02: "£trigger_no£needs $AIO_mega_02$"
 AIO_merge_cosmos_requires_AIO_mega_03: "£trigger_no£needs $AIO_mega_03$"
 AIO_merge_cosmos_requires_AIO_mega_04: "£trigger_no£needs $AIO_mega_04$"
 AIO_merge_cosmos_solution: "merge"
 AIO_merge_cosmos_solution_desc: "Continue to promote the integration process. Dimensions will be further unified, and the resistance of the universe will gradually weaken. As the stages progress, our consciousness structure will gradually expand to all levels of reality, and the original universe will be rewritten by ourselves into a new paradigm ontology."
 AIO_merge_cosmos_pause_solution: "pause merge"
 AIO_merge_cosmos_pause_solution_desc: "Suspend the integration process. It can be used to adjust the structure, wait for resources to flow back, or stabilize some unfinished construction paths. However, the reality structure itself does not wait indefinitely."

 AIO_merge_cosmos_events.201.desc: "§Y$AIO_mega_01$§! has been completed! But this is only the beginning. To rewrite the rules of the universe, we must invest tremendous amounts of energy and dark matter to continuously tear and reconstruct the structure of this space-time. In this process, we will create a domain that is completely different from the existing cosmic pattern. It will be a space-time with an infinitely high dimension, transcending the boundaries of the conventional universe and becoming the foundation of a brand-new order."
 AIO_merge_cosmos_events.201.option_1: "Allocate sufficient resources for this project."
 AIO_merge_cosmos_events.201.option_1.tt: "Unlocked §RDirectional Apply Infinity Thesis§!(DAIT).\nThe DAIT interface can be opened in ['concept_edicts']."
 AIO_merge_cosmos_events.202.desc: "The nested reality containers constructed based on multi-dimensional convergence points have formed a closed loop. No matter from which spatiotemporal projection it is observed, its dimensional expression tends to be infinite. With the accumulation of our achievements in infinity thesis, we have been able to conceive and implement an unprecedented megastructure: §Y$AIO_mega_02$§!. It will enable us to precisely carve the laws of the universe and reshape existence itself into the only solution in an idealized model."
 AIO_merge_cosmos_events.202.option_1: "The key to unlocking the existence of endless time and space..."
 AIO_merge_cosmos_events.202.tt: "Unlocked megastructure: §Y$AIO_mega_01_node$§! Node, §Y$AIO_mega_02$§!\nGenerated system: ['concept_AIO_HS_system']."
 AIO_merge_cosmos_events.203.desc: "The second stage of Merge Cosmos has been completed."
 AIO_merge_cosmos_events.203.option_1: "REPLACE_ME"
 AIO_merge_cosmos_events.204.desc: "The third stage of Merge Cosmos has been completed."
 AIO_merge_cosmos_events.204.option_1: "REPLACE_ME"
 AIO_merge_cosmos_events.205.desc: "The structure of the universe has been dismantled; the boundaries that once confined us within limited spacetime are now mere annotations awaiting revision.\nWe have reached the Gate of Unification. A single step forward would allow us to reshape the self into a principle of cosmic logic—becoming the source of every gravity, every observation, every concept ever conceived.\nYet, transcendence is not the only choice. We may linger here, observing how this newborn construct resonates across higher dimensions."
 AIO_merge_cosmos_events.205.option_1: "Step through the gate."
 AIO_merge_cosmos_events.205.option_2: "Remain and observe."
 AIO_merge_cosmos_events.205.option_2.tt: "You can still ['concept_AIO_DAIT']. Start a special project §Y$AIO_ASCENSION$§! in §Y$AIO_crisis_events_chain$§! eventchain to complete ascension later."

 #endregion


 #region erase galaxy

 situation_AIO_erase_galaxy: "Erase Galaxy"
 situation_AIO_erase_galaxy_type: "Erase Galaxy"
 situation_AIO_erase_galaxy_desc: "The star map is collapsing in slow motion, reality's mesh erased like sand drawings in the tide.\nWith every hyperlane jump, another star sinks into the nameless abyss. Existence is being systematically negated. If left unchecked, this quiet dismantling will continue until all returns to silence.\n\nEffect: The situation advances once every three months, erasing several galaxies."
 situation_AIO_erase_galaxy_monthly_change_tooltip: ""
 AIO_erase_galaxy_solution: "Erase"
 AIO_erase_galaxy_solution_desc: "Let the tide flow. The unraveling of the galaxy shall proceed, piece by piece."
 AIO_erase_galaxy_stop_solution: "Stop"
 AIO_erase_galaxy_stop_solution_desc: "Halt the process. What remains of the stars may yet be spared the void."
 AIO_situation_AIO_erase_galaxy_galaxy_size_modifier: "galaxy size"

 #endregion
