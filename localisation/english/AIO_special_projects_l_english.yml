 AIO_CRISIS_CONTEMPLATE_GATE: "Ascension"
 AIO_CRISIS_CONTEMPLATE_GATE_DESC: "The infinity beyond the gate will not vanish. Before abandoning the distinction between observer and observed, we may spend thirty days recording the old universe’s starlight and considering the boundary we are about to cross.\n\nThis project has no time limit. Complete 30 days of research to choose again between ascension and remaining."
