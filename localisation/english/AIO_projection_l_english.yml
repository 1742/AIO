l_english:
 AIO_projection_aforgomom_action: "Summon Aforgomom"
 AIO_projection_aforgomom_activity: "Projecting into $NAME$"
 AIO_projection_aforgomom_action_tooltip: "Choose a system and invest Advanced Logic to establish an armed summoning anchor. No war or fleet access is required.\n\nInvestment: £AIO_advanced_logic£ §Y100,000 / 200,000 / 400,000§! for §Y1 / 2 / 4 times§! the anchor's base hull and weapon damage.\nPreparation: approximately §Y720 days§!.\nRange: the §Yinterference range§! at activation, measured in hyperlane jumps, including the center and ignoring bypasses.\nCooldown: §Y10 years§!, starting when investment is confirmed.\n\n§RAnchors and manifestations are hostile to every empire, including us, allies and subjects.§! Destroy the anchor to stop its ritual. Peace and changes in ownership do not interrupt it. Aborting refunds neither cost nor cooldown."
 AIO_projection_fail_center: "This system already contains a summoning anchor."
 AIO_projection_events.202.title: "Remote Projection: Investment"
 AIO_projection_events.202.desc: "Establish an armed reality anchor in §Y[From.GetName]§!. Choose a one-time investment to determine its hull and firepower. Preparation time and summoning range are the same for all tiers.\n\nThe ritual takes approximately §Y720 days§!. Our current interference range of §Y[Root.AIO_interference_range] jumps§! is fixed at activation.\n\n§ROnce released, the anchor is hostile to every empire, including us and our subjects.§! It cannot move or resurrect. Any empire can destroy it. Existing storm coverage in range is cleared before a Nexus Storm is created at the center."
 AIO_projection_invest_basic: "Basic Anchor: 100,000 Advanced Logic"
 AIO_projection_invest_reinforced: "Reinforced Anchor: 200,000 Advanced Logic"
 AIO_projection_invest_overcharged: "Overcharged Anchor: 400,000 Advanced Logic"
 AIO_projection_invest_basic_tooltip: "Spend £AIO_advanced_logic£ §Y100,000§! to create an anchor with base hull and firepower and begin a §Y10-year§! cooldown."
 AIO_projection_invest_reinforced_tooltip: "Spend £AIO_advanced_logic£ §Y200,000§! to create an anchor with §Y2 times§! its base hull and weapon damage and begin a §Y10-year§! cooldown."
 AIO_projection_invest_overcharged_tooltip: "Spend £AIO_advanced_logic£ §Y400,000§! to create an anchor with §Y4 times§! its base hull and weapon damage and begin a §Y10-year§! cooldown."
 AIO_projection_cancel: "Cancel projection"
 AIO_projection_Aforgomom: "Aforgomom Projection: [Target.GetName]"
 AIO_projection_Aforgomom_type: "Remote Aforgomom Projection"
 AIO_projection_Aforgomom_desc: "The armed anchor in §Y[Target.GetName]§! is sustaining the ritual. Completion summons Aforgomom in the center and all systems within §Y[This.AIO_projection_range] jumps§!.\n\nAnchor strength: §Y[This.AIO_projection_strength] times§! base hull and weapon damage.\n\n§RAnchors and manifestations are hostile to every empire.§! Destroying this anchor aborts this ritual. Diplomacy and changes in ownership do not affect it. Existing manifestations are not duplicated."
 AIO_projection_Aforgomom_monthly_change_tooltip: "Advances by 1 point per month and completes at 24. Other empires can track its progress through an observation situation. Destroy this anchor to prevent summoning."
 AIO_projection_maintain_ritual: "Maintain the Summoning Ritual"
 AIO_projection_maintain_ritual_desc: "The ritual advances at a fixed rate. Investment is locked; voluntary cancellation and acceleration are unavailable."
 mod_AIO_projection_Aforgomom_max_progress_add: "Aforgomom Projection Required Progress"
 mod_AIO_projection_Aforgomom_max_progress_mult: "$mod_AIO_projection_Aforgomom_max_progress_add$"
 AIO_projection_anchor: "Reality Anchor"
 AIO_projection_anchor_plural: "Reality Anchors"
 NAME_AIO_projection_anchor: "Aforgomom Reality Anchor"
 NAME_AIO_projection_anchor_design: "Aforgomom Reality Anchor"
 AIO_PROJECTION_ANCHOR_LANCE: "Anchoring Arc"
 AIO_PROJECTION_ANCHOR_LANCE_DESC: "The anchor discharges energy through cracks in reality to attack approaching fleets."
 AIO_projection_anchor_reinforced: "Reinforced Anchor"
 AIO_projection_anchor_overcharged: "Overcharged Anchor"
 AIO_projection_notice_ack: "Acknowledged."
 AIO_projection_notice_start.name: "Aforgomom: Reality Anchoring"
 AIO_projection_notice_start.desc: "§Y[From.GetName]§! has established an armed reality anchor in §Y[FromFrom.GetName]§!. In approximately §Y24 months§!, the ritual will summon Aforgomom in nearby systems.\n\n§RThe anchor and manifestations are hostile to every empire, including the caster and its allies.§! Any empire may destroy the anchor. Peace cannot stop the ritual. Track its progress in the situation log."
 AIO_projection_notice_abort.name: "Aforgomom: Ritual Aborted"
 AIO_projection_notice_abort.desc: "The ritual started by §Y[From.GetName]§! in §Y[FromFrom.GetName]§! has lost its anchor and will not summon Aforgomom.\n\nInvestment is not refunded and the cooldown remains. Other rituals and existing manifestations are unaffected. Local storms continue."
 AIO_projection_notice_complete.name: "Aforgomom: Manifestation"
 AIO_projection_notice_complete.desc: "§Y[From.GetName]§! has completed the ritual in §Y[FromFrom.GetName]§!. Aforgomom has been summoned in the center and the range fixed at activation; existing manifestations are not duplicated.\n\n§RFleets of every empire are at risk.§! This anchor has dispersed. Other anchors and local storms are unaffected."
 AIO_projection_fail.need_mega_04: "Requires ownership of §YYog-Sothoth§!."
 AIO_projection_fail.cooldown: "Remote projection is still on cooldown."
 AIO_projection_fail.exist: "Our country already has an ongoing remote projection."
 AIO_projection_observer: "Aforgomom Alert: [Target.Solar_System.GetName]"
 AIO_projection_observer_type: "Aforgomom Summoning Alert"
 AIO_projection_observer_desc: "The armed reality anchor in §Y[Target.Solar_System.GetName]§! is summoning Aforgomom. Completion affects the center and all systems within §Y[This.AIO_projection_range] jumps§!.\n\nAnchor strength: §Y[This.AIO_projection_strength] times§! base hull and weapon damage.\n\n§RThe anchor and manifestations are hostile to every empire.§! Send a fleet to destroy the anchor and prevent summoning. This situation tracks the ritual; its approach cannot change the ritual."
 AIO_projection_observer_monthly_change_tooltip: "Updates the summoning ritual's progress each month. This alert does not advance on its own. The ritual completes at 24 points."
 AIO_projection_observe_ritual: "Monitor the Reality Rift"
 AIO_projection_observe_ritual_desc: "Track the summoning ritual. Counter it by sending a fleet to destroy the anchor."
