l_english:
 AIO_projection_aforgomon_action:0 "Projection: Advent of Aforgomon"
 AIO_projection_aforgomon_activity:0 "Locking Target Coordinates: $NAME$"
 AIO_projection_aforgomon_action_tooltip:0 "Select an external system and expend £AIO_advanced_logic£ §Y100,000§! to induce severe spacetime rejection, precipitating the advent of Aforgomon after £time£ §Y720 days§!. Only the designated system is affected. Cooldown: §Y3600 days§!.\n\n§RWarning: Aforgomon, the instrument of cosmic purge, is universally hostile to all macroscopic entities, including ourselves and allies.§!"
 AIO_projection_fail.target:0 "Target system already has a pending projection or an active manifestation of Aforgomon."
 AIO_projection_fail.need_mega_04:0 "Requires ownership of §Y$AIO_mega_04$§!."
 AIO_projection_fail.cooldown:0 "Remote projection is still on cooldown."
 AIO_projection_confirm:0 "Extinguish the Stars"
 AIO_projection_confirm_tooltip:0 "After 720 days, Aforgomon will descend upon the locked system. Once confirmed, this cannot be undone; if the target becomes invalid or already hosts a manifestation, the entity will not appear and no refund will be issued."
 AIO_projection_events.301.title:0 "$AIO_Aforgomon$"
 AIO_projection_events.301.desc:0 "Through the hyperdimensional projection nexus of Yog-Sothoth, we can trigger an irremediable collapse of causal logic within §Y[From.GetName]§!, inviting 'Aforgomon' — the cosmic purge mechanism incarnate — to descend upon it.\n\nThe descending arbiter will relentlessly erase all structures and existence present in the system.\n\nCost: £AIO_advanced_logic£ §Y100,000§!\nDelay: £time£ §Y720 days§!\nCooldown: §Y3600 days§!\n\n§RWarning: $AIO_Aforgomon$ recognizes neither friend nor foe; the descending entity will thoroughly expunge everything in the system.§!"
 AIO_projection_Aforgomon.located: "The void has parted for the Purger; Aforgomon will descend upon §Y[event_target:AIO_projection_Aforgomon_target.GetName]§! in §Y720 days§!."
 AIO_projection_Aforgomon.advented: "Stars fall silent, the void fractures — Aforgomon has descended upon §Y[event_target:AIO_projection_Aforgomon_target.GetName]§!!"
