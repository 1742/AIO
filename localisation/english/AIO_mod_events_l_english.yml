l_english:
 AIO_mod_events.201.desc: "Welcome to All Is One v2.1. This version returns to Directional Apply Infinity as its core gameplay.\n\nUpdated: 2026/10/17 (Beijing time)\n - Matryoshka Brains can be built on all colonies, with Recursive Nodes counted separately for each colony\n - Removed the special colony in the Nameless Mist\n - Improved DAIT menu, accessible through edicts after completing the Gate of Gates\n - Aforgomon finale. The values have not been verified. If there is too little time to maneuver and investigate, please provide feedback in Steam Workshop comment section."
 AIO_mod_events.201.leader_desc: "Author's comment"
 AIO_mod_events.201.catch_phrase: "Fixing this mod is exhausting..."
 AIO_mod_events.201.know: "I will read this later."
 AIO_mod_events.201.know_again: "OK!"
 AIO_mod_events.201.guide: "How do you recommend playing?"
 AIO_mod_events.201.guide.response:0 "Rush your species ascension, save up Alloys to build the Gate of Gates, then go Enrich + Dyson Swarms / Arc Furnaces. Add as many resources as you want."
 AIO_mod_events.201.dait: "How do I use §Y$concept_AIO_DAIT$§!?"
 AIO_mod_events.201.dait.response:0 "Click the fixed orb at the bottom of the screen to expand the menu. Select a target, operation and applicable range, then Confirm. The upper-right × collapses the menu, keeping the orb. Exit Menu at the bottom right closes both; reopen it by edict with your operation and range preserved. Entering system view alone does not select a target. In an empty system, select the Void Coordinate; for Invert Ethics, a country can be selected in diplomacy."
 AIO_mod_events.201.situation:0 "Aforgomon Finale"
 AIO_mod_events.201.situation.response:0 "Once Yog-Sothoth is complete, the universe begins correcting our ascension project. The first five advents favor external systems; later rounds default to the Nameless Mist. If no eligible external target remains, it turns to the Mist sooner. Omens last 300 days initially, decreasing by 60 each round to a minimum of 180.\n\nInvestigate 1 / 2 / 3 distinct remnants to understand the cycle, induction and constraint in turn. Surveys and field projects each require 60 days of work by a science ship with a scientist. Choose induction and constraint sites in the Apply Infinity menu. Projects must finish before manifestation and do not reset the timer; constraint already includes induction. Ordinary manifestations remain for 180 days; constrained ones allow 720 days for battle.\n\nDefeat a constrained manifestation to choose ascension. If you remain, an untimed Ascension project lets you revisit the choice after 30 days of research."
 AIO_mod_events.201.compatibility: "Compatibility?"
 AIO_mod_events.201.compatibility.response: "§RDo not use galaxy map types provided by other mods.§! They may prevent §Y$AIO_mist$§! from spawning and block the exclusive megastructure and crisis progression.\nSome effects in this mod remove celestial bodies, systems, or ships. If another mod attaches an event chain to a special target, rewriting that target may break the chain. Save the game before using §YHarvest§! or §YErase§! on an important system."
