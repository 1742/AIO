l_english:
 AIO_mod_events.201.desc: "Welcome to All-in-One v2.1. Directional Apply Infinity returns as the core gameplay. The Nameless Mist no longer hosts a colony, Matryoshka Brains work independently of the capital, and the level-five Aforgomon endgame has shorter investigations and waits. All operations cost Hyperlogic before ascension. Enrich and Generate alter systems directly without country buffs."
 AIO_mod_events.201.leader_desc: "Author's comment"
 AIO_mod_events.201.catch_phrase: "This does not seem to display."
 AIO_mod_events.201.know: "I will read this later."
 AIO_mod_events.201.know_again: "OK!"
 AIO_mod_events.201.guide: "How do you recommend playing?"
 AIO_mod_events.201.guide.response:0 "Accumulate Hyperlogic and build the dedicated megastructures. Level five unlocks the challenge; completing the final megastructure automatically begins the Aforgomon finale. Investigate remnants and defeat the constrained manifestation to ascend. The special origin ascends directly."
 AIO_mod_events.201.dait: "How do I use §Y$concept_AIO_DAIT$§!?"
 AIO_mod_events.201.dait.response:0 "Open the toolbar through its edict and select a target and range. All operations cost Hyperlogic before ascension and are free afterward. Enrich is instant; other operations have windups. Seed, Harvest, Strike and Erase have independent 360-day cooldowns, reduced to 270 by Transcend Causality. Strike is indiscriminate."
 AIO_mod_events.201.situation:0 "Aforgomon Finale"
 AIO_mod_events.201.situation.response:0 "Completing Yog-Sothoth automatically begins the Aforgomon finale. Investigate 1/2/3 remnants to learn cycles, induction and constraint. Research and field projects take 60 days each. Ordinary manifestations stay for 180 days; constrained manifestations allow 360 days for combat. After defeating the final manifestation, ascend immediately or continue as your current empire. Deferring leaves an untimed Ascension project; research it for 30 days to revisit the choice."
 AIO_mod_events.201.compatibility: "Compatibility?"
 AIO_mod_events.201.compatibility.response: "§RDo not use galaxy map types provided by other mods.§! They may prevent §Y$AIO_mist$§! from spawning and block the exclusive megastructure and crisis progression.\nSome effects in this mod remove celestial bodies, systems, or ships. If another mod attaches an event chain to a special target, rewriting that target may break the chain. Save the game before using §YHarvest§! or §YErase§! on an important system."
