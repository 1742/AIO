l_english:
 AIO_mod_events.201.desc: "Welcome to the All in One mod. Stellaris 4.4 brought major changes. The old DAIT system was retired because, for unknown reasons, it caused high memory usage(However, the original calculations were indeed complex). Redesigning the gameplay and UI took a long time."
 AIO_mod_events.201.leader_desc: "Author's comment"
 AIO_mod_events.201.catch_phrase: "This does not seem to display."
 AIO_mod_events.201.know: "I will read this later."
 AIO_mod_events.201.know_again: "OK!"
 AIO_mod_events.201.guide: "How do you recommend playing?"
 AIO_mod_events.201.guide.response: "Rush your species ascension in the early game. Once it is complete, pivot to Physics Research to unlock §Y$tech_AIO_exponential_learning_theory$§! and §Y$AIO_horizon_engine$§!. It is worth remaining at crisis level 1 for a while: use the Horizon Engine to supply energy, burn through synapses, and kick-start your research.\n\nAt the same time, stockpile £energy£ Energy, £sr_dark_matter£ Dark Matter, £nanites£ Nanites, and £sr_living_metal£ Living Metal. Later megastructure upgrades consume these resources in large quantities."
 AIO_mod_events.201.dait: "How do I use §Y$concept_AIO_DAIT$§!?"
 AIO_mod_events.201.dait.response: "Press Esc to exit the DAIT menu!!!\nIt works the same way as §Y$dyson_gun_0$§!.\nDAIT operations unlock in pairs as your crisis level rises: §YEnrich/Storm§!, §YSpawn/Harvest§!, §YSeed/Strike§!, and §YEthic/Erase§!."
 AIO_mod_events.201.situation: "What effect does §Y$AIO_crisis_situation$§! have?"
 AIO_mod_events.201.situation.response: "§Y$AIO_crisis_situation$§! begins after crisis level 2. Crisis megastructures and the number of DAIT operations both accelerate its progress. While the situation is active, previously used DAIT effects may be repeated in other systems."
 AIO_mod_events.201.compatibility: "Compatibility?"
 AIO_mod_events.201.compatibility.response: "§RDo not use galaxy map types provided by other mods.§! They may prevent §Y$AIO_HYPER_DIMENSIONAL_SPACE$§! from spawning and block the exclusive megastructure and crisis progression.\nSome effects in this mod remove celestial bodies, systems, or ships. If another mod attaches an event chain to a special target, rewriting that target may break the chain. Save the game before using §YHarvest§! or §YErase§! on an important system."
