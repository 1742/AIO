l_english:
 AIO_mod_events.201.desc: "Welcome to All-in-One! The ascension path is no longer restricted to Gestalts: regular empires, Hive Minds and Machine Intelligences can all take it, subject to the other requirements shown in the perk panel.\n\nThis update focuses on the §YNameless Mist colony§! and the §YAforgomon endgame§!. Build your production base, rewrite galactic rules and face the final pursuit. Completing Yog-Sothoth immediately starts the endgame, so have your science ships and fleets ready. The topics below explain the new progression."
 AIO_mod_events.201.leader_desc: "Author's comment"
 AIO_mod_events.201.catch_phrase: "This does not seem to display."
 AIO_mod_events.201.know: "I will read this later."
 AIO_mod_events.201.know_again: "OK!"
 AIO_mod_events.201.guide: "How do you recommend playing?"
 AIO_mod_events.201.guide.response: "Accumulate §YAdvanced Logic§!, research the exclusive technologies and build the §Y$AIO_horizon_engine$§!. Upgrade the gate on the reality side to enter §Y$AIO_mist$§!. Crisis levels require both accumulated Logic and technological or megastructure milestones; check the Crisis panel.\n\nDevelop the colony and progress through the Silver Key, Eternal Throne and Yog-Sothoth to unlock more DAIT operations. Stockpile £energy£ Energy, £alloys£ Alloys, £sr_dark_matter£ Dark Matter, £sr_living_metal£ Living Metal and £nanites£ Nanites: the later upgrades are not cheap."
 AIO_mod_events.201.compatibility: "Compatibility?"
 AIO_mod_events.201.compatibility.response: "§RDo not use galaxy map types provided by other mods.§! They may prevent §Y$AIO_mist$§! from spawning and block the exclusive megastructure and crisis progression.\nSome effects in this mod remove celestial bodies, systems, or ships. If another mod attaches an event chain to a special target, rewriting that target may break the chain. Save the game before using §YHarvest§! or §YErase§! on an important system."
 AIO_mod_events.201.mist: "How do I develop the Nameless Mist?"
 AIO_mod_events.201.mist.response: "Opening the gate automatically establishes the §YNameless Mist colony§!; nomadic empires use a stationary shipborne colony. Specializations supply production jobs, and some resource districts require the corresponding rule technologies. These change benefits and costs throughout the galaxy, while the Mist receives the corresponding local exemptions.\n\nThe §YMatryoshka Brain§! specialization produces Research and Advanced Logic, but watch its Energy upkeep and population attrition.\n\nColony capacity starts at §Y12§! and rises to §Y24 / 40 / 64§! through megastructure upgrades. After completing the final megastructure, a repeatable decision adds §G8§! district capacity for §Y5000 Energy and 2000 Alloys§! over §Y360 days§!."
 AIO_mod_events.201.final: "How does the endgame work? (Spoilers)"
 AIO_mod_events.201.final.response: "§YCompleting Yog-Sothoth starts the pursuit, not an immediate victory.§! Each round has a shorter warning period. After Aforgomon stays in an external system for 360 days, it erases that system and leaves an investigation project.\n\nInvestigate §Y1 / 2 / 6§! remnants to understand the cycle, unlock Induction and unlock Constraint. Research takes §Y360 days§!; projects expire after §Y1000 days§! and are not restored after failure or cancellation. Induction and Constraint must finish before the warning ends. Constraint also redirects the manifestation; changing its target does not reset the timer.\n\nDefeat the §Yconstrained manifestation§! in an external system before its stay ends to ascend. If it reaches the Mist, the Mist and the Ultimate Gate are removed. The ascension ending removes your colonies and transforms your empire.\n\nVictory unlocks §Yremote projection§!: lock a system without an existing lock or Aforgomon, summon a storm, and summon the manifestation in that system alone after §Y720 days§!."
