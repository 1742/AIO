l_english:
 AIO_mod_events.201.desc: "Welcome to All in One v2.1. The laws of the galaxy remain firm. We intend to find a few places where they can be revised. Directional Apply Infinity is at the heart of this version: build dedicated megastructures, accumulate Advanced Logic, and extend your interventions from deposits and storms to civilizations and spacetime. Matryoshka Brains can be built on your colonies; the Nameless Mist houses the ascension megastructures, leading ultimately to Aforgomon’s reckoning."
 AIO_mod_events.201.leader_desc: "Author's comment"
 AIO_mod_events.201.catch_phrase: "The gate was always there. We have merely learned to open it."
 AIO_mod_events.201.know: "I will read this later."
 AIO_mod_events.201.know_again: "OK!"
 AIO_mod_events.201.guide: "How do you recommend playing?"
 AIO_mod_events.201.guide.response:0 "Accumulate Advanced Logic through research and exploration. Research the Dimensionality Hypothesis, build the Horizon Engine, then progress through the dedicated megastructures. Each completed structure opens the next stage of reality intervention.\n\nMatryoshka Brains are independent of the capital and can connect physical pops on your colonies to produce research and Advanced Logic. More nodes increase output, energy demands and population attrition. Virtual empires can assemble physical Recursive Chassis.\n\nLevel five unlocks the endgame challenge; completing the final megastructure starts the reckoning automatically. Defeat the constrained endgame manifestation to choose ascension or remain as your current empire. The special origin begins already ascended."
 AIO_mod_events.201.dait: "How do I use §Y$concept_AIO_DAIT$§!?"
 AIO_mod_events.201.dait.response:0 "Click the fixed orb at the bottom of the screen to expand the menu. Select a target, operation and applicable range, then Confirm. The upper-right × closes the menu and hides the orb; reopen it by edict with your operation and range preserved. Entering system view alone does not select a target. In an empty system, select the Void Coordinate; for Invert Ethics, a country can be selected in diplomacy.\n\nAll operations cost Advanced Logic before ascension. Ascension removes costs and cooldowns, but windups still apply. Enrich is instant; all other operations have windups. After successful resolution, Seed, Harvest, Strike and Erase each have an independent 360-day cooldown, reduced to 270 days by Transcend Causality. Strike avatars are hostile to all; empire-wide range requires ascension."
 AIO_mod_events.201.situation:0 "Aforgomon Finale"
 AIO_mod_events.201.situation.response:0 "Once Yog-Sothoth is complete, the universe begins correcting our ascension project. The first five advents favor external systems; later rounds default to the Nameless Mist. If no eligible external target remains, it turns to the Mist sooner. Omens last 300 days initially, decreasing by 60 each round to a minimum of 180.\n\nInvestigate 1 / 2 / 3 distinct remnants to understand the cycle, induction and constraint in turn. Surveys and field projects each require 60 days of work by a science ship with a scientist. Choose induction and constraint sites in the Apply Infinity menu. Projects must finish before manifestation and do not reset the timer; constraint already includes induction. Ordinary manifestations remain for 180 days; constrained ones allow 360 days for battle.\n\nDefeat a constrained manifestation to choose ascension. If you remain, an untimed Ascension project lets you revisit the choice after 30 days of research."
 AIO_mod_events.201.compatibility: "Compatibility?"
 AIO_mod_events.201.compatibility.response: "§RDo not use galaxy map types provided by other mods.§! They may prevent §Y$AIO_mist$§! from spawning and block the exclusive megastructure and crisis progression.\nSome effects in this mod remove celestial bodies, systems, or ships. If another mod attaches an event chain to a special target, rewriting that target may break the chain. Save the game before using §YHarvest§! or §YErase§! on an important system."
