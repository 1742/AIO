l_english:
 AIO_mod_events.201.desc: "Mod: All in One\n\nThis menu lists recent changes.\n\n§RWarning: Modded map types may prevent $AIO_HYPER_DIMENSIONAL_SPACE$ from spawning and block megastructure upgrades.§!\n\nLast updated: Beijing Time 2026/7/19\n\n- Removed the Merge Cosmos Situation; completing §Y$AIO_mega_04$§! now wins the game\n- Every exclusive megastructure upgrade triggers one Random Applied Infinity Thesis\n- Crisis levels progressively unlock ['concept_AIO_DAIT'] operations and require cumulative DAIT uses"
 AIO_mod_events.201.option_1: "OK"
 AIO_mod_events.201.option_2: "How do you recommend playing?"
 AIO_mod_events.201.option_2.response: "emmmm I've only tested one gameplay($origin_machine$, $civic_memorialist$, $tradition_virtuality$).\n\nNeedless to say, the first thirty years of fast species fly, do some §Y$physics_research$§! before the crisis ascension to get the §Y$tech_AIO_exponential_learning_theory$§! as soon as possible, and try to build the §Y$AIO_horizon_engine$§! as early as possible, rely on §Y$energy$§! to produce §Y$district_AIO_lathe$§! to produce research points, dig a few graves to build an $tech_archaeo_refinery$ to produce enough strategic resources, and build some warehouses to store §Y$energy$§! and §Y$sr_dark_matter$§!.\n\nAfter upgrading the situation, the DAIT allocate $AIO_DAIT_energy_option.1.title$ to enhance $energy$ output, if you reach the second stage of the situation and built §Y$AIO_mega_02$§!, the §Y$AIO_advanced_logic$§! production capacity will take off after it comes up."
