l_english:
 AIO_recursive_cycle_situation: "Recursive Computation"
 AIO_recursive_cycle_situation_type: "$AIO_recursive_cycle_situation$"
 AIO_recursive_cycle_situation_desc: "The Matryoshka Brain is arranging its recursive nodes into a repeatable cycle of theoretical condensation. Nodes continue to produce research and advanced logic through the normal job economy. Completing a cycle converts the computation into stored research and irreversibly consumes participating nodes.\n\nProgress generated by each approach is recorded separately; research and population loss are weighted by their actual contributions."
 AIO_recursive_cycle_situation_monthly_change_tooltip: "Monthly progress depends on the total workforce assigned to recursive nodes across the empire and the current approach. Energy or advanced-logic deficits pause progress."
 AIO_recursive_cycle_stage_1: "Computation Layout"
 AIO_recursive_cycle_stage_1_desc: "The network may still freely change its computational structure. Serial computation must be selected before this stage ends."
 AIO_recursive_cycle_stage_2: "Theoretical Convergence"
 AIO_recursive_cycle_stage_2_desc: "The computation has converged. An active serial approach may continue, but cannot be selected again after leaving it. Parallel and overclock approaches remain interchangeable."
 AIO_recursive_cycle_parallel: "Parallel Computation"
 AIO_recursive_cycle_parallel_desc: "Distribute the problem across as many nodes as possible: §G+100%§! recursive-node job efficiency and §R-50%§! situation speed. Costs §R0.5§! advanced logic monthly per 100 nodes. Its progress corresponds to §Y5%§! population loss and §Y120 months§! of each research field."
 AIO_recursive_cycle_serial: "Serial Computation"
 AIO_recursive_cycle_serial_desc: "Resolve an indivisible dependency chain: §G+100%§! situation speed. Costs §R1§! advanced logic monthly per 100 nodes. Its progress corresponds to §Y10%§! population loss and §Y240 months§! of each research field. It cannot be newly selected in stage two."
 AIO_recursive_cycle_serial_locked: "£trigger_no£The theory has entered convergence; the computation can no longer be switched into a serial structure."
 AIO_recursive_cycle_overclock: "Overloaded Overclock"
 AIO_recursive_cycle_overclock_desc: "Expand parallel width while compressing serial timing: §G+100%§! recursive-node job efficiency and §G+100%§! situation speed. Costs §R2§! advanced logic monthly per 100 nodes. Its progress corresponds to §R25%§! population loss and §Y120 months§! of each research field."
 AIO_recursive_cycle_parallel_progress_desc: "$AIO_recursive_cycle_parallel$"
 AIO_recursive_cycle_serial_progress_desc: "$AIO_recursive_cycle_serial$"
 AIO_recursive_cycle_overclock_progress_desc: "$AIO_recursive_cycle_overclock$"
 AIO_recursive_cycle_parallel_modifier: "$AIO_recursive_cycle_parallel$"
 AIO_recursive_cycle_overclock_modifier: "$AIO_recursive_cycle_overclock$"

 AIO_recursive_events.204.title: "Recursive Computation Complete"
 AIO_recursive_events.204.desc: "The current computation has converged.\n\nStored research in each field increases by §Y[This.AIO_recursive_cycle_research_months] months§! of current monthly output.\n§R[This.AIO_recursive_cycle_pop_loss_display]%§! of participating recursive nodes are consumed."
 AIO_recursive_events.204.option: "Begin the next computation."
 AIO_recursive_events.204.exhausted: "\n\n§YEvery permanent theory has reached its limit. This cycle produces no permanent modifier.§!"
 AIO_recursive_events.204.material_1: "\n\n§HPermanent Theory: Atomic Lattice Efficiency§!\nRank: [This.AIO_DAIT_material_option_1_rank]/10\nPer rank: §G+100%§! job output of minerals, food, alloys, consumer goods and strategic resources."
 AIO_recursive_events.204.material_2: "\n\n§HPermanent Theory: Baryonic Assembly Threshold§!\nRank: [This.AIO_DAIT_material_option_2_rank]/8\nPer rank: §G-10%§! building, ship and megastructure cost."
 AIO_recursive_events.204.material_3: "\n\n§HPermanent Theory: Biological/Mechanical Bootstrap§!\nRank: [This.AIO_DAIT_material_option_3_rank]/10\nPer rank: §G+10%§! population growth and assembly."
 AIO_recursive_events.204.material_4: "\n\n§HPermanent Theory: Structural Anti-Entropy Limit§!\nRank: [This.AIO_DAIT_material_option_4_rank]/8\nPer rank: §G-10%§! building and district upkeep."
 AIO_recursive_events.204.material_5: "\n\n§HPermanent Theory: Pauli Exclusion Shielding§!\nRank: [This.AIO_DAIT_material_option_5_rank]/8\nPer rank: §G+12.5%§! maximum districts and §G-10%§! housing usage."
 AIO_recursive_events.204.material_7: "\n\n§HPermanent Theory: Planetary Phase Rewriting§!\nRank: [This.AIO_DAIT_material_option_7_rank]/10\nPer rank: §G+7%§! habitability floor and §G+100%§! terraforming speed."
 AIO_recursive_events.204.energy_1: "\n\n§HPermanent Theory: Vacuum Zero-Point Level§!\nRank: [This.AIO_DAIT_energy_option_1_rank]/10\nPer rank: §G+100%§! energy job output and ship shields."
 AIO_recursive_events.204.energy_2: "\n\n§HPermanent Theory: Maxwell Demon Protocol§!\nRank: [This.AIO_DAIT_energy_option_2_rank]/8\nPer rank: §G-10%§! job and ship energy upkeep."
 AIO_recursive_events.204.energy_3: "\n\n§HPermanent Theory: Strong-Interaction Coupling§!\nRank: [This.AIO_DAIT_energy_option_3_rank]/10\nPer rank: §G+100%§! ship hull and armor."
 AIO_recursive_events.204.energy_4: "\n\n§HPermanent Theory: Fine-Structure Constant§!\nRank: [This.AIO_DAIT_energy_option_4_rank]/10\nPer rank: §G+100%§! ship weapon damage."
 AIO_recursive_events.204.energy_5: "\n\n§HPermanent Theory: Least-Action Construction§!\nRank: [This.AIO_DAIT_energy_option_5_rank]/10\nPer rank: §G+100%§! planetary, megastructure, ship and starbase construction speed."
 AIO_recursive_events.204.metric_1: "\n\n§HPermanent Theory: Topological Manifold Rigidity§!\nRank: [This.AIO_DAIT_metric_option_1_rank]/8\nPer rank: §G-10%§! empire size."
 AIO_recursive_events.204.metric_2: "\n\n§HPermanent Theory: Minkowski Metric§!\nRank: [This.AIO_DAIT_metric_option_2_rank]/8\nPer rank: §G+12.5%§! sublight speed and §G-10%§! hyperlane charge and cooldown."
 AIO_recursive_events.204.metric_3: "\n\n§HPermanent Theory: Closed Light-Cone Curve§!\nRank: [This.AIO_DAIT_metric_option_3_rank]/10\nPer rank: §G+100%§! evasion and daily hull, armor and shield regeneration."
 AIO_recursive_events.204.metric_4: "\n\n§HPermanent Theory: Nonlocal Correlation§!\nRank: [This.AIO_DAIT_metric_option_4_rank]/10\nPer rank: §G+0.3§! sensor range, §G+6%§! weapon range and §G+100%§! tracking."
 AIO_recursive_events.204.metric_5: "\n\n§HPermanent Theory: Event-Horizon Projection§!\nRank: [This.AIO_DAIT_metric_option_5_rank]/10\nPer rank: §G+10%§! accuracy, §G+25%§! catapult accuracy and §G+50%§! jump range."
 AIO_recursive_events.204.metric_6: "\n\n§HPermanent Theory: Causal Offense/Defense§!\nRank: [This.AIO_DAIT_metric_option_6_rank]/8\nPer rank: §G+12.5%§! armor and shield penetration and §G+10%§! damage reduction."

